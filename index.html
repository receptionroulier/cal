<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choix de Calendrier</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      margin-bottom: 40px;
      opacity: 0.7;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 900px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: white;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      background: rgba(255,255,255,0.08);
    }

    .icon {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
    }

    .text {
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.6;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      opacity: 0.5;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <h1>Choisissez une vue</h1>
  <p>Accès aux calendriers et état des ponts</p>

  <div class="container">

    <a class="card" href="https://receptionroulier.github.io/cal/calr.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
      </svg>
      <div class="text">
        <div class="title">Calendrier Réception</div>
        <div class="subtitle">Planning simple</div>
      </div>
    </a>

    <a class="card" href="https://receptionroulier.github.io/cal/r.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M3 10h18"/>
      </svg>
      <div class="text">
        <div class="title">Réception + Ponts</div>
        <div class="subtitle">Vue combinée</div>
      </div>
    </a>

    <a class="card" href="https://receptionroulier.github.io/cal/caln.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 20h18"/>
        <path d="M5 20l2-5h10l2 5"/>
      </svg>
      <div class="text">
        <div class="title">Calendrier Navires</div>
        <div class="subtitle">Planning des arrivées</div>
      </div>
    </a>

    <a class="card" href="https://receptionroulier.github.io/cal/n.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 20h18"/>
        <path d="M5 20l2-5h10l2 5"/>
        <circle cx="12" cy="10" r="2"/>
      </svg>
      <div class="text">
        <div class="title">Navires + Ponts</div>
        <div class="subtitle">Vue combinée</div>
      </div>
    </a>

    <a class="card" href="https://receptionroulier.github.io/cal/p.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 12h18"/>
        <path d="M6 12v4"/>
        <path d="M18 12v4"/>
      </svg>
      <div class="text">
        <div class="title">État des Ponts</div>
        <div class="subtitle">Suivi en temps réel</div>
      </div>
    </a>

  </div>

  <footer>© 2026 - Outils planning</footer>

</body>
</html>
