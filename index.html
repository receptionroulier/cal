<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choix de Calendrier</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 20px;
  }

  h1 { margin-bottom: 10px; font-size: 28px; }
  p { margin-bottom: 30px; opacity: 0.7; }

  .section {
    width: 100%;
    max-width: 900px;
    margin-bottom: 30px;
  }

  .section-title {
    font-size: 18px;
    margin-bottom: 15px;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 20px;
    text-decoration: none;
    color: white;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
  }

  .card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    background: rgba(255,255,255,0.08);
  }

  .icon { width: 40px; height: 40px; }

  .text { display: flex; flex-direction: column; }
  .title { font-size: 15px; font-weight: 600; }
  .subtitle { font-size: 12px; opacity: 0.6; }

  footer {
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.5;
  }

  /* ===================== PONTS ===================== */
  #ponts-table { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
  .pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
  }
  .pont-card:hover { transform: scale(1.02); }

  .pont-card.ferme { border-left-color: #ff4040; }
  .pont-card.ferme-travaux { border-left-color: #ff4040; }
  .pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
  .pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
  .pont-card.ouvert { border-left-color: #58ff58; }

  .pastille { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: inline-block; }
  .ferme .pastille, .ferme-travaux .pastille { background: #ff4040; }
  .fermeture .pastille { background: orange; }
  .manoeuvre .pastille { background: #1c3cff; }
  .ouvert .pastille { background: #58ff58; }

  .state-header { font-weight: bold; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .pont-nom { font-weight: bold; margin-left: 16px; }
  .pont-date { margin-left: 16px; font-size: 0.85em; color: #ccc; margin-bottom: 4px; }

  .texte-travaux { font-weight: bold; color: #fff; background-color: orange; padding: 0 4px; border-radius: 2px; }

  @keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
  }
  @keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
  }

  .spinner { width: 35px; height: 35px; border: 4px solid #333; border-top: 4px solid #00e5ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .error-message { text-align: center; color: #ff4040; font-weight: bold; }
</style>
</head>

<body>

<h1>Choisissez une vue</h1>
<p>Accès aux calendriers</p>

<!-- ÉTAT DES PONTS -->
<div class="section">
  <div class="section-title">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M3 12h18"/>
      <path d="M6 12v4"/>
      <path d="M18 12v4"/>
    </svg>
    <span>État des Ponts</span>
  </div>
  <div id="update-indicator">Chargement...</div>
  <div id="ponts-table"><div class="spinner"></div></div>
</div>

<!-- RÉCEPTION -->
<div class="section">
  <div class="section-title">📦 Réception</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/calr.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>
      <div class="text">
        <div class="title">Calendrier Réception</div>
        <div class="subtitle">Planning simple</div>
      </div>
    </a>
    <a class="card" href="https://receptionroulier.github.io/cal/r.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
      <div class="text">
        <div class="title">Réception + Ponts</div>
        <div class="subtitle">Vue combinée</div>
      </div>
    </a>
  </div>
</div>

<!-- NAVIRES -->
<div class="section">
  <div class="section-title">🚢 Navires</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/caln.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 20h18"/><path d="M5 20l2-5h10l2 5"/></svg>
      <div class="text">
        <div class="title">Calendrier Navires</div>

      </div>
    </a>
    <a class="card" href="https://receptionroulier.github.io/cal/n.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 20h18"/><path d="M5 20l2-5h10l2 5"/></svg>
      <div class="text">
        <div class="title">Navires + Ponts</div>
        <div class="subtitle">Vue combinée</div>
      </div>
    </a>
  </div>
</div>

<footer>© 2026 - Outils planning</footer>

<script>
/* ===================== FETCH & RENDER ===================== */
const FETCH_TIMEOUT = 10000;
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_TIME = "pontsCacheTime";
const CACHE_EXPIRATION = 60000; 
const REFRESH_INTERVAL = 30000;

async function fetchWithTimeout(url, opts={}, timeout=FETCH_TIMEOUT){
  const controller = new AbortController();
  const id = setTimeout(()=>controller.abort(), timeout);
  try { return await fetch(url, {...opts, signal: controller.signal}); }
  finally { clearTimeout(id); }
}

function parseFRDate(str){
  if(!str) return NaN;
  str = str.replace(/\u00A0/g,' ').trim();
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s*(\d{1,2}):(\d{2})?/);
  if(!m) return NaN;
  const [d,mo,y,h,mi] = [Number(m[1]), Number(m[2]), Number(m[3]), Number(m[4]||0), Number(m[5]||0)];
  return new Date(y,mo-1,d,h,mi).getTime();
}

function safeTime(str){ const t=parseFRDate(str); return Number.isFinite(t)?t:null; }

function parseRawContentToData(raw){
  if(!raw) return null;
  if(typeof raw === "string"){ try{ const j=JSON.parse(raw); return j?.data||j; } catch{return null;} }
  if(typeof raw==="object"){ if(raw.data) return raw.data; return raw; }
  return null;
}

function renderPonts(list){
  const container=document.getElementById("ponts-table");
  if(!list || !list.length){ container.innerHTML='Aucun pont'; return; }

  const states = { ferme: [], travaux: [], fermeture: [], manoeuvre: [], ouvert: [] };

  list.forEach(p=>{
    const txt = (p.statutText||"").toLowerCase();
    if(txt.includes("fermé") && txt.includes("travaux")) states.travaux.push(p);
    else if(txt.includes("fermé")) states.ferme.push(p);
    else if(txt.includes("fermeture")) states.fermeture.push(p);
    else if(txt.includes("manoeuvre")||txt.includes("manœuvre")) states.manoeuvre.push(p);
    else if(txt.includes("ouvert")) states.ouvert.push(p);
    else states.ferme.push(p);
  });

  let html='';
  for(const [key,ponts] of Object.entries(states)){
    if(!ponts.length) continue;
    html+=`<div class="pont-card ${key}">`;
    html+=`<div class="state-header"><span class="pastille"></span>${key.charAt(0).toUpperCase()+key.slice(1)} (${ponts.length})</div>`;

    ponts.forEach(p=>{
      let dateStr="";
      if(key==="travaux"){
        const m = p.statutText.match(/Travaux du (.+?) à (.+)/i);
        if(m){ dateStr = `du ${m[1]} au ${m[2]}`; }
        else { dateStr = p.date||"inconnue"; }
      } else { dateStr = `depuis le ${p.date||"inconnue"}`; }
      html+=`<div class="pont-nom">${p.nom}</div>`;
      html+=`<div class="pont-date">${dateStr}</div>`;
    });

    html+=`</div>`;
  }

  container.innerHTML = html;
}

async function checkAndUpdate(forceUpdate=false){
  const now=Date.now(), nowStr=new Date(now).toLocaleString();
  const lastWriteTime=parseInt(localStorage.getItem(CACHE_KEY_TIME)||0), lastStr=lastWriteTime?new Date(lastWriteTime).toLocaleString():"inconnue";
  const container=document.getElementById("ponts-table"), indicator=document.getElementById("update-indicator");

  if(!forceUpdate && lastWriteTime && now-lastWriteTime<CACHE_EXPIRATION){
    const cached=localStorage.getItem(CACHE_KEY_DATA);
    if(cached){ renderPonts(JSON.parse(cached)); indicator.textContent=`🟢 — MàJ OK le ${nowStr} — États inchangés depuis le ${lastStr}`; return; }
  }

  try{
    const targetUrl="https://www.havre-port.com/map/getPonts?_ts="+Date.now();
    const rawContent=await fetchWithTimeout(targetUrl);
    const data=parseRawContentToData(await rawContent.json?.() || rawContent);
    if(!data) throw new Error("Impossible d'extraire les données API");

    const ponts=Object.values(data);
    localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(ponts));
    localStorage.setItem(CACHE_KEY_TIME, Date.now());
    renderPonts(ponts);
    indicator.textContent=`🟢 — MàJ OK le ${nowStr}`;
  }catch(err){
    indicator.textContent=`🔴 — MàJ échouée le ${nowStr}`;
    console.error(err);
  }
}

(async function init(){ checkAndUpdate(true); setInterval(()=>checkAndUpdate(false), REFRESH_INTERVAL); })();
</script>

</body>
</html>
