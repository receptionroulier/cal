<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mise à jour…</title></head>
<body>
<p>Mise à jour en cours, vous allez être redirigé…</p>
<script>
async function migrate() {
  // 1. Désinscrire tous les SW de l'ancienne origine
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
  }
  // 2. Vider tous les caches de l'ancienne origine
  const keys = await caches.keys();
  await Promise.all(keys.map(k => caches.delete(k)));

  // 3. Rediriger vers le nouveau domaine
  window.location.replace('https://lh.roulierlh.workers.dev/');
}
migrate();
</script>
</body>
</html>
