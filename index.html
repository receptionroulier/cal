    body {

  display: flex;

}

    .page-title {
  font-size: 12px;
  opacity: 0.6;
  margin-bottom: 30px;
}    .section {
      width: 100%;
      max-width: 900px;
      margin-bottom: 30px;
    }
    .section-title {
      font-size: 18px;
      margin-bottom: 15px;

    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;

    /* ===== CARD standard ===== */
    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: white;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      background: rgba(255,255,255,0.08);
    }

    /* ===== PONTS CARD (même animation, flex-col) ===== */
    .card-ponts {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: white;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-ponts:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      background: rgba(255,255,255,0.08);
    }
    .card-ponts-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon { width: 40px; height: 40px; flex-shrink: 0; }
    .text { display: flex; flex-direction: column; }
    .title { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 12px; opacity: 0.6; }

    /* ===== 5 COLONNES ===== */
    .ponts-columns {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    @media (max-width: 700px) {
      .ponts-columns { grid-template-columns: repeat(2, 1fr); }
      .col-ouvert { grid-column: auto; }
    }
    .pont-col { display: flex; flex-direction: column; gap: 2px; }
    .col-header {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .col-count { opacity: 0.5; font-weight: 400; }

    .pastille {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }
    .p-rouge  { background: #ff4040; }
    .p-orange { background: orange; }
    .p-bleu   { background: #4c6fff; }
    .p-vert   { background: #58ff58; }

    .pont-entry  { font-size: 11px; line-height: 1.3; margin-bottom: 4px; }
    .pont-name   { font-weight: 600; color: #e0e0e0; word-break: break-word; }
    .pont-since  { color: #777; font-size: 10px; }

    #ponts-update { font-size: 10px; opacity: 0.4; text-align: right; }

    .mini-spinner {
      width: 18px; height: 18px;
      border: 3px solid #333;
      border-top: 3px solid #00e5ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    footer { margin-top: 20px; font-size: 13px; opacity: 0.5; }
  </style>
</head>
<body>
  <div style="display:flex; align-items:center; justify-content:center; width:100%; max-width:900px; margin-bottom:30px; position:relative;">
   <img src="https://receptionroulier.github.io/cal/RoulierLH.png" 
       alt="Logo RoulierLH"

  <h1 class="page-title" style="margin:0; font-size:12px; text-align:center; width:100%;">Accès aux calendriers</h1>
</div> 
  
  <!-- ===== PONTS ===== -->
  <div class="section">

  <!-- ===== RÉCEPTION ===== -->
  <div class="section">

    <div class="container">
      <a class="card" href="https://receptionroulier.github.io/cal/calr.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>

          <div class="title">Calendrier Réception</div>

      </a>

  <!-- ===== NAVIRES ===== -->
  <div class="section">
    <div class="section-title">🚢 Navires</div>
    <div class="container">
      <a class="card" href="https://receptionroulier.github.io/cal/caln.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M3 20h18"/><path d="M5 20l2-5h10l2 5"/>
        </svg>
        <div class="text">
          <div class="title">Calendrier Navires</div>
          <div class="subtitle">Planning des arrivées</div>
        </div>
      </a>
      <a class="card" href="https://receptionroulier.github.io/cal/n.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M3 20h18"/><path d="M5 20l2-5h10l2 5"/>
        </svg>
        <div class="text">
          <div class="title">Navires + Ponts</div>
          <div class="subtitle">Vue combinée</div>
        </div>
      </a>
    </div>
  </div>

  <footer>© 2026 - RoulierLH planning</footer>

<script>
/* ===== CLÉS CACHE PROPRES À L'INDEX (n'interfère pas avec p.html) ===== */
const IDX_CACHE_DATA = "idxPontsData";
const IDX_CACHE_TIME = "idxPontsCacheTime";
const CACHE_TTL      = 60000;   // 1 min
const REFRESH_MS     = 30000;   // 30 s

/* ===== PARSING DATE JJ/MM/AAAA [HH:MM[:SS]] ===== */
function parseFRDate(str) {
  if (!str || typeof str !== "string") return NaN;
  str = str.replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim();
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (!m) return NaN;
  return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0)).getTime();
}

function fmtShort(str) {
  const t = parseFRDate(str);
  if (!isFinite(t)) return str || "—";
  const d = new Date(t), p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ===== EXTRACTION DATE FIN TRAVAUX ===== */
function extractFinTravaux(pont) {
  // Concatène tous les champs texte disponibles
  const raw = [
    pont.statutText, pont.forceText, pont.info,
    pont.description, pont.message, pont.text, pont.comment
  ].filter(v => v && typeof v === "string").join(" ");

  console.debug("[Travaux]", pont.nom, "→ texte brut:", raw);

  // Motif 1 : "du JJ/MM/AAAA au JJ/MM/AAAA"
  const m1 = raw.match(/\bdu\s+\d{1,2}\/\d{1,2}\/\d{4}\s+au\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);
  if (m1) return m1[1];

  // Motif 2 : "jusqu'au JJ/MM/AAAA"
  const m2 = raw.match(/jusqu[''`]?\s*au\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);
  if (m2) return m2[1];

  // Motif 3 : "au JJ/MM/AAAA"
  const m3 = raw.match(/\bau\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);
  if (m3) return m3[1];

  // Motif 4 : dernière date trouvée dans le texte
  const all = [...raw.matchAll(/\b(\d{1,2}\/\d{1,2}\/\d{4})\b/g)].map(x => x[1]);
  if (all.length) return all[all.length - 1];

  return null;
}

function fmtFinTravaux(pont) {
  const fin = extractFinTravaux(pont);
  if (!fin) return "Date inconnue";
  const t = parseFRDate(fin);
  if (!isFinite(t)) return `Jusqu'au ${fin}`;
  const d = new Date(t), p = n => String(n).padStart(2,'0');
  return `Jusqu'au ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
}

/* ===== CLASSIFICATION — ordre strict pour éviter les faux positifs ===== */
function classifyPont(p) {
  const s = (p.statutText || "").toLowerCase();
  // travaux d'abord (fermé + travaux), avant de tester fermé seul
  if ((s.includes("fermé") || s.includes("ferme")) && s.includes("travaux")) return "travaux";
  // fermeture avant fermé (fermeture contient "ferme" en sous-chaîne)
  if (s.includes("fermeture")) return "fermeture";
  if (s.includes("fermé") || s.includes("ferme")) return "ferme";
  if (s.includes("manoeuvre") || s.includes("manœuvre")) return "manoeuvre";
  if (s.includes("ouvert")) return "ouvert";
  return "ferme";
}

/* ===== FETCH via même proxy que p.html ===== */
async function fetchPonts() {
  const proxy  = "https://crimson-recipe-63e0.receptionroulier.workers.dev/?url=";
  const target = "https://www.havre-port.com/map/getPonts?_ts=" + Date.now();

  const tryFetch = async url => {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), 10000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (res.ok) return await res.text();
    } catch(e) { console.warn("fetch err", url, e); }
    finally { clearTimeout(tid); }
    return null;
  };

  const raw = (await tryFetch(proxy + encodeURIComponent(target))) || (await tryFetch(target));
  if (!raw) return null;

  try {
    const json = JSON.parse(raw);
    const arr  = json?.data ? Object.values(json.data) : Object.values(json);
    // Dédoublonnage par nom
    return Array.from(new Map(arr.map(p => [p.nom, p])).values());
  } catch(e) { console.error("JSON parse err", e); return null; }
}

/* ===== RENDER ===== */
function mkEntry(p, sinceStr) {
  return `<div class="pont-entry">
    <div class="pont-name">${p.nom}</div>
    <div class="pont-since">${sinceStr}</div>
  </div>`;
}

function renderCols(ponts) {
  const cols = document.getElementById("ponts-cols");

  const byDate = list => list.sort((a,b) => (parseFRDate(b.date)||0) - (parseFRDate(a.date)||0));

  const fermes    = byDate(ponts.filter(p => classifyPont(p) === "ferme"));
  const travaux   = byDate(ponts.filter(p => classifyPont(p) === "travaux"));
  const fermeture = byDate(ponts.filter(p => classifyPont(p) === "fermeture"));
  const manoeuvre = byDate(ponts.filter(p => classifyPont(p) === "manoeuvre"));
  const ouverts   = byDate(ponts.filter(p => classifyPont(p) === "ouvert"));

  const since  = p => p.date ? `Depuis le ${fmtShort(p.date)}` : "—";
  const build  = (list, fn) => list.length
    ? list.map(p => mkEntry(p, fn(p))).join("")
    : `<div class="pont-entry"><div class="pont-since">—</div></div>`;

  cols.innerHTML = `
    <div class="pont-col">
      <div class="col-header">
        <span class="pastille p-rouge"></span>Fermé(s)
        <span class="col-count">(${fermes.length})</span>
      </div>
      ${build(fermes, since)}
    </div>

    <div class="pont-col col-ouvert">
      <div class="col-header">
        <span class="pastille p-vert"></span>Ouvert(s)
        <span class="col-count">(${ouverts.length})</span>
      </div>
      ${ouverts.length ? mkEntry(ouverts[0], since(ouverts[0])) : `<div class="pont-entry"><div class="pont-since">—</div></div>`}
    </div>
        
    <div class="pont-col">
      <div class="col-header">
        <span class="pastille p-orange"></span>En fermeture
        <span class="col-count">(${fermeture.length})</span>
      </div>
      ${build(fermeture, since)}
    </div>

    <div class="pont-col">
      <div class="col-header">
        <span class="pastille p-bleu"></span>Bientôt ouvert(s)
        <span class="col-count">(${manoeuvre.length})</span>
      </div>
      ${build(manoeuvre, since)}
    </div>

    <div class="pont-col">
      <div class="col-header">🚧&nbsp;En travaux
        <span class="col-count">(${travaux.length})</span>
      </div>
      ${build(travaux, p => fmtFinTravaux(p))}
    </div>
    
  `;
}

/* ===== INIT ===== */
async function loadPonts(forceUpdate = false) {
  const indicator = document.getElementById("ponts-update");
  const now = Date.now();
  const nowStr = new Date(now).toLocaleString("fr-FR");

  // Utiliser le cache si récent et pas forcé
  if (!forceUpdate) {
    const lastTime = parseInt(localStorage.getItem(IDX_CACHE_TIME) || 0);
    if (lastTime && now - lastTime < CACHE_TTL) {
      const cached = localStorage.getItem(IDX_CACHE_DATA);
      if (cached) { renderCols(JSON.parse(cached)); indicator.textContent = `🟢 ${nowStr}`; return; }
    }
  }

  try {
    const ponts = await fetchPonts();
    if (!ponts || !ponts.length) throw new Error("Vide");
    // Sauvegarde dans cache propre à l'index
    localStorage.setItem(IDX_CACHE_DATA, JSON.stringify(ponts));
    localStorage.setItem(IDX_CACHE_TIME, String(now));
    renderCols(ponts);
    indicator.textContent = `🟢 ${nowStr}`;
  } catch(e) {
    const cached = localStorage.getItem(IDX_CACHE_DATA);
    if (cached) {
      renderCols(JSON.parse(cached));
      indicator.textContent = `🔴 Erreur — cache utilisé`;
    } else {
      document.getElementById("ponts-cols").innerHTML =
        `<div style="color:#ff4040;font-size:12px;grid-column:1/-1">Données indisponibles</div>`;
      indicator.textContent = `🔴 ${nowStr}`;
    }
  }
}

loadPonts(true);
setInterval(() => loadPonts(false), REFRESH_MS);
</script>
</body>
</html>
