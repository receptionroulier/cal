<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mise à jour…</title></head>
<body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#1a1a2e;color:white;text-align:center;">
  <div>
    <div style="font-size:2rem;margin-bottom:16px;">⚠️</div>
    <p>L'application a déménagé.</p>
    <p style="font-size:0.85rem;opacity:.7;margin-bottom:20px;">
      Supprimez cette icône de votre écran d'accueil<br>
      et réinstallez l'app depuis le nouveau lien.
    </p>
    <a href="https://lh.roulierlh.workers.dev/"
       style="background:#6c63ff;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:700;">
      Ouvrir la nouvelle app →
    </a>
  </div>
  <script>
  async function migrate() {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  migrate();
  </script>
</body>
</html>
