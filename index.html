<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choix de Calendrier</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 20px;
}

h1 { margin-bottom: 10px; font-size: 28px; }
p { margin-bottom: 30px; opacity: 0.7; }

.section { width: 100%; max-width: 900px; margin-bottom: 30px; }
.section-title { font-size: 18px; margin-bottom: 15px; opacity: 0.8; }

.container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

.card {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  padding: 20px;
  text-decoration: none;
  color: white;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.card:hover { transform: scale(1.02); box-shadow: 0 12px 24px rgba(0,0,0,0.6); }

.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.icon { width: 40px; height: 40px; flex-shrink:0; }

.text { display: flex; flex-direction: column; }
.title { font-size: 15px; font-weight: 600; }
.subtitle { font-size: 12px; opacity: 0.8; line-height:1.4; white-space: normal; text-align:left; }

footer { margin-top: 20px; font-size: 13px; opacity: 0.5; }

#ponts-summary table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 5px;
  font-size: 11px;
}

#ponts-summary th, #ponts-summary td {
  padding: 2px 4px;
  vertical-align: top;
  text-align: left;
}

#ponts-summary th { font-weight: bold; font-size: 12px; }

.pastille {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
.ferme { background:red; }
.fermeture { background:orange; }
.manoeuvre { background:blue; }
.ouvert { background:green; }
.travaux-icon { display:inline-block; width:10px; height:10px; background:orange; border-radius:2px; margin-right:4px; vertical-align:middle; }
</style>
</head>

<body>

<h1>Choisissez une vue</h1>
<p>Accès aux calendriers</p>

<div class="section">
  <div class="section-title">📊 Dashboard Ponts</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/p.html">
      <div class="card-header">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M3 12h18"/>
          <path d="M6 12v4"/>
          <path d="M18 12v4"/>
        </svg>
        <div class="text">
          <div class="title">État des Ponts</div>
        </div>
      </div>
      <div class="subtitle" id="ponts-summary">Chargement...</div>
    </a>
  </div>
</div>

<!-- RÉCEPTION -->
<div class="section">
  <div class="section-title">📦 Réception</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/calr.html">
      <div class="card-header">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
        </svg>
        <div class="text"><div class="title">Calendrier Réception</div></div>
      </div>
      <div class="subtitle">Planning simple</div>
    </a>

    <a class="card" href="https://receptionroulier.github.io/cal/r.html">
      <div class="card-header">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M3 10h18"/>
        </svg>
        <div class="text"><div class="title">Réception + Ponts</div></div>
      </div>
      <div class="subtitle">Vue combinée</div>
    </a>
  </div>
</div>

<!-- NAVIRES -->
<div class="section">
  <div class="section-title">🚢 Navires</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/caln.html">
      <div class="card-header">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M3 20h18"/>
          <path d="M5 20l2-5h10l2 5"/>
        </svg>
        <div class="text"><div class="title">Calendrier Navires</div></div>
      </div>
      <div class="subtitle">Planning des arrivées</div>
    </a>

    <a class="card" href="https://receptionroulier.github.io/cal/n.html">
      <div class="card-header">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M3 20h18"/>
          <path d="M5 20l2-5h10l2 5"/>
        </svg>
        <div class="text"><div class="title">Navires + Ponts</div></div>
      </div>
      <div class="subtitle">Vue combinée</div>
    </a>
  </div>
</div>

<footer>© 2026 - Outils planning</footer>

<script>
async function loadPontsSummary() {
  try {
    const url = "https://www.havre-port.com/map/getPonts?_ts=" + Date.now();
    const res = await fetch("https://crimson-recipe-63e0.receptionroulier.workers.dev/?url=" + encodeURIComponent(url));
    const raw = await res.json();
    const data = raw.data || raw;
    const ponts = Object.values(data);

    const stats = { ferme: [], travaux: [], fermeture: [], manoeuvre: [], ouvert: [] };

    function formatDateDepuis(str){
      if (!str) return "";
      const m = str.match(/\d{1,2}\/\d{1,2}\/\d{4}\s\d{1,2}:\d{2}/g);
      return m ? `Depuis le ${m[0]}` : "";
    }

    function formatDateTravaux(str){
      if (!str) return "";
      const m = str.match(/\d{1,2}\/\d{1,2}\/\d{4}\s\d{1,2}:\d{2}/g);
      return m ? `jusqu’au ${m[1] || m[0]}` : "";
    }

    // Trier pour le dernier pont ouvert
    ponts.sort((a,b)=>{
      const da = new Date(a.date);
      const db = new Date(b.date);
      return da-db;
    });

    ponts.forEach(p=>{
      const s = (p.statutText||"").toLowerCase();
      if(s.includes("travaux")) stats.travaux.push({text:p.nom, date:formatDateTravaux(p.statutText)});
      else if(s.includes("fermé")) stats.ferme.push({text:p.nom, date:formatDateDepuis(p.statutText)});
      else if(s.includes("fermeture")) stats.fermeture.push({text:p.nom, date:formatDateDepuis(p.statutText)});
      else if(s.includes("manoeuvre") || s.includes("manœuvre")) stats.manoeuvre.push({text:p.nom, date:formatDateDepuis(p.statutText)});
      else if(s.includes("ouvert")) stats.ouvert.push({text:p.nom, date:formatDateDepuis(p.statutText)});
    });

    // Ne garder que le dernier pont ouvert
    if(stats.ouvert.length>0) stats.ouvert = [stats.ouvert[stats.ouvert.length-1]];

    const categories = ["ferme","travaux","fermeture","manoeuvre","ouvert"];
    const labels = {ferme:"Fermés", travaux:"Travaux", fermeture:"Fermeture", manoeuvre:"En manœuvre", ouvert:"Ouverts"};
    const colors = {ferme:'ferme', travaux:'travaux-icon', fermeture:'fermeture', manoeuvre:'manoeuvre', ouvert:'ouvert'};

    let html = '<table><tr>';
    categories.forEach(c=>{
      html += `<th><span class="pastille ${colors[c]}"></span> ${labels[c]} (${stats[c].length})</th>`;
    });
    html += '</tr><tr>';

    categories.forEach(c=>{
      html += '<td>';
      stats[c].forEach(p=>{
        html += `<div>${p.text}</div>`;
        html += `<div style="font-size:10px; opacity:0.8;">${p.date}</div>`;
      });
      html += '</td>';
    });
    html += '</tr></table>';

    document.getElementById("ponts-summary").innerHTML = html;

  } catch(e){
    console.error(e);
    document.getElementById("ponts-summary").innerHTML = "Erreur chargement";
  }
}

loadPontsSummary();
setInterval(loadPontsSummary,60000);
</script>

</body>
</html>
