<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 20px;
}
.container {
    width: 95%;
    max-width: 1200px;
    padding: 12px;
    box-sizing: border-box;
}
h2 {
    text-align: center;
    color: #ffffff;
    margin: 0 0 5px;
}
#update-indicator {
    text-align: center;
    font-size: 0.7em;
    opacity: 0.85;
    font-weight: bold;
    margin-bottom: 15px;
}

/* ===================== SPINNER ===================== */
.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #333;
    border-top: 4px solid #00e5ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 40px auto;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===================== CARTES PONTS ===================== */
#ponts-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
}
.pont-card:hover { transform: scale(1.02); }

.pont-card.ferme, .pont-card.ferme-travaux { border-left-color: #ff4040; }
.pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
.pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
.pont-card.ouvert { border-left-color: #58ff58; }

.pastille { width: 10px; height: 10px; border-radius: 50%; display:inline-block; margin-right:6px; }
.ferme .pastille { background: #ff4040; }
.fermeture .pastille { background: orange; }
.manoeuvre .pastille { background: #1c3cff; }
.ouvert .pastille { background: #58ff58; }

.pont-nom { font-weight: bold; display: flex; align-items: center; }
.pont-infos { font-size: 0.85em; color: #ccc; }

.texte-travaux { font-weight: bold; color: #fff; background-color: orange; padding: 0 4px; border-radius: 2px; }

@keyframes pulse-blue {0%,100%{box-shadow:0 0 5px rgba(28,60,255,0.4);transform:scale(1);}50%{box-shadow:0 0 20px rgba(28,60,255,0.7);transform:scale(1.02);}}
@keyframes pulse-orange {0%,100%{box-shadow:0 0 5px rgba(255,165,0,0.4);transform:scale(1);}50%{box-shadow:0 0 20px rgba(255,165,0,0.7);transform:scale(1.02);}}

.error-message { text-align: center; color: #ff4040; font-weight: bold; }

/* ===================== VISUEL DES 5 COLONNES ===================== */
#ponts-visual { display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; }
#ponts-visual > div { min-width:130px; }
.pont-col { display:flex; flex-direction:column; }
.pont-col-title { font-weight:bold; margin-bottom:4px; }
.pont-col .pont-item { margin-bottom:6px; }
.pont-col .pont-item span { display:block; font-size:0.8em; opacity:0.8; }
</style>
</head>
<body>

<div class="container">
    <h2>État des Ponts</h2>
    <div id="update-indicator">Chargement...</div>
    <div id="ponts-table">
        <div class="spinner"></div>
    </div>
</div>

<script>
// ===================== FETCH DATA =====================
async function fetchPonts() {
    const url = "https://www.havre-port.com/map/getPonts?_ts=" + Date.now();
    try {
        const res = await fetch(url);
        const raw = await res.json();
        return Object.values(raw.data || raw);
    } catch(e) {
        console.error("Impossible de récupérer les ponts :", e);
        return [];
    }
}

// ===================== RENDER PONT CARD =====================
function renderPontsVisual(ponts) {
    const container = document.getElementById("ponts-table");
    if(!ponts.length){ container.innerHTML = '<div class="error-message">Aucun pont disponible.</div>'; return; }

    const columns = { ferme: [], travaux: [], fermeture: [], manoeuvre: [], ouvert: [] };

    ponts.forEach(p => {
        const s = (p.statutText||"").toLowerCase();
        if(s.includes("fermé") && s.includes("travaux")) columns.travaux.push(p);
        else if(s.includes("fermé")) columns.ferme.push(p);
        else if(s.includes("fermeture")) columns.fermeture.push(p);
        else if(s.includes("manoeuvre") || s.includes("manœuvre")) columns.manoeuvre.push(p);
        else if(s.includes("ouvert")) columns.ouvert.push(p);
    });

    // Pont ouvert le plus récent
    columns.ouvert.sort((a,b)=> new Date(b.date) - new Date(a.date));

    function makeCol(title, color, list, showMostRecent=false){
        let html = `<div class="pont-col"><div class="pont-col-title"><span class="pastille" style="background:${color}"></span> ${title} (${list.length})</div>`;
        list.forEach((p,i)=>{
            if(showMostRecent && i>0) return;
            html += `<div class="pont-item">${p.nom}<span>${p.statutText}</span></div>`;
        });
        html += `</div>`;
        return html;
    }

    const visualHTML = `
        <div id="ponts-visual">
            ${makeCol("Fermés","#ff4040",columns.ferme)}
            ${makeCol("Travaux","orange",columns.travaux)}
            ${makeCol("En fermeture","orange",columns.fermeture)}
            ${makeCol("Manœuvre","#1c3cff",columns.manoeuvre)}
            ${makeCol("Ouvert","#58ff58",columns.ouvert,true)}
        </div>
    `;

    container.innerHTML = `<div class="pont-card">${visualHTML}</div>`;
}

// ===================== INIT =====================
async function init() {
    const data = await fetchPonts();
    renderPontsVisual(data);
    setInterval(async ()=>{
        const data = await fetchPonts();
        renderPontsVisual(data);
    }, 30000);
}
init();
</script>

</body>
</html>
