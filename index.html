<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoulierLH — Mise à jour requise</title>
</head>
<body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:white;text-align:center;padding:24px;box-sizing:border-box;">
  <div>
    <div style="font-size:3rem;margin-bottom:16px;">📲</div>
    <h2 style="margin:0 0 12px;font-size:1.1rem;">RoulierLH a changé d'adresse</h2>
    <p style="font-size:0.85rem;opacity:.7;line-height:1.7;margin-bottom:8px;">
      <strong style="color:white;">1.</strong> Supprimez l'icône <strong>RoulierLH</strong> de votre écran d'accueil<br>
      <strong style="color:white;">2.</strong> Ouvrez le nouveau lien ci-dessous<br>
      <strong style="color:white;">3.</strong> Réinstallez l'app depuis ce nouveau lien
    </p>
    <a href="https://rp.monsite.workers.dev?from=legacy"
       style="display:inline-block;margin-top:16px;background:#00e5ff;color:#0f172a;padding:14px 28px;border-radius:10px;text-decoration:none;font-weight:700;font-size:0.95rem;">
      Ouvrir le nouveau lien →
    </a>
  </div>
  <script>
  async function migrate() {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  migrate();
  </script>
</body>
</html>
