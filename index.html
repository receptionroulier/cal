<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choix de Calendrier</title>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
h1 { margin-bottom: 10px; font-size: 28px; }
p { margin-bottom: 30px; opacity: 0.7; }
.section { width: 100%; max-width: 900px; margin-bottom: 30px; }
.section-title { font-size: 18px; margin-bottom: 15px; opacity: 0.8; }
.container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.card {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  padding: 20px;
  text-decoration: none;
  color: white;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 12px 30px rgba(0,0,0,0.6); background: rgba(255,255,255,0.08); }
.icon { width: 40px; height: 40px; }
.text { display: flex; flex-direction: column; }
.title { font-size: 15px; font-weight: 600; }
.subtitle { font-size: 12px; opacity: 0.6; }
footer { margin-top: 20px; font-size: 13px; opacity: 0.5; }

/* ===================== VISUEL DES PONTS ===================== */
#ponts-visual { display:flex; gap:12px; flex-wrap:wrap; font-size:0.75em; margin-top:10px; }
#ponts-visual > div { min-width:120px; }

/* ===================== SPINNER ===================== */
.spinner {
  width: 35px; height: 35px;
  border: 4px solid #333; border-top: 4px solid #00e5ff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}
@keyframes spin { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }
</style>
</head>
<body>

<h1>Choisissez une vue</h1>
<p>Accès aux calendriers</p>

<!-- RÉCEPTION -->
<div class="section">
  <div class="section-title">📦 Réception</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/calr.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
      </svg>
      <div class="text">
        <div class="title">Calendrier Réception</div>
        <div class="subtitle">Planning simple</div>
      </div>
    </a>
    <a class="card" href="https://receptionroulier.github.io/cal/r.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M3 10h18"/>
      </svg>
      <div class="text">
        <div class="title">Réception + Ponts</div>
        <div class="subtitle">Vue combinée</div>
      </div>
    </a>
  </div>
</div>

<!-- NAVIRES -->
<div class="section">
  <div class="section-title">🚢 Navires</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/caln.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 20h18"/>
        <path d="M5 20l2-5h10l2 5"/>
      </svg>
      <div class="text">
        <div class="title">Calendrier Navires</div>
        <div class="subtitle">Planning des arrivées</div>
      </div>
    </a>
    <a class="card" href="https://receptionroulier.github.io/cal/n.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 20h18"/>
        <path d="M5 20l2-5h10l2 5"/>
      </svg>
      <div class="text">
        <div class="title">Navires + Ponts</div>
        <div class="subtitle">Vue combinée</div>
      </div>
    </a>
  </div>
</div>

<!-- PONTS -->
<div class="section">
  <div class="section-title">🌉 Ponts</div>
  <div class="container">
    <a class="card" href="https://receptionroulier.github.io/cal/p.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 12h18"/>
        <path d="M6 12v4"/>
        <path d="M18 12v4"/>
      </svg>
      <div class="text">
        <div class="title">État des Ponts</div>
        <div id="ponts-visual">
          <div id="col-ferme"></div>
          <div id="col-travaux"></div>
          <div id="col-fermeture"></div>
          <div id="col-manoeuvre"></div>
          <div id="col-ouvert"></div>
        </div>
      </div>
    </a>
  </div>
</div>

<footer>© 2026 - Outils planning</footer>

<script>
// ===================== VISUEL DES PONTS =====================
async function updatePontsCardVisual() {
  const url = "https://www.havre-port.com/map/getPonts?_ts=" + Date.now();
  try {
    const res = await fetch(url);
    const raw = await res.json();
    const data = Object.values(raw.data || raw);

    const columns = { ferme: [], travaux: [], fermeture: [], manoeuvre: [], ouvert: [] };

    data.forEach(p => {
      const s = (p.statutText||"").toLowerCase();
      const info = p.forceText || `Depuis le ${p.date||"inconnue"}`;
      if(s.includes("fermé") && s.includes("travaux")) columns.travaux.push({nom:p.nom, info});
      else if(s.includes("fermé")) columns.ferme.push({nom:p.nom, info});
      else if(s.includes("fermeture")) columns.fermeture.push({nom:p.nom, info});
      else if(s.includes("manoeuvre") || s.includes("manœuvre")) columns.manoeuvre.push({nom:p.nom, info});
      else if(s.includes("ouvert")) columns.ouvert.push({nom:p.nom, info});
    });

    columns.ouvert.sort((a,b)=>{
      const ta=Date.parse(a.info.replace("Depuis le ","")), tb=Date.parse(b.info.replace("Depuis le ",""));
      return tb-ta;
    });

    function makeCol(title,color,list,showMostRecent=false){
      let html=`<div>`;
      html += `<div style="font-weight:bold;color:${color};margin-bottom:4px;">${title} (${list.length})</div>`;
      list.forEach((p,i)=>{
        if(showMostRecent && i>0) return;
        html += `<div>${p.nom}</div>`;
        html += `<div style="opacity:0.8;margin-bottom:4px;">${p.info}</div>`;
      });
      html += `</div>`;
      return html;
    }

    document.getElementById("col-ferme").innerHTML = makeCol("Fermés","#ff4040",columns.ferme);
    document.getElementById("col-travaux").innerHTML = makeCol("Travaux","orange",columns.travaux);
    document.getElementById("col-fermeture").innerHTML = makeCol("En fermeture","orange",columns.fermeture);
    document.getElementById("col-manoeuvre").innerHTML = makeCol("Manœuvre","#1c3cff",columns.manoeuvre);
    document.getElementById("col-ouvert").innerHTML = makeCol("Ouvert","#58ff58",columns.ouvert,true);

  } catch(e){
    console.error("Impossible de récupérer le visuel des ponts :", e);
  }
}

// Mise à jour au chargement et toutes les 30 secondes
updatePontsCardVisual();
setInterval(updatePontsCardVisual,30000);
</script>

</body>
</html>
