<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⚠️ Désinstaller cette app</title>
  <meta name="application-name" content="⚠️ Désinstaller">
  <link rel="manifest" href="/cal/manifest.json">
</head>
<body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:white;text-align:center;padding:24px;box-sizing:border-box;">
  <div>
    <div style="font-size:3rem;margin-bottom:16px;">⚠️</div>
    <h2 style="margin:0 0 12px;font-size:1.1rem;">RoulierLH a déménagé !</h2>
    <p style="font-size:0.85rem;opacity:.7;line-height:1.6;margin-bottom:28px;">
      Veuillez <strong style="color:white;">désinstaller cette icône</strong><br>
      de votre écran d'accueil,<br>
      puis réinstallez l'app depuis le nouveau lien.
    </p>
    <a href="https://lh.roulierlh.workers.dev/"
       style="display:inline-block;background:#6c63ff;color:white;padding:14px 28px;border-radius:10px;text-decoration:none;font-weight:700;font-size:0.95rem;">
      Ouvrir la nouvelle app →
    </a>
  </div>
  <script>
  async function migrate() {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  migrate();
  </script>
</body>
</html>
