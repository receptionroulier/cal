<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 20px;
    scroll-behavior: smooth;
}
.container {
    width: 95%;
    max-width: 1200px;
    padding: 12px;
    box-sizing: border-box;
    overflow-y: auto;
}
h2 {
    text-align: center;
    color: #00e5ff;
    margin: 0 0 5px;
}
#cache-info {
    text-align:center;
    margin-bottom:14px;
    font-size:0.7em;
    color:#ccc;
}
.cache-ok { color:#58ff58; font-weight:bold; }
.cache-fail { color:#ff4040; font-weight:bold; }
@media (max-width: 768px) {
    .container { width: 100%; padding: 8px; }
}
#ponts-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
    word-break: break-word;
}
.pont-card:hover { transform: scale(1.02); }
.pont-card.ferme { border-left-color: #ff4040; }
.pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
.pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
.pont-card.ouvert { border-left-color: #58ff58; }
.pastille { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: inline-block; }
.ferme .pastille { background: #ff4040; }
.fermeture .pastille { background: orange; }
.manoeuvre .pastille { background: #1c3cff; }
.ouvert .pastille { background: #58ff58; }
.pont-nom { font-weight: bold; display: flex; align-items: center; }
.pont-infos { font-size: 0.85em; color: #ccc; }
@keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
}
@keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
}
.error-message { text-align: center; color: #ff4040; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
    <h2>État des Ponts</h2>
    <div id="cache-info">
        <span id="cache-status"></span>
        <span id="cache-time"></span>
    </div>
    <div id="ponts-table">Chargement...</div>
</div>

<script>
const PROXY_STORE_KEY = "pontsProxyStore";
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_TIME = "pontsCacheTime";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_QUALITY = "pontsCacheQuality";
const CACHE_KEY_CHECK = "pontsLastCheck";

const CACHE_EXPIRATION_SHORT = 60000;
const CACHE_EXPIRATION_LONG = 15*60000;
const REFRESH_INTERVAL = 30000;
const PROXY_TEST_TIMEOUT = 8000;
const FETCH_TIMEOUT = 10000;
const PROXY_REBUILD_INTERVAL = 6*60*60*1000;

const INITIAL_PROXIES = [
    "https://proxy.corsfix.com/?",
    "https://yacdn.org/proxy/",
    "https://jsonp.afeld.me/?callback=&url=",
    "https://crossorigin.me/",
    "https://cors-proxy.htmldriven.com/?url=",
    "https://test.cors.workers.dev/?",
    "https://api.codetabs.com/v1/proxy?quest=",
    "https://cors.bridged.cc/",
    "https://corsproxy.io/?",
    "https://allorigins.hexlet.app/get?url=",
    "https://api.allorigins.win/raw?url="
];

let validProxies = [];
let brokenProxies = [];
let allProxies = Array.from(new Set(INITIAL_PROXIES));
let proxyStats = {};
let blacklist = {};

// ============ UTILITAIRES ============
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function withTimeout(promiseFactory, ms){
    const controller = new AbortController();
    const id = setTimeout(()=>controller.abort(), ms);
    try{ const res = await promiseFactory(controller.signal); clearTimeout(id); return res; }
    finally{ clearTimeout(id); }
}
async function fetchWithTimeout(url, options={}, timeout=FETCH_TIMEOUT){
    return withTimeout(signal=>fetch(url,{...options,signal}), timeout);
}
async function sha256(str){
    const data = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest("SHA-256",data);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function normalizeData(data){
    return JSON.stringify(data.map(p=>({nom:p.nom,statutText:p.statutText,date:p.date,forceText:p.forceText||""})).sort((a,b)=>a.nom.localeCompare(b.nom)));
}
function isProxyDisabled(proxy){ 
    return proxyStats[proxy]?.disabledUntil && proxyStats[proxy].disabledUntil > Date.now(); 
}
function shuffle(a){return a.slice().sort(()=>Math.random()-0.5);}
async function testProxySimple(proxy, targetUrl){
    try{
        const res = await fetchWithTimeout(proxy + encodeURIComponent(targetUrl), {method:'GET'}, PROXY_TEST_TIMEOUT);
        if(!res.ok) throw new Error();
        proxyStats[proxy] = proxyStats[proxy] || {success:0,fail:0};
        proxyStats[proxy].success++;
        return {ok:true};
    }catch(e){
        proxyStats[proxy] = proxyStats[proxy] || {success:0,fail:0};
        proxyStats[proxy].fail++;
        if(proxyStats[proxy].fail >= 3) blacklist[proxy] = Date.now() + 5*60*1000;
        return {ok:false};
    }
}

// ============ POOL FETCH ============
async function fetchWithPool(url){
    const lists = [shuffle(validProxies), shuffle(brokenProxies), shuffle(allProxies)];
    for(const list of lists){
        const promises = list.map(proxy=>{
            if(isProxyDisabled(proxy) || (blacklist[proxy] && blacklist[proxy] > Date.now())) return Promise.reject();
            return fetchWithTimeout(proxy+encodeURIComponent(url), {method:'GET'}, FETCH_TIMEOUT)
                .then(res=>res.ok?res:Promise.reject())
                .catch(()=>Promise.reject());
        });
        try{
            const first = await Promise.any(promises);
            return first.json().catch(()=>first.text());
        }catch(e){ continue; }
    }
    return null;
}

// ============ PROXIES DYNAMIQUES ============
async function fetchProxiesBatch(count = 10){
    const proxies = [];
    for(let i=0;i<count;i++){
        try{
            const res = await fetch("https://api.getproxylist.com/proxy?protocol=http");
            if(!res.ok) continue;
            const json = await res.json();
            if(json.ip && json.port){
                proxies.push(`http://${json.ip}:${json.port}`);
            }
        }catch(e){ continue; }
    }
    return proxies;
}

async function rebuildProxyPool(){
    validProxies = validProxies.filter(p=>!blacklist[p]);
    brokenProxies = brokenProxies.filter(p=>!blacklist[p]);
    const newProxies = await fetchProxiesBatch(10);
    const testResults = await Promise.all(newProxies.map(async p=>{
        const test = await testProxySimple(p, "https://www.havre-port.com/map/getPonts");
        return {proxy:p, ok:test.ok};
    }));
    testResults.forEach(r=>{
        if(r.ok && !allProxies.includes(r.proxy)) allProxies.push(r.proxy);
    });
    console.log(`[ProxyPool] Ajoutés ${testResults.filter(r=>r.ok).length} nouveaux proxies`);
}

// ============ CACHE ET PONTS ============
function parseRawContentToData(raw){
    if(!raw) return null;
    if(typeof raw==='string'){ try{const j=JSON.parse(raw); return j?.data||j;}catch(e){return null;} }
    if(typeof raw==='object'){ if(raw.data) return raw.data; if(raw.contents){ try{const inner=JSON.parse(raw.contents); return inner?.data||inner;}catch(e){return null;} } return raw; }
    return null;
}

function updateCacheDisplay(state){
    const status = document.getElementById("cache-status");
    const t = document.getElementById("cache-time");
    const cacheStamp = localStorage.getItem(CACHE_KEY_TIME);
    const checkStamp = localStorage.getItem(CACHE_KEY_CHECK);
    const cacheDate = cacheStamp ? new Date(parseInt(cacheStamp)).toLocaleString("fr-FR") : "inconnue";
    const checkDate = checkStamp ? new Date(parseInt(checkStamp)).toLocaleString("fr-FR") : "inconnue";

    if(state==='fresh'){
        status.innerHTML = '<span class="cache-ok">🟢 </span>';
        t.textContent = " — MàJ : " + cacheDate;
    } else if(state==='unchanged'){
        status.innerHTML = '<span class="cache-ok">🟢 </span>';
        t.textContent = " — MàJ : " + checkDate;
    } else if(state==='fallback'){
        status.innerHTML = '<span class="cache-fail">🔴 </span>';
        t.textContent = " — MàJ : " + cacheDate;
    }
}

async function checkAndUpdate(forceUpdate=false){
    const now = Date.now();
    const last = localStorage.getItem(CACHE_KEY_TIME);
    const container = document.getElementById("ponts-table");
    let cacheUsed = false;
    const cached = localStorage.getItem(CACHE_KEY_DATA);
    const quality = localStorage.getItem(CACHE_KEY_QUALITY);
    const ttl = quality==='fresh'?CACHE_EXPIRATION_LONG:CACHE_EXPIRATION_SHORT;

    if(cached && !forceUpdate && last && now-last<ttl){
        renderPonts(JSON.parse(cached));
        localStorage.setItem(CACHE_KEY_CHECK, now);
        updateCacheDisplay('unchanged');
        cacheUsed = true;
    }

    if(!cacheUsed){
        const raw = await fetchWithPool("https://www.havre-port.com/map/getPonts");
        if(raw){
            const data = parseRawContentToData(raw);
            if(data){
                const ponts = Object.values(data);
                const unique = Array.from(new Map(ponts.map(p=>[p.nom,p])).values());
                const ordered = unique.sort((a,b)=>{
                    const score = p=>{
                        const s = (p.statutText||'').toLowerCase();
                        if(s.includes('fermé')) return 1;
                        if(s.includes('fermeture')) return 2;
                        if(s.includes('manoeuvre')||s.includes('manœuvre')) return 3;
                        if(s.includes('ouvert')) return 4;
                        return 5;
                    }; return score(a)-score(b);
                });

                const norm = normalizeData(ordered);
                const oldHash = localStorage.getItem(CACHE_KEY_HASH);
                const newHash = await sha256(norm);

                localStorage.setItem(CACHE_KEY_DATA,JSON.stringify(ordered));
                localStorage.setItem(CACHE_KEY_TIME,Date.now());
                localStorage.setItem(CACHE_KEY_CHECK, Date.now());

                if(newHash!==oldHash){
                    localStorage.setItem(CACHE_KEY_HASH,newHash);
                    localStorage.setItem(CACHE_KEY_QUALITY,'fresh');
                    updateCacheDisplay('fresh');
                } else {
                    localStorage.setItem(CACHE_KEY_QUALITY,'unchanged');
                    updateCacheDisplay('unchanged');
                }

                renderPonts(ordered);
                return;
            }
        }

        if(cached){
            renderPonts(JSON.parse(cached));
            localStorage.setItem(CACHE_KEY_QUALITY,'fallback');
            updateCacheDisplay('fallback');
        } else {
            container.innerHTML='<div class="error-message">Impossible de récupérer les ponts et aucun cache disponible.</div>';
        }
    }
}

function renderPonts(list){
    const container = document.getElementById("ponts-table");
    if(!list||!list.length){ 
        container.innerHTML = '<div class="error-message">Aucun pont disponible.</div>'; 
        return; 
    }

    const fragment = document.createDocumentFragment();
    list.forEach(p => {
        const statut = (p.statutText||'').toLowerCase();
        const open = statut.includes('ouvert');
        const move = statut.includes('manoeuvre')||statut.includes('manœuvre');
        const fermeture = statut.includes('fermeture');
        const ferme = statut.includes('fermé')||statut.includes('ferme');
        const cls = ferme ? 'ferme' : fermeture ? 'fermeture' : move ? 'manoeuvre' : open ? 'ouvert' : 'ferme';
        const info = p.forceText || `MàJ : ${p.date||'inconnue'}`;

        const card = document.createElement('div');
        card.className = 'pont-card ' + cls;
        card.innerHTML = `
            <div class="pont-nom"><span class="pastille"></span>${p.nom||'Pont sans nom'}</div>
            <div class="pont-etat">${p.statutText||''}</div>
            <div class="pont-infos">${info}</div>
        `;
        fragment.appendChild(card);
    });

    container.innerHTML = '';
    container.appendChild(fragment);

    // Relancer les animations
    ['manoeuvre','fermeture'].forEach(clsName=>{
        const nodes = container.querySelectorAll('.pont-card.'+clsName);
        nodes.forEach(node=>{
            node.style.animation = 'none';
            void node.offsetHeight;
            node.style.animation = '';
        });
    });
}

// ============ INITIALISATION ============
(async function init(){
    await rebuildProxyPool();
    setInterval(rebuildProxyPool, PROXY_REBUILD_INTERVAL);

    await checkAndUpdate(true);
    setInterval(()=>checkAndUpdate(false), REFRESH_INTERVAL);
})();
</script>
</body>
</html>
