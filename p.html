<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ponts du Havre</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #fff;
    text-align: center;
    padding: 20px;
}
.pont {
    padding: 12px;
    margin: 10px auto;
    width: 300px;
    border-radius: 10px;
    background: #333;
    font-size: 20px;
    transition: background 0.3s ease;
}
.manoeuvre {
    animation: clignoteBleu 1s infinite;
}
@keyframes clignoteBleu {
    0% { background-color: #0055ff; }
    50% { background-color: #002266; }
    100% { background-color: #0055ff; }
}
.ferme {
    animation: clignoteOrange 1s infinite;
}
@keyframes clignoteOrange {
    0% { background-color: #ff8800; }
    50% { background-color: #663300; }
    100% { background-color: #ff8800; }
}
.indicateur {
    margin-top: 15px;
    font-size: 16px;
    padding: 8px;
    display: inline-block;
    border-radius: 8px;
}
.indicateur.vert {
    background: #0a0;
}
.indicateur.rouge {
    background: #a00;
}
</style>
</head>
<body>

<h1>État des Ponts</h1>

<div id="ponts-container"></div>

<div id="indicMaj" class="indicateur">Initialisation…</div>

<script>
/* ----------------------------------------
   CONFIG
----------------------------------------- */
const PROXIES = [
    "https://www.havre-port.com/map/getPonts",
    "https://proxy1.example.com/ponts",
    "https://proxy2.example.com/ponts"
];

let cachePonts = null;          // dernier cache accepté
let cacheMaxDate = null;        // date max du dernier cache
let derniereMajTexte = "";      // texte indicateur
let derniereMajCouleur = "";    // classe CSS

/* ----------------------------------------
   UTILITAIRE : extraire date max d'un JSON
----------------------------------------- */
function extractMaxDate(json) {
    try {
        let dates = Object.values(json).map(p => new Date(p.date));
        return new Date(Math.max(...dates));
    } catch {
        return null;
    }
}

/* ----------------------------------------
   AFFICHAGE
----------------------------------------- */
function afficherPonts(json) {
    const cont = document.getElementById("ponts-container");
    cont.innerHTML = "";

    for (let nom in json) {
        const pont = json[nom];
        const div = document.createElement("div");

        div.className = "pont";
        div.textContent = `${pont.nom} — ${pont.etat}`;

        if (pont.etat === "MANOEUVRE") div.classList.add("manoeuvre");
        if (pont.etat === "FERME") div.classList.add("ferme");

        cont.appendChild(div);
    }
}

function afficherIndicateur() {
    const i = document.getElementById("indicMaj");
    i.textContent = derniereMajTexte;
    i.className = "indicateur " + derniereMajCouleur;
}

/* ----------------------------------------
   LECTURE VIA PROXY (aléatoire)
----------------------------------------- */
async function fetchViaProxy() {
    let proxiesMelanges = [...PROXIES].sort(() => Math.random() - 0.5);

    for (let url of proxiesMelanges) {
        try {
            let rep = await fetch(url, { cache: "no-store" });
            if (!rep.ok) continue;
            return await rep.json();
        } catch {
            continue;
        }
    }
    return null; // tous KO
}

/* ----------------------------------------
   MISE À JOUR TOUTES LES 30s
----------------------------------------- */
async function miseAJour() {
    let json = await fetchViaProxy();

    // 1) Problème proxy → on garde le cache actuel
    if (!json) {
        if (cachePonts) {
            derniereMajTexte = "Utilisation du cache (tous les proxy KO) — " +
                cacheMaxDate.toLocaleString();
            derniereMajCouleur = "rouge";
            afficherIndicateur();
            afficherPonts(cachePonts);
        }
        return;
    }

    // 2) On calcule la date max reçue
    let newMaxDate = extractMaxDate(json);
    if (!newMaxDate) return;

    // PREMIER LANCEMENT → on accepte immédiatement
    if (!cachePonts) {
        cachePonts = json;
        cacheMaxDate = newMaxDate;
        afficherPonts(cachePonts);
        derniereMajTexte = "Mise à jour initiale : " + cacheMaxDate.toLocaleString();
        derniereMajCouleur = "vert";
        afficherIndicateur();
        return;
    }

    // 3) Protection anti-retour-en-arrière
    if (newMaxDate < cacheMaxDate) {
        // JSON plus vieux → on ignore
        derniereMajTexte = "Données plus anciennes ignorées — " + cacheMaxDate.toLocaleString();
        derniereMajCouleur = "vert";
        afficherIndicateur();
        afficherPonts(cachePonts);
        return;
    }

    // 4) JSON au moins aussi récent → on doit comparer les contenus
    let inchanges = JSON.stringify(json) === JSON.stringify(cachePonts);

    if (inchanges) {
        // inchangé
        derniereMajTexte = "Données inchangées (vérifié) — " + newMaxDate.toLocaleString();
        derniereMajCouleur = "vert";
        afficherIndicateur();
        afficherPonts(cachePonts);
        return;
    }

    // 5) JSON plus récent → on remplace le cache
    cachePonts = json;
    cacheMaxDate = newMaxDate;

    afficherPonts(cachePonts);
    derniereMajTexte = "Mise à jour — " + cacheMaxDate.toLocaleString();
    derniereMajCouleur = "vert";
    afficherIndicateur();
}

/* ----------------------------------------
   DÉMARRAGE
----------------------------------------- */
miseAJour();
setInterval(miseAJour, 30000);
</script>
</body>
</html>
