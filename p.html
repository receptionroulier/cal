<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 20px;
}
.container {
    width: 95%;
    max-width: 1200px;
    padding: 12px;
    overflow-y: auto;
}
h2 {
    text-align: center;
    color: #00e5ff;
    margin: 0 0 5px;
}
#cache-info { text-align:center; margin-bottom:14px; font-size:0.8em; color:#ccc; }
.cache-ok { color:#58ff58; font-weight:bold; }
.cache-fail { color:#ff4040; font-weight:bold; }

#ponts-table { display: flex; flex-direction: column; gap: 10px; transition: opacity 0.5s; }
.pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
    word-break: break-word;
    opacity: 1;
}
.pont-card:hover { transform: scale(1.02); }

.pont-card.ferme { border-left-color: #ff4040; }
.pont-card.ferme-travaux { border-left-color: #ff4040; }
.pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
.pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
.pont-card.ouvert { border-left-color: #58ff58; }

.pastille { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: inline-block; }
.ferme .pastille, .ferme-travaux .pastille { background: #ff4040; }
.fermeture .pastille { background: orange; }
.manoeuvre .pastille { background: #1c3cff; }
.ouvert .pastille { background: #58ff58; }

.pont-nom { font-weight: bold; display: flex; align-items: center; }
.pont-infos { font-size: 0.85em; color: #ccc; }
.travaux-highlight { background: orange; color: white; font-weight: bold; padding: 0 4px; border-radius: 3px; }

@keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
}
@keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
}
</style>
</head>
<body>
<div class="container">
    <h2>État des Ponts</h2>
    <div id="cache-info">
        <span id="cache-status"></span>
        <span id="cache-time"></span>
    </div>
    <div id="ponts-table">Chargement...</div>
</div>

<script>
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_TIME = "pontsCacheTime";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_QUALITY = "pontsCacheQuality";
const CACHE_KEY_CHECK = "pontsLastCheck";

const REFRESH_INTERVAL = 30000;
const FETCH_TIMEOUT = 10000;
const INITIAL_PROXIES = [
    "https://proxy.corsfix.com/?",
    "https://yacdn.org/proxy/",
    "https://jsonp.afeld.me/?callback=&url=",
    "https://cors-proxy.htmldriven.com/?url=",
    "https://api.codetabs.com/v1/proxy?quest=",
    "https://cors.bridged.cc/",
    "https://corsproxy.io/?",
    "https://allorigins.hexlet.app/get?url=",
    "https://api.allorigins.win/raw?url=",
    "https://thingproxy.freeboard.io/fetch/"
];

let allProxies = INITIAL_PROXIES.map(url=>({url, score:1, fails:0, disabledUntil:0}));

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function withTimeout(promiseFactory, ms){
    const controller = new AbortController();
    const id = setTimeout(()=>controller.abort(), ms);
    try{ const res = await promiseFactory(controller.signal); clearTimeout(id); return res; }
    finally{ clearTimeout(id); }
}
async function fetchWithTimeout(url, options={}, timeout=FETCH_TIMEOUT){
    return withTimeout(signal=>fetch(url,{...options,signal}), timeout);
}
async function fetchWithPool(url){
    const proxies = allProxies.filter(p=>p.disabledUntil<=Date.now()).sort((a,b)=>b.score-a.score);
    for(const p of proxies){
        try{
            const res = await fetchWithTimeout(p.url+encodeURIComponent(url),{method:'GET'},FETCH_TIMEOUT);
            if(res.ok){ p.score=Math.min(p.score+1,10); p.fails=0; return res.json().catch(()=>res.text()); }
            else throw new Error("HTTP non-ok");
        } catch(e){
            p.fails++; p.score=Math.max(p.score-1,0);
            if(p.fails>=3){ p.disabledUntil=Date.now()+30000; p.fails=0; }
        }
    }
    return null;
}

function highlightTravaux(text){ 
    return text ? text.replace(/(travaux)/i,'<span class="travaux-highlight">$1</span>') : ''; 
}

function createCard(p){
    const div = document.createElement("div");
    div.className="pont-card";
    const cls = getStateClass(p);
    div.classList.add(cls);
    div.innerHTML = `<div class="pont-nom"><span class="pastille"></span>${p.nom||'Pont sans nom'}</div>
                     <div class="pont-etat">${highlightTravaux(p.statutText)}</div>
                     <div class="pont-infos">MàJ : ${p.date||'inconnue'}</div>`;
    return div;
}
function getStateClass(p){
    const s=(p.statutText||"").toLowerCase();
    if(s.includes('fermé') && !s.includes('travaux')) return 'ferme';
    if(s.includes('travaux')) return 'ferme-travaux';
    if(s.includes('fermeture')) return 'fermeture';
    if(s.includes('manoeuvre')||s.includes('manœuvre')) return 'manoeuvre';
    if(s.includes('ouvert')) return 'ouvert';
    return 'ferme';
}

function renderPonts(list){
    const container=document.getElementById("ponts-table");
    container.style.opacity=0;
    setTimeout(()=>{
        container.innerHTML='';
        list.forEach(p=>container.appendChild(createCard(p)));
        container.style.opacity=1;
    },300);
}

function updateCacheDisplay(state){
    const status = document.getElementById("cache-status");
    const time = document.getElementById("cache-time");
    const cacheStamp = localStorage.getItem(CACHE_KEY_TIME);
    const checkStamp = localStorage.getItem(CACHE_KEY_CHECK);
    const cacheDate = cacheStamp ? new Date(parseInt(cacheStamp)).toLocaleString() : 'inconnue';
    const checkDate = checkStamp ? new Date(parseInt(checkStamp)).toLocaleString() : 'inconnue';
    if(state==='fresh'){ status.innerHTML='🟢 '; time.textContent=' — MàJ : '+cacheDate; }
    else if(state==='verified'){ status.innerHTML='🟢 '; time.textContent=' — MàJ vérifié : '+checkDate; }
    else if(state==='fallback'){ status.innerHTML='🔴 '; time.textContent=' — MàJ : '+cacheDate; }
}

function normalizeData(data){ return JSON.stringify(data.map(p=>({nom:p.nom,statutText:p.statutText,date:p.date})).sort((a,b)=>a.nom.localeCompare(b.nom))); }

async function checkAndUpdate(force=false){
    const cached = localStorage.getItem(CACHE_KEY_DATA);
    const lastData = cached ? JSON.parse(cached) : [];
    if(cached && !force){ renderPonts(lastData); updateCacheDisplay('verified'); }

    let newData=null;
    for(let i=0;i<3;i++){
        newData=await fetchWithPool("https://www.havre-port.com/map/getPonts");
        if(newData) break; await sleep(200);
    }
    if(!newData){
        if(cached){ updateCacheDisplay('fallback'); return; }
        else { document.getElementById("ponts-table").innerHTML='Impossible de récupérer les ponts.'; return; }
    }

    // transformer en array, enlever doublons et garder état le plus récent
    const pontsArray=Object.values(newData);
    const pontMap=new Map();
    pontsArray.forEach(p=>{
        if(!pontMap.has(p.nom) || new Date(p.date)>new Date(pontMap.get(p.nom).date)) pontMap.set(p.nom,p);
    });
    const finalList=Array.from(pontMap.values());
    // tri par état puis date
    finalList.sort((a,b)=>{
        const score=s=>{
            const s1=(s.statutText||"").toLowerCase();
            if(s1.includes('fermé') && !s1.includes('travaux')) return 1;
            if(s1.includes('travaux')) return 2;
            if(s1.includes('fermeture')) return 3;
            if(s1.includes('manoeuvre')||s1.includes('manœuvre')) return 4;
            if(s1.includes('ouvert')) return 5;
            return 6;
        }
        const diff=score(a)-score(b);
        if(diff!==0) return diff;
        const da=a.date?new Date(a.date):0;
        const db=b.date?new Date(b.date):0;
        return db-da;
    });

    // vérifier si au moins une date est antérieure
    let applyNew=true;
    finalList.forEach(p=>{
        const old=lastData.find(op=>op.nom===p.nom);
        if(old && p.date && old.date && new Date(p.date)<new Date(old.date)) applyNew=false;
    });

    if(applyNew){
        localStorage.setItem(CACHE_KEY_DATA,JSON.stringify(finalList));
        localStorage.setItem(CACHE_KEY_TIME,Date.now());
        localStorage.setItem(CACHE_KEY_CHECK,Date.now());
        updateCacheDisplay('fresh');
        renderPonts(finalList);
    } else {
        updateCacheDisplay('verified');
        renderPonts(lastData);
    }
}

// lancement initial et intervalle
(async function init(){
    await checkAndUpdate(true);
    setInterval(()=>checkAndUpdate(false), REFRESH_INTERVAL);
})();
</script>
</body>
</html>
