<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 20px;
    scroll-behavior: smooth;
}
.container {
    width: 95%;
    max-width: 1200px;
    padding: 12px;
    box-sizing: border-box;
    overflow-y: auto;
}
h2 {
    text-align: center;
    color: #00e5ff;
    margin: 0 0 5px;
}
#cache-info {
    text-align:center;
    margin-bottom:14px;
    font-size:0.7em;
    color:#ccc;
}
.cache-ok { color:#58ff58; font-weight:bold; }
.cache-fail { color:#ff4040; font-weight:bold; }
@media (max-width: 768px) {
    .container { width: 100%; padding: 8px; }
}
#ponts-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
    word-break: break-word;
}
.pont-card:hover { transform: scale(1.02); }
.pont-card.ferme { border-left-color: #ff4040; }
.pont-card.ferme-travaux { border-left-color: #ff4040; }
.pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
.pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
.pont-card.ouvert { border-left-color: #58ff58; }
.pastille { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: inline-block; }
.ferme .pastille,
.ferme-travaux .pastille { background: #ff4040; }
.fermeture .pastille { background: orange; }
.manoeuvre .pastille { background: #1c3cff; }
.ouvert .pastille { background: #58ff58; }
.pont-nom { font-weight: bold; display: flex; align-items: center; }
.pont-infos { font-size: 0.85em; color: #ccc; }
.error-message { text-align: center; color: #ff4040; font-weight: bold; }
/* style du mot Travaux */
.travaux-highlight {
    background: orange;
    color: white;
    padding: 0 4px;
    border-radius: 3px;
}
@keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
}
@keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
}
</style>
</head>
<body>
<div class="container">
    <h2>État des Ponts</h2>
    <div id="cache-info">
        <span id="cache-status"></span>
        <span id="cache-time"></span>
    </div>
    <div id="ponts-table">Chargement...</div>
</div>

<script>
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_TIME = "pontsCacheTime";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_QUALITY = "pontsCacheQuality";
const CACHE_KEY_CHECK = "pontsLastCheck";

const CACHE_EXPIRATION_SHORT = 60000;
const CACHE_EXPIRATION_LONG = 15*60000;
const REFRESH_INTERVAL = 30000;
const FETCH_TIMEOUT = 10000;

const INITIAL_PROXIES = [
    "https://proxy.corsfix.com/?",
    "https://yacdn.org/proxy/",
    "https://jsonp.afeld.me/?callback=&url=",
    "https://cors-proxy.htmldriven.com/?url=",
    "https://api.codetabs.com/v1/proxy?quest=",
    "https://cors.bridged.cc/",
    "https://corsproxy.io/?",
    "https://allorigins.hexlet.app/get?url=",
    "https://api.allorigins.win/raw?url="
];

let allProxies = INITIAL_PROXIES.map(p=>({url:p, score:1, fails:0, disabledUntil:0}));

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function withTimeout(promiseFactory, ms){
    const controller = new AbortController();
    const id = setTimeout(()=>controller.abort(), ms);
    try{ const res = await promiseFactory(controller.signal); clearTimeout(id); return res; }
    finally{ clearTimeout(id); }
}
async function fetchWithTimeout(url, options={}, timeout=FETCH_TIMEOUT){
    return withTimeout(signal=>fetch(url,{...options,signal}), timeout);
}
async function sha256(str){
    const data = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest("SHA-256",data);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function normalizeData(data){
    return JSON.stringify(data.map(p=>({nom:p.nom,statutText:p.statutText,date:p.date})).sort((a,b)=>a.nom.localeCompare(b.nom)));
}
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }
function getSortedProxies(){
    const now = Date.now();
    return allProxies.filter(p=>p.disabledUntil<=now).sort((a,b)=>b.score-b.score);
}
async function fetchWithPool(url){
    const proxies = getSortedProxies();
    for(const proxy of proxies){
        try{
            const res = await fetchWithTimeout(proxy.url+encodeURIComponent(url),{method:'GET'},FETCH_TIMEOUT);
            if(res.ok){
                proxy.score = Math.min(proxy.score+1,10);
                proxy.fails = 0;
                return res.json().catch(()=>res.text());
            } else throw new Error("HTTP non-ok");
        } catch(e){
            proxy.fails++;
            proxy.score = Math.max(proxy.score-1,0);
            if(proxy.fails>=3){
                proxy.disabledUntil = Date.now()+30000;
                proxy.fails = 0;
            }
        }
    }
    return null;
}
function parseRawContentToData(raw){
    if(!raw) return null;
    if(typeof raw==='string'){ try{const j=JSON.parse(raw); return j?.data||j;}catch(e){return null;} }
    if(typeof raw==='object'){ if(raw.data) return raw.data; if(raw.contents){ try{const inner=JSON.parse(raw.contents); return inner?.data||inner;}catch(e){return null;} } return raw; }
    return null;
}
function updateCacheDisplay(state){
    const status = document.getElementById("cache-status");
    const t = document.getElementById("cache-time");
    const cacheStamp = localStorage.getItem(CACHE_KEY_TIME);
    const checkStamp = localStorage.getItem(CACHE_KEY_CHECK);
    const cacheDate = cacheStamp ? new Date(parseInt(cacheStamp)).toLocaleString("fr-FR") : "inconnue";
    const checkDate = checkStamp ? new Date(parseInt(checkStamp)).toLocaleString("fr-FR") : "inconnue";

    if(state==='fresh'){
        status.innerHTML = '<span class="cache-ok">🟢 </span>';
        t.textContent = " — MàJ : " + cacheDate;
    } else if(state==='verified'){
        status.innerHTML = '<span class="cache-ok">🟢 </span>';
        t.textContent = " — MàJ vérifié: " + checkDate;
    } else if(state==='fallback'){
        status.innerHTML = '<span class="cache-fail">🔴 </span>';
        t.textContent = " — MàJ : " + cacheDate;
    }
}

// transforme "Travaux" en fond orange + texte blanc
function highlightTravaux(text){
    if(!text) return "";
    return text.replace(/(travaux)/i,'<strong>$1</strong>, '<span class="travaux-highlight">$1</span>');
}

function createCard(p){
    const div = document.createElement("div");
    div.className = "pont-card";
    const statut = (p.statutText||"").toLowerCase();
    const open=statut.includes('ouvert');
    const move=statut.includes('manoeuvre')||statut.includes('manœuvre');
    const fermeture=statut.includes('fermeture');
    const ferme=statut.includes('fermé');
    let cls;
    if(ferme && !statut.includes('travaux')) cls="ferme";
    else if(statut.includes('travaux')) cls="ferme-travaux";
    else if(fermeture) cls="fermeture";
    else if(move) cls="manoeuvre";
    else if(open) cls="ouvert";
    else cls="ferme";
    div.classList.add(cls);

    div.innerHTML = `<div class="pont-nom"><span class="pastille"></span>${p.nom||'Pont sans nom'}</div>
                     <div class="pont-etat">${highlightTravaux(p.statutText)}</div>
                     <div class="pont-infos">${p.forceText||`MàJ : ${p.date||'inconnue'}`}</div>`;
    return div;
}

function updateCard(div,p){
    const statut = (p.statutText||"").toLowerCase();
    div.className = "pont-card";
    const open=statut.includes('ouvert');
    const move=statut.includes('manoeuvre')||statut.includes('manœuvre');
    const fermeture=statut.includes('fermeture');
    const ferme=statut.includes('fermé');
    let cls;
    if(ferme && !statut.includes('travaux')) cls="ferme";
    else if(statut.includes('travaux')) cls="ferme-travaux";
    else if(fermeture) cls="fermeture";
    else if(move) cls="manoeuvre";
    else if(open) cls="ouvert";
    else cls="ferme";
    div.classList.add(cls);

    div.querySelector(".pont-nom").innerHTML = `<span class="pastille"></span>${p.nom||'Pont sans nom'}`;
    div.querySelector(".pont-etat").innerHTML = highlightTravaux(p.statutText);
    div.querySelector(".pont-infos").textContent = p.forceText||`MàJ : ${p.date||'inconnue'}`;
}

function renderPontsPartial(list){
    const container=document.getElementById("ponts-table");
    if(container.textContent.includes('Chargement')) container.innerHTML=''; 
    const existing = {};
    container.querySelectorAll(".pont-card").forEach(c=>existing[c.id]=c);
    const seen = new Set();
    list.forEach(p=>{
        const id = "pont-"+p.nom.replace(/\s+/g,'_');
        seen.add(id);
        if(existing[id]){
            const div = existing[id];
            if(div.dataset.statut!==p.statutText || div.dataset.date!==p.date){
                updateCard(div,p);
            }
        } else {
            const div = createCard(p);
            container.appendChild(div);
        }
    });
    Object.keys(existing).forEach(id=>{
        if(!seen.has(id)) existing[id].remove();
    });
}

async function checkAndUpdate(forceUpdate=false){
    const now = Date.now();
    const last = localStorage.getItem(CACHE_KEY_TIME);
    let cacheUsed = false;
    const cached = localStorage.getItem(CACHE_KEY_DATA);
    const quality = localStorage.getItem(CACHE_KEY_QUALITY);
    const ttl = quality==='fresh'?CACHE_EXPIRATION_LONG:CACHE_EXPIRATION_SHORT;

    if(cached && !forceUpdate && last && now-last<ttl){
        renderPontsPartial(JSON.parse(cached));
        localStorage.setItem(CACHE_KEY_CHECK, now);
        updateCacheDisplay('verified');
        cacheUsed = true;
    }

    async function fetchDataOnce(){
        const raw = await fetchWithPool("https://www.havre-port.com/map/getPonts");
        if(!raw) return null;
        const data = parseRawContentToData(raw);
        if(!data) return null;
        const ponts = Object.values(data);
        const unique = Array.from(new Map(ponts.map(p=>[p.nom,p])).values());
        return unique.sort((a,b)=>{
            const score = p=>{
                const s = (p.statutText||'').toLowerCase();
                if(s.includes('fermé') && !s.includes('travaux')) return 1;
                if(s.includes('travaux')) return 2;
                if(s.includes('fermeture')) return 3;
                if(s.includes('manoeuvre')||s.includes('manœuvre')) return 4;
                if(s.includes('ouvert')) return 5;
                return 6;
            };
            const s = score(a)-score(b);
            if(s !== 0) return s;
            const da = a.date ? new Date(a.date) : new Date(0);
            const db = b.date ? new Date(b.date) : new Date(0);
            return db - da;
        });
    }

    let newData = null;
    if(!cached || forceUpdate){
        for(let i=0;i<3;i++){
            newData = await fetchDataOnce();
            if(newData) break;
            await sleep(200);
        }
    } else {
        newData = await fetchDataOnce();
    }

    if(newData){
        const norm = normalizeData(newData);
        const oldHash = localStorage.getItem(CACHE_KEY_HASH);
        const oldData = cached ? JSON.parse(cached) : [];
        let applyNew = true;

        for(const p of newData){
            const oldP = oldData.find(op=>op.nom===p.nom);
            if(oldP && p.date && oldP.date && p.date < oldP.date){
                applyNew = false;
                break;
            }
        }

        if(applyNew){
            const newHash = await sha256(norm);
            localStorage.setItem(CACHE_KEY_DATA,JSON.stringify(newData));
            localStorage.setItem(CACHE_KEY_TIME,Date.now());
            localStorage.setItem(CACHE_KEY_CHECK, Date.now());
            localStorage.setItem(CACHE_KEY_HASH,newHash);
            localStorage.setItem(CACHE_KEY_QUALITY, newHash!==oldHash ? 'fresh' : 'verified');
            updateCacheDisplay(newHash!==oldHash ? 'fresh' : 'verified');
            renderPontsPartial(newData);
        } else {
            renderPontsPartial(oldData);
            updateCacheDisplay('verified');
        }
    } else {
        if(cached){
            renderPontsPartial(JSON.parse(cached));
            localStorage.setItem(CACHE_KEY_QUALITY,'fallback');
            updateCacheDisplay('fallback');
        } else {
            document.getElementById("ponts-table").innerHTML='<div class="error-message">Impossible de récupérer les ponts et aucun cache disponible.</div>';
        }
    }
}

(async function init(){
    await checkAndUpdate(true);
    setInterval(()=>checkAndUpdate(false), REFRESH_INTERVAL);
})();
</script>
</body>
</html>
