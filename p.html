<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tableau de bord - Ponts</title>
<style>
/* =====================
   GLOBAL
===================== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 20px;
}
.container {
    width: 95%;    
    padding: 14px;
    box-sizing: border-box;
    overflow-y: auto;
}
h2 {
    text-align: center;
    color: #00e5ff;
    margin: 0 0 15px;
}

/* Responsive */
@media (max-width: 768px) {
    .container {
        width: 90%;
    }
}

/* =====================
   CARTES PONTS
===================== */
#ponts-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
}
.pont-card:hover { transform: scale(1.02); }
.pont-card.ferme { border-left-color: #ff4040; }
.pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
.pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
.pont-card.ouvert { border-left-color: #58ff58; }
.pastille { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: inline-block; }
.ferme .pastille    { background: #ff4040; }
.fermeture .pastille { background: orange; }
.manoeuvre .pastille { background: #1c3cff; }
.ouvert .pastille   { background: #58ff58; }
.pont-nom { font-weight: bold; display: flex; align-items: center; }
.pont-infos { font-size: 0.85em; color: #ccc; }

@keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
}
@keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
}
.error-message {
    text-align: center;
    color: #ff4040;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>État des Ponts</h2>
    <div id="ponts-table">Chargement...</div>
</div>

<script>
/* ===========================================================
   CONFIGURATION
   =========================================================== */
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_TIME = "pontsCacheTime";

const PROXY_STORE_KEY = "pontsProxyStore"; // persist valid/broken proxies
const CACHE_EXPIRATION = 60000; // 1 minutes
const REFRESH_INTERVAL = 30000; // 30 segondes between updates
const PROXY_TEST_TIMEOUT = 8000; // ms timeout pour tester un proxy
const FETCH_TIMEOUT = 10000; // ms timeout pour fetch réel via proxy
const RETEST_INTERVAL = 10 * 60 * 1000; // retest des proxys tombés toutes les 10 min
const RETEST_BATCH_SIZE = 5; // combien de proxys "cassés" retester à chaque passe

/* Liste initiale (fallback) de proxys à tester si rien en stockage.
   Tu peux en ajouter/supprimer selon ton expérience */
const INITIAL_PROXIES = [
    "https://api.allorigins.win/get?url=",
    "https://thingproxy.freeboard.io/fetch/",
    "https://cors-anywhere.com/",
    "https://every-origin.vercel.app/",
    "https://proxy.corsfix.com/?",
    "https://yacdn.org/proxy/",
    "https://jsonp.afeld.me/?callback=&url=",
    "https://crossorigin.me/",
    "https://cors-proxy.htmldriven.com/?url=",
    "https://test.cors.workers.dev/?"
];

/* ===========================================================
   ÉTAT LOCAL (en mémoire)
   validProxies: proxys testés et valides (préférés)
   brokenProxies: proxys qui ont échoué au test
   allProxies: union / source
   =========================================================== */
let validProxies = [];
let brokenProxies = [];
let allProxies = [...INITIAL_PROXIES];

/* ===========================================================
   UTILITAIRES
   =========================================================== */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function withTimeout(promise, ms, onAbort) {
    const controller = new AbortController();
    const id = setTimeout(() => {
        controller.abort();
        if (typeof onAbort === "function") onAbort();
    }, ms);
    try {
        const res = await promise(controller.signal);
        clearTimeout(id);
        return res;
    } finally {
        clearTimeout(id);
    }
}

async function fetchWithTimeout(url, options = {}, timeout = FETCH_TIMEOUT) {
    return withTimeout(async (signal) => {
        const merged = { ...options, signal };
        return fetch(url, merged);
    }, timeout, () => {});
}

async function sha256(str) {
    const data = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

function normalizeData(data) {
    return JSON.stringify(data
        .map(p => ({
            nom: p.nom,
            statutText: p.statutText,
            date: p.date,
            forceText: p.forceText || ""
        }))
        .sort((a, b) => a.nom.localeCompare(b.nom))
    );
}

/* Parse robuste de la réponse "raw" retournée par le proxy.
   Peut recevoir :
   - un objet JS (avec .data)
   - une string (qui peut contenir JSON)
   - un objet { contents: '...'} (allorigins)
   On renvoie l'objet JS final (ou null si parse fail). */
function parseProxyPayload(raw) {
    if (!raw) return null;
    // si c'est une string, tenter parse JSON
    if (typeof raw === "string") {
        try { return JSON.parse(raw); } catch (e) { return null; }
    }
    // si objet et a une propriété 'contents' (allorigins style), tenter parse contents
    if (typeof raw === "object") {
        if (raw.contents && typeof raw.contents === "string") {
            try {
                return JSON.parse(raw.contents);
            } catch (e) {
                return null;
            }
        }
        return raw; // on suppose un objet déjà
    }
    return null;
}

/* ===========================================================
   PERSISTENCE DES PROXYS (stocker valid/broken pour accélérer)
   =========================================================== */
function loadProxyStoreFromLS() {
    try {
        const raw = localStorage.getItem(PROXY_STORE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed;
    } catch (e) { return null; }
}
function saveProxyStoreToLS(store) {
    try {
        localStorage.setItem(PROXY_STORE_KEY, JSON.stringify(store));
    } catch (e) { /* ignore */ }
}

/* ===========================================================
   TEST DES PROXYS
   - testProxySimple: teste un proxy une fois (avec timeout)
   - preTestProxies: au démarrage, on teste tous (ou ceux en store)
   =========================================================== */
async function testProxySimple(proxy, targetUrl, timeout = PROXY_TEST_TIMEOUT) {
    // On fait un fetch rapide avec timeout; si réponse ok on renvoie true + contenu
    try {
        const res = await withTimeout(async (signal) => {
            // certains proxies attendent l'url encodée à la fin, d'autres utilisent param 'url='
            // Ici on assume que la chaîne proxy est un préfixe où on concatène encodeURIComponent(url)
            // (c'est le format utilisé dans INITIAL_PROXIES)
            const full = proxy + encodeURIComponent(targetUrl);
            const r = await fetch(full, { method: 'GET', signal });
            return r;
        }, timeout, () => {});
        if (!res.ok) {
            return { ok: false, status: res.status };
        }
        // essayer de parser JSON léger (ou au moins vérifier qu'on a quelque chose)
        const contentType = res.headers.get('content-type') || '';
        let parsed = null;
        if (contentType.includes('application/json')) {
            parsed = await res.json();
        } else {
            // tenter de parser en texte puis JSON (beaucoup de proxys renvoient JSON même si header absent)
            const text = await res.text();
            try { parsed = JSON.parse(text); } catch (e) { parsed = text; }
        }
        // Si on obtient quelque chose, considérer le proxy valide
        return { ok: true, parsed };
    } catch (err) {
        return { ok: false, error: err.message || String(err) };
    }
}

async function preTestProxies(targetUrl) {
    // Charger store depuis LS si présent (pour accélérer)
    const store = loadProxyStoreFromLS();
    if (store && Array.isArray(store.validProxies) && store.validProxies.length) {
        // On démarre avec ce store mais on va retester rapidement en background
        validProxies = [...new Set(store.validProxies)];
        brokenProxies = Array.isArray(store.brokenProxies) ? [...new Set(store.brokenProxies)] : [];
        allProxies = Array.from(new Set([...allProxies, ...validProxies, ...brokenProxies]));
        console.log("💾 Proxies chargés depuis localStorage:", validProxies.length, "valide(s),", brokenProxies.length, "cassé(s)");
    } else {
        // prendre la liste initiale
        validProxies = [];
        brokenProxies = [...allProxies];
    }

    // Si on a peu ou pas de validProxies, tester un ensemble initial
    const toTest = Array.from(new Set([...validProxies, ...brokenProxies, ...allProxies]));
    console.log("🔎 Pré-test des proxys (total list):", toTest.length);

    // lancer tests en batch (limiter concurrence)
    const concurrency = 6;
    const results = [];
    let idx = 0;
    async function worker() {
        while (idx < toTest.length) {
            const p = toTest[idx++];
            try {
                const r = await testProxySimple(p, targetUrl, PROXY_TEST_TIMEOUT);
                results.push({ proxy: p, result: r });
            } catch (e) {
                results.push({ proxy: p, result: { ok: false, error: e.message } });
            }
        }
    }
    // démarrer workers
    const workers = Array(concurrency).fill(0).map(() => worker());
    await Promise.all(workers);

    // classer résultats
    const newValids = [];
    const newBroken = [];
    for (const entry of results) {
        if (entry.result && entry.result.ok) newValids.push(entry.proxy);
        else newBroken.push(entry.proxy);
    }

    // si aucun valid trouvé, garder la plus probable (on veut avoir quelque chose pour essayer)
    if (newValids.length === 0 && results.length > 0) {
        // prendre le premier résultat "ok-like" (status < 500) ou sinon le premier proxy pour tenter
        const prefer = results.find(r => r.result && r.result.ok) || results[0];
        if (prefer) newValids.push(prefer.proxy);
    }

    // appliquer
    validProxies = Array.from(new Set(newValids));
    brokenProxies = Array.from(new Set(newBroken.filter(p => !validProxies.includes(p))));
    allProxies = Array.from(new Set([...allProxies, ...validProxies, ...brokenProxies]));

    // sauvegarder en localStorage pour accélérer prochains démarrages
    saveProxyStoreToLS({ validProxies, brokenProxies, timestamp: Date.now() });

    console.log(`✅ Pré-test terminé — valides: ${validProxies.length}, cassés: ${brokenProxies.length}`);
    return { validProxies, brokenProxies };
}

/* ===========================================================
   RETEST PROXYS "CASSÉS" EN ARRIÈRE-PLAN (par batch)
   - retestBrokenProxies: reteste RETEST_BATCH_SIZE proxys cassés
   - planifié périodiquement
   =========================================================== */
async function retestBrokenProxies(targetUrl) {
    if (!brokenProxies || brokenProxies.length === 0) return;
    const toRetest = brokenProxies.slice(0, RETEST_BATCH_SIZE);
    console.log("🔁 Retest proxys cassés (batch):", toRetest);
    for (const p of toRetest) {
        const res = await testProxySimple(p, targetUrl, PROXY_TEST_TIMEOUT);
        if (res.ok) {
            // remettre dans valides
            validProxies.push(p);
            brokenProxies = brokenProxies.filter(x => x !== p);
            console.log("♻️ Proxy rétabli :", p);
            saveProxyStoreToLS({ validProxies: Array.from(new Set(validProxies)), brokenProxies, timestamp: Date.now() });
        } else {
            // le laisser cassé mais on peut le tourner vers la fin de liste
            brokenProxies = brokenProxies.filter(x => x !== p).concat(p);
            console.log("⛔ Toujours cassé :", p);
        }
        // petit délai pour éviter rafales
        await sleep(400);
    }
}

/* ===========================================================
   FETCH AVEC POOL DE PROXYS
   - On utilise d'abord validProxies (ordre mélangé)
   - Si rien, on retente brokenProxies (ordre mélangé)
   - Chaque tentative a un timeout; si réponse OK, on retourne le contenu
   - Si aucun proxy ne répond, retourne null (caller fait fallback cache)
   =========================================================== */
function shuffle(a) { return a.slice().sort(() => Math.random() - 0.5); }

async function fetchWithPool(url) {
    const tryLists = [
        shuffle(validProxies),
        shuffle(brokenProxies),
        shuffle(allProxies)
    ];

    for (const list of tryLists) {
        if (!list || list.length === 0) continue;
        for (const proxy of list) {
            try {
                // faire une requête via proxy avec timeout
                const full = proxy + encodeURIComponent(url);
                const res = await fetchWithTimeout(full, { method: 'GET' }, FETCH_TIMEOUT);
                if (!res.ok) {
                    console.warn(`Proxy ${proxy} renvoyé status ${res.status}`);
                    // marquer comme cassé si 5xx
                    if (res.status >= 500 && !brokenProxies.includes(proxy)) {
                        brokenProxies.push(proxy);
                        validProxies = validProxies.filter(p => p !== proxy);
                        saveProxyStoreToLS({ validProxies, brokenProxies, timestamp: Date.now() });
                    }
                    continue;
                }
                // lire payload
                const contentType = res.headers.get('content-type') || '';
                let raw;
                if (contentType.includes('application/json')) {
                    raw = await res.json();
                } else {
                    raw = await res.text();
                    // essayer de parser JSON si possible
                    try { raw = JSON.parse(raw); } catch (e) { /* keep text */ }
                }
                // si ok, considérer proxy valide et sauvegarder si nouveau
                if (!validProxies.includes(proxy)) {
                    validProxies.push(proxy);
                    brokenProxies = brokenProxies.filter(p => p !== proxy);
                    saveProxyStoreToLS({ validProxies: Array.from(new Set(validProxies)), brokenProxies, timestamp: Date.now() });
                }
                return raw;
            } catch (err) {
                console.warn(`Erreur fetch via proxy ${proxy}:`, err && err.message ? err.message : err);
                // marquer comme cassé localement (mais on continuera d'essayer d'autres proxys)
                if (!brokenProxies.includes(proxy)) {
                    brokenProxies.push(proxy);
                    validProxies = validProxies.filter(p => p !== proxy);
                    saveProxyStoreToLS({ validProxies, brokenProxies, timestamp: Date.now() });
                }
                // petite pause courte pour éviter rafales (et débordements des proxys)
                await sleep(150);
                continue;
            }
        }
    }
    // aucun proxy n'a fonctionné
    return null;
}

/* ===========================================================
   LOGIQUE PONTS (intégration complète)
   =========================================================== */
function parseRawContentToData(raw) {
    // raw peut être :
    // - objet contenant .data (déjà)
    // - objet contenant .contents (string JSON)
    // - une string JSON
    try {
        if (!raw) return null;
        if (typeof raw === "string") {
            // parse possible JSON
            let j = null;
            try { j = JSON.parse(raw); } catch (e) { return null; }
            if (j && j.data) return j.data;
            return j;
        }
        if (typeof raw === "object") {
            if (raw.data) return raw.data;
            if (raw.contents) {
                try {
                    const inner = JSON.parse(raw.contents);
                    if (inner && inner.data) return inner.data;
                    return inner;
                } catch (e) { return null; }
            }
            return raw;
        }
    } catch (e) {
        return null;
    }
    return null;
}

async function checkAndUpdate(forceUpdate = false) {
    const now = Date.now();
    const last = localStorage.getItem(CACHE_KEY_TIME);
    const container = document.getElementById("ponts-table");

    // si cache récent et pas de forceUpdate -> afficher cache
    if (!forceUpdate && last && now - last < CACHE_EXPIRATION) {
        const cached = localStorage.getItem(CACHE_KEY_DATA);
        if (cached) {
            try {
                renderPonts(JSON.parse(cached));
                console.log("⚡ Cache utilisé (valid)");
                return;
            } catch (e) {
                console.warn("Erreur parsing cache:", e);
            }
        }
    }

    // tenter fetch via pool de proxys
    try {
        const raw = await fetchWithPool("https://www.havre-port.com/map/getPonts");
        if (!raw) throw new Error("Aucun proxy n'a répondu");

        const data = parseRawContentToData(raw);
        if (!data) throw new Error("Impossible d'extraire les données de la réponse API");

        const ponts = Object.values(data);
        const unique = Array.from(new Map(ponts.map(p => [p.nom, p])).values());

        const ordered = unique.sort((a, b) => {
            const score = p => {
                const s = (p.statutText || "").toLowerCase();
                if (s.includes("fermé")) return 1;
                if (s.includes("fermeture")) return 2;
                if (s.includes("manoeuvre") || s.includes("manœuvre")) return 3;
                if (s.includes("ouvert")) return 4;
                return 5;
            };
            return score(a) - score(b);
        });

        const norm = normalizeData(ordered);
        const newHash = await sha256(norm);
        const oldHash = localStorage.getItem(CACHE_KEY_HASH);

        if (newHash !== oldHash) {
            localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(ordered));
            localStorage.setItem(CACHE_KEY_HASH, newHash);
            console.log("🔄 Cache mis à jour (nouveau hash)");
        } else {
            console.log("✅ Données inchangées (hash identique)");
        }
        localStorage.setItem(CACHE_KEY_TIME, Date.now());
        renderPonts(ordered);
    } catch (err) {
        console.warn("Erreur récupération ponts:", err && err.message ? err.message : err);
        // fallback: afficher dernier cache valide si présent
        const cached = localStorage.getItem(CACHE_KEY_DATA);
        if (cached) {
            try {
                renderPonts(JSON.parse(cached));
                console.log("⚠️ Utilisation du dernier cache valide (fallback)");
            } catch (e) {
                container.innerHTML = `<div class="error-message">Impossible de récupérer les ponts et le cache est corrompu.</div>`;
            }
        } else {
            container.innerHTML = `<div class="error-message">Impossible de récupérer les ponts et aucun cache disponible.</div>`;
        }
    }
}

/* ===========================================================
   RENDER
   =========================================================== */
function renderPonts(list) {
    const container = document.getElementById("ponts-table");
    if (!list || !list.length) {
        container.innerHTML = '<div class="error-message">Aucun pont disponible.</div>';
        return;
    }

    container.innerHTML = list.map(p => {
        const statut = (p.statutText || "").toLowerCase();
        const open = statut.includes("ouvert");
        const move = statut.includes("manoeuvre") || statut.includes("manœuvre");
        const fermeture = statut.includes("fermeture");
        const ferme = statut.includes("fermé") || statut.includes("ferme");
        const cls = ferme ? "ferme" : fermeture ? "fermeture" : move ? "manoeuvre" : open ? "ouvert" : "ferme";
        const info = p.forceText || `MàJ : ${p.date || "inconnue"}`;

        return `
            <div class="pont-card ${cls}">
                <div class="pont-nom">
                    <span class="pastille" aria-label="Statut: ${p.statutText || 'inconnu'}"></span>${p.nom || 'Pont sans nom'}
                </div>
                <div class="pont-etat">${p.statutText || ''}</div>
                <div class="pont-infos">${info}</div>
            </div>
        `;
    }).join("");
}

/* ===========================================================
   INITIALISATION
   - pré-test proxies au démarrage
   - planifier retest batches
   - lancer checkAndUpdate(force=true)
   - boucle périodique de rafraîchissement
   =========================================================== */
(async function init() {
    const target = "https://www.havre-port.com/map/getPonts";
    // charger store et pré-tester proxys
    try {
        // if no store, preTest will test INITIAL_PROXIES
        await preTestProxies(target);
    } catch (e) {
        console.warn("Pré-test proxys a planté :", e);
    }

    // Démarrer retest périodique des proxys cassés
    setInterval(() => {
        retestBrokenProxies(target).catch(e => console.warn("Erreur retestBrokenProxies:", e));
    }, RETEST_INTERVAL);

    // Lancer update forcée au démarrage pour avoir l'état le plus frais possible
    checkAndUpdate(true);

    // Boucle régulière
    setInterval(() => checkAndUpdate(false), REFRESH_INTERVAL);

    // en background, retester rapidement tout un cycle après quelques secondes
    // pour améliorer validProxies si on a démarré depuis old store
    setTimeout(() => {
        preTestProxies(target).catch(e => console.warn("Second preTest failed:", e));
    }, 5000);
})();
</script>

</body>
</html>
