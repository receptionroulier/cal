<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 20px;
}
.container {
    width: 95%;    
    padding: 14px;
    box-sizing: border-box;
    overflow-y: auto;
}
h2 {
    text-align: center;
    color: #00e5ff;
    margin: 0 0 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}
#status-indicator {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: gray;
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
}
#status-indicator.ok {
    background: #58ff58;
    box-shadow: 0 0 6px #58ff58;
}
#status-indicator.fail {
    background: #ff4040;
    box-shadow: 0 0 6px #ff4040;
}

#ponts-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
}
.pont-card:hover { transform: scale(1.02); }
.pont-card.ferme { border-left-color: #ff4040; }
.pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
.pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
.pont-card.ouvert { border-left-color: #58ff58; }
.pastille { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: inline-block; }
.ferme .pastille    { background: #ff4040; }
.fermeture .pastille { background: orange; }
.manoeuvre .pastille { background: #1c3cff; }
.ouvert .pastille   { background: #58ff58; }
.pont-nom { font-weight: bold; display: flex; align-items: center; }
.pont-infos { font-size: 0.85em; color: #ccc; }

@keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
}
@keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
}
.error-message {
    text-align: center;
    color: #ff4040;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>État des Ponts <span id="status-indicator"></span></h2>
    <div id="maj-info" style="text-align:center;font-size:0.8em;color:#aaa;margin-top:-10px;margin-bottom:10px;">MàJ : —</div>
    <div id="ponts-table">Chargement...</div>
</div>

<script>
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_TIME = "pontsCacheTime";
const PROXY_STORE_KEY = "pontsProxyStore";

const CACHE_EXPIRATION = 60000;
const REFRESH_INTERVAL = 30000;
const FETCH_TIMEOUT = 10000;
const PROXY_TEST_TIMEOUT = 8000;
const RETEST_INTERVAL = 5 * 60 * 1000;

const PROXIES = [
    "https://api.allorigins.win/raw?url=",
    "https://api.allorigins.win/get?url=",
    "https://thingproxy.freeboard.io/fetch/",
    "https://api.codetabs.com/v1/proxy?quest=",
    "https://api.allorigins.win/raw?url=",
    "https://cors.isomorphic-git.org/",
    "https://yacdn.org/proxy/",
    "https://api.allorigins.win/get?url=",
    "https://proxy.cors.sh/",
    "https://corsproxy.io/?",
    "https://crossorigin.me/",
    "https://jsonp.afeld.me/?url=",
    "https://api.scraperlink.com/cors?url=",
    "https://cors-anywhere.herokuapp.com/",
    "https://proxymaster.vercel.app/api/?url=",
    "https://public.newtonschool.co/v1/corsproxy/?url=",
    "https://proxy.hackathon.win/?url=",
    "https://proxy.zyte.com/?url=",
    "https://fetch-proxy.herokuapp.com/?url=",
    "https://my-cors-proxy.fly.dev/?url=",
    "https://one-cors-proxy.vercel.app/api/?url=",
    "https://thingproxy-760a.up.railway.app/fetch/",
    "https://flycorsproxy-production.up.railway.app/?url=",
    "https://proxy.liam.sh/?url=",
    "https://api.allorigins.win/raw?url=",
    "https://cors-proxy-mint.vercel.app/api?url=",
    "https://havre-cors-proxy.vercel.app/?url=",
    "https://freedom-cors-proxy.vercel.app/?url=",
    "https://anyoriginproxy.vercel.app/?url=",
    "https://simple-cors-proxy-omega.vercel.app/?url=",
    "https://open-proxy.nomore.workers.dev/?url="
];

function timeoutPromise(ms){ return new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms)); }

async function sha256(str){
    const data = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function normalizeData(data){
    return JSON.stringify(
        data.map(p=>({ nom:p.nom, statutText:p.statutText, date:p.date, forceText:p.forceText||"" }))
            .sort((a,b)=>a.nom.localeCompare(b.nom))
    );
}

function loadProxyStore(){
    const saved = localStorage.getItem(PROXY_STORE_KEY);
    if(!saved) return { working:[...PROXIES], broken:[] };
    try { return JSON.parse(saved); }
    catch { return { working:[...PROXIES], broken:[] }; }
}
function saveProxyStore(store){ localStorage.setItem(PROXY_STORE_KEY, JSON.stringify(store)); }

async function testProxy(proxy){
    try {
        await Promise.race([
            fetch(proxy + encodeURIComponent("https://www.havre-port.com/map/getPonts")),
            timeoutPromise(PROXY_TEST_TIMEOUT)
        ]);
        return true;
    } catch { return false; }
}

async function fetchFromProxy(proxy, url){
    const response = await Promise.race([
        fetch(proxy + encodeURIComponent(url)),
        timeoutPromise(FETCH_TIMEOUT)
    ]);
    if(!response.ok) throw new Error("Proxy HTTP error" + response.status);
    const txt = await response.text();
    try { return JSON.parse(txt).contents || txt; }
    catch { return txt; }
}

async function fetchWithDynamicProxies(url){
    let store = loadProxyStore();
    for(const proxy of [...store.working]){
        try{
            const data = await fetchFromProxy(proxy, url);
            document.getElementById("status-indicator").className = "ok";
            return data;
        } catch(err){
            store.working = store.working.filter(p => p !== proxy);
            store.broken.push(proxy);
            saveProxyStore(store);
        }
    }
    document.getElementById("status-indicator").className = "fail";
    throw new Error("Tous les proxys actifs ont échoué");
}

async function retestBrokenProxies(){
    let store = loadProxyStore();
    if(store.broken.length === 0) return;
    const toTest = store.broken.slice(0,5);
    for(const proxy of toTest){
        const ok = await testProxy(proxy);
        if(ok){
            store.working.push(proxy);
            store.broken = store.broken.filter(p => p !== proxy);
        }
    }
    saveProxyStore(store);
}
setInterval(retestBrokenProxies, RETEST_INTERVAL);

function renderPonts(list){
    const container = document.getElementById("ponts-table");
    if(!list || !list.length){
        container.innerHTML = '<div class="error-message">Aucun pont disponible.</div>';
        return;
    }
    container.innerHTML = list.map(p=>{
        const s = p.statutText.toLowerCase();
        const cls = s.includes("fermé") ? "ferme" : s.includes("fermeture") ? "fermeture" : s.includes("manoeuvre") ? "manoeuvre" : s.includes("ouvert") ? "ouvert" : "ferme";
        const info = p.forceText || `MàJ : ${p.date}`;
        return `
            <div class="pont-card ${cls}">
                <div class="pont-nom"><span class="pastille"></span>${p.nom}</div>
                <div class="pont-etat">${p.statutText}</div>
                <div class="pont-infos">${info}</div>
            </div>`;
    }).join("");
}

async function checkAndUpdate(){
    const now = Date.now();
    const last = parseInt(localStorage.getItem(CACHE_KEY_TIME) || 0);
    const cached = localStorage.getItem(CACHE_KEY_DATA);

    if(cached && now-last < CACHE_EXPIRATION){
        const data = JSON.parse(cached);
        renderPonts(data);
        const t = localStorage.getItem(CACHE_KEY_TIME);
        if(t) document.getElementById("maj-info").textContent = "MàJ : " + new Date(parseInt(t)).toLocaleString();
    }

    try{
        const raw = await fetchWithDynamicProxies("https://www.havre-port.com/map/getPonts");
        const json = JSON.parse(raw).data;
        const ponts = Object.values(json);
        const unique = Array.from(new Map(ponts.map(p=>[p.nom,p])).values());

        const ordered = unique.sort((a,b)=>{
            const pr = s => s.includes("fermé")?1 : s.includes("fermeture")?2 : s.includes("manoeuvre")?3 : s.includes("ouvert")?4 : 5;
            return pr(a.statutText.toLowerCase()) - pr(b.statutText.toLowerCase());
        });

        const norm = normalizeData(ordered);
        const newHash = await sha256(norm);
        const oldHash = localStorage.getItem(CACHE_KEY_HASH);

        if(newHash !== oldHash){
            localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(ordered));
            localStorage.setItem(CACHE_KEY_HASH, newHash);
            localStorage.setItem(CACHE_KEY_TIME, Date.now());
            renderPonts(ordered);
            document.getElementById("maj-info").textContent = "MàJ : " + new Date().toLocaleString();
        }

    }catch(err){
        const cached2 = localStorage.getItem(CACHE_KEY_DATA);
        if(cached2){ renderPonts(JSON.parse(cached2)); }
    }
}

loadProxyStore();
checkAndUpdate();
setInterval(checkAndUpdate, REFRESH_INTERVAL);
</script>
</body>
</html>
