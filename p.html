<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tableau de bord - Ponts</title>
<style>
/* ===================== GLOBAL ===================== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 20px;
    scroll-behavior: smooth;
}
.container {
    width: 95%;
    max-width: 1200px;
    padding: 12px;
    box-sizing: border-box;
}
h2 {
    text-align: center;
    color: #00e5ff;
    margin: 0 0 5px;
}
#update-indicator {
    text-align: center;
    font-size: 0.7em;
    opacity: 0.85;
    font-weight: bold;
    margin-bottom: 15px;
}

/* ===================== CARTES PONTS ===================== */
#ponts-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.pont-card {
    background: #1f1f1f;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
    border-left: 4px solid #444;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
}
.pont-card:hover { transform: scale(1.02); }

.pont-card.ferme,
.pont-card.ferme-travaux { border-left-color: #ff4040; }

.pont-card.fermeture {
    border-left-color: orange;
    animation: pulse-orange 1.2s infinite;
}
.pont-card.manoeuvre {
    border-left-color: #1c3cff;
    animation: pulse-blue 1.2s infinite;
}
.pont-card.ouvert { border-left-color: #58ff58; }

.pastille {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    display: inline-block;
}
.ferme .pastille,
.ferme-travaux .pastille { background: #ff4040; }
.fermeture .pastille { background: orange; }
.manoeuvre .pastille { background: #1c3cff; }
.ouvert .pastille { background: #58ff58; }

.pont-nom { font-weight: bold; display: flex; align-items: center; }
.pont-infos { font-size: 0.85em; color: #ccc; }

.texte-travaux {
    font-weight: bold;
    color: #fff;
    background-color: orange;
    padding: 0 4px;
    border-radius: 2px;
}

@keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
}
@keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
}

.error-message {
    text-align: center;
    color: #ff4040;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>État des Ponts</h2>
    <div id="update-indicator">Chargement...</div>
    <div id="ponts-table">Chargement...</div>
</div>

<script>
/* ===================== CONFIG ===================== */
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_TIME = "pontsCacheTime";

const CACHE_EXPIRATION = 60000; // 1 min
const REFRESH_INTERVAL = 30000; // 30 sec
const FETCH_TIMEOUT = 10000;    // ms
const SCORE_RETEST_INTERVAL = 5 * 60 * 1000; // 5 minutes

/* ===================== PROXIES ===================== */
const INITIAL_PROXIES = [
    "https://api.allorigins.win/get?url=",
    "https://thingproxy.freeboard.io/fetch/",
    "https://cors-anywhere.herokuapp.com/",
    "https://every-origin.vercel.app/",
    "https://proxy.corsfix.com/?",
    "https://yacdn.org/proxy/",
    "https://jsonp.afeld.me/?callback=&url=",
    "https://crossorigin.me/",
    "https://cors-proxy.htmldriven.com/?url=",
    "https://test.cors.workers.dev/?",
    "https://api.codetabs.com/v1/proxy?quest=",
    "https://cors.bridged.cc/",
    "https://corsproxy.io/?",
    "https://allorigins.hexlet.app/get?url=",
    "https://api.allorigins.win/raw?url=",
    "https://test.cors.workers.dev/",
    "https://codetabs.com/cors-proxy/cors-proxy.html?url=",
    "https://cors.lol/",
    "https://cors.x2u.in/"
];

let allProxies = [...INITIAL_PROXIES];
let proxyScores = {}; // { proxyUrl: score }

/* ===================== UTILITAIRES ===================== */
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function withTimeout(promiseFactory, ms){
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), ms);
    try { return await promiseFactory(controller.signal); }
    finally { clearTimeout(id); }
}

async function fetchWithTimeout(url, opts={}, timeout=FETCH_TIMEOUT){
    return withTimeout(signal => fetch(url, {...opts, signal}), timeout);
}

async function sha256(str){
    const data = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function safeDateToISOString(d) {
    if (!d) return "";
    const dt = new Date(d);
    return isFinite(dt.getTime()) ? dt.toISOString() : "";
}

function normalizeData(data){
    return JSON.stringify(
        data.map(p=>({nom:p.nom, date: safeDateToISOString(p.date)}))
            .sort((a,b)=>a.nom.localeCompare(b.nom))
    );
}

/* shuffle in-place copy */
function shuffleCopy(arr) {
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* Build ordered proxies array according to scores.
   Proxies with same score are shuffled to avoid hitting same first every time. */
function getProxiesOrderedByScore() {
    // create map score => [proxies]
    const buckets = {};
    for (const p of allProxies) {
        const s = proxyScores[p] ?? 0;
        if (!buckets[s]) buckets[s] = [];
        buckets[s].push(p);
    }
    const scores = Object.keys(buckets).map(Number).sort((a,b)=>b-a); // high -> low
    const ordered = [];
    for (const s of scores) {
        const group = shuffleCopy(buckets[s]); // shuffle same-scored proxies
        ordered.push(...group);
    }
    return ordered.length ? ordered : allProxies.slice(); // fallback
}

/* ===================== PARSE DATA ===================== */
function parseRawContentToData(raw){
    if (!raw) return null;

    // many proxies return an object with "contents" or "data"
    if (typeof raw === "string") {
        try { const j = JSON.parse(raw); return j?.data || j; } catch(e) { return null; }
    }
    if (typeof raw === "object") {
        if (raw.data) return raw.data;
        if (raw.contents) {
            try { const inner = JSON.parse(raw.contents); return inner?.data || inner; } catch(e) { /* fallthrough */ }
        }
        return raw;
    }
    return null;
}

/* ===================== FETCH CORE: try proxies in order until one returns ===================== */
async function fetchWithPool(url) {
    // use proxies ordered by score (shuffle within equal score)
    const ordered = getProxiesOrderedByScore();
    console.log("fetchWithPool -> trying proxies (ordered):", ordered);

    for (const proxy of ordered) {
        const full = proxy + encodeURIComponent(url);
        try {
            const res = await fetchWithTimeout(full, { method: "GET" }, FETCH_TIMEOUT);
            if (!res.ok) {
                console.warn("fetch failed status:", res.status, "proxy:", proxy);
                proxyScores[proxy] = (proxyScores[proxy] ?? 0) - 1;
                continue;
            }

            // Try to parse as JSON if possible, else text
            let raw;
            const ct = res.headers.get("content-type") || "";
            if (ct.includes("json")) raw = await res.json();
            else {
                const text = await res.text();
                try { raw = JSON.parse(text); } catch(e) { raw = text; }
            }

            // success: increment score and return raw
            proxyScores[proxy] = (proxyScores[proxy] ?? 0) + 1;
            console.log("✔ Proxy OK:", proxy, "score:", proxyScores[proxy]);
            return raw;

        } catch (err) {
            // network / timeout error
            console.warn("✖ Proxy error:", proxy, err && (err.name || err.message));
            proxyScores[proxy] = (proxyScores[proxy] ?? 0) - 1;
            // continue to next proxy
        }
    }

    // none responded
    console.warn("Aucun proxy n'a répondu (tous tentés).");
    return null;
}

/* ===================== SCORING: re-evaluate all proxies every 5 minutes ===================== */
async function rescoreProxies() {
    console.log("🔄 rescoreProxies: début");

    const testTarget = "https://www.havre-port.com/map/getPonts";
    // We'll test each proxy quickly (timeout short)
    const promises = [];
    for (const proxy of allProxies) {
        const full = proxy + encodeURIComponent(testTarget);
        // sequentially (not to hammer), but with short timeout.
        // do one-by-one to avoid rate-limits; small delay between tests helps.
        promises.push((async () => {
            try {
                const res = await fetchWithTimeout(full, {}, 3000);
                if (res && res.ok) {
                    proxyScores[proxy] = (proxyScores[proxy] ?? 0) + 1;
                    console.log("rescore: OK", proxy);
                } else {
                    proxyScores[proxy] = (proxyScores[proxy] ?? 0) - 1;
                    console.log("rescore: KO status", proxy, res && res.status);
                }
            } catch (err) {
                proxyScores[proxy] = (proxyScores[proxy] ?? 0) - 1;
                console.log("rescore: KO err", proxy, err && err.name);
            }
            // small pause to reduce bursts
            await sleep(120);
        })());
    }

    // wait all
    await Promise.all(promises);

    // After updating scores, sort allProxies by descending score (in-place)
    allProxies.sort((a, b) => (proxyScores[b] ?? 0) - (proxyScores[a] ?? 0));

    console.log("🔢 rescoreProxies: scores", proxyScores);
    console.log("🔁 rescoreProxies: allProxies sorted (top 10):", allProxies.slice(0,10));
}

/* ===================== RENDER ===================== */
function renderPonts(list){
    const container = document.getElementById("ponts-table");
    if(!list || !list.length){
        container.innerHTML = '<div class="error-message">Aucun pont disponible.</div>';
        return;
    }
    container.innerHTML = list.map(p=>{
        const statut=(p.statutText||"").toLowerCase();
        const open=statut.includes("ouvert");
        const move=statut.includes("manoeuvre")||statut.includes("manœuvre");
        const fermeture=statut.includes("fermeture");
        const ferme=statut.includes("fermé");
        const travaux=statut.includes("travaux");
        let cls=(ferme&&travaux)?"ferme-travaux":ferme?"ferme":fermeture?"fermeture":move?"manoeuvre":open?"ouvert":"ferme";
        let texteEtat=p.statutText||"";
        if(travaux) texteEtat=texteEtat.replace(/(travaux)/i,'<span class="texte-travaux">$1</span>');
        const info=p.forceText||`MàJ : ${p.date||"inconnue"}`;
        return `<div class="pont-card ${cls}"><div class="pont-nom"><span class="pastille"></span>${p.nom}</div><div class="pont-etat">${texteEtat}</div><div class="pont-infos">${info}</div></div>`;
    }).join("");
}

/* ===================== CHECK+UPDATE ===================== */
async function checkAndUpdate(forceUpdate=false){
    const now = Date.now();
    const last = localStorage.getItem(CACHE_KEY_TIME);
    const container = document.getElementById("ponts-table");
    const indicator = document.getElementById("update-indicator");

    if(!forceUpdate && last && now - last < CACHE_EXPIRATION){
        const cached = localStorage.getItem(CACHE_KEY_DATA);
        if(cached){
            try {
                renderPonts(JSON.parse(cached));
                indicator.textContent = "🟢 — MàJ OK — États inchangés depuis le : " + new Date(parseInt(last)).toLocaleString();
                return;
            } catch(e){
                console.warn("cache parse error", e);
            }
        }
    }

    try {
        const raw = await fetchWithPool("https://www.havre-port.com/map/getPonts");
        if (!raw) throw new Error("Aucun proxy n'a répondu");

        // raw might be object or string; parse into data
        const data = parseRawContentToData(raw);
        if (!data) throw new Error("Impossible d'extraire les données API");

        const ponts = Object.values(data);
        const unique = Array.from(new Map(ponts.map(p=>[p.nom,p])).values());

        const ordered = unique.sort((a,b)=>{
            const score = p => {
                const s = (p.statutText||"").toLowerCase();
                if(s.includes("fermé")&&s.includes("travaux")) return 2;
                if(s.includes("fermé")) return 1;
                if(s.includes("fermeture")) return 3;
                if(s.includes("manoeuvre")||s.includes("manœuvre")) return 4;
                if(s.includes("ouvert")) return 5;
                return 6;
            };
            if(score(a)!==score(b)) return score(a)-score(b);
            const ta = isFinite(new Date(a.date||0).getTime()) ? new Date(a.date).getTime() : 0;
            const tb = isFinite(new Date(b.date||0).getTime()) ? new Date(b.date).getTime() : 0;
            return tb - ta;
        });

        // protection anti-retour-arrière
        const newestDate = ordered.length ? Math.max(...ordered.map(p=> {
            const t = new Date(p.date||0).getTime();
            return isFinite(t) ? t : 0;
        })) : 0;
        const lastWriteTime = parseInt(localStorage.getItem(CACHE_KEY_TIME)||0,10) || 0;

        if (newestDate < lastWriteTime) {
            const cached = localStorage.getItem(CACHE_KEY_DATA);
            if (cached) {
                try {
                    renderPonts(JSON.parse(cached));
                    indicator.textContent = "🟢 — MàJ OK — États inchangés depuis le : " + new Date(lastWriteTime).toLocaleString();
                    return;
                } catch(e){
                    console.warn("cache parse fallback error", e);
                }
            }
        }

        const norm = normalizeData(ordered);
        const newHash = await sha256(norm);
        const oldHash = localStorage.getItem(CACHE_KEY_HASH);

        if (newHash !== oldHash) {
            localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(ordered));
            localStorage.setItem(CACHE_KEY_HASH, newHash);
            localStorage.setItem(CACHE_KEY_TIME, Date.now().toString());
            indicator.textContent = "🟢 — MàJ OK — États au : " + new Date().toLocaleString();
        } else {
            indicator.textContent = "🟢 — MàJ OK — États inchangés depuis le : " + new Date(lastWriteTime).toLocaleString();
        }

        renderPonts(ordered);

    } catch (err) {
        console.error("checkAndUpdate error:", err && (err.message || err));
        const cached = localStorage.getItem(CACHE_KEY_DATA);
        const lastWrite = parseInt(localStorage.getItem(CACHE_KEY_TIME)||0,10) || 0;

        if (cached) {
            try {
                renderPonts(JSON.parse(cached));
                indicator.textContent = "🔴 — MàJ échouée — États au : " + new Date(lastWrite).toLocaleString();
            } catch (e) {
                container.innerHTML = '<div class="error-message">Impossible de récupérer les ponts et le cache est corrompu.</div>';
            }
        } else {
            container.innerHTML = '<div class="error-message">Impossible de récupérer les ponts et aucun cache disponible.</div>';
            indicator.textContent = "🔴 — MàJ échouée : aucun cache";
        }
    }
}

/* ===================== INIT ===================== */
(async function init(){

    // initial quick probe: shuffle proxies, try until first success, display quickly,
    // but after that we still call checkAndUpdate which will fetch again via fetchWithPool
    // (so this probe mainly for quick feedback + initial score updates)
    (async function initialProbe() {
        const shuffled = shuffleCopy(allProxies);
        console.log("initialProbe -> order:", shuffled);
        for (const proxy of shuffled) {
            const full = proxy + encodeURIComponent("https://www.havre-port.com/map/getPonts");
            try {
                const res = await fetchWithTimeout(full, {}, 5000);
                if (!res || !res.ok) {
                    proxyScores[proxy] = (proxyScores[proxy] || 0) - 1;
                    console.warn("initialProbe KO", proxy, res && res.status);
                    continue;
                }
                let raw;
                const ct = res.headers.get("content-type") || "";
                if (ct.includes("json")) raw = await res.json();
                else {
                    const text = await res.text();
                    try { raw = JSON.parse(text); } catch(e) { raw = text; }
                }
                // found one: boost score and stop probe
                proxyScores[proxy] = (proxyScores[proxy] || 0) + 2;
                console.log("initialProbe -> premier proxy valide:", proxy);
                // update scores ordering immediately
                allProxies.sort((a,b) => (proxyScores[b] ?? 0) - (proxyScores[a] ?? 0));
                // Use this raw to render immediately if possible
                const data = parseRawContentToData(raw);
                if (data) {
                    // render result immediately and store cache/hash etc in checkAndUpdate later
                    try {
                        const ponts = Object.values(data);
                        const unique = Array.from(new Map(ponts.map(p=>[p.nom,p])).values());
                        renderPonts(unique);
                        localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(unique));
                        localStorage.setItem(CACHE_KEY_TIME, Date.now().toString());
                        console.log("initialProbe -> affichage initial basé sur proxy", proxy);
                    } catch(e) { console.warn("initialProbe: parse/render error", e); }
                }
                break; // stop after first success
            } catch (e) {
                proxyScores[proxy] = (proxyScores[proxy] || 0) - 1;
                console.warn("initialProbe error proxy:", proxy, e && e.name);
            }
        }
    })();

    // Start normal update loop
    checkAndUpdate(true);
    setInterval(()=>checkAndUpdate(false), REFRESH_INTERVAL);

    // Re-evaluate scores every 5 minutes and reorder 'allProxies'
    // First call shortly after init to populate proxyScores
    setTimeout(rescoreProxies, 2000);
    setInterval(rescoreProxies, SCORE_RETEST_INTERVAL);

})();
</script>

</body>
</html>
