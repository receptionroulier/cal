<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendrier + Ponts</title>

<style>
/* ===========================
   RESET + BASE
=========================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #0d0d0d;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow-x: hidden;
}

/* ===========================
   HEADER
=========================== */
.calendar-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    background:#121212;
    border-bottom:1px solid #333;
}
.nav-buttons button {
    background:#222;
    color:#fff;
    padding:8px 14px;
    margin-right:10px;
    border:1px solid #444;
    border-radius:6px;
    cursor:pointer;
}
.nav-buttons button:hover {
    background:#333;
}
.view-switch button {
    background:#222;
    color:#ccc;
    padding:8px 14px;
    border:1px solid #444;
    border-radius:6px;
    cursor:pointer;
}
.view-switch button.active {
    background:#444;
}

/* ===========================
   GRID CALENDRIER
=========================== */
.calendar {
    padding:20px;
}
.week {
    display:grid !important;
    grid-template-columns:repeat(7,1fr) !important;
    min-width:0;
    width:100%;
    gap:1px;
}
.day-cell {
    background:#1a1a1a;
    border:1px solid #222;
    min-height:140px;
    padding:6px;
    position:relative;
    overflow:hidden;
}
.day-label-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
}
.day-number {
    font-weight:bold;
}
.more-count {
    font-size:12px;
    color:#66aaff;
    cursor:pointer;
}

/* ===========================
   ÉVÈNEMENTS (normaux)
=========================== */
.cell-events {
    position:relative;
    min-height:65px !important;
    overflow:visible;
}
.event-item {
    font-size:12px;
    margin-bottom:3px;
    padding:2px 4px;
    background:#255075;
    border-radius:4px;
    white-space: normal !important;
    word-break: break-word !important;
    max-width:100%;
}

/* ===========================
   MULTI-JOURS (bands)
=========================== */
.band-event {
    position:absolute;
    left:0;
    right:0;
    height:22px !important;
    line-height:22px !important;
    padding-left:4px;
    font-size:12px;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden !important;
    border-radius:4px;
    background:#3b82f6;
}

/* ===========================
   POPOVER
=========================== */
.popover {
    position:absolute;
    top:28px;
    right:4px;
    z-index:9999;
    background:#181818;
    border:1px solid #333;
    box-shadow:0 8px 25px rgba(0,0,0,0.7);
    border-radius:8px;
    padding:8px;
    min-width:150px;
}
.popover-item {
    padding:6px;
    background:rgba(255,255,255,0.04);
    border:1px solid #222;
    border-radius:4px;
    margin-bottom:4px;
    font-size:13px;
}

/* ===========================
   MODAL
=========================== */
#eventModal {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999999;
}
.modal-content {
    background:#1a1a1a;
    padding:20px;
    border-radius:10px;
    width:92%;
    max-width:500px;
    max-height:80%;
    overflow-y:auto;
}
.modal-item {
    background:#222;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #333;
}

/* ===========================
   RESPONSIVE
=========================== */
@media(max-width:760px) {
    .day-cell {
        min-height:110px;
    }
    .event-item {
        font-size:11px;
    }
}
</style>
</head>



<body>

<!-- ===========================
     HEADER
=========================== -->
<div class="calendar-header">
    <div class="nav-buttons">
        <button onclick="prev()">◀</button>
        <button onclick="today()">Aujourd’hui</button>
        <button onclick="next()">▶</button>
    </div>
    <h2 id="titleMonth"></h2>
    <div class="view-switch">
        <button class="active" onclick="setView('month')">Mois</button>
        <button onclick="setView('week')">Semaine</button>
    </div>
</div>

<!-- ===========================
     CALENDRIER
=========================== -->
<div class="calendar" id="calendar"></div>

<!-- ===========================
     MODAL
=========================== -->
<div id="eventModal">
    <div class="modal-content">
        <h3>Évènements du jour</h3>
        <div id="modalList"></div>
        <button onclick="closeModal()">Fermer</button>
    </div>
</div>

<!-- ===========================
     SCRIPT
=========================== -->

<script>
/* ================================================================
   LOGIQUE : NAVIGATION
================================================================ */
let current = new Date();
let viewMode = "month";

function setView(v){
    viewMode = v;
    loadCalendar();
}

function prev(){
    if(viewMode === "month"){ current.setMonth(current.getMonth()-1); }
    else { current.setDate(current.getDate()-7); }
    loadCalendar();
}
function next(){
    if(viewMode === "month"){ current.setMonth(current.getMonth()+1); }
    else { current.setDate(current.getDate()+7); }
    loadCalendar();
}
function today(){
    current = new Date();
    loadCalendar();
}

/* ================================================================
   OUTILS
================================================================ */
function clone(d){ return new Date(d.getTime()); }
function formatDate(d){ return d.toISOString().split("T")[0]; }

/* Lundi de la semaine */
function getStartMonday(date){
    const d = clone(date);
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    return d;
}

/* ================================================================
   GESTION DES PONTS (PARTIE ORIGINALE NON MODIFIÉE)
================================================================ */
async function getOffs(start, end){
    const url = `https://openholidaysapi.org/PublicHolidays?countryIsoCode=FR&languageIsoCode=FR&validFrom=${start}&validTo=${end}`;
    const resp = await fetch(url);
    return await resp.json();
}

async function getBridges(start, end){
    const offs = await getOffs(start, end);
    const bridges = [];

    for(const o of offs){
        const f = o.startDate;
        const sf = new Date(f);
        const ef = new Date(o.endDate);

        /* Lundi est 1, dimanche est 0 → blocage */
        const fd = sf.getDay();
        if(fd === 0){ sf.setDate(sf.getDate()-1); }

        /* Si lundi ou vendredi */
        if(fd === 5 || fd === 2){
            const bStart = new Date(sf);
            const bEnd = new Date(ef);
            bridges.push({ title: o.name, start: bStart, end: bEnd });
        }
    }
    return bridges;
}

/* ================================================================
   CHARGEMENT CALENDRIER
================================================================ */
async function loadCalendar(){
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    if(viewMode === "month"){
        buildMonth();
    } else {
        buildWeek();
    }
}

function buildMonth(){
    const year = current.getFullYear();
    const month = current.getMonth();
    const startMonth = new Date(year, month, 1);
    const endMonth = new Date(year, month+1, 0);

    document.getElementById("titleMonth").textContent =
        startMonth.toLocaleDateString("fr-FR",{ month:"long", year:"numeric" });

    const firstMonday = getStartMonday(startMonth);

    const weeks = [];
    let runner = clone(firstMonday);

    for(let w=0; w<6; w++){
        const arr = [];
        for(let d=0; d<7; d++){
            arr.push(clone(runner));
            runner.setDate(runner.getDate()+1);
        }
        weeks.push(arr);
    }
    renderWeeks(weeks);
}

function buildWeek(){
    const monday = getStartMonday(current);
    const week = [];
    const w = clone(monday);
    for(let i=0;i<7;i++){
        week.push(clone(w));
        w.setDate(w.getDate()+1);
    }
    document.getElementById("titleMonth").textContent =
        "Semaine du " + formatDate(monday);
    renderWeeks([week]);
}

/* ================================================================
   RENDU GRILLE
================================================================ */
async function renderWeeks(weeks){
    const cal = document.getElementById("calendar");

    /* Récupération ponts */
    const start = clone(weeks[0][0]);
    const end = clone(weeks[weeks.length-1][6]);
    const bridges = await getBridges(formatDate(start), formatDate(end));

    for(const week of weeks){
        const wdiv = document.createElement("div");
        wdiv.className = "week";

        for(const day of week){
            const cell = document.createElement("div");
            cell.className = "day-cell";

            /* HEADER CELLULE */
            const labelRow = document.createElement("div");
            labelRow.className = "day-label-row";

            const dn = document.createElement("div");
            dn.className = "day-number";
            dn.textContent = day.getDate();

            const more = document.createElement("div");
            more.className = "more-count";

            labelRow.appendChild(dn);
            labelRow.appendChild(more);

            const evDiv = document.createElement("div");
            evDiv.className = "cell-events";

            cell.appendChild(labelRow);
            cell.appendChild(evDiv);
            wdiv.appendChild(cell);

            /* RENDU ÉVÈNEMENTS */
            const eventsToday = getEventsForDay(day);
            applyEventRender(day, evDiv, more, eventsToday);

            /* RENDU PONTS (multi-jours) */
            applyBridges(day, evDiv, bridges);
        }
        cal.appendChild(wdiv);
    }
}

/* ================================================================
   EVENTS — (EXEMPLE, à remplacer par tes sources)
================================================================ */
function getEventsForDay(day){
    // Remplace ici si tu as ta propre source d’évènements
    const list = window.demoEvents || [];
    return list.filter(e => formatDate(new Date(e.date)) === formatDate(day));
}

/* ================================================================
   RENDU ÉVÉNEMENTS DU JOUR
================================================================ */
function applyEventRender(day, evDiv, moreNode, events){
    const MAX_DISPLAY = 2;  

    /* Affiche les 2 premiers */
    const visible = events.slice(0, MAX_DISPLAY);
    const hidden = events.slice(MAX_DISPLAY);

    for(const ev of visible){
        const div = document.createElement("div");
        div.className = "event-item";
        div.textContent = ev.title;
        evDiv.appendChild(div);
    }

    if(hidden.length > 0){
        const count = hidden.length;
        moreNode.textContent = `+${count} autres`;
        moreNode.onclick = ()=> openPopover(day, events, moreNode);
    } else {
        moreNode.textContent = "";
    }
}

/* ================================================================
   POPOVER
================================================================ */
let popover = null;

function openPopover(day, events, anchor){
    closePopover();

    popover = document.createElement("div");
    popover.className = "popover";

    events.forEach(ev=>{
        const div = document.createElement("div");
        div.className="popover-item";
        div.textContent = ev.title;
        popover.appendChild(div);
    });

    anchor.parentElement.appendChild(popover);
}

function closePopover(){
    if(popover){
        popover.remove();
        popover = null;
    }
}

document.addEventListener("click",(e)=>{
    if(popover && !popover.contains(e.target) && !e.target.classList.contains("more-count")){
        closePopover();
    }
});

/* ================================================================
   PONTS (multi-jours)
================================================================ */
function applyBridges(day, evDiv, bridges){
    const today = formatDate(day);

    let rowIndex = 0;
    for(const b of bridges){
        const sd = formatDate(b.start);
        const ed = formatDate(b.end);
        const cur = formatDate(day);

        if(cur >= sd && cur <= ed){
            const band = document.createElement("div");
            band.className = "band-event";
            band.style.top = (rowIndex * 22) + "px";
            band.textContent = b.title;
            evDiv.appendChild(band);
            rowIndex++;
        }
    }
}

/* ================================================================
   MODAL
================================================================ */
function openModal(events){
    const modal = document.getElementById("eventModal");
    const list = document.getElementById("modalList");
    list.innerHTML = "";

    events.forEach(ev=>{
        const div = document.createElement("div");
        div.className = "modal-item";
        div.textContent = ev.title;
        list.appendChild(div);
    });

    modal.style.display = "flex";
}
function closeModal(){
    document.getElementById("eventModal").style.display="none";
}

/* ================================================================
   DEMO EVENTS
================================================================ */
window.demoEvents = [
    { date:"2025-01-05", title:"Réunion stratégique très très longue pour test" },
    { date:"2025-01-05", title:"Déjeuner pro" },
    { date:"2025-01-05", title:"3e événement" },
    { date:"2025-01-06", title:"Rendez-vous médical" }
];

/* ================================================================
   START
================================================================ */
loadCalendar();
</script>

</body>
</html>
