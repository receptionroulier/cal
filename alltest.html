<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page avec 2 iframes (gauche 20%)</title>
  <style>
    /* Reset basique */
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}

    /* Conteneur en flex : colonne complète */
    .container{display:flex;height:100vh;}

    /* Colonne gauche fixe 20% */
    .left{width:20%;min-width:180px; /* afin d'éviter d'être trop petit */overflow:hidden;border-right:1px solid #e0e0e0}

    /* Colonne droite prend le reste */
    .right{flex:1;overflow:hidden}

    /* Ifames remplies et pas de bordures par défaut */
    iframe{width:100%;height:100%;border:0}

    /* Petits styles utiles */
    .note{position:fixed;left:8px;bottom:8px;background:#fff;padding:8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:13px}
  </style>
</head>
<body>

  <div class="container">

    <!-- Colonne gauche : iframe 20% -->
    <div class="left">
      <!--
        Remplacez l'URL suivante par l'adresse que vous voulez afficher dans la colonne gauche.
        Exemple : src="http://example-left.com" ou "https://mon-serveur/chemin"
      -->
      <iframe id="leftFrame" src="http://URL_DE_LA_COLONNE_GAUCHE_EXEMPLE" title="Gauche"></iframe>
    </div>

    <!-- Colonne droite : iframe qui prend tout le reste -->
    <div class="right">
      <!--
        Remplacez l'URL suivante par l'adresse que vous voulez afficher dans la colonne droite.
        Exemple : src="http://example-right.com" ou "https://mon-serveur/chemin"
      -->
      <iframe id="rightFrame" src="http://URL_DE_LA_COLONNE_DROITE_EXEMPLE" title="Droite"></iframe>
    </div>

  </div>

  <div class="note">Remplacez les valeurs <code>http://URL_DE_...</code> par vos adresses HTTP/HTTPS réelles, puis enregistrez sous <code>.html</code> et ouvrez dans votre navigateur.</div>

  <!-- Script optionnel : recharger les iframes (ex : toutes les 15s) - décommentez si vous voulez -->
  <!--
  <script>
    // Exemple : recharger les iframes toutes les 15 secondes
    // setInterval(() => {
    //   document.getElementById('leftFrame').contentWindow.location.reload();
    //   document.getElementById('rightFrame').contentWindow.location.reload();
    // }, 15000);
  </script>
  -->

  <script>
    // Rechargement sans flicker : on recharge dans un iframe "fantôme"
    function softReload(id) {
      const iframe = document.getElementById(id);

      // Créer un iframe caché qui va charger en arrière-plan
      const ghost = document.createElement('iframe');
      ghost.style.display = 'none';
      ghost.src = iframe.src + '?t=' + Date.now(); // éviter le cache

      ghost.onload = () => {
        // Une fois chargé, remplacer le contenu sans effet visuel
        iframe.src = ghost.src;
        ghost.remove();
      };

      document.body.appendChild(ghost);
    }

    setInterval(() => {
      softReload('leftFrame');
      softReload('rightFrame');
    }, 15000);
  </script>

</body>
</html>
