<!DOCTYPE html> 
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ponts HAROPA – Monitoring + Calendrier</title>
<style>
/* =====================
   GLOBAL
   ===================== */
:root{
  --bg: #101010;
  --panel: #1a1a1a;
  --muted: #8a8a8a;
  --accent: #00e5ff;
  --gap: 6px;
  --band-height: 18px;
  --band-gap: 6px;
}
html,body{height:100%;margin:0}
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:#eaeaea;
  display:flex;
  height:100vh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}

/* =====================
   LEFT COLUMN (PONTS)
   ===================== */
.left{
  flex:0 0 20%;
  border-right:1px solid #444;
  padding:14px;
  overflow-y:auto;
}
.left h2{ color:var(--accent); text-align:center; margin:0 0 8px 0}

/* Pont cards (visuals preserved) */
.pont-card{
  background:#1f1f1f;
  border-radius:8px;
  padding:10px 12px;
  box-shadow:0 0 5px rgba(0,0,0,0.4);
  border-left:4px solid #444;
  transition:transform .12s ease,box-shadow .2s ease;
  margin-bottom:8px;
}
.pont-card:hover{ transform:scale(1.02) }
.pont-card.ferme{ border-left-color:#ff4040 }
.pont-card.fermeture{ border-left-color:orange; animation:pulse-orange 1.2s infinite; }
.pont-card.manoeuvre{ border-left-color:#1c3cff; animation:pulse-blue 1.2s infinite; }
.pont-card.ouvert{ border-left-color:#58ff58; }
.pastille{ width:10px; height:10px; border-radius:50%; margin-right:6px; display:inline-block; }
.ferme .pastille{ background:#ff4040 }
.fermeture .pastille{ background:orange }
.manoeuvre .pastille{ background:#1c3cff }
.ouvert .pastille{ background:#58ff58 }
.pont-nom{ font-weight:700; display:flex; align-items:center; gap:8px }

/* pulse animations */
@keyframes pulse-blue{
  0%,100%{ box-shadow:0 0 5px rgba(28,60,255,0.4); transform:scale(1) }
  50%{ box-shadow:0 0 20px rgba(28,60,255,0.7); transform:scale(1.02) }
}
@keyframes pulse-orange{
  0%,100%{ box-shadow:0 0 5px rgba(255,165,0,0.4); transform:scale(1) }
  50%{ box-shadow:0 0 20px rgba(255,165,0,0.7); transform:scale(1.02) }
}

/* =====================
   RIGHT: CALENDAR
   ===================== */
.right{ flex:1; display:flex; flex-direction:column; height:100%; overflow:hidden; }

/* header */
#calendar-header{
  flex:0 0 auto;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  color:var(--accent);
  border-bottom:1px solid #333;
  flex-wrap:wrap;
}
.nav-btn{ cursor:pointer; color:var(--accent); font-size:26px; padding:4px 10px; border-radius:6px; user-select:none; }
.nav-btn:hover{ background:#222 }
.view-btn{ cursor:pointer; font-size:14px; padding:4px 10px; background:#222; border-radius:6px; border:1px solid #333; color:var(--accent) }
.view-btn:hover{ background:#333 }

/* calendar grid */
#calendar-grid{
  flex:1 1 auto;
  display:grid;
  gap:1px;
  background:#333;
  overflow:auto;
  padding:6px;
  position:relative; /* bands are absolute inside */
  align-content:start;
  min-width:0;
}

/* cells - ensure they can shrink (min-width:0 to not let long content stretch columns) */
.calendar-cell{
  background:var(--panel);
  padding:6px;
  border:1px solid #222;
  position:relative;
  min-height:70px;
  display:flex;
  flex-direction:column;
  overflow:visible;
  min-width:0; /* allow flex/grid children to shrink (prevents stretching on long words) */
}
.date-label{ font-size:12px; color:#fff; margin-bottom:6px; white-space:nowrap; }

/* events container (we hide overflow and compute how many fit) */
.cell-events{
  display:flex;
  flex-direction:column;
  gap:4px;
  z-index:4;
  overflow:hidden; /* important: hide overflow, we'll decide visible count */
  min-width:0; /* allow children to shrink */
}

/* single event styling - multiline now */
.event{
  padding:3px 6px;
  border-radius:4px;
  font-size:12px;
  line-height:1.2;
  white-space:normal;        /* autorise retour à la ligne */
  word-break:break-word;     /* coupe les mots trop longs */
  overflow-wrap:break-word;
  overflow:hidden;
  min-width:0;
}
.event.reception{ background:#109c5344; border-left:3px solid #109c53; color:#eaffea }
.event.navire{ background:#3644b344; border-left:3px solid #3644b3; color:#eef0ff }

/* "+X autres" badge */
.more-events{
  font-size:12px;
  color:var(--muted);
  padding:2px 4px;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}

/* popover container (fixed) */
#global-popover{
  position:fixed;
  display:none;
  z-index:1200;
  left:0; top:0;
}
.popover{
  background:#121212;
  border:1px solid #333;
  box-shadow:0 10px 30px rgba(0,0,0,0.7);
  border-radius:8px;
  padding:8px;
  min-width:180px;
  max-width:340px;
  color:#eaeaea;
  overflow:auto;
  max-height:60vh;
}
.pop-item{ padding:6px 8px; border-radius:6px; margin-bottom:6px; background:rgba(255,255,255,0.02); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pop-item:last-child{ margin-bottom:0 }

/* modal for full day list */
.modal-overlay{
  position:fixed; inset:0; display:none; z-index:2000;
  align-items:center; justify-content:center;
  background:linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65));
}
.modal{
  background:#121212; border-radius:10px; border:1px solid #333;
  width:min(780px, 94%); max-height:80vh; overflow:auto;
  padding:18px; box-shadow:0 20px 60px rgba(0,0,0,0.7);
}
.modal header{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
.modal h3{ margin:0; color:var(--accent); font-size:18px }
.close-btn{ cursor:pointer; background:#222; border:1px solid #333; padding:6px 10px; border-radius:6px; color:var(--accent) }
.list-item{ padding:10px; border-radius:8px; background:rgba(255,255,255,0.02); margin-bottom:8px }

/* multi-day bands (absolute). left/right text can wrap now */
.multi-band{
  position:absolute;
  height:var(--band-height);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  font-size:12px;
  color:#fff;
  z-index:2; /* under events (z-index 4) */
  overflow:hidden;
  pointer-events:auto;
  min-width:18px;
}
.multi-band .band-left{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:normal;   /* multiline allowed */
  word-break:break-word;
  font-weight:600;
  min-width:0;
}
.multi-band .band-right{ margin-left:8px; white-space:nowrap; }

/* color variants */
.multi-band.reception{ background:#109c53 }
.multi-band.navire{ background:#3644b3 }

/* small devices */
@media (max-width:900px){
  .left{ flex:0 0 30%; padding:10px; }
  #calendar-header{ font-size:16px; gap:8px; padding:10px; }
  .nav-btn{ font-size:20px; padding:2px 6px; }
  .calendar-cell{ min-height:90px; padding:8px; }
  .modal{ width:96%; padding:14px; }
}
</style>
</head>
<body>

<!-- LEFT: Ponts -->
<div class="left">
  <h2>État des Ponts</h2>
  <div id="ponts-table">Chargement…</div>
</div>

<!-- RIGHT: Calendar -->
<div class="right">
  <div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
    <span class="nav-btn" id="today-btn" style="font-size:18px;">Aujourd’hui</span>
  </div>

  <div id="calendar-grid"></div>
</div>

<!-- popover for "+X autres" -->
<div id="global-popover" aria-hidden="true"></div>

<!-- modal overlay for full-day listing -->
<div id="modal-overlay" class="modal-overlay" role="dialog" aria-hidden="true">
  <div class="modal" role="document" aria-modal="true">
    <header>
      <h3 id="modal-title">Événements</h3>
      <button class="close-btn" id="modal-close">Fermer</button>
    </header>
    <div id="modal-body"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG / CONSTANTS
   ============================================================ */
const API_KEY = "AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo";
const CAL_RECEPTION = "receptionroulier@gmail.com";
const CAL_NAVIRE = "smr.programme@gmail.com";
let viewDays = 21; 
let offsetWeeks = 0;
const CAL_HASH_KEY = "calendarHash";
const CAL_CACHE_KEY = "calendarCache";
const CAL_REFRESH_INTERVAL = 60000;
const CACHE_KEY_DATA="pontsData";
const CACHE_KEY_HASH="pontsHash";
const CACHE_KEY_TIME="pontsCacheTime";
const CACHE_EXPIRATION=60000;
const REFRESH_INTERVAL=10000;
const PROXIES=["https://api.allorigins.win/get?url=","https://cors-anywhere.herokuapp.com/","https://thingproxy.freeboard.io/fetch/"];

/* =====================
   DATE UTILITIES
   ===================== */
function getStartMonday(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function addDays(date,n){ const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function formatDate(d){
  return d.getFullYear().toString().padStart(4,'0') + '-' +
         (d.getMonth()+1).toString().padStart(2,'0') + '-' +
         d.getDate().toString().padStart(2,'0');
}
function dayName(d){ return ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"][d.getDay()]; }
function formatMonthRange(start,end){
  const m=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const m1 = m[start.getMonth()], m2 = m[end.getMonth()];
  const y1 = start.getFullYear(), y2 = end.getFullYear();
  return (m1 === m2 && y1 === y2) ? `${m1} ${y1}` : `${m1} — ${m2} ${y2}`;
}

/* ============================================================
   HASH UTIL
   ============================================================ */
async function hashObject(obj){
  const txt = JSON.stringify(obj);
  const data = new TextEncoder().encode(txt);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   FETCH CALENDAR
   ============================================================ */
async function fetchCalendarWithHash(start, end){
  const timeMin = start.toISOString();
  const timeMax = addDays(end,1).toISOString();
  const urlRec = `https://www.googleapis.com/calendar/v3/calendars/${CAL_RECEPTION}/events?key=${API_KEY}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
  const urlNav = `https://www.googleapis.com/calendar/v3/calendars/${CAL_NAVIRE}/events?key=${API_KEY}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
  const [recRaw, navRaw] = await Promise.all([
    fetch(urlRec).then(r=>r.json()).catch(()=>({items:[]})),
    fetch(urlNav).then(r=>r.json()).catch(()=>({items:[]})),
  ]);
  const events = { reception: recRaw.items || [], navire: navRaw.items || [] };
  const newHash = await hashObject(events);
  const oldHash = localStorage.getItem(CAL_HASH_KEY);
  if(newHash === oldHash && localStorage.getItem(CAL_CACHE_KEY)){
    try { return JSON.parse(localStorage.getItem(CAL_CACHE_KEY)); } catch{}
  }
  localStorage.setItem(CAL_HASH_KEY, newHash);
  localStorage.setItem(CAL_CACHE_KEY, JSON.stringify(events));
  return events;
}

/* ============================================================
   NORMALISATION
   ============================================================ */
function localYMDFromDateTime(dtStr){
  const d = new Date(dtStr);
  const y = d.getFullYear();
  const m = (d.getMonth()+1).toString().padStart(2,'0');
  const day = d.getDate().toString().padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getLocalStartYMD(ev){
  if(ev.start?.date) return ev.start.date;
  if(ev.start?.dateTime) return localYMDFromDateTime(ev.start.dateTime);
  return null;
}
function getLocalEndYMD_Inclusive(ev){
  if(ev.end?.date){
    const d = new Date(ev.end.date);
    d.setDate(d.getDate()-1);
    return formatDate(d);
  }
  if(ev.end?.dateTime){
    const d = new Date(ev.end.dateTime);
    if(d.getHours()===0 && d.getMinutes()===0 && d.getSeconds()===0 && d.getMilliseconds()===0){
      const prev = new Date(d.getTime() - 1);
      return formatDate(prev);
    }
    return localYMDFromDateTime(ev.end.dateTime);
  }
  return null;
}

/* ============================================================
   GRID CREATION
   ============================================================ */
function createGrid(start, viewDays){
  const grid = document.getElementById('calendar-grid');
  const rows = (viewDays === 21) ? 3 : 4;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  grid.style.gridTemplateColumns = `repeat(7, 1fr)`;
  grid.innerHTML = '';
  const dates = [];
  for(let i=0;i<viewDays;i++){
    const d = addDays(start,i);
    const cell = document.createElement('div');
    cell.className = 'calendar-cell';
    cell.dataset.date = formatDate(d);
    cell.dataset.index = i;
    cell._allEvents = [];
    cell.innerHTML = `<div class="date-label">${dayName(d)} ${d.getDate()}</div><div class="cell-events"></div>`;
    grid.appendChild(cell);
    dates.push(formatDate(d));
  }
  return dates;
}

/* ============================================================
   CLEAR PREVIOUS
   ============================================================ */
function clearPrevious(){
  const grid = document.getElementById('calendar-grid');
  grid.querySelectorAll('.multi-band').forEach(n=>n.remove());
  document.querySelectorAll('.calendar-cell .event').forEach(n=>n.remove());
  closeGlobalPopover();
  closeModal();
}

/* ============================================================
   ALLOCATE LEVEL (avoid multi-day overlap)
   ============================================================ */
function allocateLevel(occupied, dayIndexes){
  let level = 0;
  while(true){
    let ok = true;
    for(const di of dayIndexes){
      const row = occupied[di] || [];
      if(row[level]){
        ok = false;
        break;
      }
      // vérifie le jour précédent et suivant pour éviter chevauchement visuel
      if((occupied[di-1] && occupied[di-1][level]) || (occupied[di+1] && occupied[di+1][level])){
        ok = false;
        break;
      }
    }
    if(ok){
      for(const di of dayIndexes){
        occupied[di] = occupied[di] || [];
        occupied[di][level] = true;
      }
      return level;
    }
    level++;
  }
}

/* ============================================================
   EVENT RENDER
   ============================================================ */
function renderEvents(dates, events){
  const cells = {};
  document.querySelectorAll('.calendar-cell').forEach(c=>cells[c.dataset.date]=c);
  const occupied = [];
  for(const type of ['reception','navire']){
    for(const ev of events[type]){
      const start = getLocalStartYMD(ev);
      const end = getLocalEndYMD_Inclusive(ev);
      if(!start || !end) continue;
      const startIndex = dates.indexOf(start);
      const endIndex = dates.indexOf(end);
      if(startIndex===-1 && endIndex===-1) continue;
      const si = startIndex===-1 ? 0 : startIndex;
      const ei = endIndex===-1 ? dates.length-1 : endIndex;
      const dayIndexes = [];
      for(let i=si;i<=ei;i++) dayIndexes.push(i);
      const level = allocateLevel(occupied, dayIndexes);

      // if single-day, put in cell
      if(si === ei){
        const cell = cells[start];
        const container = cell.querySelector('.cell-events');
        const div = document.createElement('div');
        div.className='event '+type;
        div.textContent=ev.summary;
        container.appendChild(div);
        cell._allEvents.push({ev,type});
      } else {
        // multi-day band
        const cellStart = cells[dates[si]];
        const cellEnd = cells[dates[ei]];
        const band = document.createElement('div');
        band.className='multi-band '+type;
        band.style.top = (level*(18+6))+'px';
        const leftText = document.createElement('span');
        leftText.className='band-left';
        leftText.textContent=ev.summary;
        band.appendChild(leftText);
        cellStart.appendChild(band);
        band.style.left='0';
        band.style.width=((ei-si+1)/dates.length*100)+'%';
      }
    }
  }
}

/* ============================================================
   POPOVER / MODAL
   ============================================================ */
const popover = document.getElementById('global-popover');
function showGlobalPopover(x,y,html){ popover.innerHTML=html; popover.style.display='block'; popover.style.left=x+'px'; popover.style.top=y+'px'; popover.setAttribute('aria-hidden','false'); }
function closeGlobalPopover(){ popover.style.display='none'; popover.setAttribute('aria-hidden','true'); }

const modalOverlay = document.getElementById('modal-overlay');
function openModal(title,html){ modalOverlay.style.display='flex'; document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=html; modalOverlay.setAttribute('aria-hidden','false'); }
function closeModal(){ modalOverlay.style.display='none'; modalOverlay.setAttribute('aria-hidden','true'); }
document.getElementById('modal-close').addEventListener('click', closeModal);

/* ============================================================
   INIT / MAIN
   ============================================================ */
async function main(){
  const start = getStartMonday(addDays(new Date(), offsetWeeks*7));
  const dates = createGrid(start, viewDays);
  const events = await fetchCalendarWithHash(start, addDays(start,viewDays-1));
  renderEvents(dates, events);
  document.getElementById('calendar-title').textContent = formatMonthRange(start, addDays(start,viewDays-1));
}
main();
</script>
</body>
</html>
