<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendrier HAROPA</title>

<style>
/* ----------------------------------------------------
   RESET + BASE UI
---------------------------------------------------- */
body {
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
  -webkit-font-smoothing: antialiased;
}

a { color:inherit; text-decoration:none; }

#calendar-container {
  width:100%;
  max-width:1450px;
  margin:0 auto;
  padding:20px;
}

/* ----------------------------------------------------
   CALENDRIER GRID
---------------------------------------------------- */
#calendar-grid {
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  gap:1px;
  background:#1a1a1a;
  border:1px solid #2c2c2c;
}

.calendar-cell {
  position:relative;
  min-height:105px;
  background:#141414;
  border:1px solid #1b1b1b;
  display:flex;
  flex-direction:column;
  padding:6px 6px 4px 6px;
  overflow:hidden; /* évite les débordements */
}

/* ----------------------------------------------------
   ENTÊTE DATES + BADGE "+X autres"
---------------------------------------------------- */
.date-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin-bottom:4px;
}

.date-header span.date-number {
  font-weight:bold;
  font-size:14px;
}

.date-header span.more-count {
  font-size:11px;
  background:#2a2a2a;
  padding:2px 6px;
  border-radius:5px;
  border:1px solid #333;
  cursor:pointer;
  display:none; /* affiché si nécessaire */
}

/* ----------------------------------------------------
   EVENTS PONCTUELS DANS CELLULE
---------------------------------------------------- */
.cell-events {
  display:flex;
  flex-direction:column;
  gap:2px;
  overflow:hidden;
}

.cell-events .event {
  padding:2px 5px;
  background:#222;
  border-left:3px solid #4da3ff;
  border-radius:3px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ----------------------------------------------------
   MULTI-JOURS (bandes)
---------------------------------------------------- */
.multi-event {
  position:absolute;
  left:2px;
  right:2px;
  height:20px;
  background:#375a7f;
  border-radius:4px;
  padding-left:6px;
  font-size:11px;
  line-height:20px;
  color:white;
  z-index:20;
}

/* ----------------------------------------------------
   POPOVER + MODAL
---------------------------------------------------- */
.popover {
  position:absolute;
  background:#181818;
  border:1px solid #333;
  box-shadow:0 8px 25px rgba(0,0,0,0.7);
  border-radius:8px;
  padding:10px;
  z-index:2000;
  min-width:180px;
  max-width:250px;
  max-height:260px;
  overflow:auto;
}

.popover .pop-item {
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  padding:6px;
  border-radius:6px;
  margin-bottom:6px;
  font-size:12px;
}

/* MODAL */
#modal-overlay {
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.55);
  display:none;
  z-index:3000;
}

#modal-box {
  background:#181818;
  width:90%;
  max-width:420px;
  margin:120px auto;
  padding:20px;
  border-radius:10px;
  border:1px solid #333;
  box-shadow:0 8px 30px rgba(0,0,0,0.7);
}

#modal-title {
  font-size:18px;
  margin-bottom:15px;
}

#modal-content .modal-item {
  background:#222;
  padding:8px;
  border-radius:8px;
  border-left:4px solid #4da3ff;
  font-size:13px;
  margin-bottom:8px;
}

/* ----------------------------------------------------
   RESPONSIVE
---------------------------------------------------- */
@media(max-width:700px){
  .calendar-cell { min-height:90px; }
  .date-header span.date-number { font-size:12px; }
}
</style>
</head>

<body>
<div id="calendar-container">

  <div id="calendar-grid"></div>

  <!-- Popover global -->
  <div id="global-popover" style="position:fixed; display:none;"></div>

  <!-- Modal -->
  <div id="modal-overlay">
    <div id="modal-box">
      <div id="modal-title"></div>
      <div id="modal-content"></div>
    </div>
  </div>

</div>

<script>
/* ----------------------------------------------------
   UTILITAIRES DATES
---------------------------------------------------- */
function getStartMonday(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function formatDate(d){
  return d.toISOString().split("T")[0];
}

/* ----------------------------------------------------
   BUILD CALENDAR
---------------------------------------------------- */
function buildCalendar(start){
  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";

  for(let i=0;i<42;i++){
    const cellDate = new Date(start);
    cellDate.setDate(start.getDate() + i);

    const cell = document.createElement("div");
    cell.className = "calendar-cell";
    cell.dataset.date = formatDate(cellDate);

    const header = document.createElement("div");
    header.className = "date-header";

    const dateSpan = document.createElement("span");
    dateSpan.className = "date-number";
    dateSpan.textContent = cellDate.getDate();

    const moreSpan = document.createElement("span");
    moreSpan.className = "more-count";
    moreSpan.textContent = "+0";

    header.append(dateSpan, moreSpan);

    const eventsContainer = document.createElement("div");
    eventsContainer.className = "cell-events";

    cell.append(header, eventsContainer);
    grid.append(cell);
  }
}

/* ----------------------------------------------------
   DISPLAY EVENTS (ponctuels)
---------------------------------------------------- */
function displayDailyEvents(events){
  events.forEach(ev=>{
    const cell = document.querySelector(`.calendar-cell[data-date="${ev.date}"]`);
    if(!cell) return;
    const container = cell.querySelector(".cell-events");

    const el = document.createElement("div");
    el.className = "event";
    el.textContent = ev.title;
    container.append(el);
  });
}

/* ----------------------------------------------------
   GESTION MULTI-JOURS (BANDS)
   ⚠️ EXACTEMENT TON CODE, NON MODIFIÉ
---------------------------------------------------- */
function displayMultiDay(events){
  events.forEach(ev=>{
    const start = new Date(ev.start);
    const end = new Date(ev.end);

    const range = [];
    const temp = new Date(start);
    while(temp<=end){
      range.push(formatDate(temp));
      temp.setDate(temp.getDate()+1);
    }

    range.forEach((date,idx)=>{
      const cell = document.querySelector(`.calendar-cell[data-date="${date}"]`);
      if(!cell) return;

      const band = document.createElement("div");
      band.className = "multi-event";
      band.textContent = idx===0 ? ev.title : "";
      band.style.top = `${idx*22}px`;
      cell.append(band);
    });
  });
}

/* ----------------------------------------------------
   AUTO-LIMIT EVENTS + "+X autres" (Option B)
---------------------------------------------------- */
function limitEvents(){
  document.querySelectorAll(".calendar-cell").forEach(cell=>{
    const events = [...cell.querySelectorAll(".event")];
    const header = cell.querySelector(".more-count");

    if(events.length <= 2){
      header.style.display="none";
      return;
    }

    events.slice(2).forEach(e=>e.style.display="none");

    const hidden = events.length - 2;
    header.textContent = `+${hidden}`;
    header.style.display="inline-block";

    header.onclick = ()=> openPopover(cell.dataset.date, header);
  });
}

/* ----------------------------------------------------
   POPOVER
---------------------------------------------------- */
function openPopover(date, anchor){
  closePopover();

  const pop = document.getElementById("global-popover");
  pop.innerHTML = "";
  pop.style.display="block";

  const rect = anchor.getBoundingClientRect();
  pop.style.left = `${rect.right + 8}px`;
  pop.style.top  = `${rect.top}px`;

  const content = document.createElement("div");
  content.className = "popover";

  const dayEvents = [...document.querySelectorAll(`.calendar-cell[data-date="${date}"] .event`)]
    .map(e=>e.textContent);

  dayEvents.forEach(t=>{
    const item = document.createElement("div");
    item.className="pop-item";
    item.textContent = t;
    content.append(item);
  });

  const btn = document.createElement("button");
  btn.textContent = "Voir plus";
  btn.style.marginTop="8px";
  btn.onclick = ()=> openModal(date);
  content.append(btn);

  pop.append(content);
}

function closePopover(){
  document.getElementById("global-popover").style.display="none";
}

document.addEventListener("click", e=>{
  if(!e.target.closest(".popover") && !e.target.classList.contains("more-count")){
    closePopover();
  }
});

/* ----------------------------------------------------
   MODAL
---------------------------------------------------- */
function openModal(date){
  closePopover();
  const overlay = document.getElementById("modal-overlay");
  const title = document.getElementById("modal-title");
  const content = document.getElementById("modal-content");

  overlay.style.display="block";
  title.textContent = "Évènements du " + date;
  content.innerHTML="";

  const items = [...document.querySelectorAll(`.calendar-cell[data-date="${date}"] .event`)]
      .map(e=>e.textContent);

  items.forEach(t=>{
    const div = document.createElement("div");
    div.className="modal-item";
    div.textContent = t;
    content.append(div);
  });
}

document.getElementById("modal-overlay").onclick = e=>{
  if(e.target.id==="modal-overlay"){
    e.target.style.display="none";
  }
};

/* ----------------------------------------------------
   CHARGEMENT CALENDRIER + PONTS (ton code intact)
---------------------------------------------------- */
async function loadCalendar(){
  const today = new Date();
  const monday = getStartMonday(today);

  buildCalendar(monday);

  /* --- SIMULATION EVENTS (à remplacer par ton API) --- */
  const events = [
    {date:"2025-01-13", title:"Réunion équipe"},
    {date:"2025-01-13", title:"Inspection site"},
    {date:"2025-01-13", title:"Formation sécurité"},
    {date:"2025-01-14", title:"Comité direction"}
  ];

  displayDailyEvents(events);

  /* Multi-jours */
  displayMultiDay([
    {start:"2025-01-12", end:"2025-01-15", title:"Maintenance docks"},
    {start:"2025-01-16", end:"2025-01-19", title:"Audit Qualité"}
  ]);

  /* limite affichage + "+X autres" */
  limitEvents();
}

loadCalendar();
</script>

</body>
</html>
