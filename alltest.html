<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ponts HAROPA – Monitoring + Calendrier</title>
<style>
:root{
  --bg: #101010;
  --panel: #1a1a1a;
  --muted: #8a8a8a;
  --accent: #00e5ff;
  --gap: 6px;
  --band-height: 18px;
  --band-gap: 6px;
}
html,body{height:100%;margin:0}
body{
  font-family: Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:#eaeaea;
  display:flex;
  height:100vh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}

/* LEFT COLUMN */
.left{
  flex:0 0 20%;
  border-right:1px solid #444;
  padding:14px;
  overflow-y:auto;
}
.left h2{ color:var(--accent); text-align:center; margin:0 0 8px 0}

/* Pont cards */
.pont-card{
  background:#1f1f1f;
  border-radius:8px;
  padding:10px 12px;
  box-shadow:0 0 5px rgba(0,0,0,0.4);
  border-left:4px solid #444;
  transition:transform .12s ease,box-shadow .2s ease;
  margin-bottom:8px;
}
.pont-card:hover{ transform:scale(1.02) }
.pont-card.ferme{ border-left-color:#ff4040 }
.pont-card.fermeture{ border-left-color:orange; animation:pulse-orange 1.2s infinite; }
.pont-card.manoeuvre{ border-left-color:#1c3cff; animation:pulse-blue 1.2s infinite; }
.pont-card.ouvert{ border-left-color:#58ff58; }
.pastille{ width:10px; height:10px; border-radius:50%; margin-right:6px; display:inline-block; }
.ferme .pastille{ background:#ff4040 }
.fermeture .pastille{ background:orange }
.manoeuvre .pastille{ background:#1c3cff }
.ouvert .pastille{ background:#58ff58 }
.pont-nom{ font-weight:700; display:flex; align-items:center; gap:8px }

/* pulse animations */
@keyframes pulse-blue{
  0%,100%{ box-shadow:0 0 5px rgba(28,60,255,0.4); transform:scale(1) }
  50%{ box-shadow:0 0 20px rgba(28,60,255,0.7); transform:scale(1.02) }
}
@keyframes pulse-orange{
  0%,100%{ box-shadow:0 0 5px rgba(255,165,0,0.4); transform:scale(1) }
  50%{ box-shadow:0 0 20px rgba(255,165,0,0.7); transform:scale(1.02) }
}

/* RIGHT: CALENDAR */
.right{ flex:1; display:flex; flex-direction:column; height:100%; overflow:hidden; }

/* header */
#calendar-header{
  flex:0 0 auto;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  color:var(--accent);
  border-bottom:1px solid #333;
  flex-wrap:wrap;
}
.nav-btn{ cursor:pointer; color:var(--accent); font-size:26px; padding:4px 10px; border-radius:6px; user-select:none; }
.nav-btn:hover{ background:#222 }
.view-btn{ cursor:pointer; font-size:14px; padding:4px 10px; background:#222; border-radius:6px; border:1px solid #333; color:var(--accent) }
.view-btn:hover{ background:#333 }

/* calendar grid */
#calendar-grid{
  flex:1 1 auto;
  display:grid;
  gap:1px;
  background:#333;
  overflow:auto;
  padding:6px;
  position:relative;
  align-content:start;
  min-width:0;
}
.calendar-cell{
  background:var(--panel);
  padding:6px;
  border:1px solid #222;
  position:relative;
  min-height:70px;
  display:flex;
  flex-direction:column;
  overflow:visible;
  min-width:0;
  word-break: break-word; /* allows wrapping of long event titles */
}
.date-label{ font-size:12px; color:#fff; margin-bottom:6px; white-space:nowrap; }

.cell-events{
  display:flex;
  flex-direction:column;
  gap:4px;
  z-index:4;
  overflow:hidden;
  min-width:0;
}
.event{
  padding:3px 6px;
  border-radius:4px;
  font-size:12px;
  line-height:1.2;
  min-width:0;
  word-wrap: break-word;
  white-space: normal; /* allow wrapping */
}
.event.reception{ background:#109c5344; border-left:3px solid #109c53; color:#eaffea }
.event.navire{ background:#3644b344; border-left:3px solid #3644b3; color:#eef0ff }

.more-events{
  font-size:12px;
  color:var(--muted);
  padding:2px 4px;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}

#global-popover{
  position:fixed;
  display:none;
  z-index:1200;
  left:0; top:0;
}
.popover{
  background:#121212;
  border:1px solid #333;
  box-shadow:0 10px 30px rgba(0,0,0,0.7);
  border-radius:8px;
  padding:8px;
  min-width:180px;
  max-width:340px;
  color:#eaeaea;
  overflow:auto;
  max-height:60vh;
}
.pop-item{ padding:6px 8px; border-radius:6px; margin-bottom:6px; background:rgba(255,255,255,0.02); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pop-item:last-child{ margin-bottom:0 }

.modal-overlay{
  position:fixed; inset:0; display:none; z-index:2000;
  align-items:center; justify-content:center;
  background:linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65));
}
.modal{
  background:#121212; border-radius:10px; border:1px solid #333;
  width:min(780px, 94%); max-height:80vh; overflow:auto;
  padding:18px; box-shadow:0 20px 60px rgba(0,0,0,0.7);
}
.modal header{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
.modal h3{ margin:0; color:var(--accent); font-size:18px }
.close-btn{ cursor:pointer; background:#222; border:1px solid #333; padding:6px 10px; border-radius:6px; color:var(--accent) }
.list-item{ padding:10px; border-radius:8px; background:rgba(255,255,255,0.02); margin-bottom:8px; }

.multi-band{
  position:absolute;
  height:var(--band-height);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  font-size:12px;
  color:#fff;
  z-index:2;
  overflow:hidden;
  pointer-events:auto;
  min-width:18px;
}
.multi-band .band-left{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; min-width:0 }
.multi-band .band-right{ margin-left:8px; white-space:nowrap; }

.multi-band.reception{ background:#109c53 }
.multi-band.navire{ background:#3644b3 }

@media (max-width:900px){
  .left{ flex:0 0 30%; padding:10px; }
  #calendar-header{ font-size:16px; gap:8px; padding:10px; }
  .nav-btn{ font-size:20px; padding:2px 6px; }
  .calendar-cell{ min-height:90px; padding:8px; }
  .modal{ width:96%; padding:14px; }
}
</style>
</head>
<body>

<div class="left">
  <h2>État des Ponts</h2>
  <div id="ponts-table">Chargement…</div>
</div>

<div class="right">
  <div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
    <span class="nav-btn" id="today-btn" style="font-size:18px;">Aujourd’hui</span>
  </div>

  <div id="calendar-grid"></div>
</div>

<div id="global-popover" aria-hidden="true"></div>

<div id="modal-overlay" class="modal-overlay" role="dialog" aria-hidden="true">
  <div class="modal" role="document" aria-modal="true">
    <header>
      <h3 id="modal-title">Événements</h3>
      <button class="close-btn" id="modal-close">Fermer</button>
    </header>
    <div id="modal-body"></div>
  </div>
</div>

<script>
/* =========================
   JS complet
   ========================= */

// --- CONFIGURATION ---
const API_KEY = "AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo";
const CAL_RECEPTION = "receptionroulier@gmail.com";
const CAL_NAVIRE = "smr.programme@gmail.com";

let viewDays = 21;
let offsetWeeks = 0;

// --- UTILS DATE ---
function getStartMonday(date){
    const d=new Date(date);
    const day=d.getDay();
    const diff=(day===0?-6:1)-day;
    d.setDate(d.getDate()+diff);
    return d;
}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}
function formatDate(d){return d.getFullYear().toString().padStart(4,'0')+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');}
function dayName(d){return ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"][d.getDay()];}
function formatMonthRange(start,end){const m=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];const m1=m[start.getMonth()], m2=m[end.getMonth()];const y1=start.getFullYear(), y2=end.getFullYear();return (m1===m2&&y1===y2)?`${m1} ${y1}`:`${m1} — ${m2} ${y2}`;}

/* FETCH CALENDAR */
async function fetchCalendar(start,end){
    const timeMin=start.toISOString();
    const timeMax=addDays(end,1).toISOString();
    const urlRec=`https://www.googleapis.com/calendar/v3/calendars/${CAL_RECEPTION}/events?key=${API_KEY}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
    const urlNav=`https://www.googleapis.com/calendar/v3/calendars/${CAL_NAVIRE}/events?key=${API_KEY}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
    const [recRaw, navRaw] = await Promise.all([fetch(urlRec).then(r=>r.json()).catch(()=>({items:[]})),fetch(urlNav).then(r=>r.json()).catch(()=>({items:[]}))]);
    return {reception:recRaw.items||[], navire:navRaw.items||[]};
}

/* RENDU CALENDAR */
function createCalendarGrid(startDate,days){
    const grid = document.getElementById("calendar-grid");
    grid.innerHTML="";
    grid.style.gridTemplateColumns=`repeat(${days}, minmax(100px,1fr))`;

    const cells = [];
    for(let i=0;i<days;i++){
        const d=addDays(startDate,i);
        const cell = document.createElement("div");
        cell.classList.add("calendar-cell");
        const label = document.createElement("div");
        label.className="date-label";
        label.textContent = `${dayName(d)} ${d.getDate()}`;
        cell.appendChild(label);
        const evContainer = document.createElement("div");
        evContainer.className="cell-events";
        cell.appendChild(evContainer);
        grid.appendChild(cell);
        cells.push({date:d, el:cell, eventsContainer:evContainer});
    }
    return cells;
}

/* AFFICHE LES ÉVÉNEMENTS */
function renderEvents(cells, events){
    const allEvents = [];
    ["reception","navire"].forEach(type=>{
        events[type].forEach(ev=>{
            const start = new Date(ev.start.dateTime||ev.start.date);
            const end = new Date(ev.end.dateTime||ev.end.date);
            allEvents.push({ev,type,start,end,title:ev.summary||type});
        });
    });

    // Multi-day events
    const bands = [];
    allEvents.forEach(e=>{
        const startIndex=cells.findIndex(c=>c.date>=e.start);
        const endIndex=cells.findIndex(c=>c.date>e.end);
        const sIndex = startIndex>=0?startIndex:0;
        const eIndex = endIndex>=0?endIndex:cells.length-1;
        if((e.end - e.start)/(1000*3600*24)>0){
            // multi-day band
            const band = document.createElement("div");
            band.className="multi-band "+e.type;
            const left = document.createElement("div"); left.className="band-left"; left.textContent=e.title;
            const right = document.createElement("div"); right.className="band-right"; right.textContent="";
            band.appendChild(left); band.appendChild(right);
            band.style.top=(sIndex*(parseInt(getComputedStyle(cells[0].el).height)+6))+"px";
            band.style.left=(sIndex*(100/cells.length))+"%";
            band.style.width=((eIndex-sIndex+1)*(100/cells.length))+"%";
            cells[0].el.parentElement.appendChild(band);
        }else{
            const cell = cells[sIndex];
            const evDiv = document.createElement("div");
            evDiv.className="event "+e.type;
            evDiv.textContent=e.title;
            cell.eventsContainer.appendChild(evDiv);
        }
    });
}

/* INIT CALENDAR */
async function initCalendar(){
    const startMonday=getStartMonday(new Date());
    const cells=createCalendarGrid(startMonday,viewDays);
    const events=await fetchCalendar(startMonday,addDays(startMonday,viewDays-1));
    renderEvents(cells,events);
    document.getElementById("calendar-title").textContent=formatMonthRange(startMonday,addDays(startMonday,viewDays-1));
}

/* INIT */
initCalendar();

</script>
</body>
</html>
