<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Double iframe – Rechargement intelligent</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #container {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  .frame-wrapper {
    position: relative;
    height: 100%;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;

    /* Crossfade */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in-out;
  }

  .visible {
    opacity: 1;
    pointer-events: auto;
  }

  .hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="container">
  <!-- Partie gauche (25%) -->
  <div class="frame-wrapper" style="width:25%;">
    <iframe id="leftA" class="visible" data-src="https://receptionroulier.github.io/cal/p.html"></iframe>
    <iframe id="leftB" class="hidden" data-src="https://receptionroulier.github.io/cal/p.html"></iframe>
  </div>

  <!-- Partie droite (75%) -->
  <div class="frame-wrapper" style="width:75%;">
    <iframe id="rightA" class="visible" data-src="https://receptionroulier.github.io/cal/caltest.html"></iframe>
    <iframe id="rightB" class="hidden" data-src="https://receptionroulier.github.io/cal/caltest.html"></iframe>
  </div>
</div>

<script>
// Fonction Smart Polling + swap iframe
function monitor(versionURL, iframeA, iframeB, pageURL, delay, preloadImmediate=false) {
    const state = {
        active: iframeA,
        buffer: iframeB,
        lastVersion: null,
        isSwapping: false
    };

    // Lazy load de l'iframe active
    if (!state.active.src) state.active.src = state.active.dataset.src;

    async function checkVersion() {
        try {
            const response = await fetch(versionURL + "?_=" + Date.now());
            const version = await response.text();

            if (version !== state.lastVersion && !state.isSwapping) {
                state.lastVersion = version;
                await preloadAndSwap(version);
            }

        } catch (err) {
            console.error("Erreur version :", err);
        }
    }

    function preloadAndSwap(version) {
        return new Promise(resolve => {
            state.isSwapping = true;
            const { active, buffer } = state;

            buffer.src = buffer.dataset.src + "?v=" + version;

            buffer.onload = () => {
                // Crossfade
                active.classList.add("hidden");
                active.classList.remove("visible");
                buffer.classList.add("visible");
                buffer.classList.remove("hidden");

                // Swap logique
                state.active = buffer;
                state.buffer = active;

                state.isSwapping = false;
                resolve();
            };
        });
    }

    async function loop() {
        await checkVersion();

        if (!preloadImmediate) {
            await new Promise(r => setTimeout(r, delay));
        }
        loop();
    }

    loop();
}

// Partie gauche → 1 seconde
monitor(
    "https://receptionroulier.github.io/cal/p.version.txt",
    document.getElementById("leftA"),
    document.getElementById("leftB"),
    "https://receptionroulier.github.io/cal/p.html",
    1000,
    false
);

// Partie droite → 1 secondes, préchargement immédiat
monitor(
    "https://receptionroulier.github.io/cal/caltest.version.txt",
    document.getElementById("rightA"),
    document.getElementById("rightB"),
    "https://receptionroulier.github.io/cal/caltest.html",
    1000,
    true
);

// 🔹 Mise à jour interne de l'heure / animations dans la partie droite
setInterval(() => {
    const iframe = document.getElementById("rightA"); // iframe active, swap si nécessaire
    if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: "refreshTime" }, "*");
    }
}, 1000);

// Si tu utilises un buffer actif lors du swap, tu peux adapter le postMessage pour pointer vers state.active
</script>

</body>
</html>
