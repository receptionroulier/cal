<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page avec 2 iframes (gauche 20%)</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .container{display:flex;height:100vh;}
    .left{width:20%;min-width:180px;overflow:hidden;border-right:1px solid #e0e0e0}
    .right{flex:1;overflow:hidden}
    iframe{width:100%;height:100%;border:0}
  </style>
</head>
<body>

  <div class="container">

    <div class="left">
      <iframe id="leftFrame" 
              src="https://receptionroulier.github.io/cal/p.html" 
              title="Ponts"></iframe>
    </div>

    <div class="right">
      <iframe id="rightFrame" 
              src="https://receptionroulier.github.io/cal/caltest.html" 
              title="Calendrier"></iframe>
    </div>

  </div>

  <script>
    // Recharge les 2 iframes toutes les 15 secondes
    setInterval(() => {
      document.getElementById('leftFrame').contentWindow.location.reload();
      document.getElementById('rightFrame').contentWindow.location.reload();
    }, 15000);
  </script>

</body>
</html>
