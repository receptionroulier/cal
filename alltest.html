<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Double iframe – Rechargement intelligent</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #container {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  .frame-wrapper {
    position: relative;
    height: 100%;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;

    /* Crossfade plus doux */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in-out;
  }

  .visible {
    opacity: 1;
    pointer-events: auto;
  }

  .hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="container">
  <!-- Zone gauche (25%) -->
  <div class="frame-wrapper" style="width:25%;">
    <iframe id="leftA" class="visible"
            src="https://receptionroulier.github.io/cal/p.html"></iframe>
    <iframe id="leftB" class="hidden"></iframe>
  </div>

  <!-- Zone droite (75%) -->
  <div class="frame-wrapper" style="width:75%;">
    <iframe id="rightA" class="visible"
            src="https://receptionroulier.github.io/cal/caltest.html"></iframe>
    <iframe id="rightB" class="hidden"></iframe>
  </div>
</div>

<script>
function monitor(versionURL, iframeA, iframeB, pageURL, interval) {
    const state = {
        active: iframeA,
        buffer: iframeB,
        lastVersion: null,
        isSwapping: false
    };

    async function checkVersion() {
        try {
            const response = await fetch(versionURL + "?_=" + Date.now());
            const version = await response.text();

            if (version !== state.lastVersion && !state.isSwapping) {
                state.lastVersion = version;
                preloadAndSwap(version);
            }
        } catch (err) {
            console.error("Erreur de vérification :", err);
        }
    }

    function preloadAndSwap(version) {
        state.isSwapping = true;

        const { active, buffer } = state;

        buffer.src = pageURL + "?v=" + version;

        buffer.onload = () => {
            // Crossfade
            active.classList.add("hidden");
            active.classList.remove("visible");

            buffer.classList.add("visible");
            buffer.classList.remove("hidden");

            // Swap logique
            state.active = buffer;
            state.buffer = active;

            state.isSwapping = false;
        };
    }

    setInterval(checkVersion, interval);
}

// Zone gauche → 1 seconde
monitor(
    "https://receptionroulier.github.io/cal/p.version.txt",
    document.getElementById("leftA"),
    document.getElementById("leftB"),
    "https://receptionroulier.github.io/cal/p.html",
    1000
);

// Zone droite → 5 secondes
monitor(
    "https://receptionroulier.github.io/cal/caltest.version.txt",
    document.getElementById("rightA"),
    document.getElementById("rightB"),
    "https://receptionroulier.github.io/cal/caltest.html",
    5000
);
</script>

</body>
</html>
