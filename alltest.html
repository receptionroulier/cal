<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Double iframe ultra fluide</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  #container {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  .frame-wrapper {
    position: relative;
    height: 100%;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .hidden {
    opacity: 0;
    pointer-events: none;
  }

  .visible {
    opacity: 1;
  }

  /* Transition douce si tu veux */
  iframe {
    transition: opacity 0.3s linear;
  }
</style>
</head>
<body>

<div id="container">
  <!-- Zone gauche -->
  <div class="frame-wrapper" style="width:25%">
    <iframe id="leftA" class="visible"
            src="https://receptionroulier.github.io/cal/p.html"></iframe>
    <iframe id="leftB" class="hidden"></iframe>
  </div>

  <!-- Zone droite -->
  <div class="frame-wrapper" style="width:75%">
    <iframe id="rightA" class="visible"
            src="https://receptionroulier.github.io/cal/caltest.html"></iframe>
    <iframe id="rightB" class="hidden"></iframe>
  </div>
</div>

<script>
const REFRESH_MS = 5000; // 5 secondes

function setupDoubleBuffer(idA, idB, url) {
  let visible = document.getElementById(idA);
  let hidden  = document.getElementById(idB);

  setInterval(() => {
    // charger en arrière-plan
    hidden.src = url;

    hidden.onload = () => {
      // swap instantané
      visible.classList.add("hidden");
      visible.classList.remove("visible");

      hidden.classList.add("visible");
      hidden.classList.remove("hidden");

      // inverser les rôles
      [visible, hidden] = [hidden, visible];
    };
  }, REFRESH_MS);
}

// Activation double buffering
setupDoubleBuffer("leftA",  "leftB",  "https://receptionroulier.github.io/cal/p.html");
setupDoubleBuffer("rightA", "rightB", "https://receptionroulier.github.io/cal/caltest.html");
</script>

</body>
</html>
