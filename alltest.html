<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tableau de bord - Ponts - Navires & Calendrier Réception</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .left {
      width: 20%;
      min-width: 180px;
      overflow: hidden;
      border-right: 1px solid #e0e0e0;
      position: relative;
    }
    .right {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left" id="leftContainer">
      <iframe id="leftFrame" src="https://receptionroulier.github.io/cal/p.html" title="Ponts"></iframe>
    </div>

    <div class="right" id="rightContainer">
      <iframe id="rightFrame" src="https://receptionroulier.github.io/cal/caltest.html" title="Calendriers"></iframe>
    </div>
  </div>

  <script>
    function smoothReload(containerId, iframeId, src) {
      const container = document.getElementById(containerId);
      const oldIframe = document.getElementById(iframeId);

      // Créer un iframe préchargé
      const newIframe = document.createElement('iframe');
      newIframe.src = src.split('?')[0] + '?t=' + Date.now();
      newIframe.style.position = 'absolute';
      newIframe.style.top = '0';
      newIframe.style.left = '0';
      newIframe.style.width = '100%';
      newIframe.style.height = '100%';
      newIframe.style.border = '0';
      newIframe.style.opacity = '0'; // invisible au début

      // Une fois chargé, swap les iframes
      newIframe.onload = () => {
        newIframe.style.opacity = '1'; // afficher
        oldIframe.remove();
        newIframe.id = iframeId; // conserver l'id
      };

      container.appendChild(newIframe);
    }

    setInterval(() => {
      smoothReload('leftContainer', 'leftFrame', 'https://receptionroulier.github.io/cal/p.html');
      smoothReload('rightContainer', 'rightFrame', 'https://receptionroulier.github.io/cal/caltest.html');
    }, 15000);
  </script>

</body>
</html>
