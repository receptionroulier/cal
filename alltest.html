  <script>
    // Rechargement sans flicker : on recharge dans un iframe "fantôme"
    function softReload(id) {
      const iframe = document.getElementById(id);

      // Créer un iframe caché qui va charger en arrière-plan
      const ghost = document.createElement('iframe');
      ghost.style.display = 'none';
      ghost.src = iframe.src + '?t=' + Date.now(); // éviter le cache

      ghost.onload = () => {
        // Une fois chargé, remplacer le contenu sans effet visuel
        iframe.src = ghost.src;
        ghost.remove();
      };

      document.body.appendChild(ghost);
    }

    setInterval(() => {
      softReload('leftFrame');
      softReload('rightFrame');
    }, 15000);
  </script>
