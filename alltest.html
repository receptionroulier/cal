<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ponts HAROPA – Monitoring + Calendrier</title>

<style>
/* ============================================================
   GLOBAL
============================================================ */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: #eaeaea;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ============================================================
   COLONNE GAUCHE
============================================================ */
.left {
  flex: 0 0 20%;
  border-right: 1px solid #444;
  padding: 14px;
  overflow-y: auto;
  box-sizing: border-box;
}
.left h2 {
  color: #00e5ff;
  text-align: center;
}

/* ============================================================
   CARTES PONTS
============================================================ */
.pont-card {
  background: #1f1f1f;
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: 0 0 5px rgba(0,0,0,0.4);
  border-left: 4px solid #444;
  transition: transform 0.15s ease, box-shadow 0.3s ease;
  margin-bottom: 8px;
}
.pont-card:hover { transform: scale(1.02); }
.pont-card.ferme { border-left-color: #ff4040; }
.pont-card.fermeture { border-left-color: orange; animation: pulse-orange 1.2s infinite; }
.pont-card.manoeuvre { border-left-color: #1c3cff; animation: pulse-blue 1.2s infinite; }
.pont-card.ouvert { border-left-color: #58ff58; }

.pastille {
  width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: inline-block;
}
.ferme .pastille      { background: #ff4040; }
.fermeture .pastille  { background: orange; }
.manoeuvre .pastille  { background: #1c3cff; }
.ouvert .pastille     { background: #58ff58; }

.pont-nom {
  font-weight: bold;
  display: flex;
  align-items: center;
}

/* ============================================================
   ANIMATIONS PULSE
============================================================ */
@keyframes pulse-blue {
  0%,100% { box-shadow: 0 0 5px rgba(28,60,255,0.4); transform: scale(1); }
  50%     { box-shadow: 0 0 20px rgba(28,60,255,0.7); transform: scale(1.02); }
}
@keyframes pulse-orange {
  0%,100% { box-shadow: 0 0 5px rgba(255,165,0,0.4); transform: scale(1); }
  50%     { box-shadow: 0 0 20px rgba(255,165,0,0.7); transform: scale(1.02); }
}

/* ============================================================
   CALENDRIER
============================================================ */
.right {
  flex:1;
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
}

/* Header calendrier */
#calendar-header {
  flex:0 0 auto;
  padding:12px;
  text-align:center;
  font-size:22px;
  color:#00e5ff;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
}

.nav-btn {
  cursor:pointer;
  color:#00e5ff;
  font-size:26px;
  padding:4px 10px;
  border-radius:6px;
  transition:0.2s;
}
.nav-btn:hover { background:#222; }

.view-btn {
  cursor:pointer;
  font-size:14px;
  padding:4px 10px;
  background:#222;
  border-radius:6px;
  border:1px solid #333;
  color:#00e5ff;
}
.view-btn:hover { background:#333; }

/* Grille calendrier */
#calendar-grid {
  flex:1 1 auto;
  display:grid;
  gap:1px;
  background:#333;
  overflow:auto;
  box-sizing:border-box;
  padding:6px;
  position:relative;
}

/* Cellules */
.calendar-cell {
  background:#1a1a1a;
  padding:6px;
  border:1px solid #222;
  overflow:hidden;          /* ← empêche les débordements */
  position:relative;
  min-height:70px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
}

.date-label {
  font-size:12px;
  margin-bottom:4px;
  color:#ffffff;
}

/* Conteneur des événements ponctuels */
.cell-events {
  display:flex;
  flex-direction:column;
  gap:4px;
  z-index:4;
  max-height:100%;         /* ← correction */
  overflow-y:auto;         /* ← correction */
}

/* Événements ponctuels */
.event {
  padding:3px 6px;
  border-radius:4px;
  font-size:12px;
}
.event.reception { background:#109c5344; border-left:3px solid #109c53; color:#eaffea; }
.event.navire    { background:#3644b344; border-left:3px solid #3644b3; color:#eef0ff; }

/* ============================================================
   BANDES MULTI-JOURS
============================================================ */
.multi-band {
  position:absolute;
  height:18px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  box-sizing:border-box;
  font-size:12px;
  color:#fff;
  overflow:hidden;
  z-index:2;
  pointer-events:auto;
  white-space:nowrap;
}

.multi-band.reception { background: #109c53; }
.multi-band.navire    { background: #3644b3; }

.band-left  { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.band-right { white-space:nowrap; margin-left:8px; }

/* Responsive */
@media (max-width:900px){
  .left { flex:0 0 30%; }
  .calendar-cell { min-height:90px; }
}
</style>
</head>
<body>

<!-- ====================== COLONNE GAUCHE ====================== -->
<div class="left">
  <h2>État des Ponts</h2>
  <div id="ponts-table">Chargement…</div>
</div>

<!-- ====================== CALENDRIER =========================== -->
<div class="right">
  <div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
    <span class="nav-btn" id="today-btn" style="font-size:18px;">Aujourd’hui</span>
  </div>

  <div id="calendar-grid"></div>
</div>
