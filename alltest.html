<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tableau double iframe – Rechargement intelligent</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #container {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  .frame-wrapper {
    position: relative;
    height: 100%;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    transition: opacity 0.25s linear;
  }

  .hidden {
    opacity: 0;
    pointer-events: none;
  }

  .visible {
    opacity: 1;
  }
</style>
</head>

<body>

<div id="container">
  
  <!-- Zone gauche (25%) -->
  <div class="frame-wrapper" style="width: 25%;">
    <iframe id="leftA" class="visible"
            src="https://receptionroulier.github.io/cal/p.html"></iframe>
    <iframe id="leftB" class="hidden"></iframe>
  </div>

  <!-- Zone droite (75%) -->
  <div class="frame-wrapper" style="width: 75%;">
    <iframe id="rightA" class="visible"
            src="https://receptionroulier.github.io/cal/caltest.html"></iframe>
    <iframe id="rightB" class="hidden"></iframe>
  </div>

</div>

<script>
/*
    Fonction de surveillance :
    - Vérifie le fichier version toutes les 1 seconde
    - Si la version change → recharge l’iframe (double-buffer)
*/
function monitor(urlVersion, iframeA, iframeB, pageUrl) {
    let lastVersion = null;

    setInterval(async () => {
        try {
            // On ajoute un timestamp pour éviter le cache
            const response = await fetch(urlVersion + "?_=" + Date.now());
            const version = await response.text();

            if (version !== lastVersion) {
                lastVersion = version;

                // On recharge dans l’iframe cachée (double-buffer)
                iframeB.src = pageUrl + "?v=" + version;

                iframeB.onload = () => {
                    // Swap : B devient visible, A devient cachée
                    iframeA.classList.add("hidden");
                    iframeA.classList.remove("visible");

                    iframeB.classList.add("visible");
                    iframeB.classList.remove("hidden");

                    // Permutation des références
                    const temp = iframeA;
                    iframeA = iframeB;
                    iframeB = temp;
                };
            }

        } catch (error) {
            console.error("Erreur lors de la vérification :", error);
        }
    }, 1000); // Vérification toutes les secondes
}

// Activation pour la page de gauche
monitor(
    "https://receptionroulier.github.io/cal/p.version.txt",
    document.getElementById("leftA"),
    document.getElementById("leftB"),
    "https://receptionroulier.github.io/cal/p.html"
);

// Activation pour la page de droite
monitor(
    "https://receptionroulier.github.io/cal/caltest.version.txt",
    document.getElementById("rightA"),
    document.getElementById("rightB"),
    "https://receptionroulier.github.io/cal/caltest.html"
);
</script>

</body>
</html>
