<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Réception Roulier</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
:root {
  --bg: #0a0e14; --surface: #111722; --surface2: #1a2130;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --accent: #3b8fff; --text: #e8edf5; --text2: #7a8fa8; --text3: #4a5a6e;
  --red: #ff4d6d; --blue: #3b8fff; --warn: #ff6b35;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; }

#app { display: flex; flex-direction: column; height: 100vh; }

header {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border2); flex-shrink: 0;
}
.header-left-action { display: flex; align-items: center; }
.logo { font-size: 1.1rem; font-weight: 800; color: var(--accent); white-space: nowrap; }
.logo span { color: var(--text2); font-weight: 400; }
.week-nav { display: flex; align-items: center; gap: 8px; margin: 0 auto; }
.week-nav button { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
#week-label { font-size: 0.82rem; font-weight: 700; background: var(--surface2); padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border2); }
.header-actions { display: flex; gap: 8px; }
.btn { padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 0.75rem; font-weight: 700; border: none; transition: all .15s; white-space: nowrap; }
.btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost:hover { color: var(--text); background: var(--surface); border-color: var(--accent); }
.view-tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: 8px; padding: 3px; border: 1px solid var(--border); }
.view-tab { padding: 4px 12px; border-radius: 5px; font-size: 0.73rem; font-weight: 700; cursor: pointer; color: var(--text3); }
.view-tab.active { background: var(--accent); color: #000; }

main { display: flex; flex: 1; min-height: 0; }

#panel-staff {
  width: 220px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border2); display: flex; flex-direction: column; overflow: hidden;
}
.panel-title { font-size: 0.65rem; font-weight: 700; color: var(--text3); padding: 12px 14px 8px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
#staff-search { margin: 8px 10px; padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.75rem; outline: none; }
#staff-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
.staff-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
  cursor: grab; margin-bottom: 3px; transition: all .12s; border: 1px solid transparent;
}
.staff-item:hover { background: var(--surface2); border-color: var(--border); }
.staff-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 700; flex-shrink: 0; }
.staff-name { font-size: 0.73rem; font-weight: 600; }
.staff-matric { font-size: 0.62rem; color: var(--text3); font-family: 'DM Mono', monospace; }
.staff-item.absent { opacity: 0.45; }
.absence-badge { font-size: 0.58rem; padding: 1px 4px; border-radius: 3px; background: rgba(255,107,53,0.2); color: var(--warn); margin-left: auto; }

#content { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }

#view-week { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.days-header { display: grid; gap: 4px; padding: 8px 0 4px; box-sizing: border-box; }
.day-header-cell {
  text-align: center; padding: 8px 4px; border-radius: 7px; font-size: 0.72rem; font-weight: 700;
  background: var(--surface); border: 2px solid var(--border); cursor: pointer; position: relative;
  min-height: 60px; box-sizing: border-box;
}
.day-header-cell.today { border-color: var(--accent); }
.day-header-cell.ferie { border-color: var(--red); }
.day-header-cell.today.ferie { border-color: var(--red); }
.ferie-badge {
  position: absolute; left: 4px; top: 4px; font-size: 0.52rem; font-weight: 700;
  color: var(--red); background: rgba(255,77,109,0.15); padding: 1px 4px; border-radius: 3px;
}
.day-mail-btn {
  position: absolute; right: 5px; top: 5px; font-size: 0.7rem; cursor: pointer; opacity: 0.6;
  background: var(--surface2); border-radius: 50%; width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
}
.day-mail-btn:hover { opacity: 1; color: var(--accent); background: var(--accent); color: #000; }

.week-grid { display: grid; gap: 4px; padding: 4px 0 10px; align-content: start; box-sizing: border-box; }
.day-col {
  background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 8px;
  display: flex; flex-direction: column; gap: 8px; align-items: stretch;
  height: fit-content; overflow: hidden; box-sizing: border-box;
}
.day-col.today { border-color: var(--accent); }
.day-col.ferie { border-color: var(--red); }
.day-col.today.ferie { border-color: var(--red); }
.day-col.no-activity {
  opacity: 0.5;
  background: linear-gradient(135deg, var(--surface) 0%, rgba(10,14,20,0.8) 100%);
}

.section-label {
  font-size: 0.58rem; font-weight: 700; color: var(--text3); padding: 6px 0 2px;
  border-top: 1px solid var(--border); text-transform: uppercase; text-align: center;
  white-space: normal; word-break: break-word;
}
.section-hours {
  font-size: 0.55rem; color: var(--text3); font-family: 'DM Mono', monospace;
  margin-bottom: 3px; text-align: center;
}

.slot-container { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; margin-bottom: 4px; }
.slot-info { display: flex; justify-content: space-between; align-items: flex-start; font-size: 0.6rem; font-weight: 700; color: var(--text3); margin-bottom: 4px; gap: 4px; }
.slot-remove { color: var(--red); cursor: pointer; }

.assigned-chip {
  display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 5px;
  background: var(--bg); border: 1px solid var(--border); cursor: pointer; position: relative; width: 100%;
}
.chip-name { font-size: 0.68rem; font-weight: 600; flex: 1; white-space: normal; word-break: break-word; color: var(--text); }
.chip-matric { font-size: 0.58rem; color: var(--text3); font-family: 'DM Mono', monospace; }
.chip-remove {
  position: absolute; right: 4px; top: 4px; font-size: 0.65rem; color: var(--red);
  display: none; background: var(--surface); border-radius: 3px; padding: 0 2px;
}
.assigned-chip:hover .chip-remove { display: block; }

.drop-zone {
  border: 1px dashed var(--border); border-radius: 5px; padding: 4px; min-height: 32px;
  font-size: 0.62rem; color: var(--text3); display: flex; align-items: center; justify-content: center;
}
.drop-zone.active { border-color: var(--accent); background: rgba(59,143,255,0.08); }

#view-absences { display: none; flex: 1; padding: 20px; overflow-y: auto; }
.abs-table { width: 100%; border-collapse: collapse; font-size: 0.65rem; background: var(--surface); }
.abs-table th, .abs-table td { border: 1px solid var(--border2); padding: 4px; text-align: center; }
.abs-table th { background: var(--surface2); color: var(--text2); }
.abs-code { font-weight: bold; padding: 2px 4px; border-radius: 3px; background: rgba(255,107,53,0.2); color: var(--warn); }

#modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
#modal-overlay.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; max-width: 520px; width: 94%; }
.modal-label { font-size: 0.72rem; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; }
.modal-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 8px 12px; margin-bottom: 12px; outline: none; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-btn { padding: 8px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; }
.modal-btn-cancel { background: var(--surface2); color: var(--text2); }
.modal-btn-ok { background: var(--accent); color: #000; }

#toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #000; padding: 10px 18px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; transform: translateY(60px); opacity: 0; transition: all .25s; z-index: 2000; }
#toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left-action">
        <button class="btn btn-ghost" id="btn-settings" style="padding: 6px; border-radius: 50%;">⚙️</button>
    </div>
    <div class="logo">RÉCEPTION<span> ROULIER</span></div>
    <div class="week-nav">
      <button id="prev-week">‹</button>
      <div id="week-label">Chargement...</div>
      <button id="next-week">›</button>
    </div>
    <div class="view-tabs">
      <div class="view-tab active" data-view="week">Planning</div>
      <div class="view-tab" data-view="absences">Absences</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btn-email-week">✉ Mail Hebdo</button>
    </div>
  </header>

  <main>
    <div id="panel-staff">
      <div class="panel-title">Personnel</div>
      <input type="text" id="staff-search" placeholder="Rechercher…">
      <div id="staff-list"></div>
    </div>
    <div id="content">
      <div id="view-week">
        <div id="week-scroll-area" style="flex:1;overflow:auto;min-height:0;">
          <div id="week-inner" style="min-width:560px;padding:0 10px 10px;">
            <div class="days-header" id="days-header"></div>
            <div class="week-grid" id="week-grid"></div>
          </div>
        </div>
      </div>
      <div id="view-absences" style="display:none">
          <div class="panel-title" style="padding: 20px; display:flex; justify-content:space-between; align-items:center">
              <span>Suivi Mensuel des Absences</span>
              <div id="month-nav" style="display:flex; gap:10px; align-items:center">
                  <button class="btn btn-ghost" style="padding:2px 8px" id="abs-prev">‹</button>
                  <span id="abs-month-label" style="font-size:0.8rem">Chargement...</span>
                  <button class="btn btn-ghost" style="padding:2px 8px" id="abs-next">›</button>
              </div>
          </div>
          <div id="absences-container" style="padding: 0 20px 20px"></div>
      </div>
    </div>
  </main>
</div>

<div id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<div id="toast"></div>

<script>
const PLAN_PROXY = "https://planning-proxy.receptionroulier.workers.dev";
const NAV_PROXY = "https://shgt-proxy.receptionroulier.workers.dev";
const HOLIDAYS_BASE = "https://calendrier.api.gouv.fr/jours-feries/metropole";

const SECTIONS_ORDER = ['cm', 'fcq', 'pn', 'matin', 'aprem', 'autre'];

const SECTIONS_MAP = {
  'cm': { id: 'cm', name: 'Chef de Manutention', hours: '', color: '#ff4d6d' },
  'fcq': { id: 'fcq', name: 'Chef de quai', hours: '8h30-12h00 / 14h00-17h30', color: '#a78bfa' },
  'pn': { id: 'pn', name: 'Montage / Prépa', hours: '8h30-12h00 / 14h00-17h30', color: '#00c896' },
  'matin': { id: 'matin', name: 'Réception Matin', hours: '7h00 / 14h00', color: '#3b8fff' },
  'aprem': { id: 'aprem', name: 'Réception Après-Midi', hours: '13h00 / 20h00', color: '#ffd060' },
  'autre': { id: 'autre', name: 'Autres', hours: '', color: '#94a3b8' }
};

const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

let state = {
  weekStart: getMonday(new Date()),
  absMonth: new Date(),
  view: 'week',
  planning: {},
  slots: {},
  absences: {},
  holidays: {},
  config: {
    emailWeek: 'chefmanutention.tmt@shgt.fr',
    emailCcWeek: 'smaillard@smr-france.com',
  },
  staff: [],
  workerAssignmentMap: {},
  dragWorker: null,
};

// ── API ──
async function fetchNavires(dateFrom, dateTo) {
    try {
        const response = await fetch(NAV_PROXY, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dateFrom, dateTo })
        });
        const data = await response.json();
        return Array.isArray(data) ? data : [];
    } catch(e) {
        console.error('[API] Error navires:', e);
        return [];
    }
}

async function fetchPersonnel(dateFrom, dateTo) {
    try {
        const response = await fetch(PLAN_PROXY, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'workers', dateFrom, dateTo })
        });
        const data = await response.json();
        return data;
    } catch(e) {
        console.error('[API] Error personnel:', e);
        return { totalWorkers: 0, workerCalendars: [] };
    }
}

// ── FETCH JOURS FÉRIÉS ──
async function fetchHolidays() {
    try {
        const currentYear = new Date().getFullYear();
        const yearsToFetch = [currentYear - 2, currentYear - 1, currentYear, currentYear + 1, currentYear + 2];

        const holidays = {};

        const results = await Promise.all(
            yearsToFetch.map(year =>
                fetch(`${HOLIDAYS_BASE}/${year}.json`)
                    .then(r => {
                        if (!r.ok) {
                            console.log(`[HOLIDAYS] ${year}: HTTP ${r.status}`);
                            return [];
                        }
                        return r.json();
                    })
                    .catch(err => {
                        console.error(`[HOLIDAYS] ${year}:`, err);
                        return [];
                    })
            )
        );

        results.forEach((yearData, idx) => {
            const year = yearsToFetch[idx];
            // L'API retourne un objet { "2025-01-01": "Jour de l'an", ... }
            if (yearData && typeof yearData === 'object' && !Array.isArray(yearData)) {
                Object.entries(yearData).forEach(([date, nom]) => {
                    holidays[date] = nom;
                });
                console.log(`[HOLIDAYS] ${year}: ${Object.keys(yearData).length} jours fériés`);
            } else if (Array.isArray(yearData)) {
                yearData.forEach(h => {
                    if (h.date) holidays[h.date] = h.nom;
                });
            }
        });

        state.holidays = holidays;
        console.log('[HOLIDAYS] Total:', Object.keys(holidays).length, 'holidays');
        console.log('[HOLIDAYS] Sample:', Object.entries(holidays).slice(0, 5));
    } catch(e) {
        console.error('[HOLIDAYS] Error:', e);
        state.holidays = {};
    }
}

// ── HELPERS ──
function getMonday(d) {
  const r = new Date(d);
  const day = r.getDay();
  r.setDate(r.getDate() + (day === 0 ? -6 : 1 - day));
  r.setHours(0,0,0,0); return r;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmtISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtFR(d) { return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }); }
function getWeekNum(d) {
  const t = new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate() + 3 - (t.getDay()+6)%7);
  const j4 = new Date(t.getFullYear(),0,4);
  return 1 + Math.round(((t-j4)/86400000 - 3 + (j4.getDay()+6)%7)/7);
}
function getWorker(id) { return state.staff.find(w => w.id === id); }
function initials(w) { return ((w.firstName||'')[0]||'') + ((w.lastName||'')[0]||''); }
function avatar(w, size=26) {
  const color = w.color || '#3b8fff';
  return `<div class="staff-avatar" style="width:${size}px;height:${size}px;background:${color}22;color:${color};border:1px solid ${color}44">${initials(w).toUpperCase()}</div>`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
function getRandomColor(id) {
    const colors = ['#3b8fff', '#a78bfa', '#00c896', '#ffd060', '#ff6b6b', '#ff4d6d'];
    let hash = 0;
    for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

function findSectionForWorker(jobCode, posteCode, projectName) {
    const isParcProject = projectName && (projectName.includes('Parc SMR') || projectName.includes('Parc Manucar'));

    if (jobCode === 'CM' && posteCode === '0817') return 'cm';
    if (jobCode === 'FCQ' && posteCode === '0817') return 'fcq';
    if (jobCode === 'PN' && posteCode === '0817') return 'pn';
    if ((jobCode === 'CI' || jobCode === 'CO') && posteCode === '0714' && isParcProject) return 'matin';
    if ((jobCode === 'CI' || jobCode === 'CO') && posteCode === '1320' && isParcProject) return 'aprem';

    return 'autre';
}

// ── STATE MANAGEMENT ──
function loadState() {
  try {
    const s = localStorage.getItem('planningRoulier_v20');
    if (s) {
      const saved = JSON.parse(s);
      state.planning = saved.planning || {};
      // Les slots sauvegardés sont restaurés puis fusionnés avec les données dynamiques
      state._savedSlots = saved.slots || {};
      state.config = { ...state.config, ...saved.config };
    }
    // Restaurer les largeurs de colonnes
    const cw = localStorage.getItem('planningRoulier_colWidths');
    if (cw) state.colWidths = JSON.parse(cw);
    else state.colWidths = Array(7).fill(null);
  } catch(e) { console.error('[loadState]', e); state.colWidths = Array(7).fill(null); }
}
function saveState() {
  try {
    localStorage.setItem('planningRoulier_v20', JSON.stringify({
      planning: state.planning,
      slots: state.slots,
      config: state.config,
    }));
    console.log('[saveState] Affectations sauvegardées', Object.keys(state.planning).length, 'entrées');
  } catch(e) { console.error('[saveState]', e); }
}

// ── PARSE PERSONNEL DATA ──
function parsePersonnelData(personnelData, dateFrom, dateTo) {
    const staffMap = new Map();
    const absencesMap = {};
    const workerAssignmentMap = {};

    if (!personnelData || !personnelData.workerCalendars) {
        return { staff: [], absences: {}, workerAssignmentMap: {} };
    }

    personnelData.workerCalendars.forEach(wc => {
        const workerId = String(wc.workerId);

        if (!staffMap.has(workerId)) {
            const rawFirst = wc.firstName || '';
            const capitalFirst = rawFirst.charAt(0).toUpperCase() + rawFirst.slice(1).toLowerCase();
            staffMap.set(workerId, {
                id: workerId,
                firstName: capitalFirst,
                lastName: (wc.lastName || '').toUpperCase(),
                matricule: wc.dockerMatricule || '',
                color: getRandomColor(workerId),
                isChief: wc.isChief || false
            });
        }

        if (wc.days) {
            wc.days.forEach(day => {
                if (!day.date) return;
                if (day.isAbsence && day.code) {
                    if (!absencesMap[workerId]) absencesMap[workerId] = {};
                    absencesMap[workerId][day.date] = day.code;
                }
                if (day.projectAssignmentWorkerId) {
                    workerAssignmentMap[String(day.projectAssignmentWorkerId)] = workerId;
                }
            });
        }
    });

    return {
        staff: Array.from(staffMap.values()),
        absences: absencesMap,
        workerAssignmentMap: workerAssignmentMap
    };
}

// ── BUILD SLOTS FROM NAVIRES ──
async function buildDynamicSlots() {
    const dateStart = fmtISO(state.weekStart);
    const dateEnd = fmtISO(addDays(state.weekStart, 6));
    const naviresData = await fetchNavires(dateStart, dateEnd);

    // Initialiser les slots vides
    for(let i=0; i<7; i++) {
        state.slots[i] = {};
        SECTIONS_ORDER.forEach(secId => {
            state.slots[i][secId] = [];
        });
    }

    // Suivre les IDs de slots construits dynamiquement (pour éviter doublons)
    const builtSlotIds = new Set();

    naviresData.forEach(dayData => {
        if (!dayData || !dayData.postes) return;

        const dateObj = new Date(dayData.date);
        const dayIdx = Math.floor((dateObj - state.weekStart) / (1000 * 60 * 60 * 24));
        if (dayIdx < 0 || dayIdx > 6) return;

        dayData.postes.forEach(p => {
            if (!p.poste || !p.poste.code) return;
            const posteCode = p.poste.code;

            if (!p.projectAssignments || p.projectAssignments.length === 0) return;

            const parcAssignments = p.projectAssignments.filter(pa => pa.sectorId === 25);
            if (parcAssignments.length === 0) return;

            parcAssignments.forEach(pa => {
                if (!pa.projectAssignmentWorkers) return;

                const projectName = pa.project?.name || '';

                pa.projectAssignmentWorkers.forEach(w => {
                    const jobCode = w.job?.code || 'UNK';
                    const secId = findSectionForWorker(jobCode, posteCode, projectName);
                    const slotId = `slot_${pa.id}_${w.id}`;

                    builtSlotIds.add(slotId);

                    state.slots[dayIdx][secId].push({
                        id: slotId,
                        label: jobCode,
                        jobCode: jobCode,
                        posteCode: posteCode,
                        projectName: projectName,
                        assignmentId: pa.id,
                        workerAssignmentId: String(w.id)
                    });
                });
            });
        });
    });

    // Fusionner les slots sauvegardés qui ne sont plus dans les données dynamiques
    // (slots ajoutés manuellement ou slots d'une semaine dont les données ne sont plus disponibles)
    const savedSlots = state._savedSlots || {};
    for(let i=0; i<7; i++) {
        if (!savedSlots[i]) continue;
        SECTIONS_ORDER.forEach(secId => {
            const saved = savedSlots[i][secId] || [];
            saved.forEach(savedSlot => {
                if (!builtSlotIds.has(savedSlot.id)) {
                    // Ce slot n'existe plus dans les données dynamiques, on le conserve quand même
                    // s'il a une affectation de planning associée
                    const planKey = `${i}_${secId}_${savedSlot.id}`;
                    if (state.planning[planKey]) {
                        if (!state.slots[i][secId]) state.slots[i][secId] = [];
                        state.slots[i][secId].push(savedSlot);
                    }
                }
            });
        });
    }
}

// ── LOAD ALL DATA ──
async function loadAllData() {
    const dateStart = fmtISO(state.weekStart);
    const dateEnd = fmtISO(addDays(state.weekStart, 6));

    const personnelData = await fetchPersonnel(dateStart, dateEnd);
    const parsed = parsePersonnelData(personnelData, dateStart, dateEnd);

    state.staff = parsed.staff;
    state.absences = parsed.absences;
    state.workerAssignmentMap = parsed.workerAssignmentMap;

    await buildDynamicSlots();
}

// ── RENDER STAFF ──
function renderStaffList(filter='') {
  const list = document.getElementById('staff-list');
  list.innerHTML = '';
  const q = filter.toLowerCase();

  if (state.staff.length === 0) {
    list.innerHTML = '<div style="padding:10px;font-size:0.65rem;color:var(--text3);text-align:center">Aucun personnel</div>';
    return;
  }

  state.staff.forEach(w => {
    const name = `${w.firstName} ${w.lastName}`.toLowerCase();
    if (q && !name.includes(q) && !(w.matricule||'').toLowerCase().includes(q)) return;
    const dateToday = fmtISO(addDays(state.weekStart, 0));
    const absCode = state.absences[w.id]?.[dateToday] || '';
    const el = document.createElement('div');
    el.className = 'staff-item' + (absCode ? ' absent' : '');
    el.draggable = true;
    el.innerHTML = `${avatar(w)}<div class="staff-info"><div class="staff-name">${w.firstName} ${w.lastName}</div><div class="staff-matric">${w.matricule||'—'}</div></div>${absCode ? `<div class="absence-badge">${absCode}</div>` : ''}`;
    el.addEventListener('dragstart', e => { state.dragWorker = w.id; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    list.appendChild(el);
  });
}

// ── COLUMN WIDTHS ──
// Stocke les largeurs en px pour chaque colonne (7 jours)
if (!state.colWidths) state.colWidths = Array(7).fill(null); // null = auto (1fr)

function applyGridColumns() {
  const cols = state.colWidths.map(w => w ? w + 'px' : 'minmax(100px, 1fr)').join(' ');
  document.getElementById('days-header').style.gridTemplateColumns = cols;
  document.getElementById('week-grid').style.gridTemplateColumns = cols;
}

function renderWeekHeader() {
  const header = document.getElementById('days-header');
  header.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);

  DAYS.forEach((name, i) => {
    const d = addDays(state.weekStart, i);
    const dateISO = fmtISO(d);
    const isToday = d.getTime() === today.getTime();
    const isFerie = !!state.holidays[dateISO];

    const cell = document.createElement('div');
    cell.className = `day-header-cell${isToday ? ' today' : ''}${isFerie ? ' ferie' : ''}`;
    cell.style.cssText = 'position:relative; overflow:visible;';

    cell.innerHTML = `
      ${isFerie ? `<div class="ferie-badge">Férié</div>` : ''}
      <div class="day-name">${name}</div>
      <div class="day-num">${fmtFR(d)}</div>
      <div class="day-mail-btn" onclick="event.stopPropagation(); sendDailyMail(${i})">💬</div>
    `;

    // Poignée de redimensionnement (bord droit)
    const handle = document.createElement('div');
    handle.style.cssText = `
      position:absolute; right:-3px; top:0; bottom:0; width:6px;
      cursor:col-resize; z-index:10; background:transparent;
    `;
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      const startX = e.clientX;
      const startW = cell.getBoundingClientRect().width;
      const onMove = mv => {
        const newW = Math.max(80, startW + mv.clientX - startX);
        state.colWidths[i] = newW;
        applyGridColumns();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        // Sauvegarder les largeurs
        try { localStorage.setItem('planningRoulier_colWidths', JSON.stringify(state.colWidths)); } catch(e) {}
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    // Double-clic = reset largeur de cette colonne
    handle.addEventListener('dblclick', e => {
      e.stopPropagation();
      state.colWidths[i] = null;
      applyGridColumns();
      try { localStorage.setItem('planningRoulier_colWidths', JSON.stringify(state.colWidths)); } catch(e) {}
    });

    cell.appendChild(handle);
    header.appendChild(cell);
  });

  applyGridColumns();
}

function renderWeekGrid() {
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  // Appliquer les largeurs synchronisées header/grid
  setTimeout(() => applyGridColumns(), 0);

  DAYS.forEach((_, dayIdx) => {
    const col = document.createElement('div');
    col.className = 'day-col';

    const d = addDays(state.weekStart, dayIdx);
    const dateISO = fmtISO(d);
    const isToday = d.getTime() === today.getTime();
    const isFerie = !!state.holidays[dateISO];

    if (isToday) col.classList.add('today');
    if (isFerie) col.classList.add('ferie');

    const daySlots = state.slots[dayIdx] || {};

    let hasAnySlots = false;
    SECTIONS_ORDER.forEach(secId => {
        if (daySlots[secId] && daySlots[secId].length > 0) hasAnySlots = true;
    });

    if (!hasAnySlots) {
        col.classList.add('no-activity');
        col.innerHTML = `<div style="font-size:0.6rem; color:var(--text3); text-align:center; margin-top:40px">Aucune activité</div>`;
    } else {
        SECTIONS_ORDER.forEach(secId => {
            const sec = SECTIONS_MAP[secId];
            const slots = daySlots[secId] || [];

            if (slots.length === 0) return;

            const label = document.createElement('div');
            label.className = 'section-label';
            label.style.color = sec.color;
            label.textContent = sec.name;
            col.appendChild(label);

            if (sec.hours) {
                const hours = document.createElement('div');
                hours.className = 'section-hours';
                hours.textContent = sec.hours;
                col.appendChild(hours);
            }

            slots.forEach((slot, slotIdx) => {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'slot-container';
                const workerId = state.planning[`${dayIdx}_${secId}_${slot.id}`];
                const w = getWorker(workerId);

                const safeSecId = secId.replace(/'/g, "\\'");
                const safeSlotId = slot.id.replace(/'/g, "\\'");

                slotDiv.innerHTML = `
                    <div class="slot-info"><span>${slot.label}</span><span class="slot-remove" onclick="removeSlot(${dayIdx}, '${safeSecId}', ${slotIdx})">✕</span></div>
                    <div class="drop-zone" data-day="${dayIdx}" data-sec="${secId}" data-slot="${slot.id}">
                        ${w ? `
                          <div class="assigned-chip">
                            <div class="chip-name">${w.lastName} ${w.firstName}</div>
                            <div class="chip-matric">${w.matricule||'—'}</div>
                            <div class="chip-remove" onclick="removeFromSlot(${dayIdx},'${safeSecId}','${safeSlotId}')">✕</div>
                          </div>
                        ` : 'Glisser ici'}
                    </div>
                `;

                const dz = slotDiv.querySelector('.drop-zone');
                dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('active'); });
                dz.addEventListener('dragleave', () => dz.classList.remove('active'));
                dz.addEventListener('drop', e => {
                    e.preventDefault(); dz.classList.remove('active');
                    if (state.dragWorker) { addToSlot(dayIdx, secId, slot.id, state.dragWorker); state.dragWorker = null; }
                });
                col.appendChild(slotDiv);
            });
        });
    }

    grid.appendChild(col);
  });
}

function addToSlot(dayIdx, secId, slotId, workerId) {
  const worker = getWorker(workerId);
  if (!worker) { toast('Travailleur non trouvé'); return; }

  const dateISO = fmtISO(addDays(state.weekStart, dayIdx));
  const absCode = state.absences[workerId]?.[dateISO] || '';

  if (absCode && !confirm(`⚠️ ${worker.firstName} ${worker.lastName} est absent (${absCode}) le ${dateISO}. Forcer ?`)) return;

  state.planning[`${dayIdx}_${secId}_${slotId}`] = workerId;
  saveState(); renderWeekGrid();
  toast('Affecté ✓');
}

function removeFromSlot(dayIdx, secId, slotId) {
    delete state.planning[`${dayIdx}_${secId}_${slotId}`];
    saveState(); renderWeekGrid();
}

function removeSlot(dayIdx, secId, slotIdx) {
    const slot = state.slots[dayIdx][secId][slotIdx];
    if (!slot) return;
    delete state.planning[`${dayIdx}_${secId}_${slot.id}`];
    state.slots[dayIdx][secId].splice(slotIdx, 1);
    saveState(); renderWeekGrid();
}

function renderAbsences() {
    const container = document.getElementById('absences-container');
    const startOfMonth = new Date(state.absMonth.getFullYear(), state.absMonth.getMonth(), 1);
    const daysInMonth = new Date(state.absMonth.getFullYear(), state.absMonth.getMonth() + 1, 0).getDate();

    document.getElementById('abs-month-label').textContent = state.absMonth.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

    if (state.staff.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3)">Aucune donnée</div>';
        return;
    }

    let html = `<table class="abs-table"><thead><tr><th style="position:sticky; left:0; background:var(--surface2); z-index:1">Personnel</th>`;
    for(let i=1; i<=daysInMonth; i++) {
        const d = new Date(startOfMonth.getFullYear(), startOfMonth.getMonth(), i);
        html += `<th>${i}<br>${d.toLocaleDateString('fr-FR',{weekday:'short'}).substring(0,3)}</th>`;
    }
    html += `</tr></thead><tbody>`;
    state.staff.forEach(w => {
        html += `<tr><td style="position:sticky; left:0; background:var(--surface); border-right:1px solid var(--border2)">${w.lastName} ${w.firstName}</td>`;
        for(let i=1; i<=daysInMonth; i++) {
            const dateISO = fmtISO(new Date(startOfMonth.getFullYear(), startOfMonth.getMonth(), i));
            const code = state.absences[w.id]?.[dateISO] || '';
            html += `<td>${code ? `<span class="abs-code">${code}</span>` : '—'}</td>`;
        }
        html += `</tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

// ── PDF & EMAILS ──
async function generatePDF(dayIdx = null) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const wn = getWeekNum(state.weekStart);
    let title = "", fileName = "", rows = [];

    if (dayIdx === null) {
        title = `Effectif Parc Roulier - Semaine ${wn}`;
        fileName = `Planning_Réception_Semaine${wn}.pdf`;
        for(let i=0; i<7; i++) {
            rows.push([`${DAYS[i]} ${fmtFR(addDays(state.weekStart, i))}`, '']);
            SECTIONS_ORDER.forEach(secId => {
                const sec = SECTIONS_MAP[secId];
                const slots = state.slots[i]?.[secId] || [];
                slots.forEach(s => {
                    const w = getWorker(state.planning[`${i}_${secId}_${s.id}`]);
                    rows.push([`  ${sec.name} (${s.label})`, w ? `${w.lastName} ${w.firstName}` : 'Non affecté']);
                });
            });
            rows.push([]);
        }
    } else {
        const d = addDays(state.weekStart, dayIdx);
        const dateStr = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
        title = `Effectif Parc Roulier - ${DAYS[dayIdx]} ${dateStr}`;
        fileName = `Planning_Réception_du_${dateStr.replace(/ /g,'_')}.pdf`;
        SECTIONS_ORDER.forEach(secId => {
            const sec = SECTIONS_MAP[secId];
            const slots = state.slots[dayIdx]?.[secId] || [];
            rows.push([sec.name, '']);
            slots.forEach(s => {
                const w = getWorker(state.planning[`${dayIdx}_${secId}_${s.id}`]);
                rows.push([`  ${s.label}`, w ? `${w.lastName} ${w.firstName}` : 'Non affecté']);
            });
        });
    }
    doc.text(title, 14, 15);
    doc.autoTable({ startY: 20, head: [['Poste / Section', 'Personnel']], body: rows, theme: 'grid' });
    doc.save(fileName);
}

async function sendDailyMail(dayIdx) {
    const d = addDays(state.weekStart, dayIdx);
    const dateStr = d.toLocaleDateString('fr-FR', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
    await generatePDF(dayIdx);
    const body = `Bonjour,\n\nCi-joint l'effectif Parc Roulier pour le ${dateStr}.`;
    window.open(`mailto:${state.config.emailWeek}?cc=${state.config.emailCcWeek}&subject=${encodeURIComponent('Planning Réception du ' + fmtFR(d))}&body=${encodeURIComponent(body)}`);
}

async function sendWeeklyMail() {
    const wn = getWeekNum(state.weekStart);
    await generatePDF();
    const body = `Bonjour,\n\nCi-joint l'effectif Parc Roulier pour la Semaine ${wn}.`;
    window.open(`mailto:${state.config.emailWeek}?cc=${state.config.emailCcWeek}&subject=${encodeURIComponent('Planning Hebdo Semaine ' + wn)}&body=${encodeURIComponent(body)}`);
}

function showConfigModal() {
  showModal(`
    <h2>⚙ Configuration</h2>
    <div class="modal-label">Email destinataires</div>
    <input class="modal-input" id="cfg-email-week" value="${state.config.emailWeek}">
    <div class="modal-label">Copie (CC)</div>
    <input class="modal-input" id="cfg-cc-week" value="${state.config.emailCcWeek}">
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-btn modal-btn-ok" onclick="saveConfig()">Enregistrer</button>
    </div>
  `);
}
window.saveConfig = function() {
  state.config.emailWeek = document.getElementById('cfg-email-week').value;
  state.config.emailCcWeek = document.getElementById('cfg-cc-week').value;
  saveState(); closeModal(); toast('Configuration sauvegardée');
};

function showModal(content) {
  document.getElementById('modal-content').innerHTML = content;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
window.closeModal = closeModal;

// ── INIT ──
async function initApp() {
    state.absMonth = new Date();
    await fetchHolidays();
    await loadAllData();
    render();
}

function render() {
  updateWeekLabel();
  renderStaffList(document.getElementById('staff-search').value);
  if (state.view === 'week') {
    renderWeekHeader();
    renderWeekGrid();
  } else if (state.view === 'absences') {
    renderAbsences();
  }
}

function updateWeekLabel() {
  const wn = getWeekNum(state.weekStart);
  document.getElementById('week-label').textContent = `Semaine ${wn} · ${fmtFR(state.weekStart)} – ${fmtFR(addDays(state.weekStart, 6))}`;
}

document.getElementById('prev-week').addEventListener('click', async () => {
    state.weekStart = addDays(state.weekStart, -7);
    await loadAllData();
    render();
});
document.getElementById('next-week').addEventListener('click', async () => {
    state.weekStart = addDays(state.weekStart, 7);
    await loadAllData();
    render();
});
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.view = tab.dataset.view;
    document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t === tab));
    document.getElementById('view-week').style.display = state.view === 'week' ? 'flex' : 'none';
    document.getElementById('view-absences').style.display = state.view === 'absences' ? 'block' : 'none';
    render();
  });
});
document.getElementById('btn-settings').addEventListener('click', showConfigModal);
document.getElementById('btn-email-week').addEventListener('click', sendWeeklyMail);
document.getElementById('staff-search').addEventListener('input', e => renderStaffList(e.target.value));
document.getElementById('abs-prev').addEventListener('click', async () => {
    state.absMonth.setMonth(state.absMonth.getMonth() - 1);
    await loadAllData();
    renderAbsences();
});
document.getElementById('abs-next').addEventListener('click', async () => {
    state.absMonth.setMonth(state.absMonth.getMonth() + 1);
    await loadAllData();
    renderAbsences();
});

loadState();
initApp();
</script>
