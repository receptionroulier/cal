name: Auto update version files

on:
  push:
    paths:
      - 'cal/*.html'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update version files
        run: |
          for html in cal/*.html; do
            version_file="${html%.html}.version.txt"
            date +%s > "$version_file"
          done

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add cal/*.version.txt
          git commit -m "Auto-update version files" || echo "No changes to commit"
          git push
