<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adresse mise à jour — RoulierLH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Arial;background:linear-gradient(135deg,#0f172a,#1e293b);color:#eaeaea;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px 28px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:20px;backdrop-filter:blur(12px);box-shadow:0 20px 40px rgba(0,0,0,0.5);text-align:center}
.icon{font-size:2.5rem}
h2{font-size:1.2rem;font-weight:700;color:#fff}
p{font-size:0.9rem;color:#94a3b8;line-height:1.6}
.url-box{background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.3);border-radius:10px;padding:12px 16px;font-family:monospace;font-size:0.85rem;color:#00e5ff;word-break:break-all}
.btn{display:block;background:#00e5ff;color:#0f172a;border:none;border-radius:10px;padding:13px 20px;font-size:0.95rem;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:#00c4e0}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔖</div>
  <h2>Nouvelle adresse du Calendrier Réception</h2>
  <p>Ce calendrier a déménagé. Merci de mettre à jour votre favori avec la nouvelle adresse :</p>
  <div class="url-box">https://lh.roulierlh.workers.dev/calr</div>
  <a class="btn" href="https://lh.roulierlh.workers.dev/calr">Ouvrir la nouvelle adresse</a>
  <p style="font-size:0.78rem;color:#475569">Pour mettre à jour votre favori : ouvrez la nouvelle adresse, puis remplacez le favori existant.</p>
</div>
</body>
</html>
