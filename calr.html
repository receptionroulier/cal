<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendrier Réception</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;overflow:hidden}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;display:flex;flex-direction:column;height:100%;overflow:hidden;min-height:0}
  #calendar-header{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);backdrop-filter:blur(8px);min-height:52px;position:relative}
  .header-left{display:flex;align-items:center;flex-shrink:0}
  #today-group{position:absolute;left:25%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;pointer-events:auto}
  #week-group{display:flex;align-items:center;gap:6px;pointer-events:auto}
  .back-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;color:#94a3b8;flex-shrink:0;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer;background:none;border:none}
  .back-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
  #calendar-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:bold;font-size:1.1rem;white-space:nowrap;pointer-events:none;max-width:calc(100% - 320px);overflow:hidden;text-overflow:ellipsis;text-align:center}
  #current-time{margin-left:auto;flex-shrink:0;font-size:2rem;font-weight:bold;font-family:"Trebuchet MS",sans-serif;white-space:nowrap}
  #header-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
  .nav-btn{cursor:pointer;color:#fff;font-size:24px;padding:2px 8px;border-radius:6px;line-height:1;flex-shrink:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .nav-btn:hover{background:rgba(255,255,255,0.1)}
  .view-btn{cursor:pointer;font-size:12px;padding:4px 8px;background:rgba(255,255,255,0.08);border-radius:6px;border:1px solid rgba(255,255,255,0.15);color:#fff;flex-shrink:0;white-space:nowrap}
  .view-btn:hover{background:rgba(255,255,255,0.15)}
  #calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative}
  .day-cell{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:6px;position:relative;overflow:hidden;min-height:80px}
  .day-cell.future-day{background:rgba(255,255,255,0.07);border:1px solid rgba(0,229,255,0.25);box-shadow:0 0 4px rgba(0,229,255,0.15)}
  .day-cell.today{background:rgba(0,229,255,0.08);border:2px solid rgba(0,229,255,0.75);box-shadow:0 0 8px rgba(0,229,255,0.5);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(0,229,255,0.5)}50%{box-shadow:0 0 14px rgba(0,229,255,0.75)}}
  .date-label{font-size:0.72rem;color:#9bb4be;margin-bottom:6px;font-weight:400}
  .day-cell.holiday{background:rgba(255,60,60,0.08) !important;border-color:rgba(255,80,80,0.5) !important;box-shadow:0 0 6px rgba(255,60,60,0.15) !important}
  .holiday-label{font-size:0.62rem;color:rgba(255,120,120,0.85);font-weight:600;letter-spacing:0.03em;margin-left:4px}
  .mob-day.mob-holiday{background:rgba(255,60,60,0.08) !important;border-color:rgba(255,80,80,0.5) !important;opacity:1 !important;box-shadow:0 0 6px rgba(255,60,60,0.15) !important}
  .mob-holiday-label{font-size:0.6rem;color:rgba(255,120,120,0.85);font-weight:600;margin-left:auto;letter-spacing:0.03em}
  .past-day-overlay{position:absolute;inset:0;background:rgba(200,210,220,0.06);backdrop-filter:grayscale(35%) brightness(0.85) contrast(0.9);-webkit-backdrop-filter:grayscale(35%) brightness(0.85) contrast(0.9);border-radius:8px;pointer-events:none;z-index:50}
  #events-layer{position:absolute;left:2px;right:6px;top:10px;bottom:10px;pointer-events:none}
  .multi-band,.single-evt{pointer-events:auto;position:absolute;display:flex;align-items:center;padding:0 10px;height:22px;border-radius:12px;font-size:0.78rem;color:#fff;white-space:nowrap;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,0.02),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(6px) saturate(150%);box-shadow:0 6px 18px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.02);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
  .past-event{filter:grayscale(35%) brightness(0.85) contrast(0.9);opacity:0.6}
  .multi-band:hover,.single-evt:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.03);background:linear-gradient(135deg,rgba(255,255,255,0.03),rgba(255,255,255,0.05))}
  .reception{background:linear-gradient(90deg,rgba(0,255,120,0.25),rgba(0,200,100,0.22));border:1px solid rgba(0,255,120,0.75);box-shadow:0 0 6px rgba(0,255,140,0.55),0 0 12px rgba(0,255,140,0.45),0 0 22px rgba(0,255,140,0.32),inset 0 0 6px rgba(0,255,160,0.35)}
  .reception:hover{background:linear-gradient(90deg,rgba(0,255,140,0.35),rgba(0,200,120,0.32));box-shadow:0 0 10px rgba(0,255,160,0.85),0 0 22px rgba(0,255,160,0.65),0 0 32px rgba(0,255,160,0.5),inset 0 0 8px rgba(0,255,180,0.45)}
  .navire-smr{background:linear-gradient(90deg,rgba(0,130,255,0.25),rgba(0,110,220,0.22));border:1px solid rgba(0,160,255,0.75);box-shadow:0 0 6px rgba(0,150,255,0.55),0 0 12px rgba(0,150,255,0.45),0 0 22px rgba(0,150,255,0.32),inset 0 0 6px rgba(0,170,255,0.35)}
  .navire-smr:hover{background:linear-gradient(90deg,rgba(0,160,255,0.35),rgba(0,130,255,0.32));box-shadow:0 0 10px rgba(0,180,255,0.85),0 0 22px rgba(0,180,255,0.65),0 0 32px rgba(0,180,255,0.5),inset 0 0 8px rgba(0,200,255,0.45)}
  .navire-manucar{background:linear-gradient(90deg,rgba(255,140,0,0.25),rgba(220,100,0,0.22));border:1px solid rgba(255,160,0,0.75);box-shadow:0 0 6px rgba(255,140,0,0.55),0 0 12px rgba(255,140,0,0.45),0 0 22px rgba(255,140,0,0.32),inset 0 0 6px rgba(255,160,0,0.35)}
  .navire-manucar:hover{background:linear-gradient(90deg,rgba(255,160,0,0.35),rgba(220,120,0,0.32));box-shadow:0 0 10px rgba(255,180,0,0.85),0 0 22px rgba(255,180,0,0.65),0 0 32px rgba(255,180,0,0.5),inset 0 0 8px rgba(255,200,0,0.45)}
  .autre{background:linear-gradient(90deg,rgba(255,220,0,0.25),rgba(200,180,0,0.22));border:1px solid rgba(255,210,0,0.75);box-shadow:0 0 6px rgba(255,220,0,0.55),0 0 12px rgba(255,220,0,0.45),0 0 22px rgba(255,220,0,0.32),inset 0 0 6px rgba(255,230,0,0.35)}
  .autre:hover{background:linear-gradient(90deg,rgba(255,230,0,0.35),rgba(220,190,0,0.32));box-shadow:0 0 10px rgba(255,240,0,0.85),0 0 22px rgba(255,240,0,0.65),0 0 32px rgba(255,240,0,0.5),inset 0 0 8px rgba(255,255,0,0.45)}
  .mob-evt.navire-manucar{background:linear-gradient(90deg,rgba(255,140,0,0.18),rgba(220,100,0,0.14));border:1px solid rgba(255,160,0,0.5);box-shadow:0 0 6px rgba(255,140,0,0.2)}
  .mob-evt.autre{background:linear-gradient(90deg,rgba(255,220,0,0.18),rgba(200,180,0,0.14));border:1px solid rgba(255,210,0,0.5);box-shadow:0 0 6px rgba(255,220,0,0.2)}
  .event-text-container{display:inline-flex;white-space:nowrap;overflow:hidden;width:100%;position:relative}
  .event-text{white-space:nowrap;display:inline-block;position:relative}
  .event-text.scrolling{animation:scroll 10s linear infinite}
  .event-text.scrolling::after{content:attr(data-text);position:absolute;left:100%;white-space:nowrap}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  .more-events{position:absolute;top:6px;right:8px;padding:2px 6px;background:rgba(0,0,0,0.45);border-radius:6px;font-size:0.72rem;cursor:pointer;z-index:60;pointer-events:auto}
  #mobile-wrap{display:none;flex:1;flex-direction:column;overflow:hidden}
  /* ── NOUVELLE VUE MOBILE SEMAINE 2 COLONNES ── */
  .week-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;flex:1;min-height:0;overflow:hidden}
  .week-col{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
  .mob-day{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0}
  .mob-day.mob-today{border:2px solid rgba(0,229,255,0.7);box-shadow:0 0 8px rgba(0,229,255,0.4);animation:pulse 2s infinite}
  .mob-day.mob-past{background:rgba(255,255,255,0.03);opacity:0.65}
  .mob-day.mob-future{background:rgba(255,255,255,0.07);border-color:rgba(0,229,255,0.2)}
  .mob-day-header{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:0.78rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0}
  .mob-day-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,0.2)}
  .mob-today .mob-day-dot{background:#00e5ff}
  .mob-future .mob-day-dot{background:rgba(0,229,255,0.4)}
  .mob-past .mob-day-dot{background:rgba(255,255,255,0.15)}
  .mob-day-date{color:#cbd5e1;font-size:0.75rem}
  .mob-more-tag{margin-left:auto;font-size:0.7rem;font-weight:700;color:#94a3b8;background:rgba(255,255,255,0.1);border-radius:4px;padding:1px 5px;line-height:1.4}
  .mob-events{display:flex;flex-direction:column;gap:4px;padding:5px 6px;overflow-y:auto;flex:1}
  .mob-empty{font-size:0.68rem;color:#475569;font-style:italic;padding:4px 6px}
  /* ── Nouvelle carte événement mobile 2 lignes ── */
  .mob-evt{display:flex;flex-direction:column;gap:2px;padding:5px 7px;border-radius:7px;cursor:pointer;transition:transform .12s;flex-shrink:0;overflow:hidden}
  .mob-evt:active{transform:translateX(2px)}
  .mob-evt.reception{background:linear-gradient(90deg,rgba(0,255,120,0.18),rgba(0,200,100,0.14));border:1px solid rgba(0,255,120,0.5);box-shadow:0 0 6px rgba(0,255,140,0.2)}
  .mob-evt.navire-smr{background:linear-gradient(90deg,rgba(0,130,255,0.18),rgba(0,110,220,0.14));border:1px solid rgba(0,160,255,0.5);box-shadow:0 0 6px rgba(0,150,255,0.2)}
  .mob-evt-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.73rem;color:#f0f8ff}
  .mob-evt-time{font-size:0.65rem;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Swipe animation */
  .week-grid{transition:transform 0.3s ease,opacity 0.3s ease}
  .week-grid.swipe-left{transform:translateX(-100%);opacity:0}
  .week-grid.swipe-right{transform:translateX(100%);opacity:0}
  /* Header jour cliquable */
  .mob-day-header{cursor:pointer}
  .mob-day-header:hover{background:rgba(255,255,255,0.05)}
  /* Modale jour agrandi */
  #day-modal{position:fixed;inset:0;display:none;z-index:998}
  #day-modal.show{display:block}
  #day-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);cursor:pointer}
  #day-modal-card{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border:1px solid rgba(255,255,255,0.12);border-radius:20px 20px 0 0;max-height:80vh;overflow-y:auto;padding:16px;z-index:1}
  #day-modal-title{font-size:1rem;font-weight:700;margin-bottom:12px;color:#fff}
  .day-modal-evt{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;margin-bottom:8px;cursor:pointer}
  .day-modal-evt.reception{background:linear-gradient(90deg,rgba(0,255,120,0.18),rgba(0,200,100,0.14));border:1px solid rgba(0,255,120,0.5)}
  .day-modal-evt.navire-smr{background:linear-gradient(90deg,rgba(0,130,255,0.18),rgba(0,110,220,0.14));border:1px solid rgba(0,160,255,0.5)}
  .day-modal-evt.autre{background:linear-gradient(90deg,rgba(255,220,0,0.18),rgba(200,180,0,0.14));border:1px solid rgba(255,210,0,0.5)}
  .day-modal-evt-name{font-weight:700;font-size:0.88rem}
  .day-modal-evt-time{font-size:0.75rem;color:#94a3b8}
  .day-modal-evt-place{font-size:0.75rem;color:#64748b}
  #day-modal-close{width:40px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 14px;cursor:pointer}
  #event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
  .modal-card{background:rgba(15,23,42,0.97);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);padding:18px;border-radius:16px;max-width:720px;width:94%;box-shadow:0 20px 40px rgba(0,0,0,0.6);max-height:85vh;overflow-y:auto}
  .modal-card h3{margin-bottom:6px}
  .modal-item{margin-bottom:10px}
  .modal-item p{color:#dbe7ea;margin-top:6px}

  @media(min-width:720px){
    #calendar-wrap{display:flex !important}
    #mobile-wrap{display:none !important}
    #calendar-title{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 420px)}
    #mob-today-standalone{display:none}
  }
  @media(max-width:719px){
    #calendar-wrap{display:none !important}
    #mobile-wrap{display:flex !important}
    #today-group{display:none}
    #header-right{display:none}
    #calendar-header{position:static}
    .header-left{flex-shrink:0}
    .back-btn{display:flex !important}
    #calendar-title{position:static;transform:none;max-width:none;flex:1;font-size:0.95rem;text-align:center;pointer-events:none}
    #mob-today-standalone{display:flex;align-items:center;font-size:12px;padding:4px 10px;background:rgba(255,255,255,0.08);border-radius:6px;border:1px solid rgba(255,255,255,0.15);color:#fff;cursor:pointer;flex-shrink:0;white-space:nowrap}
    #mob-today-standalone:hover{background:rgba(255,255,255,0.15)}
  }
  @media(max-width:400px){.nav-btn{font-size:20px;padding:2px 5px}}
  /* ── PDF EXPORT ── */
  #pdf-fab{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(30,41,59,0.92);border:1px solid rgba(255,255,255,0.18);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:900;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:background .15s,color .15s,transform .15s;-webkit-tap-highlight-color:transparent}
  #pdf-fab:hover{background:rgba(51,65,85,0.98);color:#fff;transform:scale(1.08)}
  #pdf-panel{position:fixed;bottom:72px;right:20px;width:260px;background:rgba(15,23,42,0.97);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:16px;z-index:901;box-shadow:0 8px 32px rgba(0,0,0,0.6);display:none;flex-direction:column;gap:10px;backdrop-filter:blur(12px)}
  #pdf-panel.open{display:flex}
  .pdf-panel-title{font-size:0.82rem;font-weight:700;color:#e2e8f0;margin-bottom:2px}
  .pdf-preset-row{display:flex;gap:6px;flex-wrap:wrap}
  .pdf-preset{font-size:0.72rem;padding:4px 10px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#cbd5e1;cursor:pointer;transition:background .12s}
  .pdf-preset:hover,.pdf-preset.active{background:rgba(0,229,255,0.15);border-color:rgba(0,229,255,0.4);color:#fff}
  .pdf-range-row{display:flex;gap:6px;align-items:center}
  .pdf-range-row label{font-size:0.7rem;color:#64748b;white-space:nowrap}
  .pdf-date-input{flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#e2e8f0;font-size:0.72rem;padding:4px 6px;outline:none}
  .pdf-date-input:focus{border-color:rgba(0,229,255,0.5)}
  .pdf-generate-btn{padding:8px;background:linear-gradient(90deg,rgba(0,130,255,0.35),rgba(0,100,220,0.3));border:1px solid rgba(0,160,255,0.5);border-radius:8px;color:#fff;font-size:0.78rem;font-weight:600;cursor:pointer;text-align:center;transition:background .12s}
  .pdf-generate-btn:hover{background:linear-gradient(90deg,rgba(0,150,255,0.5),rgba(0,120,240,0.45))}
  .pdf-generate-btn:disabled{opacity:0.5;cursor:not-allowed}
  .pdf-status{font-size:0.7rem;color:#64748b;text-align:center;min-height:14px}
  @media(max-width:719px){#pdf-fab,#pdf-panel{display:none !important}}

</style>
</head>
<body>
<div id="calendar-header">
  <div class="header-left">
    <button class="back-btn" id="back-btn" title="Accueil">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>
  <div id="today-group">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span class="nav-btn" id="today-btn" style="font-size:13px;padding:4px 10px;">Aujourd'hui</span>
    <span class="nav-btn" id="next-btn">›</span>
  </div>
  <span id="calendar-title">Chargement…</span>
  <button id="mob-today-standalone">Aujourd'hui</button>
  <div id="header-right">
    <div id="week-group">
      <span class="view-btn" id="view-3w">3 semaines</span>
      <span class="view-btn" id="view-4w">4 semaines</span>
    </div>
    <div id="current-time"></div>
  </div>
</div>
<div id="calendar-wrap">
  <div id="calendar" role="grid" aria-label="Calendrier"></div>
  <div id="events-layer" aria-hidden="false"></div>
</div>
<div id="mobile-wrap"></div>
<div id="day-modal">
  <div id="day-modal-backdrop"></div>
  <div id="day-modal-card">
    <div id="day-modal-close"></div>
    <div id="day-modal-title"></div>
    <div id="day-modal-events"></div>
  </div>
</div>
<div id="event-modal">
  <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<!-- PDF EXPORT -->
<button id="pdf-fab" title="Exporter PDF">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
</button>
<div id="pdf-panel">
  <div class="pdf-panel-title">📄 Exporter en PDF</div>
  <div>
    <div style="font-size:0.7rem;color:#64748b;margin-bottom:5px">Plage rapide</div>
    <div class="pdf-preset-row">
      <span class="pdf-preset" data-preset="thisweek">Cette sem.</span>
      <span class="pdf-preset" data-preset="next3w">+3 sem.</span>
      <span class="pdf-preset active" data-preset="thismonth">Ce mois</span>
      <span class="pdf-preset" data-preset="custom">Perso…</span>
    </div>
  </div>
  <div id="pdf-custom-range" style="display:none;flex-direction:column;gap:6px">
    <div class="pdf-range-row">
      <label for="pdf-date-from">Du</label>
      <input type="date" id="pdf-date-from" class="pdf-date-input">
    </div>
    <div class="pdf-range-row">
      <label for="pdf-date-to">Au</label>
      <input type="date" id="pdf-date-to" class="pdf-date-input">
    </div>
  </div>
  <button class="pdf-generate-btn" id="pdf-generate-btn">Générer le PDF</button>
  <div class="pdf-status" id="pdf-status"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  const NAVIRES_API     = 'https://calendar.docker.inno-web.fr/api/projectAssignments';
  const NAVIRES_API_NEW = 'https://shgt-proxy.receptionroulier.workers.dev';
  const CACHE_KEY = 'calr_v1_cache';
  const CACHE_TTL = 30000;
  const INDEX_URL = 'index.html';
  const SHOW_TYPES = ['reception', 'navire-smr', 'navire-manucar', 'autre'];

  let weekView = 3, currentStartDate = new Date(), resizeTimeout, autoRefreshTimer;
  const holidaySet = new Set(); // dates ISO fériées ex: '2026-04-06'

  // Charge les jours fériés français depuis l'API officielle (une fois au démarrage)
  async function loadFrenchHolidays() {
    try {
      const year = new Date().getFullYear();
      const [r1, r2] = await Promise.all([
        fetch(`https://calendrier.api.gouv.fr/jours-feries/metropole/${year}.json`),
        fetch(`https://calendrier.api.gouv.fr/jours-feries/metropole/${year+1}.json`),
      ]);
      const [d1, d2] = await Promise.all([r1.json(), r2.json()]);
      Object.keys(d1).forEach(k => holidaySet.add(k));
      Object.keys(d2).forEach(k => holidaySet.add(k));
    } catch(e) { console.warn('Jours fériés non chargés:', e.message); }
  }

  const $  = id => document.getElementById(id);
  const mk = (tag, cls) => { const e=document.createElement(tag); if(cls) e.className=cls; return e; };
  function getMonday(d){ const r=new Date(d), day=r.getDay(); r.setDate(r.getDate()+(day===0?-6:1-day)); r.setHours(0,0,0,0); return r; }
  function fmtTime(d){ return d ? new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''; }
  function fmtDayLabel(d){ return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'}); }
  function fmtFullDate(d){ return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }
  function capitalize(s){ return s ? s[0].toUpperCase()+s.slice(1) : s; }
  function parseDateLocal(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,0,0,0,0); }
  const PLACE_MAP = { 'Quai RORO à Bougainville': 'BGV', 'RORO à Bougainville': 'BGV' };
  function fmtPlace(place){ const raw=(place||'').trim(); return (PLACE_MAP[raw] ?? raw.replace(/quai\s*/i,'').trim()); }
  function isMobile(){ return window.innerWidth < 720; }
  function fmtDateISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

  $('back-btn').addEventListener('click', function() {
    try { window.top.location.href = INDEX_URL; } catch(e) { window.location.href = INDEX_URL; }
  });
  $('mob-today-standalone').addEventListener('click', () => scrollToToday(true));

  /* ── PARSE POSTE ex: "0714" → hDebut=7, hFin=14 ── */
  function parsePoste(poste) {
    if (!poste || poste.length < 3) return { hDebut: 0, hFin: 23 };
    const s = poste.padStart(4, '0');
    const hDebut = parseInt(s.slice(0, 2), 10);
    const hFin   = parseInt(s.slice(2, 4), 10);
    return { hDebut: isNaN(hDebut) ? 0 : hDebut, hFin: isNaN(hFin) ? 23 : hFin };
  }

  /* ── FETCH NAVIRES — Worker proxy (nouvelle API) + fallback ancienne ── */
  async function fetchNaviresAPI(timeMin, timeMax) {
    try {
      const items = await fetchNaviresNew(timeMin, timeMax);
      if (items !== null) return items;
    } catch(e) { console.warn('Worker SHGT indisponible, fallback:', e.message); }
    return fetchNaviresOld(timeMin, timeMax);
  }

  async function fetchNaviresNew(timeMin, timeMax) {
    const raw = [];
    // Un seul appel au Worker — c'est lui qui fait les appels par semaine vers SHGT
    const r = await fetch(NAVIRES_API_NEW, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        dateFrom: fmtDateISO(timeMin),
        dateTo:   fmtDateISO(timeMax),
        sectorId: 0, SectorProjectNumberType: 0, searchValue: '', onlyUserData: false, withRefused: false
      }),
    });
    if (!r.ok) throw new Error('Worker HTTP ' + r.status);
    const allDays = await r.json();

    const seen = new Set();
    const days = allDays.filter(d=>{ if(seen.has(d.date)) return false; seen.add(d.date); return true; });
    days.sort((a,b)=>a.date.localeCompare(b.date));

    for (const day of days) {
      if (!day.postes?.length) continue;
      for (const pg of day.postes) {
        const [hDebut] = pg.poste.startTime.split(':').map(Number);
        const [hFin]   = pg.poste.endTime.split(':').map(Number);
        for (const pa of pg.projectAssignments) {
          const projectName = pa.project?.name || '';
          // Exclure tous les Parcs (sectorId 25)
          if (pa.sectorId === 25) continue;
          const [y,m,d] = pa.date.split('-').map(Number);
          const _start = new Date(y,m-1,d,hDebut,0,0,0);
          const _end   = new Date(y,m-1,d,hFin,0,0,0);
          if (_end <= _start) _end.setHours(23,59,0,0);
          // Nom : extraInfo = vrai nom du navire, sinon nom projet
          const _name  = pa.project?.extraInfo || pa.project?.name || '';
          const _place = pa.project?.place?.name || '';
          // Type selon nom projet
          let _type = 'autre';
          if (projectName === 'Navire SMR')     _type = 'navire-smr';
          if (projectName === 'Navire Manucar') _type = 'navire-manucar';
          raw.push({ _start, _end, _name, _place, _hDebut: hDebut, _hFin: hFin, _volumes: pa.volumes||[], _comments: pa.comments||pa.customerComments||'', _type, id: String(pa.id) });
        }
      }
    }
    return buildFusedEvents(raw);
  }

  async function fetchNaviresOld(timeMin, timeMax) {
    const startDate = fmtDateISO(timeMin), endDate = fmtDateISO(timeMax);
    try {
      const r = await fetch(`${NAVIRES_API}?startDate=${startDate}&endDate=${endDate}`);
      if (!r.ok) return [];
      const data = await r.json();
      for (const day of data) { if (day.isHoliday) holidaySet.add(day.date); }
      const raw = [];
      for (const day of data) {
        if (!day.projectAssignments?.length) continue;
        for (const pa of day.projectAssignments) {
          const { hDebut, hFin } = parsePoste(pa.poste);
          const [y,m,d] = pa.date.split('-').map(Number);
          const _start = new Date(y,m-1,d,hDebut,0,0,0);
          const _end   = new Date(y,m-1,d,hFin,0,0,0);
          if (_end <= _start) _end.setHours(23,59,0,0);
          raw.push({ _start, _end, _name: pa.name, _place: pa.place||'', _hDebut: hDebut, _hFin: hFin, _volumes: [], id: String(pa.id) });
        }
      }
      return buildFusedEvents(raw);
    } catch(e) { console.error('fetchNaviresOld:', e); return []; }
  }

  function buildFusedEvents(raw) {
    raw.sort((a, b) => a._start - b._start);
    // Fusion des postes consécutifs par clé nom+lieu en O(n log n) au lieu de O(n²)
    const map = new Map();
    for (const ev of raw) {
      const key = `${ev._name}||${ev._place}`;
      const cur = map.get(key);
      if (cur && cur._end.getTime() === ev._start.getTime()) {
        cur._end = new Date(ev._end);
        cur._hFin = ev._hFin;
      } else {
        map.set(key, { ...ev });
      }
    }
    return [...map.values()].map(ev => {
      const lieu = fmtPlace(ev._place);
      const summary = `${ev._name}${lieu ? ' — ' + lieu : ''}`;
      const _endInclusive = new Date(ev._end);
      if (ev._end.getHours() === 0 && ev._end.getMinutes() === 0) _endInclusive.setSeconds(-1);
      return { id: ev.id, summary, __type: ev._type||'navire-smr', _isAllDay: false, _start: ev._start, _end: ev._end, _endInclusive, _place: ev._place, _hDebut: ev._hDebut, _hFin: ev._hFin, _hFinDisplay: ev._hFin, _volumes: ev._volumes||[], _comments: ev._comments||'' };
    });
  }

  async function fetchReception(timeMin, timeMax) {
    const p = `?key=${encodeURIComponent(API_KEY)}&singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}`;
    try {
      const r = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CAL_RECEPTION)}/events${p}`);
      const d = r.ok ? await r.json() : { items: [] };
      return (d.items || []).map(i => ({ ...i, __type: 'reception' }));
    } catch(e) { return []; }
  }

  function normalizeGCal(items) {
    return items.map(ev => {
      const allDay = !!(ev.start?.date && !ev.start?.dateTime);
      let _start, _end, _endInclusive;
      if (allDay) {
        _start = parseDateLocal(ev.start.date);
        _end   = parseDateLocal(ev.end.date);
        _endInclusive = new Date(_end); _endInclusive.setDate(_endInclusive.getDate()-1); _endInclusive.setHours(23,59,59,999);
      } else {
        _start = new Date(ev.start.dateTime); _end = new Date(ev.end.dateTime); _endInclusive = new Date(_end);
      }
      return { ...ev, __type: ev.__type||'', _isAllDay: allDay, _start, _end, _endInclusive };
    }).filter(e => e._start && e._endInclusive);
  }

  async function fetchAll(timeMin, timeMax) {
    const [gcalItems, naviresItems] = await Promise.all([
      fetchReception(timeMin, timeMax),
      fetchNaviresAPI(timeMin, timeMax),
    ]);
    return [...normalizeGCal(gcalItems), ...naviresItems];
  }

  function calculateHash(evs) {
    return JSON.stringify(evs.map(e => ({ id: e.id, summary: e.summary, s: e._start?.getTime(), e: e._end?.getTime() })));
  }
  function loadCache(){ try{ const o=JSON.parse(localStorage.getItem(CACHE_KEY)); if(o&&Date.now()-o.ts<=CACHE_TTL){ if(o.holidays) o.holidays.forEach(h=>holidaySet.add(h)); return o; } return null; }catch{ return null; } }
  function saveCache(items, hash){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ items, hash, ts: Date.now(), holidays: [...holidaySet] })); }catch{} }

  async function getItems(timeMin, timeMax, override) {
    if (override) return override;
    const cache = loadCache();
    let items;
    if (cache) {
      const fetched = await fetchAll(timeMin, timeMax).catch(() => []);
      const h = calculateHash(fetched);
      if (h !== cache.hash) { items = fetched; saveCache(items, h); } else items = cache.items;
    } else {
      items = await fetchAll(timeMin, timeMax);
      saveCache(items, calculateHash(items));
    }
    return items
      .map(ev => ({
        ...ev,
        _start: new Date(ev._start),
        _end: new Date(ev._end),
        _endInclusive: new Date(ev._endInclusive),
      }))
      .filter(ev => SHOW_TYPES.includes(ev.__type));
  }

  const isNavire = t => t === 'navire-smr' || t === 'navire-manucar' || t === 'autre';

  function updateClock(){ const n=new Date(); $('current-time').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`; }
  setInterval(updateClock, 1000); updateClock();

  function evtDateHtml(ev) {
    if (isNavire(ev.__type)) {
      const hD = String(ev._hDebut ?? new Date(ev._start).getHours()).padStart(2,'0');
      const hF = String(ev._hFinDisplay ?? ev._hFin ?? new Date(ev._end).getHours()).padStart(2,'0');
      const dateDebut = fmtFullDate(ev._start);
      const dateFin   = fmtFullDate(ev._end);
      const multiDay  = new Date(ev._start).toDateString() !== new Date(ev._end).toDateString();
      if (multiDay) {
        return `<p>Du ${dateDebut} ${hD}:00<br>Au ${dateFin} ${hF}:00</p>`;
      }
      return `<p>Le ${dateDebut}<br>${hD}:00 → ${hF}:00</p>`;
    }
    const { _start:s, _end:e, _isAllDay:all } = ev;
    const multi = !all && new Date(s).toDateString() !== new Date(e).toDateString();
    if (multi) return `<p>Du ${fmtFullDate(s)} à ${fmtTime(s)}<br>Au ${fmtFullDate(e)} à ${fmtTime(e)}</p>`;
    return all ? `<p>Le ${fmtFullDate(s)}</p>` : `<p>Le ${fmtFullDate(s)} à ${fmtTime(s)}</p>`;
  }
  function fmtVolumes(volumes) {
    if (!volumes?.length) return '';
    return volumes.map(v => {
      const parts = [];
      if (v.vlCount)         parts.push(`${v.vlCount} VL`);
      if (v.vanCount)        parts.push(`${v.vanCount} Van`);
      if (v.vlStrappingCount && v.vlStrappingCount !== v.vlCount) parts.push(`${v.vlStrappingCount} str.`);
      if (v.hhCount)         parts.push(`${v.hhCount} HH`);
      if (v.staticCount)     parts.push(`${v.staticCount} stat.`);
      if (v.weight)          parts.push(`${v.weight} t`);
      const qty = parts.join(' · ');
      const comment = v.comment ? ` — ${v.comment}` : '';
      return `<div style="font-size:0.82rem;color:#cbd5e1;margin-top:3px">${qty}${comment}</div>`;
    }).join('');
  }
  function evtHtml(ev) {
    const lieu = ev._place ? `<p>📍 ${ev._place}</p>` : '';
    const volumes = ev._volumes?.length ? `<div style="margin-top:6px"><span style="font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:0.05em">Volumes</span>${fmtVolumes(ev._volumes)}</div>` : '';
    const commentsRaw = (!ev._volumes?.length && ev.__type === 'autre' && ev._comments) ? ev._comments.replace(/<[^>]*>/g,'').trim() : '';
    const comments = commentsRaw ? `<p style="font-size:0.82rem;color:#cbd5e1;margin-top:4px">${commentsRaw}</p>` : '';
    return `<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3>${evtDateHtml(ev)}${lieu}${volumes}${comments}${ev.description?'<p>'+ev.description+'</p>':''}</div>`;
  }
  $('event-modal').addEventListener('click', () => $('event-modal').style.display='none');
  function showEventModal(ev){ $('modal-content').innerHTML=evtHtml(ev); $('event-modal').style.display='flex'; }

  const closeDayModal = () => $('day-modal').classList.remove('show');
  $('day-modal-backdrop').addEventListener('click', closeDayModal);
  $('day-modal-close').addEventListener('click', closeDayModal);
  function showModalForCell(c){
    $('modal-content').innerHTML=c.eventsList.map(evtHtml).join('<hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:8px 0">')||'<p>Aucun évènement</p>';
    $('event-modal').style.display='flex';
  }

  function evtTwoLines(ev, day) {
    if (ev._isAllDay) {
      return { name: ev.summary || '(sans titre)', time: null };
    }

    if (isNavire(ev.__type)) {
      const nom = ev.summary?.split('—')[0].trim() || '';
      const quai = fmtPlace(ev._place) ? ` — ${fmtPlace(ev._place)}` : '';
      const evStartDay = new Date(ev._start); evStartDay.setHours(0,0,0,0);
      const evEndDay   = new Date(ev._endInclusive); evEndDay.setHours(0,0,0,0);
      const isMultiDay = evStartDay.getTime() !== evEndDay.getTime();

      if (!isMultiDay) {
        const hD = String(ev._hDebut ?? ev._start.getHours()).padStart(2,'0');
        const hF = String(ev._hFinDisplay ?? ev._hFin ?? ev._end.getHours()).padStart(2,'0');
        return { name: nom, time: `${hD}:00 → ${hF}:00${quai}` };
      }

      const dayTime = day.getTime();
      if (dayTime === evStartDay.getTime()) {
        const hD = String(ev._hDebut ?? ev._start.getHours()).padStart(2,'0');
        return { name: nom, time: `${hD}:00 →${quai}` };
      } else if (dayTime === evEndDay.getTime()) {
        const hF = String(ev._hFinDisplay ?? ev._hFin ?? ev._end.getHours()).padStart(2,'0');
        return { name: nom, time: `→ ${hF}:00${quai}` };
      } else {
        return { name: nom, time: `···${quai}` };
      }
    }

    const nom = ev.summary || '(sans titre)';
    const evStartDay = new Date(ev._start); evStartDay.setHours(0,0,0,0);
    const evEndDay   = new Date(ev._endInclusive); evEndDay.setHours(0,0,0,0);
    const isMultiDay = evStartDay.getTime() !== evEndDay.getTime();

    if (!isMultiDay) {
      return { name: nom, time: `${fmtTime(ev._start)} → ${fmtTime(ev._end)}` };
    }

    const dayTime = day.getTime();
    if (dayTime === evStartDay.getTime()) {
      return { name: nom, time: `${fmtTime(ev._start)} →` };
    } else if (dayTime === evEndDay.getTime()) {
      return { name: nom, time: `→ ${fmtTime(ev._end)}` };
    } else {
      return { name: nom, time: '···' };
    }
  }

  function buildEvtBand(ev, day) {
    const row = mk('div', 'mob-evt ' + (ev.__type || ''));
    const { name, time } = evtTwoLines(ev, day);

    const nameEl = mk('div', 'mob-evt-name');
    nameEl.textContent = name;
    row.appendChild(nameEl);

    if (time !== null) {
      const timeEl = mk('div', 'mob-evt-time');
      timeEl.textContent = time;
      row.appendChild(timeEl);
    }

    row.addEventListener('click', e => { e.stopPropagation(); showEventModal(ev); });
    return row;
  }

  function showDayModal(day, evts){
    const title=$('day-modal-title');
    const evtsEl=$('day-modal-events');
    title.textContent=capitalize(day.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}));
    evtsEl.innerHTML='';
    if(!evts.length){
      evtsEl.innerHTML='<div style="color:#475569;font-style:italic;font-size:0.85rem">Aucun événement</div>';
    } else {
      evts.forEach(ev=>{
        const d=mk('div','day-modal-evt '+(ev.__type||''));
        const name=mk('div','day-modal-evt-name'); name.textContent=ev.summary?.split('—')[0].trim()||'(sans titre)';
        const time=mk('div','day-modal-evt-time');
        if(isNavire(ev.__type)){
          const hD=String(ev._hDebut??new Date(ev._start).getHours()).padStart(2,'0');
          const hF=String(ev._hFinDisplay??ev._hFin??new Date(ev._end).getHours()).padStart(2,'0');
          time.textContent=`${hD}:00 → ${hF}:00`;
        } else if(ev._isAllDay){
          time.textContent='Journée entière';
        } else {
          time.textContent=`${fmtTime(ev._start)} → ${fmtTime(ev._end)}`;
        }
        d.append(name,time);
        if(ev._place){ const pl=mk('div','day-modal-evt-place'); pl.textContent='📍 '+ev._place; d.appendChild(pl); }
        d.addEventListener('click',e=>{ e.stopPropagation(); showEventModal(ev); });
        evtsEl.appendChild(d);
      });
    }
    $('day-modal').classList.add('show');
  }

  let mobNorm=[], mobWeekStart=null, swipeStartX=0, swipeStartY=0, isSwiping=false;

  function getMobWeekMonday(d){
    const r=new Date(d), day=r.getDay();
    r.setDate(r.getDate()+(day===0?-6:1-day));
    r.setHours(0,0,0,0); return r;
  }

  function mobEventsOnDay(day){
    return mobNorm.filter(ev=>{
      const s=new Date(ev._start); s.setHours(0,0,0,0);
      const e=new Date(ev._endInclusive); e.setHours(0,0,0,0);
      return day>=s && day<=e;
    }).sort((a,b)=>new Date(a._start)-new Date(b._start));
  }

  function buildMobDayCell(day, today){
    const isPast=day<today, isToday=day.getTime()===today.getTime();
    const evts=mobEventsOnDay(day);
    const cell=mk('div','mob-day');
    if(isToday) cell.classList.add('mob-today');
    else cell.classList.add(isPast?'mob-past':'mob-future');
    const isHoliday=holidaySet.has(fmtDateISO(day));
    if(isHoliday) cell.classList.add('mob-holiday');

    const hdr=mk('div','mob-day-header');
    const dot=mk('div','mob-day-dot');
    const dateDiv=mk('div','mob-day-date');
    dateDiv.textContent=capitalize(day.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'}));
    const moreTag=mk('span','mob-more-tag'); moreTag.textContent='+'; moreTag.style.display='none';
    if(isHoliday){ const hl=mk('span','mob-holiday-label'); hl.textContent='Férié'; hdr.append(dot,dateDiv,hl,moreTag); }
    else hdr.append(dot,dateDiv,moreTag);
    hdr.addEventListener('click',e=>{ e.stopPropagation(); showDayModal(day,evts); });
    cell.appendChild(hdr);

    if(!evts.length){
      const e=mk('div','mob-empty'); e.textContent='—'; cell.appendChild(e);
    } else {
      const evWrap=mk('div','mob-events');
      evts.forEach(ev => evWrap.appendChild(buildEvtBand(ev, day)));
      cell.appendChild(evWrap);
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          if(evWrap.scrollHeight > evWrap.clientHeight + 2) moreTag.style.display='';
        });
      });
    }
    return cell;
  }

  function updateMobTitle(){
    const monday=new Date(mobWeekStart);
    const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
    const tmp=new Date(monday); tmp.setHours(0,0,0,0);
    tmp.setDate(tmp.getDate()+3-(tmp.getDay()+6)%7);
    const jan4=new Date(tmp.getFullYear(),0,4);
    const weekNum=1+Math.round(((tmp-jan4)/86400000-3+(jan4.getDay()+6)%7)/7);
    const fmtD = d => d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
    $('calendar-title').textContent=`Sem. ${weekNum} · ${fmtD(monday)} au ${fmtD(sunday)}`;
  }

  async function fetchMobRange(from, to){
    const tMin=new Date(from); tMin.setHours(0,0,0,0);
    const tMax=new Date(to); tMax.setHours(23,59,59,999);
    const items=await fetchAll(tMin,tMax);
    return items.filter(ev=>SHOW_TYPES.includes(ev.__type));
  }

  async function renderWeekGrid(animate){
    const wrap=$('mobile-wrap');
    const today=new Date(); today.setHours(0,0,0,0);
    const monday=new Date(mobWeekStart);

    const weekEnd=new Date(monday); weekEnd.setDate(monday.getDate()+7);
    mobNorm=await fetchMobRange(monday,weekEnd);
    updateMobTitle();

    const days=[];
    for(let i=0;i<8;i++){
      const d=new Date(monday); d.setDate(monday.getDate()+i); d.setHours(0,0,0,0);
      days.push(d);
    }

    const grid=mk('div','week-grid');
    if(animate==='left'){ grid.style.transform='translateX(100%)'; grid.style.opacity='0'; }
    if(animate==='right'){ grid.style.transform='translateX(-100%)'; grid.style.opacity='0'; }

    const colL=mk('div','week-col'), colR=mk('div','week-col');
    days.slice(0,4).forEach(d=>colL.appendChild(buildMobDayCell(d,today)));
    days.slice(4,8).forEach(d=>colR.appendChild(buildMobDayCell(d,today)));
    grid.append(colL,colR);

    const old=wrap.querySelector('.week-grid');
    if(old) old.remove();
    wrap.appendChild(grid);

    if(animate){
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          grid.style.transition='transform 0.28s ease, opacity 0.28s ease';
          grid.style.transform='translateX(0)';
          grid.style.opacity='1';
        });
      });
    }
  }

  async function renderMobile(){
    const wrap=$('mobile-wrap');
    wrap.innerHTML='<div style="text-align:center;padding:40px;opacity:0.5;font-size:0.9rem">Chargement…</div>';
    const today=new Date(); today.setHours(0,0,0,0);
    mobWeekStart=getMobWeekMonday(today);
    wrap.innerHTML='';
    await renderWeekGrid(null);

    const dmCard=$('day-modal-card');
    let dmStartY=0, dmDy=0;
    dmCard.addEventListener('touchstart', e=>{
      dmStartY=e.touches[0].clientY; dmDy=0;
    },{passive:true});
    dmCard.addEventListener('touchmove', e=>{
      if(!$('day-modal').classList.contains('show')) return;
      if(dmCard.scrollTop > 0) return;
      dmDy=e.touches[0].clientY - dmStartY;
      if(dmDy > 0) dmCard.style.transform=`translateY(${dmDy}px)`;
    },{passive:true});
    dmCard.addEventListener('touchend', ()=>{
      dmCard.style.transition='transform 0.2s ease';
      dmCard.style.transform='';
      setTimeout(()=>dmCard.style.transition='', 200);
      if(dmDy > 80) closeDayModal();
      dmDy=0;
    },{passive:true});

    const hdr=$('calendar-header');
    let ptrStartY=0, ptrActive=false;
    hdr.addEventListener('touchstart',e=>{
      ptrStartY=e.touches[0].clientY; ptrActive=true;
    },{passive:true});
    hdr.addEventListener('touchmove',e=>{
      if(!ptrActive) return;
      const dy=e.touches[0].clientY-ptrStartY;
      if(dy>60){ ptrActive=false; location.reload(); }
    },{passive:false});
    hdr.addEventListener('touchend',()=>{ ptrActive=false; },{passive:true});

    let swipeLocked=false;
    wrap.addEventListener('touchstart',e=>{
      swipeStartX=e.touches[0].clientX;
      swipeStartY=e.touches[0].clientY;
      isSwiping=false; swipeLocked=false;
    },{passive:true});
    wrap.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-swipeStartX;
      const dy=e.touches[0].clientY-swipeStartY;
      if(!isSwiping && !swipeLocked){
        if(Math.abs(dy)>Math.abs(dx) && Math.abs(dy)>6){ swipeLocked=true; return; }
        if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>10){ isSwiping=true; }
      }
      if(isSwiping) e.preventDefault();
    },{passive:false});
    wrap.addEventListener('touchend',e=>{
      if(!isSwiping){ isSwiping=false; swipeLocked=false; return; }
      const dx=e.changedTouches[0].clientX-swipeStartX;
      isSwiping=false; swipeLocked=false;
      if(Math.abs(dx)<40) return;
      if(dx<0){
        mobWeekStart=new Date(mobWeekStart); mobWeekStart.setDate(mobWeekStart.getDate()+7);
        renderWeekGrid('left');
      } else {
        mobWeekStart=new Date(mobWeekStart); mobWeekStart.setDate(mobWeekStart.getDate()-7);
        renderWeekGrid('right');
      }
    },{passive:true});
  }

  async function renderCalendar(override){
    const calEl=$('calendar'), evLayer=$('events-layer');
    calEl.innerHTML=''; evLayer.innerHTML='';
    const today=new Date(); today.setHours(0,0,0,0);
    const startDate=new Date(getMonday(currentStartDate)); startDate.setDate(startDate.getDate()-7);
    const totalDays=weekView*7;
    const rowH=Math.floor((Math.max(240,window.innerHeight-$('calendar-header').getBoundingClientRect().height-32)-20)/weekView);
    calEl.style.gridAutoRows=`${rowH}px`;

    const cellMap=[], months=new Set();
    for(let i=0;i<totalDays;i++){
      const d=new Date(startDate); d.setDate(d.getDate()+i); d.setHours(0,0,0,0);
      const cell=mk('div','day-cell');
      if(d>today) cell.classList.add('future-day');
      if(d.getTime()===today.getTime()) cell.classList.add('today');
      const lbl=mk('div','date-label'); lbl.textContent=fmtDayLabel(d);
      cell.appendChild(lbl); calEl.appendChild(cell);
      cellMap.push({date:d,el:cell,eventsList:[]});
      months.add(capitalize(d.toLocaleString('fr-FR',{month:'long'})));
    }

    await new Promise(resolve=>{
      const check=()=>[...calEl.querySelectorAll('.day-cell')].every(c=>{ const r=c.getBoundingClientRect(); return r.width>0&&r.height>0; })?resolve():requestAnimationFrame(check);
      check();
    });

    const calRect=calEl.getBoundingClientRect();
    const cellRects=cellMap.map(c=>c.el.getBoundingClientRect());
    const timeMin=new Date(startDate); timeMin.setHours(0,0,0,0);
    const timeMax=new Date(timeMin); timeMax.setDate(timeMax.getDate()+totalDays);
    const norm=await getItems(timeMin,timeMax,override);
    $('calendar-title').textContent=Array.from(months).join(' / ');

    const segments=[];
    norm.forEach(ev=>{
      const sDay=new Date(new Date(ev._start).getFullYear(),new Date(ev._start).getMonth(),new Date(ev._start).getDate());
      const eDay=new Date(new Date(ev._endInclusive).getFullYear(),new Date(ev._endInclusive).getMonth(),new Date(ev._endInclusive).getDate());
      let cursor=new Date(sDay), safety=0;
      while(cursor<=eDay){
        if(++safety>1000) break;
        const wi=Math.floor(Math.round((cursor-startDate)/86400000)/7);
        if(wi<0){ cursor.setDate(cursor.getDate()+1); continue; }
        if(wi>=weekView) break;
        const ws=wi*7, we=Math.min(ws+6,cellMap.length-1);
        let si=-1; for(let i=ws;i<=we;i++){ if(cellMap[i].date.getTime()>=cursor.getTime()){ si=i; break; } }
        let ei=-1; for(let i=we;i>=ws;i--){ if(cellMap[i].date.getTime()<=eDay.getTime()){ ei=i; break; } }
        if(si<0||ei<0){ cursor.setDate(cursor.getDate()+1); continue; }
        segments.push({ev,startIdx:si,endIdx:ei,weekIdx:wi,lane:0});
        cursor=new Date(cellMap[ei].date); cursor.setDate(cursor.getDate()+1);
      }
    });

    const weekLanes=Array.from({length:weekView},()=>[]);
    segments.forEach(seg=>{
      const lanes=weekLanes[seg.weekIdx]; let lane=0;
      while((lanes[lane]||[]).some(r=>!(seg.endIdx<r.startIdx||seg.startIdx>r.endIdx))) lane++;
      if(!lanes[lane]) lanes[lane]=[];
      lanes[lane].push({startIdx:seg.startIdx,endIdx:seg.endIdx}); seg.lane=lane;
    });

    segments.forEach(seg=>{ for(let i=seg.startIdx;i<=seg.endIdx;i++){ const c=cellMap[i]; if(!c.eventsList.includes(seg.ev)) c.eventsList.push(seg.ev); } });

    const dlH=(calEl.querySelector('.date-label')?.getBoundingClientRect().height)||18;
    const bandH=22, bandHVol=36, gap=6;
    const bs=bandHVol+gap;
    const weekTopBase=cellMap.filter((_,i)=>i%7===0).map(c=>c.el.getBoundingClientRect().top-calRect.top);
    const visLanes=Array.from({length:weekView},()=>Math.max(0,Math.floor((rowH-dlH-8+gap)/bs)));

    const firstIdx=ev=>segments.filter(s=>s.ev===ev).reduce((a,b)=>a.startIdx<b.startIdx?a:b).startIdx;
    const lastIdx =ev=>segments.filter(s=>s.ev===ev).reduce((a,b)=>a.endIdx>b.endIdx?a:b).endIdx;

    cellMap.forEach(c=>{ if(c.date<today) c.el.appendChild(mk('div','past-day-overlay')); });
    cellMap.forEach(c=>{
      if(holidaySet.has(fmtDateISO(c.date)) && !c.el.classList.contains('holiday')){
        c.el.classList.add('holiday');
        const lbl=c.el.querySelector('.date-label');
        const hl=mk('span','holiday-label'); hl.textContent='Férié'; lbl.appendChild(hl);
      }
    });

    segments.forEach(seg=>{
      const r0=cellRects[seg.startIdx], r1=cellRects[seg.endIdx]; if(!r0||!r1) return;
      const ev=seg.ev, isFirst=seg.startIdx===firstIdx(ev), isLast=seg.endIdx===lastIdx(ev);
      let txt='';
      if (isNavire(ev.__type)) {
        const hD  = String(ev._hDebut ?? new Date(ev._start).getHours()).padStart(2,'0');
        const hF  = String(ev._hFinDisplay ?? ev._hFin ?? new Date(ev._end).getHours()).padStart(2,'0');
        const nom = ev.summary?.split('—')[0].trim() || '';
        const lieu = fmtPlace(ev._place);
        txt = `<${hD}:00 ${nom} ${hF}:00>${lieu?' — '+lieu:''}\u00A0\u00A0\u00A0\u00A0\u00A0`;
      } else {
        if(isFirst&&!ev._isAllDay) txt+=`<${fmtTime(ev._start)} `;
        txt+=ev.summary||'(sans titre)';
        if(isLast&&!ev._isAllDay) txt+=` ${fmtTime(ev._end)}>\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0`;
      }
      const hasVol = isNavire(ev.__type) && ev._volumes?.length;
      const volTxt = hasVol ? ev._volumes.map(v => {
        const p=[];
        if(v.vlCount)    p.push(`${v.vlCount}VL`);
        if(v.vanCount)   p.push(`${v.vanCount}Van`);
        if(v.hhCount)    p.push(`${v.hhCount}HH`);
        if(v.comment)    p.push(v.comment);
        return p.join(' · ');
      }).filter(Boolean).join(' | ') : '';

      const subTxt = (hasVol && volTxt) ? volTxt
                   : (isNavire(ev.__type) && ev._comments) ? ev._comments.replace(/<[^>]*>/g,'').trim()
                   : '';
      const thisBandH = subTxt ? bandHVol : bandH;
      const band=mk('div','multi-band '+(ev.__type||''));
      band.style.cssText=`left:${r0.left-calRect.left}px;width:${Math.max(36,(r1.left+r1.width)-r0.left-6)}px;top:${weekTopBase[seg.weekIdx]+dlH+2+seg.lane*bs}px;height:${thisBandH}px;display:${seg.lane<visLanes[seg.weekIdx]?'flex':'none'};flex-direction:column;align-items:flex-start;padding:2px 10px`;
      if (new Date(ev._endInclusive) < today) band.classList.add('past-event');

      const tc=mk('div','event-text-container'), te=mk('div','event-text');
      te.textContent=txt; te.setAttribute('data-text',txt); tc.appendChild(te);
      tc.style.cssText='width:100%;flex-shrink:0';
      band.appendChild(tc);

      if(subTxt){
        const vl=mk('div','event-vol-line');
        vl.textContent=subTxt;
        vl.style.cssText='font-size:0.62rem;opacity:0.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;line-height:1.2';
        band.appendChild(vl);
      }

      band.addEventListener('click',e=>{ e.stopPropagation(); showEventModal(ev); });
      evLayer.appendChild(band);
    });

    cellMap.forEach((c,i)=>{
      const wi=Math.floor(i/7);
      const hidden=segments.filter(s=>s.startIdx<=i&&s.endIdx>=i&&s.weekIdx===wi&&s.lane>=visLanes[wi]).length;
      if(hidden>0){
        const b=mk('div','more-events'); b.textContent=`+${hidden} autres`;
        b.addEventListener('click',e=>{ e.stopPropagation(); showModalForCell(c); });
        c.el.appendChild(b);
      }
    });

    setTimeout(updateScrollingEvents,100);
  }

  /* ── PDF EXPORT ── */
  (function(){
    function loadJsPDF(cb){
      if(window.jspdf){ cb(); return; }
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload=cb; document.head.appendChild(s);
    }

    const fab=$('pdf-fab'), panel=$('pdf-panel');
    const statusEl=$('pdf-status'), genBtn=$('pdf-generate-btn');
    const customRange=$('pdf-custom-range');
    let activePreset='thismonth';

    fab.addEventListener('click',e=>{ e.stopPropagation(); panel.classList.toggle('open'); initDates(); });
    document.addEventListener('click',e=>{ if(!panel.contains(e.target)&&e.target!==fab) panel.classList.remove('open'); });

    function initDates(){
      const today=new Date();
      const y=today.getFullYear(), m=today.getMonth();
      const firstDay=new Date(y,m,1), lastDay=new Date(y,m+1,0);
      $('pdf-date-from').value=fmtDateISO(firstDay);
      $('pdf-date-to').value=fmtDateISO(lastDay);
    }

    panel.querySelectorAll('.pdf-preset').forEach(btn=>{
      btn.addEventListener('click',()=>{
        panel.querySelectorAll('.pdf-preset').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        activePreset=btn.dataset.preset;
        customRange.style.display=activePreset==='custom'?'flex':'none';
        if(activePreset!=='custom') setPresetDates(activePreset);
      });
    });

    function setPresetDates(preset){
      const today=new Date(), y=today.getFullYear(), m=today.getMonth();
      let from, to;
      if(preset==='thisweek'){ from=getMonday(today); to=new Date(from); to.setDate(from.getDate()+6); }
      else if(preset==='next3w'){ from=getMonday(today); to=new Date(from); to.setDate(from.getDate()+27); }
      else if(preset==='thismonth'){ from=new Date(y,m,1); to=new Date(y,m+1,0); }
      $('pdf-date-from').value=fmtDateISO(from);
      $('pdf-date-to').value=fmtDateISO(to);
    }
    setPresetDates('thismonth');

    genBtn.addEventListener('click', async()=>{
      const fromVal=$('pdf-date-from').value, toVal=$('pdf-date-to').value;
      if(!fromVal||!toVal){ statusEl.textContent='Choisissez une plage.'; return; }
      const from=new Date(fromVal+'T00:00:00'), to=new Date(toVal+'T23:59:59');
      if(from>to){ statusEl.textContent='La date de début doit être avant la fin.'; return; }
      genBtn.disabled=true; statusEl.textContent='Chargement des données…';
      try{
        loadJsPDF(async()=>{
          try{
            const tMin=new Date(from); tMin.setHours(0,0,0,0);
            const tMax=new Date(to); tMax.setHours(23,59,59,999);
            statusEl.textContent='Récupération des événements…';
            const evts=await fetchAll(tMin,tMax);
            const norm=evts.filter(e=>SHOW_TYPES.includes(e.__type)).map(ev=>({
              ...ev, _start:new Date(ev._start), _end:new Date(ev._end), _endInclusive:new Date(ev._endInclusive)
            }));
            statusEl.textContent='Génération du PDF…';
            generatePDF(norm, from, to);
            statusEl.textContent='✅ PDF généré !';
            setTimeout(()=>{ statusEl.textContent=''; panel.classList.remove('open'); },1800);
          }catch(e){ console.error(e); statusEl.textContent='Erreur : '+e.message; }
          genBtn.disabled=false;
        });
      }catch(e){ statusEl.textContent='Erreur chargement jsPDF.'; genBtn.disabled=false; }
    });

    function generatePDF(norm, from, to){
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });

      const PW=297, PH=210;
      const MAR_X=8, MAR_Y=8;
      const COLS=7, ROWS=4;
      const HEADER_H=7;
      const BAND_H=5.2, BAND_GAP=0.8, BAND_PAD_X=1.5, BAND_PAD_Y=0.9;
      const gridW=PW-MAR_X*2, gridH=PH-MAR_Y*2-HEADER_H;
      const cellW=gridW/COLS, cellH=gridH/ROWS;

      const C_WHITE   =[255,255,255];
      const C_GRID    =[180,190,200];
      const C_HEAD_BG =[30,41,59];
      const C_HEAD_TXT=[226,232,240];
      const C_TODAY_BG=[0,50,70];
      const C_TODAY_BD=[0,200,220];
      const C_HOL_BG  =[255,235,235];
      const C_HOL_BD  =[220,80,80];
      const C_HOL_TXT =[180,40,40];
      const C_PAST_BG =[245,247,250];
      const C_FUT_BG  =[250,252,255];
      const C_DATE_TXT=[80,100,120];
      const C_DATE_TODAY=[0,180,210];
      const C_NAV_BG  =[220,235,255];
      const C_NAV_BD  =[60,120,220];
      const C_NAV_TXT =[20,60,160];
      const C_REC_BG  =[215,255,230];
      const C_REC_BD  =[40,180,100];
      const C_REC_TXT =[10,120,60];
      const C_TIME    =[100,120,150];

      const weeks=[];
      let cur=getMonday(from);
      while(cur<=to && weeks.length<ROWS){
        const days=[];
        for(let i=0;i<7;i++){ const d=new Date(cur); d.setDate(cur.getDate()+i); d.setHours(0,0,0,0); days.push(d); }
        weeks.push(days);
        cur=new Date(cur); cur.setDate(cur.getDate()+7);
      }

      const today=new Date(); today.setHours(0,0,0,0);
      const DAYS_FR=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

      function evtsOnDay(day){
        return norm.filter(ev=>{
          const s=new Date(ev._start); s.setHours(0,0,0,0);
          const e=new Date(ev._endInclusive); e.setHours(0,0,0,0);
          return day>=s && day<=e;
        }).sort((a,b)=>new Date(a._start)-new Date(b._start));
      }

      doc.setFillColor(...C_WHITE);
      doc.rect(0,0,PW,PH,'F');

      const hY=MAR_Y;
      DAYS_FR.forEach((label,di)=>{
        const x=MAR_X+di*cellW;
        doc.setFillColor(...C_HEAD_BG);
        doc.rect(x, hY, cellW, HEADER_H, 'F');
        doc.setFont('helvetica','bold');
        doc.setFontSize(7.5);
        doc.setTextColor(...C_HEAD_TXT);
        doc.text(label, x+cellW/2, hY+HEADER_H/2+1.4, {align:'center'});
      });

      weeks.forEach((days, wi)=>{
        const rowY=MAR_Y+HEADER_H+wi*cellH;
        days.forEach((day, di)=>{
          const x=MAR_X+di*cellW;
          const isT=day.getTime()===today.getTime();
          const isPast=day<today;
          const isH=holidaySet.has(fmtDateISO(day));

          if(isT)       doc.setFillColor(...C_TODAY_BG);
          else if(isH)  doc.setFillColor(...C_HOL_BG);
          else if(isPast) doc.setFillColor(...C_PAST_BG);
          else          doc.setFillColor(...C_FUT_BG);
          doc.rect(x, rowY, cellW, cellH, 'F');

          doc.setLineWidth(isT ? 0.5 : 0.25);
          doc.setDrawColor(...(isT ? C_TODAY_BD : isH ? C_HOL_BD : C_GRID));
          doc.rect(x, rowY, cellW, cellH, 'S');

          const dateStr=day.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
          doc.setFont('helvetica', isT?'bold':'normal');
          doc.setFontSize(6.5);
          doc.setTextColor(...(isT ? C_DATE_TODAY : isH ? C_HOL_TXT : C_DATE_TXT));
          doc.text(dateStr, x+BAND_PAD_X, rowY+4);

          if(isH){
            doc.setFont('helvetica','bold');
            doc.setFontSize(5);
            doc.setTextColor(...C_HOL_TXT);
            doc.text('Férié', x+cellW-BAND_PAD_X, rowY+4, {align:'right'});
          }

          const evts=evtsOnDay(day);
          const evtStartY=rowY+6;
          const maxBands=Math.floor((cellH-6-BAND_PAD_Y)/(BAND_H+BAND_GAP));
          evts.slice(0,maxBands).forEach((ev,ei)=>{
            const bY=evtStartY+ei*(BAND_H+BAND_GAP);
            const isNav=isNavire(ev.__type);
            const bX=x+BAND_PAD_X, bW=cellW-BAND_PAD_X*2;

            doc.setFillColor(...(isNav?C_NAV_BG:C_REC_BG));
            doc.setDrawColor(...(isNav?C_NAV_BD:C_REC_BD));
            doc.setLineWidth(0.2);
            doc.roundedRect(bX, bY, bW, BAND_H, 0.8, 0.8, 'FD');

            const nom = isNav ? (ev.summary?.split('—')[0].trim()||'') : (ev.summary||'');
            doc.setFont('helvetica','bold');
            doc.setFontSize(5.2);
            doc.setTextColor(...(isNav?C_NAV_TXT:C_REC_TXT));
            const nomTrunc=doc.splitTextToSize(nom, bW-1)[0]||'';
            doc.text(nomTrunc, bX+0.8, bY+BAND_H*0.42+1);

            let timeStr='';
            if(isNav){
              const hD=String(ev._hDebut??0).padStart(2,'0');
              const hF=String(ev._hFinDisplay??ev._hFin??0).padStart(2,'0');
              const lieu=fmtPlace(ev._place);
              timeStr=`${hD}:00→${hF}:00${lieu?' '+lieu:''}`;
            } else if(!ev._isAllDay){
              timeStr=`${fmtTime(ev._start)}→${fmtTime(ev._end)}`;
            }
            if(timeStr){
              doc.setFont('helvetica','normal');
              doc.setFontSize(4.2);
              doc.setTextColor(...C_TIME);
              doc.text(timeStr, bX+0.8, bY+BAND_H-0.8);
            }
          });

          if(evts.length>maxBands){
            doc.setFont('helvetica','normal');
            doc.setFontSize(4.5);
            doc.setTextColor(...C_DATE_TXT);
            doc.text(`+${evts.length-maxBands}`, x+cellW-BAND_PAD_X, rowY+cellH-1.5, {align:'right'});
          }
        });
      });

      doc.setDrawColor(...C_GRID);
      doc.setLineWidth(0.4);
      doc.rect(MAR_X, MAR_Y, gridW, HEADER_H+gridH, 'S');

      const fmtD=d=>d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
      doc.setFont('helvetica','normal');
      doc.setFontSize(5.5);
      doc.setTextColor(160,170,180);
      doc.text(`Calendrier Navires · ${fmtD(from)} – ${fmtD(to)} · Généré le ${fmtD(new Date())}`, PW/2, PH-2, {align:'center'});

      const fmtFile=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
      doc.save(`Navires_${fmtFile(from)}_${fmtFile(to)}.pdf`);
    }
  })();

});
</script>
</body>
</html>
