<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Réception</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
html, body { height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

/* ── DESKTOP ── */
#desktop-view {
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 15px;
}
.calendar-day {
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px;
}
.calendar-day h3 {
  margin-bottom: 6px;
}
.event {
  margin: 4px 0;
  padding: 4px 8px;
  border-radius: 6px;
  background: #eef;
}
.event.reception { background: #c8ffd6; }
.event.navire    { background: #c8e0ff; }

/* ── MOBILE ── */
#mobile-view {
  display: none;
  flex-direction: column;
  height: 100vh;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #eaeaea;
}
#mob-cal { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#mob-cal-header {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
}
#mob-back-btn, .mob-cal-today-btn {
  cursor: pointer; padding: 4px 10px; border-radius: 6px; border:none; background: rgba(255,255,255,0.08); color:#fff;
}
#mob-cal-scroll { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:8px 12px 40px; }
.mob-day { background: rgba(255,255,255,0.05); border-radius:12px; padding:8px; }
.mob-day.mob-today { border:2px solid #00e5ff; }
.mob-day-date { font-weight:600; margin-bottom:4px; }

/* MODAL */
#event-modal { position: fixed; inset:0; display:none; align-items:center; justify-content:center; background: rgba(0,0,0,0.65); z-index:999; }
.modal-card { background: rgba(15,23,42,0.97); padding:18px; border-radius:16px; max-width:480px; width:94%; max-height:85vh; overflow-y:auto; }
.modal-card h3 { margin-bottom:6px; }

/* ── MEDIA QUERIES ── */
@media (max-width:719px){
  #desktop-view { display:none !important; }
  #mobile-view { display:flex !important; }
}
@media (min-width:720px){
  #desktop-view { display:flex !important; }
  #mobile-view { display:none !important; }
}
</style>
</head>
<body>

<!-- DESKTOP -->
<div id="desktop-view">
  <h2>Calendrier Réception - Desktop</h2>
  <div id="desktop-calendar"></div>
</div>

<!-- MOBILE -->
<div id="mobile-view">
  <div id="mob-cal">
    <div id="mob-cal-header">
      <button id="mob-back-btn">← Accueil</button>
      <span id="mob-cal-title">Chargement…</span>
      <button class="mob-cal-today-btn" id="mob-today-btn">Aujourd'hui</button>
    </div>
    <div id="mob-cal-scroll">
      <div style="text-align:center;padding:30px;opacity:0.5;font-size:0.9rem">Chargement…</div>
    </div>
  </div>
</div>

<!-- MODAL MOBILE -->
<div id="event-modal">
  <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
/* ── DUMMY DATA ── */
const eventsData = [
  {summary:"Réception A", type:"reception", start:"2026-04-02T10:00", end:"2026-04-02T12:00"},
  {summary:"Navire B", type:"navire", start:"2026-04-03T15:00", end:"2026-04-03T18:00"},
  {summary:"Réception C", type:"reception", start:"2026-04-05", end:"2026-04-05"} // journée entière
];

/* ── DESKTOP ── */
function renderDesktopCal() {
  const wrap = document.getElementById("desktop-calendar");
  wrap.innerHTML = "";
  const today = new Date();
  for(let i=0;i<7;i++){
    const day = new Date();
    day.setDate(today.getDate()+i);
    const dayDiv = document.createElement("div");
    dayDiv.className="calendar-day";
    dayDiv.innerHTML = `<h3>${day.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'})}</h3>`;
    const dayEvents = eventsData.filter(ev=>{
      const evStart = new Date(ev.start);
      const evEnd = ev.end?new Date(ev.end):new Date(ev.start);
      return day>=evStart && day<=evEnd;
    });
    if(dayEvents.length){
      dayEvents.forEach(ev=>{
        const eDiv = document.createElement("div");
        eDiv.className="event "+ev.type;
        eDiv.textContent=ev.summary + (ev.start.includes("T") ? " "+new Date(ev.start).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "");
        dayDiv.appendChild(eDiv);
      });
    } else {
      const eDiv = document.createElement("div"); eDiv.textContent="Aucun événement"; dayDiv.appendChild(eDiv);
    }
    wrap.appendChild(dayDiv);
  }
}

/* ── MOBILE ── */
function renderMobileCal() {
  const wrap = document.getElementById("mob-cal-scroll");
  wrap.innerHTML = "";
  const today = new Date();
  today.setHours(0,0,0,0);
  for(let i=0;i<14;i++){
    const day = new Date();
    day.setDate(today.getDate()+i);
    const card = document.createElement("div");
    card.className="mob-day";
    card.dataset.ts=day.getTime();
    card.innerHTML = `<div class="mob-day-date">${day.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'})}</div>`;
    const dayEvents = eventsData.filter(ev=>{
      const evStart = new Date(ev.start);
      const evEnd = ev.end?new Date(ev.end):new Date(ev.start);
      return day>=evStart && day<=evEnd;
    });
    if(dayEvents.length){
      dayEvents.forEach(ev=>{
        const evDiv = document.createElement("div");
        evDiv.className="mob-evt "+ev.type;
        evDiv.textContent=ev.summary;
        evDiv.addEventListener('click',()=>showEventModal(ev));
        card.appendChild(evDiv);
      });
    } else {
      const eDiv = document.createElement("div"); eDiv.textContent="Aucun événement"; card.appendChild(eDiv);
    }
    wrap.appendChild(card);
  }
  document.getElementById("mob-cal-title").textContent = today.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
}

function showEventModal(ev){
  const modal = document.getElementById("event-modal");
  const content = document.getElementById("modal-content");
  content.innerHTML = `<h3>${ev.summary}</h3>
  <p>Du ${new Date(ev.start).toLocaleString('fr-FR')}</p>` + (ev.end?`<p>Au ${new Date(ev.end).toLocaleString('fr-FR')}</p>`:'');
  modal.style.display="flex";
}
document.getElementById("event-modal").addEventListener('click',()=>{document.getElementById("event-modal").style.display='none';});

/* BOUTONS MOBILE */
document.getElementById("mob-back-btn").addEventListener('click',()=>window.location.href="index.html");
document.getElementById("mob-today-btn").addEventListener('click',()=>{ document.getElementById("mob-cal-scroll").scrollTop=0; });

/* INIT */
function isMobile(){ return window.innerWidth<720; }
function init(){
  renderDesktopCal();
  if(isMobile()) renderMobileCal();
}
init();
window.addEventListener('resize',()=>{ if(isMobile()) renderMobileCal(); });
</script>

</body>
</html>
