<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendrier SMR Programme</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f10;color:#fff;display:flex;flex-direction:column;height:100vh}

  #calendar-header{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-start; gap:8px;
    padding:12px 10px; color:#00e5ff; border-bottom:1px solid #333; position:relative;
  }
  .nav-btn{cursor:pointer;color:#00e5ff;font-size:26px;padding:4px 10px;border-radius:6px}
  .nav-btn:hover{background:#222}
  .view-btn{cursor:pointer;font-size:14px;padding:4px 10px;background:#222;border-radius:6px;border:1px solid #333;color:#00e5ff}
  .view-btn:hover{background:#333}
  #calendar-title{position:absolute; left:50%; transform:translateX(-50%); font-weight:bold; font-size:1.2rem; white-space:nowrap;}
  #current-time{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:2.2rem; font-weight:bold; color:#00e5ff; font-family:Trebuchet MS}

  #calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative}
  .day-cell{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:6px;position:relative;overflow:hidden;min-height:80px}
  .day-cell.future-day { border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 4px rgba(0, 229, 255, 0.2); }
  .day-cell.today { border: 2px solid rgba(0, 229, 255, 0.8); box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); animation: pulse 2s infinite; }
  @keyframes pulse {0% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);}50% { box-shadow: 0 0 12px rgba(0, 229, 255, 0.8);}100% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);}}
  .date-label{font-size:0.72rem;color:#cbd6da;margin-bottom:6px;font-weight:400}
  .past-day-overlay {position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);border-radius:8px;pointer-events:none;z-index:50;}
  #events-layer{position:absolute;left:2px;right:6px;top:10px;bottom:10px;pointer-events:none}
  .multi-band {pointer-events:auto;position:absolute;display:flex;align-items:center;padding:0 8px;height:22px;border-radius:6px;font-size:0.78rem;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,0.2) inset;background:#3644b3;}
  .event-text-container{display:inline-flex;white-space:nowrap;overflow:hidden;width:100%;position:relative;}
  .event-text{white-space:nowrap;display:inline-block;position:relative;}
  .event-text.scrolling{animation:scroll 10s linear infinite;}
  .event-text.scrolling::after{content:attr(data-text);position:absolute;left:100%;white-space:nowrap;}
  @keyframes scroll {0% { transform: translateX(0); } 100% { transform: translateX(-100%); }}
  .more-events{position:absolute;top:6px;right:8px;padding:2px 6px;background:rgba(0,0,0,0.45);border-radius:6px;font-size:0.72rem;cursor:pointer;z-index:60;pointer-events:auto}
  #event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
  .modal-card{background:#222;padding:18px;border-radius:10px;max-width:720px;width:94%}
  .modal-card h3{margin-bottom:6px}
  .modal-item{margin-bottom:10px}
  .modal-item p{color:#dbe7ea;margin-top:6px}

  @media(max-width:720px){#calendar-header{gap:6px;} .nav-btn{font-size:22px;padding:3px 6px;} .view-btn{font-size:12px;padding:3px 6px;} #current-time{font-size:1.8rem; right:5px;}}
  @media(max-width:500px){#calendar-header{flex-direction:column;align-items:flex-start;} #calendar-title{position:relative;left:auto;transform:none;margin:6px 0;}}
</style>
</head>
<body>
<div id="calendar-header">
  <span class="nav-btn" id="prev-btn">‹</span>
  <span class="nav-btn" id="today-btn">Aujourd’hui</span>
  <span id="calendar-title">Chargement…</span>
  <span class="nav-btn" id="next-btn">›</span>
  <span class="view-btn" id="view-3w">3 semaines</span>
  <span class="view-btn" id="view-4w">4 semaines</span>
  <div id="current-time"></div>
</div>

<div id="calendar-wrap">
  <div id="calendar" role="grid" aria-label="Calendrier"></div>
  <div id="events-layer" aria-hidden="false"></div>
</div>

<div id="event-modal" onclick="hideModal()">
  <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
  const CALENDAR_ID = 'smr.programme@gmail.com';
  let weekView = 3;
  let currentStartDate = new Date();
  let resizeTimeout;

  function getMonday(d){ const date=new Date(d); const day=date.getDay(); const diff=(day===0?-6:1-day); date.setDate(date.getDate()+diff); date.setHours(0,0,0,0); return date; }
  function fmtTime(d){ return d? new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''; }
  function fmtDayLabel(d){ return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'}); }
  function fmtFullDate(d){ return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }

  function updateClock(){ const now=new Date(); document.getElementById('current-time').textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`; }
  setInterval(updateClock, 1000);
  function hideModal(){ document.getElementById('event-modal').style.display='none'; }

  async function fetchEvents(timeMin, timeMax){
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${timeMin.toISOString()}&timeMax=${timeMax.toISOString()}`);
    const data = await res.json();
    return (data.items || []).map(ev => {
      ev._start = ev.start.dateTime ? new Date(ev.start.dateTime) : new Date(ev.start.date);
      ev._end = ev.end.dateTime ? new Date(ev.end.dateTime) : new Date(ev.end.date);
      ev._isAllDay = !ev.start.dateTime;
      if(ev._isAllDay){ ev._end.setDate(ev._end.getDate()-1); ev._end.setHours(23,59,59,999);}
      return ev;
    }).filter(e => e._start && e._end);
  }

  async function renderCalendar(){
    const calendarEl = document.getElementById('calendar');
    const eventsLayer = document.getElementById('events-layer');
    calendarEl.innerHTML = ''; eventsLayer.innerHTML = '';
    const today = new Date(); today.setHours(0,0,0,0);
    const startDate = new Date(getMonday(currentStartDate)); startDate.setDate(startDate.getDate()-7);
    const totalDays = weekView*7;
    const rowH = Math.floor((window.innerHeight - document.getElementById('calendar-header').offsetHeight - 32)/weekView);
    calendarEl.style.gridAutoRows = `${rowH}px`;

    const cells = [];
    for(let i=0;i<totalDays;i++){
      const d = new Date(startDate); d.setDate(d.getDate()+i); d.setHours(0,0,0,0);
      const cell = document.createElement('div'); cell.className='day-cell';
      if(d>today) cell.classList.add('future-day');
      if(d.getTime()===today.getTime()) cell.classList.add('today');
      const label = document.createElement('div'); label.className='date-label'; label.textContent=fmtDayLabel(d);
      cell.appendChild(label); calendarEl.appendChild(cell);
      cells.push({date:d,el:cell,events:[]});
    }

    const timeMin = new Date(startDate);
    const timeMax = new Date(startDate); timeMax.setDate(timeMax.getDate()+totalDays);
    const events = await fetchEvents(timeMin,timeMax);

    events.forEach(ev => {
      cells.forEach((c,i) => {
        if(ev._start <= c.date && ev._end >= c.date){
          const div = document.createElement('div'); div.className='multi-band';
          div.style.top='20px'; div.style.height='22px';
          const text = document.createElement('div'); text.className='event-text'; text.textContent=ev.summary||'(sans titre)'; text.setAttribute('data-text',text.textContent);
          const container = document.createElement('div'); container.className='event-text-container'; container.appendChild(text);
          div.appendChild(container);
          div.addEventListener('click', e=>{ e.stopPropagation(); showEventModal(ev); });
          eventsLayer.appendChild(div);
        }
      });
    });

    document.getElementById('calendar-title').textContent = cells[0].date.toLocaleString('fr-FR',{month:'long'})+' / '+cells[cells.length-1].date.toLocaleString('fr-FR',{month:'long'});
  }

  function showEventModal(ev){
    const modal = document.getElementById('event-modal');
    const content = document.getElementById('modal-content');
    let html=`<h3>${ev.summary||'(sans titre)'}</h3>`;
    if(ev._isAllDay) html+=`<p>Le ${fmtFullDate(ev._start)}</p>`;
    else html+=`<p>Le ${fmtFullDate(ev._start)} à ${fmtTime(ev._start)}</p>`;
    if(ev.description) html+=`<p>${ev.description}</p>`;
    content.innerHTML=html; modal.style.display='flex';
  }

  document.getElementById('prev-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()-7); renderCalendar(); });
  document.getElementById('next-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()+7); renderCalendar(); });
  document.getElementById('today-btn').addEventListener('click', ()=>{ currentStartDate=new Date(); weekView=3; renderCalendar(); });
  document.getElementById('view-3w').addEventListener('click', ()=>{ weekView=3; currentStartDate=getMonday(currentStartDate); renderCalendar(); });
  document.getElementById('view-4w').addEventListener('click', ()=>{ weekView=4; currentStartDate=getMonday(currentStartDate); renderCalendar(); });
  document.getElementById('event-modal').addEventListener('click', hideModal);
  window.addEventListener('resize', ()=>{ clearTimeout(resizeTimeout); resizeTimeout=setTimeout(()=>{ renderCalendar(); },200); });

  renderCalendar();
});
</script>
</body>
</html>
