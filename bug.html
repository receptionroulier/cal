<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug détecté</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
}

.container{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:40px 30px;
  box-shadow:0 20px 40px rgba(0,0,0,0.6);
  max-width:420px;
}

.icon{
  font-size:60px;
  margin-bottom:20px;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.spinner{
  width:70px;
  height:70px;
  margin:20px auto;
  border:6px solid rgba(255,255,255,0.08);
  border-top:6px solid #00e5ff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

h1{
  font-size:1.8rem;
  margin-bottom:10px;
}

p{
  color:#cbd5e1;
  font-size:0.95rem;
}

.status{
  margin-top:15px;
  font-size:0.8rem;
  color:#00e5ff;
  opacity:0.8;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{opacity:0.5}
  50%{opacity:1}
  100%{opacity:0.5}
}

</style>
</head>

<body>

<div class="container">
  <div class="icon">🐞</div>
  <div class="spinner"></div>
  <h1>Bug repéré</h1>
  <p>Une intervention est actuellement en cours.<br>
  Merci de patienter quelques instants.</p>
  <div class="status">Analyse en cours…</div>
</div>

</body>
</html>
