<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendrier Réception</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;flex-direction:column;height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;}

  /* HEADER */
  #calendar-header{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);backdrop-filter:blur(8px);position:relative;}
  .header-left{display:flex;align-items:center;gap:5px;}
  .nav-btn,.view-btn{cursor:pointer;padding:2px 8px;border-radius:6px;color:#fff;font-size:14px;}
  .nav-btn:hover,.view-btn:hover{background:rgba(255,255,255,0.1);}
  #calendar-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:bold;pointer-events:none;white-space:nowrap;overflow:hidden;text-align:center;}
  #current-time{margin-left:auto;font-weight:bold;font-family:"Trebuchet MS",sans-serif;}

  /* DESKTOP */
  #calendar-wrap{flex:1;display:flex;flex-direction:column;position:relative;}
  #calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;}
  .day-cell{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:6px;position:relative;min-height:80px;}
  .day-cell.today{background:rgba(0,229,255,0.08);border:2px solid rgba(0,229,255,0.75);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(0,229,255,0.5);}50%{box-shadow:0 0 14px rgba(0,229,255,0.75);}}
  .date-label{font-size:0.72rem;color:#9bb4be;margin-bottom:6px;}
  .event{position:absolute;padding:0 10px;height:22px;border-radius:12px;font-size:0.78rem;color:#fff;white-space:nowrap;overflow:hidden;transition:0.15s;}
  .reception{background:linear-gradient(90deg,rgba(0,255,120,0.25),rgba(0,200,100,0.22));border:1px solid rgba(0,255,120,0.75);}
  .navire{background:linear-gradient(90deg,rgba(0,130,255,0.25),rgba(0,110,220,0.22));border:1px solid rgba(0,160,255,0.75);}
  .event:hover{transform:translateY(-2px);}

  /* MOBILE */
  #mobile-wrap{display:none;flex:1;overflow-y:auto;padding:8px 12px;flex-direction:column;gap:6px;}
  .mob-day{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;}
  .mob-day-header{display:flex;align-items:center;gap:8px;padding:8px;}
  .mob-day-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);}
  .mob-day-date{font-size:0.82rem;color:#cbd5e1;}
  .mob-events{display:flex;flex-direction:column;gap:4px;padding:4px 6px;}
  .mob-evt{display:flex;align-items:center;gap:6px;padding:6px;border-radius:8px;font-size:0.82rem;cursor:pointer;transition:0.12s;}
  .mob-evt.reception{background:rgba(0,255,120,0.2);border:1px solid #00ff78;}
  .mob-evt.navire{background:rgba(0,130,255,0.2);border:1px solid #0099ff;}
  .mob-evt-dot{width:7px;height:7px;border-radius:50%;background:#00ff78;}

  /* MODAL */
  #event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999;}
  .modal-card{background:rgba(15,23,42,0.97);backdrop-filter:blur(12px);padding:16px;border-radius:16px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;}

  @media(max-width:720px){#calendar-wrap{display:none;}#mobile-wrap{display:flex;}#current-time{display:none;}}
  @media(min-width:721px){#mobile-wrap{display:none;}}
</style>
</head>
<body>

<div id="calendar-header">
  <div class="header-left">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span class="nav-btn" id="today-btn">Aujourd'hui</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
  </div>
  <span id="calendar-title">Chargement…</span>
  <div id="current-time"></div>
</div>

<div id="calendar-wrap">
  <div id="calendar"></div>
</div>

<div id="mobile-wrap"></div>

<div id="event-modal">
  <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
const API_KEY='YOUR_KEY_HERE';
const CALENDAR_IDS={reception:'receptionroulier@gmail.com',navire:'smr.programme@gmail.com'};
let weekView=3,currentStartDate=new Date();

// ===== UTILS =====
const fmtTime=d=>d?new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
const fmtDay=d=>d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'});
const getMonday=d=>{const t=new Date(d);t.setDate(t.getDate()-((t.getDay()+6)%7));t.setHours(0,0,0,0);return t;};
function parseLocalDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function normalize(items){return items.map(ev=>{ev._start=ev.start.dateTime?new Date(ev.start.dateTime):parseLocalDate(ev.start.date);
ev._end=ev.end.dateTime?new Date(ev.end.dateTime):parseLocalDate(ev.end.date);ev._isAllDay=!!ev.start.date&&!ev.start.dateTime;return ev;});}

// ===== CLOCK =====
setInterval(()=>{const n=new Date();document.getElementById('current-time').textContent=n.toLocaleTimeString('fr-FR');},1000);

// ===== MODAL =====
function showEventModal(ev){const c=document.getElementById('modal-content');c.innerHTML=`<h3>${ev.summary||'(sans titre)'}</h3>
<p>${ev._isAllDay?'Journée entière':fmtTime(ev._start)}</p>`;document.getElementById('event-modal').style.display='flex';}
document.getElementById('event-modal').addEventListener('click',()=>document.getElementById('event-modal').style.display='none');

// ===== FETCH =====
async function fetchCalendar(timeMin,timeMax){const p=`?key=${API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${timeMin.toISOString()}&timeMax=${timeMax.toISOString()}`;
const f=id=>fetch(`https://www.googleapis.com/calendar/v3/calendars/${id}/events${p}`).then(r=>r.json()).then(d=>d.items.map(i=>({...i,__type:id===CALENDAR_IDS.reception?'reception':'navire'}))).catch(()=>[]);return Promise.all([f(CALENDAR_IDS.reception),f(CALENDAR_IDS.navire)]).then(a=>normalize(a.flat()));}

// ===== DESKTOP =====
async function renderDesktop(){const cal=document.getElementById('calendar');cal.innerHTML='';const today=new Date();today.setHours(0,0,0,0);const start=getMonday(currentStartDate);for(let i=0;i<weekView*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('div');cell.className='day-cell';if(d.getTime()===today.getTime())cell.classList.add('today');const lbl=document.createElement('div');lbl.className='date-label';lbl.textContent=fmtDay(d);cell.appendChild(lbl);cal.appendChild(cell);}}
renderDesktop();

// ===== MOBILE =====
async function renderMobile(){const wrap=document.getElementById('mobile-wrap');wrap.innerHTML='';const today=new Date();today.setHours(0,0,0,0);for(let i=-7;i<=14;i++){const day=new Date(today);day.setDate(today.getDate()+i);const dEl=document.createElement('div');dEl.className='mob-day';const h=document.createElement('div');h.className='mob-day-header';const dot=document.createElement('div');dot.className='mob-day-dot';const dateDiv=document.createElement('div');dateDiv.className='mob-day-date';dateDiv.textContent=day.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'});h.append(dot,dateDiv);dEl.appendChild(h);wrap.appendChild(dEl);}}
renderMobile();
</script>
</body>
</html>
