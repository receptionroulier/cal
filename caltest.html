<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tableau de bord - Ponts & Calendrier</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f10;color:#fff;display:flex;flex-direction:column;height:100vh}
  /* header */
  #calendar-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 10px;color:#00e5ff;border-bottom:1px solid #333;position:relative}
  .nav-btn{cursor:pointer;color:#00e5ff;font-size:26px;padding:4px 10px;border-radius:6px}
  .nav-btn:hover{background:#222}
  .view-btn{cursor:pointer;font-size:14px;padding:4px 10px;background:#222;border-radius:6px;border:1px solid #333;color:#00e5ff}
  .view-btn:hover{background:#333}
  /* heure */
  #current-time{position:absolute;right:50px;top:50%;transform:translateY(-50%);font-size:3rem;font-weight:bold;color:#00e5ff;font-family:Trebuchet MS}
  /* calendar */
  #calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative}
  /* day cell */
  .day-cell{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:6px;position:relative;overflow:hidden;min-height:80px}
  .day-cell.future-day { border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 4px rgba(0, 229, 255, 0.2); }
  .day-cell.today { border: 2px solid rgba(0, 229, 255, 0.8); box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }
    50% { box-shadow: 0 0 12px rgba(0, 229, 255, 0.8); }
    100% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }
  }
  .date-label{font-size:0.72rem;color:#cbd6da;margin-bottom:6px;font-weight:400}
  /* Voile pour les jours passés */
  .past-day-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 8px;
    pointer-events: none;
    z-index: 50;
  }
  /* events layer (absolute) */
  #events-layer{position:absolute;left:2px;right:6px;top:10px;bottom:10px;pointer-events:none}
  .multi-band, .single-evt {
    pointer-events:auto;
    position:absolute;
    display:flex;
    align-items:center;
    padding:0 8px;
    height:22px;
    border-radius:6px;
    font-size:0.78rem;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,0.2) inset;
  }
  .reception{background:#109c53}
  .navire{background:#3644b3}
  .event-text-container {
    display: inline-flex;
    white-space: nowrap;
    overflow: hidden;
    width: 100%;
    position: relative;
  }
  .event-text {
    white-space: nowrap;
    display: inline-block;
    position: relative;
  }
  .event-text.scrolling {
    animation: scroll 10s linear infinite;
  }
  .event-text.scrolling::after {
    content: attr(data-text);
    position: absolute;
    left: 100%;
    white-space: nowrap;
  }
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
  .single-evt{border-radius:6px;padding:0 8px;display:flex;align-items:center}
  /* +X */
  .more-events{position:absolute;top:6px;right:8px;padding:2px 6px;background:rgba(0,0,0,0.45);border-radius:6px;font-size:0.72rem;cursor:pointer;z-index:60;pointer-events:auto}
  /* modal */
  #event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
  .modal-card{background:#222;padding:18px;border-radius:10px;max-width:720px;width:94%}
  .modal-card h3{margin-bottom:6px}
  .modal-item{margin-bottom:10px}
  .modal-item p{color:#dbe7ea;margin-top:6px}
  /* responsive */
  @media(max-width:720px){ .day-cell{min-height:68px} }
  /* small perf tweak: will-change for event transforms where possible */
  .multi-band, .single-evt { will-change: top, left, width, height; }
</style>
</head>
<body>
  <div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
    <span class="nav-btn" id="today-btn" style="font-size:16px">Aujourd’hui</span>
    <div id="current-time"></div>
  </div>
  <div id="calendar-wrap">
    <div id="calendar" role="grid" aria-label="Calendrier"></div>
    <div id="events-layer" aria-hidden="false"></div>
  </div>
  <div id="event-modal" onclick="hideModal()">
    <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

<script>
  // Attendre que le DOM soit chargé
  document.addEventListener('DOMContentLoaded', function() {

    // Gestionnaire d'erreurs global pour les promesses non capturées
    window.addEventListener('unhandledrejection', (event) => {
      event.preventDefault();
    });

    // ---------------- utilitaires ----------------
    const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
    const CALENDAR_IDS = { reception: 'receptionroulier@gmail.com', navire: 'smr.programme@gmail.com' };
    const CACHE_KEY = 'caltest_v2_cache';
    const CACHE_TTL = 30000;
    let weekView = 3;
    let currentStartDate = new Date();

    // [NOUVEAU] Fonction pour calculer un hash optimisé
    function calculateHash(events) {
      return JSON.stringify(
        events.map(ev => ({
          id: ev.id,
          updated: ev.updated,
          start: ev.start.dateTime || ev.start.date,
          end: ev.end.dateTime || ev.end.date,
          summary: ev.summary
        }))
      );
    }

    // [NOUVEAU] Sauvegarde le cache avec les événements et leur hash
    function saveCache(items, hash) {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            items,
            hash,
            ts: Date.now()
          })
        );
      } catch (e) {
        console.error("Erreur lors de la sauvegarde du cache :", e);
      }
    }

    // [NOUVEAU] Charge le cache depuis localStorage
    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() - obj.ts > CACHE_TTL) return null;
        return obj;
      } catch (e) {
        return null;
      }
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
    function fmtTime(d) { return d ? new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : ''; }
    function fmtDayLabel(d) { return d.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit' }); }
    function fmtFullDate(d) { return new Date(d).toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' }); }

    async function fetchCalendar(calendarId, timeMin, timeMax) {
      const base = 'https://www.googleapis.com/calendar/v3/calendars/';
      const url = `${base}${encodeURIComponent(calendarId)}/events?key=${encodeURIComponent(API_KEY)}&singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Erreur fetch calendar ${res.status}`);
      return res.json();
    }

    // ---------------- Rendering calendrier (modifié pour le hash + DOM-diff events) ----------------
    // IMPORTANT : on conserve la création des cellules comme avant (pour garantir pas de régression),
    // mais on n'efface PAS eventsLayer : on applique un diff pour créer / mettre à jour / supprimer uniquement les événements nécessaires.

    // helper pour générer un id unique de segment (évite recréations inutiles)
    function segmentIdFor(seg) {
      // utilise id de l'événement + startIdx + endIdx + lane (unique par segment visible)
      const evId = seg.ev && seg.ev.id ? seg.ev.id : (seg.ev && seg.ev.summary ? seg.ev.summary : 'ev');
      return `${evId}::${seg.startIdx}::${seg.endIdx}::${seg.lane}`;
    }

    async function renderCalendar() {
      const calendarEl = document.getElementById('calendar');
      const eventsLayer = document.getElementById('events-layer');

      // on reconstruit les cellules (identique à avant) — pas de changement de logique pour éviter toute régression.
      calendarEl.innerHTML = '';
      // NOTE : événements NE sont PAS vidés ici — diffUpdateEvents s'en chargera.
      // eventsLayer.innerHTML = ''; // <-- supprimé par DOM-diff

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const thisMonday = getMonday(currentStartDate);
      const pastMonday = new Date(thisMonday);
      pastMonday.setDate(thisMonday.getDate() - 7);
      const startDate = pastMonday;
      const totalDays = weekView * 7;
      const headerH = document.getElementById('calendar-header').getBoundingClientRect().height;
      const availH = Math.max(240, window.innerHeight - headerH - 32);
      const rowH = Math.floor((availH - 20) / weekView);
      calendarEl.style.gridAutoRows = `${rowH}px`;
      const cellMap = [];
      const months = new Set();
      for (let i = 0; i < totalDays; i++) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + i);
        d.setHours(0, 0, 0, 0);
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (d > today) {
          cell.classList.add('future-day');
        }
        if (d.getTime() === today.getTime()) {
          cell.classList.add('today');
        }
        const label = document.createElement('div');
        label.className = 'date-label';
        label.textContent = fmtDayLabel(d);
        cell.appendChild(label);
        calendarEl.appendChild(cell);
        cellMap.push({ date: d, el: cell, eventsList: [], visibleCount: 0 });
        months.add(capitalize(d.toLocaleString('fr-FR', { month: 'long' })));
      }
      const timeMin = new Date(startDate);
      timeMin.setHours(0, 0, 0, 0);
      const timeMax = new Date(timeMin);
      timeMax.setDate(timeMax.getDate() + totalDays);

      // [NOUVEAU] Gestion du cache et du hash
      const cache = loadCache();
      let items;
      if (cache) {
        const [r1, r2] = await Promise.allSettled([
          fetchCalendar(CALENDAR_IDS.reception, timeMin, timeMax),
          fetchCalendar(CALENDAR_IDS.navire, timeMin, timeMax)
        ]);
        const items1 = r1.status === 'fulfilled' ? (r1.value.items || []) : [];
        const items2 = r2.status === 'fulfilled' ? (r2.value.items || []) : [];
        const newItems = [...items1.map(i => ({ ...i, __type: 'reception' })), ...items2.map(i => ({ ...i, __type: 'navire' }))];
        const newHash = calculateHash(newItems);

        if (newHash !== cache.hash) {
          items = newItems;
          saveCache(items, newHash);
        } else {
          items = cache.items;
        }
      } else {
        const [r1, r2] = await Promise.allSettled([
          fetchCalendar(CALENDAR_IDS.reception, timeMin, timeMax),
          fetchCalendar(CALENDAR_IDS.navire, timeMin, timeMax)
        ]);
        const items1 = r1.status === 'fulfilled' ? (r1.value.items || []) : [];
        const items2 = r2.status === 'fulfilled' ? (r2.value.items || []) : [];
        items = [...items1.map(i => ({ ...i, __type: 'reception' })), ...items2.map(i => ({ ...i, __type: 'navire' }))];
        const newHash = calculateHash(items);
        saveCache(items, newHash);
      }

      // normalisation des événements (identique à ton code)
      const norm = items.map(ev => {
        const e = JSON.parse(JSON.stringify(ev));
        e.__type = e.__type || '';
        e._isAllDay = !!(e.start && e.start.date && !e.start.dateTime);
        if (e.start) {
          if (e.start.dateTime) e._start = new Date(e.start.dateTime);
          else { e._start = new Date(e.start.date); e._start.setHours(0, 0, 0, 0); }
        }
        if (e.end) {
          if (e.end.dateTime) e._end = new Date(e.end.dateTime);
          else { e._end = new Date(e.end.date); e._end.setHours(0, 0, 0, 0); }
        }
        if (e._isAllDay && e._end) {
          const adj = new Date(e._end);
          adj.setDate(adj.getDate() - 1);
          adj.setHours(23, 59, 59, 999);
          e._endInclusive = adj;
        } else if (e._end) {
          const tmp = new Date(e._end);
          if (tmp.getHours() === 0 && tmp.getMinutes() === 0 && tmp.getSeconds() === 0) {
            const adj = new Date(tmp);
            adj.setDate(adj.getDate() - 1);
            adj.setHours(23, 59, 59, 999);
            e._endInclusive = adj;
          } else e._endInclusive = new Date(e._end);
        }
        return e;
      }).filter(e => e._start && e._endInclusive);

      // segments (identique à ton code)
      const segments = [];
      norm.forEach(ev => {
        const sDay = new Date(ev._start);
        sDay.setHours(0, 0, 0, 0);
        const eDay = new Date(ev._endInclusive);
        eDay.setHours(0, 0, 0, 0);
        let cursor = new Date(sDay);
        while (cursor <= eDay) {
          const weekIndex = Math.floor((cursor - startDate) / (7 * 24 * 3600 * 1000));
          if (weekIndex < 0) { cursor = new Date(startDate); continue; }
          if (weekIndex >= weekView) break;
          const weekStartIdx = weekIndex * 7;
          const weekEndIdx = Math.min(weekStartIdx + 6, cellMap.length - 1);
          let segStartIdx = -1;
          for (let i = weekStartIdx; i <= weekEndIdx; i++) {
            if (cellMap[i].date.getTime() >= cursor.getTime()) { segStartIdx = i; break; }
          }
          if (segStartIdx === -1) { cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate() + 1); continue; }
          let segEndIdx = -1;
          for (let i = weekEndIdx; i >= weekStartIdx; i--) {
            if (cellMap[i].date.getTime() <= eDay.getTime()) { segEndIdx = i; break; }
          }
          if (segEndIdx === -1) { cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate() + 1); continue; }
          segments.push({
            ev,
            startIdx: segStartIdx,
            endIdx: segEndIdx,
            weekIdx: weekIndex,
            segStartDate: new Date(cellMap[segStartIdx].date),
            segEndDate: new Date(cellMap[segEndIdx].date)
          });
          cursor = new Date(cellMap[segEndIdx].date);
          cursor.setDate(cursor.getDate() + 1);
        }
      });

      // lanes, overlaps, etc. (identique)
      const weekLanes = Array.from({ length: weekView }, () => []);
      segments.forEach(seg => {
        const lanes = weekLanes[seg.weekIdx];
        let lane = 0;
        function overlaps(l) { const arr = lanes[l] || []; return arr.some(r => !(seg.endIdx < r.startIdx || seg.startIdx > r.endIdx)); }
        while (overlaps(lane)) lane++;
        if (!lanes[lane]) lanes[lane] = [];
        lanes[lane].push({ startIdx: seg.startIdx, endIdx: seg.endIdx });
        seg.lane = lane;
      });
      cellMap.forEach(c => { c.eventsList = []; c.totalSegments = 0; });
      segments.forEach(seg => {
        for (let i = seg.startIdx; i <= seg.endIdx; i++) {
          if (i >= 0 && i < cellMap.length) {
            cellMap[i].totalSegments++;
            if (!cellMap[i].eventsList.includes(seg.ev)) cellMap[i].eventsList.push(seg.ev);
          }
        }
      });

      // mesure pour le positionnement
      await new Promise(r => requestAnimationFrame(r));
      const calendarRect = calendarEl.getBoundingClientRect();
      const cellRects = cellMap.map(c => c.el.getBoundingClientRect());
      const dateLabel = document.querySelector('.date-label');
      const dateLabelH = dateLabel ? dateLabel.getBoundingClientRect().height : 18;
      const bandH = 22;
      const laneGap = 6;
      const bandSpacing = bandH + laneGap;
      const weekTopBase = [];
      for (let w = 0; w < weekView; w++) {
        const idx = w * 7;
        weekTopBase[w] = idx < cellRects.length ? (cellRects[idx].top - calendarRect.top) : 0;
      }
      const visibleLanesPerWeek = [];
      for (let w = 0; w < weekView; w++) {
        const avail = rowH - (dateLabelH + 8);
        const lanes = Math.max(0, Math.floor((avail + laneGap) / bandSpacing));
        visibleLanesPerWeek[w] = lanes;
      }
      function getFirstSegmentOfEvent(ev) {
        return segments.filter(s => s.ev === ev).reduce((a, b) => a.startIdx < b.startIdx ? a : b);
      }
      function getLastSegmentOfEvent(ev) {
        return segments.filter(s => s.ev === ev).reduce((a, b) => a.endIdx > b.endIdx ? a : b);
      }

      // Ajout des overlays passés (identique)
      cellMap.forEach((cellObj, idx) => {
        const cellDate = cellObj.date;
        if (cellDate < today) {
          // éviter d'empiler plusieurs overlays si renderCalendar est appelé souvent
          if (!cellObj._hasOverlay) {
            const overlay = document.createElement('div');
            overlay.className = 'past-day-overlay';
            cellObj.el.appendChild(overlay);
            cellObj.el.style.position = 'relative';
            cellObj._hasOverlay = true;
          }
        } else {
          // si on était en arrière et que le jour devient futur (rare), on peut retirer le voile
          if (cellObj._hasOverlay && cellObj.date >= today) {
            const overlay = cellObj.el.querySelector('.past-day-overlay');
            if (overlay) overlay.remove();
            cellObj._hasOverlay = false;
          }
        }
      });

      // === Construire la liste "segmentsRenderable" avec positions exactes pour chaque segment ===
      const segmentsRenderable = segments.map(seg => {
        const firstRect = cellRects[seg.startIdx];
        const lastRect = cellRects[seg.endIdx];
        if (!firstRect || !lastRect) return null;
        const left = firstRect.left - calendarRect.left;
        const width = (lastRect.left + lastRect.width) - firstRect.left - 6;
        const top = (weekTopBase[seg.weekIdx] || 0) + dateLabelH + 6 + (seg.lane * bandSpacing);
        const visibleLanes = visibleLanesPerWeek[seg.weekIdx] || 0;
        const isHidden = seg.lane >= visibleLanes;
        // Texte
        const ev = seg.ev;
        const evStartTime = ev._isAllDay ? '' : fmtTime(ev._start);
        const evEndTime = (!ev._isAllDay && seg.endIdx === getLastSegmentOfEvent(ev).endIdx) ? ('>' + fmtTime(ev._end)) : '';
        const isFirstSegment = seg.startIdx === getFirstSegmentOfEvent(ev).startIdx;
        let fullText = '';
        if (isFirstSegment && evStartTime) fullText += `<${evStartTime} `;
        fullText += ev.summary || '(sans titre)';
        if (evEndTime) fullText += ` ${evEndTime}`;

        return {
          id: segmentIdFor(seg),
          evId: ev.id || (ev.summary || '') ,
          seg,
          left: Math.round(left),
          width: Math.round(Math.max(36, width)),
          top: Math.round(top),
          height: bandH,
          text: fullText,
          type: seg.ev.__type || '',
          hidden: isHidden
        };
      }).filter(Boolean);

      // Now apply DOM-diff on segmentsRenderable
      diffUpdateEvents(segmentsRenderable);

      // Badges "+X autres" (identique)
      cellMap.forEach((c, idx) => {
        const weekIdx = Math.floor(idx / 7);
        const visibleLanes = visibleLanesPerWeek[weekIdx] || 0;
        let visibleCount = 0, hiddenCount = 0;
        segments.forEach(seg => {
          if (seg.startIdx <= idx && seg.endIdx >= idx && seg.weekIdx === weekIdx) {
            if (seg.lane < visibleLanes) visibleCount++;
            else hiddenCount++;
          }
        });
        c.visibleCount = visibleCount;
        c.hiddenCount = hiddenCount;
        // enlever ancien badge si présent
        const existingBadge = c.el.querySelector('.more-events');
        if (existingBadge) existingBadge.remove();
        if (hiddenCount > 0) {
          const badge = document.createElement('div');
          badge.className = 'more-events';
          badge.textContent = `+${hiddenCount} autres`;
          badge.addEventListener('click', e => { e.stopPropagation(); showModalForCell(c); });
          c.el.appendChild(badge);
        }
      });

      document.getElementById('calendar-title').textContent = Array.from(months).join(' / ');
    }

    // ---------------- DOM-diff implementation for events ----------------
    function diffUpdateEvents(newSegments) {
      const layer = document.getElementById('events-layer');
      const existing = new Map();
      // index existing nodes by data-seg-id
      Array.from(layer.children).forEach(child => {
        const id = child.dataset.segId;
        if (id) existing.set(id, child);
      });

      const used = new Set();

      newSegments.forEach(s => {
        const node = existing.get(s.id);
        if (s.hidden) {
          // if segment is marked hidden, ensure it's removed if exists
          if (node) {
            node.remove();
            existing.delete(s.id);
          }
          return;
        }

        if (node) {
          // Update only if needed
          let changed = false;
          if (node.style.left !== s.left + 'px') { node.style.left = s.left + 'px'; changed = true; }
          if (node.style.top !== s.top + 'px') { node.style.top = s.top + 'px'; changed = true; }
          if (node.style.width !== s.width + 'px') { node.style.width = s.width + 'px'; changed = true; }
          if (node.style.height !== s.height + 'px') { node.style.height = s.height + 'px'; changed = true; }
          // text is inside .event-text
          const textNode = node.querySelector('.event-text');
          if (textNode && textNode.textContent !== s.text) {
            textNode.textContent = s.text;
            textNode.setAttribute('data-text', s.text);
            // reset scrolling class if necessary
            textNode.classList.remove('scrolling');
            // re-evaluate scrolling after a slight timeout
            setTimeout(() => {
              const container = node.querySelector('.event-text-container');
              if (textNode.scrollWidth > (container ? container.clientWidth : 0)) {
                textNode.classList.add('scrolling');
              }
            }, 80);
          }
          used.add(s.id);
        } else {
          // create new element
          const el = document.createElement('div');
          el.className = 'multi-band ' + (s.type || '');
          el.dataset.segId = s.id;
          el.style.position = 'absolute';
          el.style.left = s.left + 'px';
          el.style.top = s.top + 'px';
          el.style.width = s.width + 'px';
          el.style.height = s.height + 'px';
          el.style.display = 'flex';
          el.style.alignItems = 'center';
          // build inner text container like before
          const textContainer = document.createElement('div');
          textContainer.className = 'event-text-container';
          textContainer.style.width = '100%';
          const eventText = document.createElement('div');
          eventText.className = 'event-text';
          eventText.textContent = s.text;
          eventText.setAttribute('data-text', s.text);
          textContainer.appendChild(eventText);
          el.appendChild(textContainer);
          // click handler to open modal: we need the original event object.
          // We can store evId to retrieve description later by searching loaded items (norm) if needed.
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            // find the segment's original ev in the last cached items; fallback does nothing
            // We stored seg.ev reference earlier in renderCalendar scope, but here we don't have direct access.
            // To keep parity, store the event object on the DOM node when created by renderCalendar (we pass it via s.seg.ev)
            // We'll set el._ev when created below.
            if (el._ev) showEventModal(el._ev);
          });
          // set ev reference for modal (we have access to s.seg.ev)
          // s.seg is available only when called from renderCalendar; ensure caller passed it.
          if (s.seg && s.seg.ev) el._ev = s.seg.ev;

          // determine scrolling after inserted into DOM
          layer.appendChild(el);
          setTimeout(() => {
            const container = el.querySelector('.event-text-container');
            const eventText = el.querySelector('.event-text');
            if (eventText && container && eventText.scrollWidth > container.clientWidth) {
              eventText.classList.add('scrolling');
            }
          }, 80);

          used.add(s.id);
        }
      });

      // remove nodes not used anymore
      existing.forEach((node, id) => {
        if (!used.has(id)) {
          node.remove();
        }
      });
    }

    // ---------------- Modals (inchangé) ----------------
    function showEventModal(ev) {
      const modal = document.getElementById('event-modal');
      const content = document.getElementById('modal-content');
      const start = ev._start, end = ev._end;
      const isAll = ev._isAllDay;
      const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
      let html = `<h3>${ev.summary || '(sans titre)'}</h3>`;
      if (isMulti) html += `<div class="modal-item"><p>Du ${fmtFullDate(start)} à ${fmtTime(start)}<br>Au ${fmtFullDate(end)} à ${fmtTime(end)}</p></div>`;
      else if (isAll) html += `<div class="modal-item"><p>Le ${fmtFullDate(start)}</p></div>`;
      else html += `<div class="modal-item"><p>Le ${fmtFullDate(start)} à ${fmtTime(start)}</p></div>`;
      if (ev.description) html += `<div class="modal-item"><p>${ev.description}</p></div>`;
      content.innerHTML = html;
      modal.style.display = 'flex';
    }

    function hideModal() { document.getElementById('event-modal').style.display = 'none'; }

    function showModalForCell(cellObj) {
      const modal = document.getElementById('event-modal');
      const content = document.getElementById('modal-content');
      const events = cellObj.eventsList || [];
      const list = [];
      events.forEach(ev => {
        const start = ev._start, end = ev._end;
        const isAll = ev._isAllDay;
        const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
        if (isMulti) list.push(`<div class="modal-item"><h3>${ev.summary || '(sans titre)'}</h3><p>&lt;${fmtTime(start)} ${ev.summary} … &gt;${fmtTime(ev._end)}</p>${ev.description ? '<p>' + ev.description + '</p>' : ''}</div>`);
        else if (isAll) list.push(`<div class="modal-item"><h3>${ev.summary || '(sans titre)'}</h3><p>${fmtFullDate(start)}</p>${ev.description ? '<p>' + ev.description + '</p>' : ''}</div>`);
        else list.push(`<div class="modal-item"><h3>${ev.summary || '(sans titre)'}</h3><p>${fmtTime(start)} ${ev.summary}</p>${ev.description ? '<p>' + ev.description + '</p>' : ''}</div>`);
      });
      content.innerHTML = list.join('<hr style="border:none;border-top:1px solid #333;margin:8px 0">') || '<p>Aucun évènement</p>';
      modal.style.display = 'flex';
    }

    // ---------------- Navigation (inchangé) ----------------
    document.getElementById('prev-btn').addEventListener('click', () => {
      currentStartDate.setDate(currentStartDate.getDate() - 7);
      localStorage.removeItem(CACHE_KEY);
      renderCalendar();
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      currentStartDate.setDate(currentStartDate.getDate() + 7);
      localStorage.removeItem(CACHE_KEY);
      renderCalendar();
    });
    document.getElementById('today-btn').addEventListener('click', () => {
      currentStartDate = new Date();
      weekView = 3;
      localStorage.removeItem(CACHE_KEY);
      renderCalendar();
    });
    document.getElementById('view-3w').addEventListener('click', () => {
      weekView = 3;
      currentStartDate = getMonday(currentStartDate);
      localStorage.removeItem(CACHE_KEY);
      renderCalendar();
    });
    document.getElementById('view-4w').addEventListener('click', () => {
      weekView = 4;
      currentStartDate = getMonday(currentStartDate);
      localStorage.removeItem(CACHE_KEY);
      renderCalendar();
    });
    window.addEventListener('resize', () => { requestAnimationFrame(() => renderCalendar()); });
    document.getElementById('event-modal').addEventListener('click', hideModal);

    // ---------------- Horloge (inchangé) ----------------
    function updateClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // [NOUVEAU] Rafraîchissement automatique toutes les 30 secondes
    setInterval(() => {
      renderCalendar();
    }, CACHE_TTL);

    // Chargement initial
    renderCalendar().catch(err => { console.error('render error', err); document.getElementById('calendar-title').textContent = 'Erreur'; });

  }); // Fermeture de DOMContentLoaded
</script>
</body>
</html>
