<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R - Ponts et Calendrier</title>
<style>
  body { margin:0; padding:0; font-family:sans-serif; background:#f9fafb; color:#1e293b; }
  #desktop-view, #mobile-view { display:none; }
  iframe { border:none; width:100%; height:100%; }

  /* MOBILE */
  #mobile-view { display:block; padding:10px; }
  #mob-ponts-header { display:flex; align-items:center; margin-bottom:10px; }
  #mob-ponts-header svg { margin-right:4px; }
  #ponts-cols { display:flex; gap:4px; justify-content:space-between; font-size:12px; }
  .pont-col { flex:1; background:#e2e8f0; border-radius:6px; padding:4px; display:flex; flex-direction:column; align-items:center; }
  .pont-pastille { width:12px; height:12px; border-radius:50%; margin:2px 0; }
  .status-ouvert { background:green; }
  .status-ferme { background:red; }
  .status-manoeuvre { background:orange; }
  .status-travaux { background:blue; }
  .pont-date { font-size:10px; opacity:0.7; margin-top:2px; }
  #mob-calr-frame { margin-top:10px; height:500px; }
</style>
</head>
<body>

<!-- DESKTOP : inchangé -->
<div id="desktop-view">
  <div style="width:48%; float:left;">
    <iframe src="https://receptionroulier.github.io/cal/p.html"></iframe>
  </div>
  <div style="width:48%; float:right;">
    <iframe src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>
</div>

<!-- MOBILE : p mobile + calr iframe -->
<div id="mobile-view">
  <div id="mob-ponts-header">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5">
      <path d="M3 12h18"/><path d="M6 12v4"/><path d="M18 12v4"/>
    </svg>
    <span>État des ponts</span>
    <span id="mob-ponts-indicator" style="margin-left:6px;">Chargement…</span>
    <span id="mob-ponts-lastupdate" style="font-size:9px; opacity:0.6; margin-left:6px;"></span>
  </div>

  <div id="ponts-cols"></div>

  <iframe id="mob-calr-frame" src="https://receptionroulier.github.io/cal/calr.html"></iframe>
</div>

<script>
// Détection device
function isMobile() { return window.innerWidth <= 768; }
if(isMobile()){
  document.getElementById('desktop-view').style.display='none';
  document.getElementById('mobile-view').style.display='block';
} else {
  document.getElementById('desktop-view').style.display='block';
  document.getElementById('mobile-view').style.display='none';
}

/* -------------------------
   PONT MOBILE : flux réel p mobile
----------------------------*/
(function(){
  const urlP = "https://receptionroulier.github.io/cal/p.json"; // ton JSON réel

  fetch(urlP)
    .then(r => r.json())
    .then(data => {
      const ponts = data.ponts;
      const lastUpdate = data.lastUpdate;

      const cols = document.getElementById("ponts-cols");
      cols.innerHTML="";

      ponts.forEach(p=>{
        const col = document.createElement("div");
        col.className="pont-col";

        const pastille = document.createElement("div");
        pastille.className="pont-pastille status-"+p.status;
        col.appendChild(pastille);

        const nom = document.createElement("div");
        nom.textContent = p.nom;
        nom.style.fontSize="11px";
        col.appendChild(nom);

        const date = document.createElement("div");
        date.className="pont-date";
        date.textContent = p.date; // date déjà formatée dans ton JSON
        col.appendChild(date);

        cols.appendChild(col);
      });

      // Dernier pont ouvert
      const lastOuvert = ponts.filter(p=>p.status==="ouvert").pop();
      if(lastOuvert){
        document.getElementById("mob-ponts-indicator").textContent = `Dernier pont ouvert : ${lastOuvert.nom}`;
      } else {
        document.getElementById("mob-ponts-indicator").textContent = `Aucun pont ouvert`;
      }

      // Dernière mise à jour
      document.getElementById("mob-ponts-lastupdate").textContent = `Dernière mise à jour : ${lastUpdate}`;
    })
    .catch(err=>{
      document.getElementById("mob-ponts-indicator").textContent = "Erreur de chargement";
      console.error(err);
    });
})();
</script>

</body>
</html>
