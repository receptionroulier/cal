<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendrier Optimisé</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f10;color:#fff;display:flex;flex-direction:column;height:100vh}
#calendar-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 10px;color:#00e5ff;border-bottom:1px solid #333;position:relative}
.nav-btn{cursor:pointer;color:#00e5ff;font-size:26px;padding:4px 10px;border-radius:6px}
.nav-btn:hover{background:#222}
.view-btn{cursor:pointer;font-size:14px;padding:4px 10px;background:#222;border-radius:6px;border:1px solid #333;color:#00e5ff}
.view-btn:hover{background:#333}
#current-time{position:absolute;right:50px;top:50%;transform:translateY(-50%);font-size:3rem;font-weight:bold;color:#00e5ff;font-family:Trebuchet MS}
#calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative}
.day-cell{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:6px;position:relative;overflow:hidden;min-height:80px}
.day-cell.future-day { border:1px solid rgba(0,229,255,0.3); box-shadow:0 0 4px rgba(0,229,255,0.2); }
.day-cell.today { border:2px solid rgba(0,229,255,0.8); box-shadow:0 0 8px rgba(0,229,255,0.6); animation:pulse 2s infinite; }
@keyframes pulse {0%{box-shadow:0 0 8px rgba(0,229,255,0.6);}50%{box-shadow:0 0 12px rgba(0,229,255,0.8);}100%{box-shadow:0 0 8px rgba(0,229,255,0.6);}}
.date-label{font-size:0.72rem;color:#cbd6da;margin-bottom:6px;font-weight:400}
.past-day-overlay {position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);border-radius:8px;pointer-events:none;z-index:50;}
#events-layer{position:absolute;left:2px;right:6px;top:10px;bottom:10px;pointer-events:none}
.multi-band{pointer-events:auto;position:absolute;display:flex;align-items:center;padding:0 8px;height:22px;border-radius:6px;font-size:0.78rem;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,0.2) inset;}
.reception{background:#109c53}
.navire{background:#3644b3}
.event-text-container{display:inline-flex;white-space:nowrap;overflow:hidden;width:100%;position:relative}
.event-text{white-space:nowrap;display:inline-block;position:relative}
.event-text.scrolling{animation:scroll 10s linear infinite}
.event-text.scrolling::after{content:attr(data-text);position:absolute;left:100%;white-space:nowrap}
@keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
.more-events{position:absolute;top:6px;right:8px;padding:2px 6px;background:rgba(0,0,0,0.45);border-radius:6px;font-size:0.72rem;cursor:pointer;z-index:60;pointer-events:auto}
#event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
.modal-card{background:#222;padding:18px;border-radius:10px;max-width:720px;width:94%}
.modal-card h3{margin-bottom:6px}
.modal-item{margin-bottom:10px}
.modal-item p{color:#dbe7ea;margin-top:6px}
@media(max-width:720px){.day-cell{min-height:68px}}
</style>
</head>
<body>
<div id="calendar-header">
  <span class="nav-btn" id="prev-btn">‹</span>
  <span id="calendar-title">Chargement…</span>
  <span class="nav-btn" id="next-btn">›</span>
  <span class="view-btn" id="view-3w">3 semaines</span>
  <span class="view-btn" id="view-4w">4 semaines</span>
  <span class="nav-btn" id="today-btn">Aujourd’hui</span>
  <div id="current-time"></div>
</div>
<div id="calendar-wrap">
  <div id="calendar"></div>
  <div id="events-layer"></div>
</div>
<div id="event-modal" onclick="this.style.display='none'">
  <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
(async function(){
const API_KEY='AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
const CALENDAR_IDS={reception:'receptionroulier@gmail.com',navire:'smr.programme@gmail.com'};
let weekView=3,currentStart=new Date(),eventCache={hash:'',events:[]};
const $=id=>document.getElementById(id);

function getMonday(d){const date=new Date(d);date.setDate(date.getDate()-(date.getDay()||7)+1);return date;}
function fmt(d,opt){return new Date(d).toLocaleDateString('fr-FR',opt);}
function fmtTime(d){return d?new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';}

async function fetchCal(id,min,max){
  const res=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(id)}/events?key=${API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${min.toISOString()}&timeMax=${max.toISOString()}`);
  if(!res.ok)throw Error(res.status);
  return (await res.json()).items||[];
}

function computeHash(ev){return ev.map(e=>e.id+e.updated).join('|');}
function updateScrolling(){document.querySelectorAll('.event-text').forEach(el=>{const c=el.parentElement;if(el.scrollWidth>c.clientWidth)el.classList.add('scrolling');else el.classList.remove('scrolling');});}

async function renderCalendar(){
  const cal=$('calendar'), layer=$('events-layer');
  const start=getMonday(currentStart),totalDays=weekView*7,today=new Date();today.setHours(0,0,0,0);

  // créer les cellules si elles n'existent pas
  if(!cal.hasChildNodes()){
    for(let i=0;i<totalDays;i++){
      const d=new Date(start);d.setDate(d.getDate()+i);
      const cell=document.createElement('div');cell.className='day-cell';
      if(d.getTime()===today.getTime())cell.classList.add('today');
      const lbl=document.createElement('div');lbl.className='date-label';lbl.textContent=fmt(d,{weekday:'short',day:'2-digit'});
      cell.appendChild(lbl);cal.appendChild(cell);
    }
  }

  // fetch événements
  const min=start,max=new Date(start);max.setDate(max.getDate()+totalDays);
  const [ev1,ev2]=await Promise.all([fetchCal(CALENDAR_IDS.reception,min,max),fetchCal(CALENDAR_IDS.navire,min,max)]);
  let events=[...ev1.map(e=>({...e,__type:'reception'})),...ev2.map(e=>({...e,__type:'navire'}))];
  const newHash=computeHash(events);
  if(eventCache.hash===newHash)return; // rien à changer
  eventCache.hash=newHash; eventCache.events=events;
  layer.innerHTML='';

  // normaliser les dates
  events=events.map(e=>{
    const s=e.start.dateTime?new Date(e.start.dateTime):new Date(e.start.date);
    const end=e.end.dateTime?new Date(e.end.dateTime):new Date(e.end);
    if(!e.start.dateTime)e._isAllDay=true;
    e._start=s;e._end=end;return e;
  });

  // segmentation et lanes
  const cellMap=[];for(let i=0;i<totalDays;i++){const d=new Date(start);d.setDate(d.getDate()+i);cellMap.push({date:d,el:cal.children[i],eventsList:[]});}
  const segments=[];events.forEach(ev=>{let cursor=new Date(ev._start);const end=ev._end;while(cursor<=end){let idx=Math.floor((cursor-start)/86400000);if(idx>=0 && idx<totalDays){segments.push({ev,startIdx:idx,endIdx:idx});cellMap[idx].eventsList.push(ev);}cursor.setDate(cursor.getDate()+1);}});

  // calcul lanes
  const lanes=[];segments.forEach(seg=>{let l=0;while(lanes[l]&&lanes[l].some(s=>!(seg.endIdx<s.startIdx||seg.startIdx>s.endIdx)))l++;if(!lanes[l])lanes[l]=[];lanes[l].push(seg);seg.lane=l;});

  // création divs
  const rowH=cal.getBoundingClientRect().height/weekView,bandH=22,laneGap=6,bandSpacing=bandH+laneGap;
  segments.forEach(seg=>{
    const first=cellMap[seg.startIdx].el.getBoundingClientRect();
    const last=cellMap[seg.endIdx].el.getBoundingClientRect();
    const left=first.left-cal.getBoundingClientRect().left;
    const width=(last.left+last.width)-first.left-6;
    const top=(rowH*Math.floor(seg.startIdx/7)) + 20 + (seg.lane*bandSpacing);
    const el=document.createElement('div');el.className='multi-band '+seg.ev.__type;el.style.left=left+'px';el.style.width=Math.max(36,width)+'px';
    el.style.top=top+'px';el.style.height=bandH+'px';
    const txtContainer=document.createElement('div');txtContainer.className='event-text-container';
    const txt=document.createElement('div');txt.className='event-text';txt.textContent=seg.ev.summary;txt.setAttribute('data-text',seg.ev.summary);
    txtContainer.appendChild(txt);el.appendChild(txtContainer);
    el.onclick=()=>{$('modal-content').innerHTML=`<h3>${seg.ev.summary}</h3><p>${fmt(seg.ev._start,{weekday:'long',day:'2-digit',month:'long'})}</p>`;$('event-modal').style.display='flex';};
    layer.appendChild(el);
  });
  updateScrolling();

  // titre mois
  const months=new Set();for(let i=0;i<totalDays;i++)months.add(fmt(new Date(start.getTime()+i*86400000),{month:'long'}));
  $('calendar-title').textContent=Array.from(months).join(' / ');
}

// navigation
$('prev-btn').onclick=()=>{currentStart.setDate(currentStart.getDate()-7); renderCalendar();}
$('next-btn').onclick=()=>{currentStart.setDate(currentStart.getDate()+7); renderCalendar();}
$('today-btn').onclick=()=>{currentStart=new Date(); renderCalendar();}
$('view-3w').onclick=()=>{weekView=3; renderCalendar();}
$('view-4w').onclick=()=>{weekView=4; renderCalendar();}

// horloge
setInterval(()=>{const now=new Date();$('current-time').textContent=`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;},1000);

// rafraîchissement cache toutes les 30s
setInterval(()=>{renderCalendar();},30000);

window.addEventListener('resize',()=>{setTimeout(renderCalendar,200);});
renderCalendar();
})();
</script>
</body>
</html>
