<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tableau de bord - Ponts & Calendrier</title>

<style>
/* ------------------ RESET ------------------ */
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:#0f0f10;
    color:#fff;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* ------------------ HEADER ------------------ */
#calendar-header{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    color:#00e5ff;
    border-bottom:1px solid #333;
    position:relative;
}

/* Boutons */
.nav-btn{
    cursor:pointer;
    color:#00e5ff;
    font-size:28px;
    padding:4px 12px;
    border-radius:8px;
}
.nav-btn:hover{background:#222}

.view-btn{
    cursor:pointer;
    font-size:15px;
    padding:5px 12px;
    background:#222;
    border-radius:8px;
    border:1px solid #333;
    color:#00e5ff;
}
.view-btn:hover{background:#333}

#today-btn{font-size:17px}

/* Titre centré */
#calendar-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-weight:bold;
    font-size:1.3rem;
    white-space:nowrap;
}

/* ------------------ HEURE ------------------ */
/* ⭐ VERSION FINALE AVEC NEON + GLASS + ANIMATION ⭐ */
#current-time{
    position:absolute;
    right:25px;
    top:50%;
    transform:translateY(-50%);
    font-size:4.2rem;
    font-weight:bold;
    color:#ffea00;

    /* Glow néon */
    text-shadow:
        0 0 6px #ffea00,
        0 0 12px #ffea00aa,
        0 0 26px #ffea00aa;

    /* légère animation pulsée */
    animation:clockPulse 3s infinite ease-in-out;

    /* glassmorphism badge */
    padding:6px 18px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.08);

    font-family:"Trebuchet MS",sans-serif;
}

@keyframes clockPulse {
    0%,100% { text-shadow:0 0 6px #ffea00,0 0 12px #ffea00aa; }
    50% { text-shadow:0 0 16px #ffea00,0 0 32px #ffea00; }
}

/* Responsive */
@media(max-width:720px){
    #current-time{font-size:2.7rem;right:10px;}
}

/* ------------------ CALENDRIER ------------------ */
#calendar-wrap{
    flex:1;display:flex;flex-direction:column;
    min-height:0;position:relative
}
#calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    padding:10px;
    align-content:start;
    position:relative
}
.day-cell{
    background:#1c1c1c;
    border:1px solid #333;
    border-radius:10px;
    padding:6px;
    min-height:80px;
    position:relative;
    overflow:hidden;
}
.day-cell.future-day{
    border:1px solid rgba(0,229,255,0.3);
    box-shadow:0 0 4px rgba(0,229,255,0.2);
}
.day-cell.today{
    border:2px solid rgba(0,229,255,0.9);
    box-shadow:0 0 14px rgba(0,229,255,0.7);
    animation:pulse 2s infinite;
}
@keyframes pulse {
    0%{box-shadow:0 0 10px rgba(0,229,255,0.6);}
    50%{box-shadow:0 0 22px rgba(0,229,255,0.9);}
    100%{box-shadow:0 0 10px rgba(0,229,255,0.6);}
}

.date-label{
    font-size:0.75rem;
    color:#cbd6da;
    margin-bottom:6px;
}

.past-day-overlay{
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.4);
    border-radius:8px;
}

/* ------------------ ÉVÉNEMENTS ------------------ */
#events-layer{
    position:absolute;left:2px;right:6px;top:10px;bottom:10px;
}

.multi-band,.single-evt{
    position:absolute;display:flex;align-items:center;
    padding:0 10px;height:22px;
    border-radius:12px;font-size:0.78rem;
    white-space:nowrap;overflow:hidden;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.09);
    backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
    transition:transform .15s;
}
.multi-band:hover,.single-evt:hover{
    transform:translateY(-2px);
}

/* Couleurs */
.reception{
    background:rgba(0,255,140,0.25);
    border:1px solid #00ff96;
    box-shadow:0 0 10px #00ffbb;
}
.navire{
    background:rgba(0,140,255,0.25);
    border:1px solid #19aaff;
    box-shadow:0 0 10px #1ebaff;
}

/* Scroll automatique des longs textes */
.event-text.scrolling{
    animation:scroll 10s linear infinite;
}
@keyframes scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-100%)}
}

/* Modale */
#event-modal{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
}
.modal-card{
    background:#222;padding:20px;
    border-radius:12px;
    width:90%;max-width:720px;
}
</style>
</head>

<body>

<!-- ---------------- HEADER ---------------- -->
<div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span class="nav-btn" id="today-btn">Aujourd’hui</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>

    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>

    <div id="current-time"></div>
</div>

<!-- ---------------- CALENDRIER ---------------- -->
<div id="calendar-wrap">
    <div id="calendar"></div>
    <div id="events-layer"></div>
</div>

<!-- ---------------- MODALE ---------------- -->
<div id="event-modal" onclick="hideModal()">
    <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<!-- ---------------- JAVASCRIPT ---------------- -->
<script>
/* HORLOGE */
function updateClock(){
    const now=new Date();
    document.getElementById("current-time").textContent =
        now.toLocaleTimeString("fr-FR",{hour12:false});
}
setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
