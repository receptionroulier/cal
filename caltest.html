<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>caltest - calendrier (final)</title>
<style>
/* ---------------- Base / layout ---------------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f10;color:#fff;display:flex;flex-direction:column;height:100vh}

/* header */
#calendar-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 12px;color:#00e5ff;border-bottom:1px solid #333;flex:0 0 auto}
#calendar-header .left{display:flex;gap:8px;align-items:center}
#calendar-header #calendar-title{font-size:20px;text-align:center;color:#00e5ff}
.nav-btn{cursor:pointer;color:#00e5ff;font-size:26px;padding:6px 10px;border-radius:6px;user-select:none}
.nav-btn:hover{background:#222}
.view-btn{cursor:pointer;font-size:14px;padding:6px 10px;background:#222;border-radius:6px;border:1px solid #333;color:#00e5ff}
.view-btn:hover{background:#333}

/* calendar container */
#calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:10px;align-content:start;position:relative}

/* cell */
.day-cell{background:#0f1112;border:1px solid #262626;border-radius:12px;padding:8px 10px;position:relative;overflow:hidden;min-height:90px}
.date-label{font-size:0.78rem;color:#cbd6da;margin-bottom:6px;font-weight:400;display:flex;justify-content:space-between;align-items:center}
.date-left{display:flex;flex-direction:column}
.date-day{font-weight:600;color:#e6f6fb;font-size:0.85rem}
.date-small{font-weight:400;color:#9fb6be;font-size:0.72rem}

/* events overlay layer */
#events-layer{position:absolute;left:10px;right:10px;top:10px;bottom:10px;pointer-events:none;z-index:40}

/* event common */
.multi-band, .single-evt{
  pointer-events:auto;
  position:absolute;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 8px;
  border-radius:8px;
  font-size:0.82rem;
  color:#fff;
  overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,0.25) inset;
  white-space:nowrap;
}

/* single-day specifics (1 line by default, allow up to 2 lines) */
.single-evt{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  white-space:normal;
  line-height:1.05em;
  word-wrap:break-word;
  word-break:break-word;
}

/* color classes */
.reception{background:#109c53}
.navire{background:#3644b3}

/* multi-band inner */
.multi-band .start{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;font-weight:600}
.multi-band .end{margin-left:auto;flex:0 0 auto;padding-left:8px;font-weight:600}

/* +X badge (top-right near date) */
.more-events{position:absolute;top:8px;right:10px;padding:3px 7px;background:rgba(0,0,0,0.55);border-radius:8px;font-size:0.72rem;cursor:pointer;pointer-events:auto;z-index:60}

/* popover/modal */
#event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
.modal-card{background:#121212;padding:18px;border-radius:12px;max-width:720px;width:94%;box-shadow:0 6px 24px rgba(0,0,0,0.6)}
.modal-card h3{margin-bottom:8px}
.modal-item{margin-bottom:8px}
.modal-item p{color:#d6e8ea;margin-top:6px;font-size:0.95rem}

/* small screens */
@media(max-width:840px){
  #calendar{gap:6px;padding:8px}
  .day-cell{padding:6px;min-height:70px}
  .nav-btn{font-size:22px;padding:6px}
}

/* visuals for today / past / future */
.day-cell.past{transform:scale(.98);opacity:.95}
.day-cell.today{transform:scale(1.01);border:1px solid rgba(0,185,255,0.12)}
/* halo/pulse (toggle via JS) */
.halo { box-shadow:0 0 18px rgba(0,185,255,0.14), 0 0 36px rgba(0,185,255,0.06) !important; }
.pulse { animation: pulse 1.8s infinite; }
@keyframes pulse{0%{transform:scale(1.00)}50%{transform:scale(1.02)}100%{transform:scale(1.00)}}

/* hover interactions */
.day-cell:hover{z-index:20}
.multi-band:hover, .single-evt:hover { transform:scale(1.02); z-index:80; }

/* ensure rounding for bands */
.multi-band, .single-evt{border-radius:8px;}

/* helper */
.small-muted{font-size:0.72rem;color:#9fb6be}
</style>
</head>
<body>
  <div id="calendar-header">
    <div class="left">
      <span class="nav-btn" id="prev-btn">‹</span>
    </div>
    <div id="calendar-title">Chargement…</div>
    <div class="left">
      <span class="nav-btn" id="next-btn">›</span>
      <span class="view-btn" id="view-3w">3 semaines</span>
      <span class="view-btn" id="view-4w">4 semaines</span>
      <span class="nav-btn" id="today-btn" style="font-size:15px;padding:6px 12px">Aujourd’hui</span>
    </div>
  </div>

  <div id="calendar-wrap">
    <div id="calendar" role="grid" aria-label="Calendrier"></div>
    <div id="events-layer" aria-hidden="false"></div>
  </div>

  <!-- Modal -->
  <div id="event-modal" onclick="hideModal()">
    <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

<script>
/* ---------------- Configuration & utils ---------------- */
const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
const CALENDAR_IDS = { reception:'receptionroulier@gmail.com', navire:'smr.programme@gmail.com' };
const CACHE_KEY = 'caltest_full_cache_s2';
const CACHE_TTL = 30000; // 30s

let weekView = 3;
let currentStartDate = new Date();

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function fmtTime(d){ return d ? new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''; }
function fmtDayLabel(d){ return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'}); }
function fmtFullDate(d){ return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }

function saveCache(items, hash){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({items,hash,ts:Date.now()})); }catch(e){}
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(Date.now() - (obj.ts||0) > CACHE_TTL) return null;
    return obj;
  }catch(e){return null;}
}
function hashItems(items){
  return JSON.stringify(items).split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
}

async function fetchCalendar(calendarId, timeMin, timeMax){
  const base = 'https://www.googleapis.com/calendar/v3/calendars/';
  const url = base + encodeURIComponent(calendarId) + '/events'
    + '?key=' + encodeURIComponent(API_KEY)
    + '&singleEvents=true&orderBy=startTime'
    + '&timeMin=' + encodeURIComponent(timeMin.toISOString())
    + '&timeMax=' + encodeURIComponent(timeMax.toISOString());
  const res = await fetch(url);
  if(!res.ok) throw new Error('Erreur fetch calendar ' + res.status);
  return res.json();
}

/* ---------------- Render core ---------------- */
async function renderCalendar(){
  const calendarEl = document.getElementById('calendar');
  const eventsLayer = document.getElementById('events-layer');
  calendarEl.innerHTML = '';
  eventsLayer.innerHTML = '';

  // visible window: monday of this week minus 7 days (past week first)
  const today = new Date(currentStartDate);
  const thisMonday = getMonday(today);
  const pastMonday = new Date(thisMonday); pastMonday.setDate(thisMonday.getDate() - 7);
  const startDate = pastMonday;
  const totalDays = weekView * 7;

  // compute row height based on available height
  const headerH = document.getElementById('calendar-header').getBoundingClientRect().height;
  const availH = Math.max(260, window.innerHeight - headerH - 36);
  const rowH = Math.floor((availH - 20) / weekView);
  calendarEl.style.gridAutoRows = rowH + 'px';

  // Build cell map
  const cellMap = [];
  const months = new Set();
  for(let i=0;i<totalDays;i++){
    const d = new Date(startDate); d.setDate(d.getDate() + i); d.setHours(0,0,0,0);
    const cell = document.createElement('div'); cell.className = 'day-cell';
    const cellDate = new Date(d);
    const now = new Date(); now.setHours(0,0,0,0);
    if(cellDate.getTime() < now.getTime()) cell.classList.add('past');
    if(cellDate.getTime() === now.getTime()) cell.classList.add('today');
    const label = document.createElement('div'); label.className = 'date-label';
    const left = document.createElement('div'); left.className='date-left';
    const dayLine = document.createElement('div'); dayLine.className='date-day';
    dayLine.textContent = d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'});
    const smallLine = document.createElement('div'); smallLine.className='date-small';
    smallLine.textContent = d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
    left.appendChild(dayLine); left.appendChild(smallLine);
    label.appendChild(left);
    cell.appendChild(label);
    calendarEl.appendChild(cell);
    cellMap.push({date:d, el:cell, eventsList:[], totalSegments:0, hiddenCount:0});
    months.add(capitalize(d.toLocaleDateString('fr-FR',{month:'long'})));
  }

  // Load events (cache)
  const timeMin = new Date(startDate); timeMin.setHours(0,0,0,0);
  const timeMax = new Date(timeMin); timeMax.setDate(timeMax.getDate() + totalDays);
  const cache = loadCache();
  let items;
  if(cache) items = cache.items;
  else {
    const [r1, r2] = await Promise.allSettled([
      fetchCalendar(CALENDAR_IDS.reception, timeMin, timeMax),
      fetchCalendar(CALENDAR_IDS.navire, timeMin, timeMax)
    ]);
    const items1 = r1.status === 'fulfilled' ? (r1.value.items||[]) : [];
    const items2 = r2.status === 'fulfilled' ? (r2.value.items||[]) : [];
    items = [
      ...items1.map(i=>({...i, __type:'reception'})),
      ...items2.map(i=>({...i, __type:'navire'}))
    ];
    saveCache(items, hashItems(items));
  }

  // Normalize events
  const norm = items.map(ev=>{
    const e = JSON.parse(JSON.stringify(ev));
    e.__type = e.__type || '';
    e._isAllDay = !!(e.start && e.start.date && !e.start.dateTime);
    if(e.start){
      if(e.start.dateTime) e._start = new Date(e.start.dateTime);
      else { e._start = new Date(e.start.date); e._start.setHours(0,0,0,0); }
    }
    if(e.end){
      if(e.end.dateTime) e._end = new Date(e.end.dateTime);
      else { e._end = new Date(e.end.date); e._end.setHours(0,0,0,0); }
    }
    if(e._isAllDay && e._end){
      const adj = new Date(e._end); adj.setDate(adj.getDate() - 1); adj.setHours(23,59,59,999); e._endInclusive = adj;
    } else if(e._end){
      const tmp = new Date(e._end);
      if(tmp.getHours()===0 && tmp.getMinutes()===0 && tmp.getSeconds()===0){
        const adj = new Date(tmp); adj.setDate(adj.getDate() - 1); adj.setHours(23,59,59,999); e._endInclusive = adj;
      } else { e._endInclusive = new Date(e._end); }
    }
    return e;
  }).filter(e=>e._start && e._endInclusive);

  // Build segments (split per week)
  const segments = [];
  norm.forEach(ev=>{
    const sDay = new Date(ev._start); sDay.setHours(0,0,0,0);
    const eDay = new Date(ev._endInclusive); eDay.setHours(0,0,0,0);
    let cursor = new Date(sDay);
    while(cursor <= eDay){
      const weekIndex = Math.floor((cursor - startDate) / (7*24*3600*1000));
      if(weekIndex < 0){ cursor = new Date(startDate); continue; }
      if(weekIndex >= weekView) break;
      const weekStartIdx = weekIndex*7;
      const weekEndIdx = Math.min(weekStartIdx+6, cellMap.length-1);
      let segStartIdx = -1;
      for(let i=weekStartIdx;i<=weekEndIdx;i++){ if(cellMap[i].date.getTime() >= cursor.getTime()){ segStartIdx = i; break; } }
      if(segStartIdx === -1){ cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate()+1); continue; }
      let segEndIdx = -1;
      for(let i=weekEndIdx;i>=weekStartIdx;i--){ if(cellMap[i].date.getTime() <= eDay.getTime()){ segEndIdx = i; break; } }
      if(segEndIdx === -1){ cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate()+1); continue; }
      segments.push({ev, startIdx:segStartIdx, endIdx:segEndIdx, weekIdx:weekIndex, segStartDate:new Date(cellMap[segStartIdx].date), segEndDate:new Date(cellMap[segEndIdx].date)});
      cursor = new Date(cellMap[segEndIdx].date); cursor.setDate(cursor.getDate()+1);
    }
  });

  // measure DOM and sizes
  await new Promise(r=>requestAnimationFrame(r));
  const calendarRect = calendarEl.getBoundingClientRect();
  const cellRects = cellMap.map(c=>c.el.getBoundingClientRect());
  const dateLabelH = document.querySelector('.date-label')?.getBoundingClientRect().height||18;
  const bandH = 22;
  const laneGap = 6;
  const bandSpacing = bandH + laneGap;
  const weekTopBase = [];
  for(let w=0; w<weekView; w++){ const idx=w*7; weekTopBase[w]=idx<cellRects.length?cellRects[idx].top-calendarRect.top:0; }
  const visibleLanesPerWeek = [];
  for(let w=0; w<weekView; w++){ const avail=rowH-(dateLabelH+8); visibleLanesPerWeek[w]=Math.max(0,Math.floor((avail+laneGap)/bandSpacing)); }

  // DETECT single-day by S2: start and endInclusive same day and not all-day
  segments.forEach(seg=>{
    seg._isSingle = (!seg.ev._isAllDay) && (new Date(seg.ev._start).toDateString() === new Date(seg.ev._endInclusive).toDateString());
    seg._span = 1;
  });

  // measure single span (1 or 2 lines) using off-DOM measure
  function measureSingleSpan(seg){
    const width = Math.max(60, (cellRects[seg.startIdx].width - 12));
    const tmp = document.createElement('div');
    tmp.style.position='absolute'; tmp.style.left='-9999px'; tmp.style.top='-9999px';
    tmp.style.width = width + 'px';
    tmp.style.font = getComputedStyle(document.body).font;
    tmp.style.lineHeight = '1.05em';
    tmp.style.whiteSpace = 'normal';
    tmp.style.padding = '0 6px';
    tmp.style.boxSizing = 'border-box';
    tmp.textContent = ('<' + fmtTime(seg.ev._start) + ' ') + (seg.ev.summary || '');
    document.body.appendChild(tmp);
    const h = tmp.getBoundingClientRect().height;
    document.body.removeChild(tmp);
    return (h > (bandH + 4)) ? 2 : 1;
  }
  segments.forEach(seg=>{
    if(seg._isSingle){
      seg._span = measureSingleSpan(seg);
      if(seg._span > 2) seg._span = 2;
    } else seg._span = 1;
  });

  /* ---------------- PACK segments per week into visible lanes ----------------
     Display priority: multi (3) > single (2) > all-day (1)
     Masking order to hide first: all-day -> single -> multi (last)
  --------------------------------------------------------------- */
  const visibleSegmentsByWeek = Array.from({length:weekView}, ()=>[]);
  for(let w=0; w<weekView; w++){
    const segs = segments.filter(s => s.weekIdx === w);
    // compute visible lane count
    const visibleLaneCount = visibleLanesPerWeek[w] || 0;
    // sort by display priority (higher first)
    segs.sort((a,b)=>{
      const pa = (!a.ev._isAllDay && (a.startIdx !== a.endIdx)) ? 3 : (a._isSingle ? 2 : 1);
      const pb = (!b.ev._isAllDay && (b.startIdx !== b.endIdx)) ? 3 : (b._isSingle ? 2 : 1);
      if(pa !== pb) return pb - pa;
      if(a.startIdx !== b.startIdx) return a.startIdx - b.startIdx;
      return (a.endIdx - a.startIdx) - (b.endIdx - b.startIdx);
    });
    // greedy pack
    let slotsLeft = visibleLaneCount;
    const packed = [];
    for(const seg of segs){
      const need = seg._span || 1;
      if(need <= slotsLeft){
        packed.push(seg); slotsLeft -= need;
      }
    }
    visibleSegmentsByWeek[w] = packed;
  }

  // mark hidden segments
  segments.forEach(seg=>{ seg._isHidden = !(visibleSegmentsByWeek[seg.weekIdx]||[]).includes(seg); });

  // compute per-cell eventsList and hiddenCount for +X
  cellMap.forEach(c=>{ c.eventsList=[]; c.totalSegments=0; c.hiddenCount=0; });
  segments.forEach(seg=>{
    for(let i=seg.startIdx;i<=seg.endIdx;i++){
      if(i>=0 && i<cellMap.length){
        const c = cellMap[i];
        c.totalSegments++;
        if(!c.eventsList.find(x=>x && x.id === seg.ev.id)) c.eventsList.push(seg.ev);
        if(seg._isHidden) c.hiddenCount++;
      }
    }
  });

  /* ---------------- RENDER visible segments (packed) ---------------- */
  for(let w=0; w<weekView; w++){
    const vis = visibleSegmentsByWeek[w] || [];
    let offset = 0;
    for(const seg of vis){
      const firstRect = cellRects[seg.startIdx];
      const lastRect = cellRects[seg.endIdx];
      if(!firstRect || !lastRect){ offset += (seg._span||1); continue; }
      const left = firstRect.left - calendarRect.left;
      const width = (lastRect.left + lastRect.width) - firstRect.left;
      const slotTop = (weekTopBase[w] || 0) + dateLabelH + 6 + (offset * bandSpacing);

      if(seg._isSingle){
        // render single-day in its own style (allows 2 lines)
        const el = document.createElement('div');
        el.className = 'single-evt ' + (seg.ev.__type || '');
        el.style.left = left + 'px';
        el.style.width = Math.max(36, firstRect.width - 6) + 'px';
        el.style.top = slotTop + 'px';
        el.style.height = (bandH * seg._span + (seg._span>1?6:0)) + 'px';
        const startTime = '<' + fmtTime(seg.ev._start) + ' ';
        const span = document.createElement('span');
        span.className = 'start';
        span.textContent = (startTime + (seg.ev.summary || ''));
        el.appendChild(span);
        el.addEventListener('click', e=>{ e.stopPropagation(); showEventModal(seg.ev); });
        eventsLayer.appendChild(el);
      } else {
        // render multi-day / all-day band
        const el = document.createElement('div');
        el.className = 'multi-band ' + (seg.ev.__type || '');
        el.style.left = left + 'px';
        el.style.width = Math.max(36, width - 4) + 'px';
        el.style.top = slotTop + 'px';
        el.style.height = bandH + 'px';
        const startSpan = document.createElement('span'); startSpan.className='start';
        const evStartTime = seg.ev._isAllDay ? '' : fmtTime(seg.ev._start);
        startSpan.textContent = (evStartTime ? ('<' + evStartTime + ' ') : '') + (seg.ev.summary || '');
        const endSpan = document.createElement('span'); endSpan.className='end';
        let endTimeText = '';
        if(!seg.ev._isAllDay){
          const segEnd = new Date(seg.segEndDate); segEnd.setHours(23,59,59,999);
          if(segEnd.getTime() < seg.ev._endInclusive.getTime()) endTimeText = '>23:59';
          else endTimeText = '>' + fmtTime(seg.ev._end);
        }
        endSpan.textContent = endTimeText;
        el.appendChild(startSpan); el.appendChild(endSpan);
        el.addEventListener('click', e=>{ e.stopPropagation(); showEventModal(seg.ev); });
        eventsLayer.appendChild(el);
      }
      offset += (seg._span || 1);
    }
  }

  // Render +X badges per cell
  cellMap.forEach((c, idx)=>{
    const existing = c.el.querySelectorAll('.more-events'); existing.forEach(n=>n.remove());
    if(c.hiddenCount && c.hiddenCount > 0){
      const badge = document.createElement('div');
      badge.className = 'more-events';
      badge.textContent = '+' + c.hiddenCount + ' autres';
      badge.addEventListener('click', e=>{ e.stopPropagation(); showModalForCell(c); });
      c.el.appendChild(badge);
    }
  });

  // Title months
  document.getElementById('calendar-title').textContent = Array.from(months).join(' / ');

  // halo/pulse on today
  document.querySelectorAll('.halo,.pulse').forEach(n=>{ n.classList.remove('halo','pulse'); });
  const todayIdx = cellMap.findIndex(c => { const n = new Date(); n.setHours(0,0,0,0); return c.date.getTime() === n.getTime(); });
  if(todayIdx !== -1){
    const todayCell = cellMap[todayIdx].el;
    todayCell.classList.add('halo','pulse');
  }
}

/* ---------------- Modals ---------------- */
function showEventModal(ev){
  const modal = document.getElementById('event-modal');
  const content = document.getElementById('modal-content');
  const start = ev._start, end = ev._end;
  const isAll = ev._isAllDay;
  const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
  let html = `<h3>${ev.summary || '(sans titre)'}</h3>`;
  if(isMulti){
    html += `<div class="modal-item"><p>Du ${fmtFullDate(start)} à ${fmtTime(start)}<br>Au ${fmtFullDate(end)} à ${fmtTime(end)}</p></div>`;
  } else if(isAll){
    html += `<div class="modal-item"><p>Le ${fmtFullDate(start)}</p></div>`;
  } else {
    html += `<div class="modal-item"><p>Le ${fmtFullDate(start)} à ${fmtTime(start)}</p></div>`;
  }
  if(ev.description) html += `<div class="modal-item"><p>${ev.description}</p></div>`;
  content.innerHTML = html;
  modal.style.display = 'flex';
}
function hideModal(){ document.getElementById('event-modal').style.display = 'none'; }

function showModalForCell(cellObj){
  const modal = document.getElementById('event-modal');
  const content = document.getElementById('modal-content');
  const events = cellObj.eventsList || [];
  const parts = [];
  events.forEach(ev=>{
    const start = ev._start, end = ev._end;
    const isAll = ev._isAllDay;
    const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
    if(isMulti){
      parts.push(`<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3><p>&lt;${fmtTime(start)} ${ev.summary} … &gt;${fmtTime(end)}</p>${ev.description?'<p>'+ev.description+'</p>':''}</div>`);
    } else if(isAll){
      parts.push(`<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3><p>Le ${fmtFullDate(start)}</p>${ev.description?'<p>'+ev.description+'</p>':''}</div>`);
    } else {
      parts.push(`<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3><p>Le ${fmtFullDate(start)} à ${fmtTime(start)}</p>${ev.description?'<p>'+ev.description+'</p>':''}</div>`);
    }
  });
  content.innerHTML = parts.length ? parts.join('<hr style="border:none;border-top:1px solid #333;margin:8px 0">') : '<p>Aucun évènement</p>';
  modal.style.display = 'flex';
}

/* ---------------- Navigation bindings ---------------- */
document.getElementById('prev-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()-7); renderCalendar(); });
document.getElementById('next-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()+7); renderCalendar(); });
document.getElementById('today-btn').addEventListener('click', ()=>{ currentStartDate=new Date(); weekView=3; renderCalendar(); });
document.getElementById('view-3w').addEventListener('click', ()=>{ weekView=3; renderCalendar(); });
document.getElementById('view-4w').addEventListener('click', ()=>{ weekView=4; renderCalendar(); });

window.addEventListener('resize', ()=>{ requestAnimationFrame(()=> renderCalendar()); });
document.getElementById('event-modal').addEventListener('click', hideModal);

/* initial */
renderCalendar().catch(err=>{ console.error('render error', err); document.getElementById('calendar-title').textContent='Erreur'; });
</script>
</body>
</html>
