<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendrier Réception</title>
<style>
/* === Styles simplifiés === */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:linear-gradient(135deg,#0f172a,#1e293b); color:#fff; display:flex;flex-direction:column;height:100vh;min-height:0;}
#calendar-header{display:flex;flex-wrap:nowrap;align-items:center;gap:6px; padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); backdrop-filter:blur(8px); min-height:52px;position:relative;}
.header-left{display:flex;align-items:center;gap:5px;flex-shrink:0;}
#calendar-title{position:absolute;left:50%;transform:translateX(-50%); font-weight:bold;font-size:1.1rem;white-space:nowrap;pointer-events:none; max-width:calc(100% - 320px);overflow:hidden;text-overflow:ellipsis;text-align:center;}
#current-time{margin-left:auto;flex-shrink:0;font-size:2rem;font-weight:bold; font-family:"Trebuchet MS",sans-serif;white-space:nowrap;}
.nav-btn{cursor:pointer;color:#fff;font-size:24px;padding:2px 8px;border-radius:6px;line-height:1;flex-shrink:0;}
.nav-btn:hover{background:rgba(255,255,255,0.1)}
.view-btn{cursor:pointer;font-size:12px;padding:4px 8px;background:rgba(255,255,255,0.08);border-radius:6px;border:1px solid rgba(255,255,255,0.15);color:#fff;flex-shrink:0;white-space:nowrap;}
.view-btn:hover{background:rgba(255,255,255,0.15)}
#calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative;}
.day-cell{ background:rgba(255,255,255,0.05);backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08);border-radius:10px; padding:6px;position:relative;overflow:visible;min-height:80px; }
.day-cell.today{background:rgba(0,229,255,0.08);border:2px solid rgba(0,229,255,0.75);box-shadow:0 0 8px rgba(0,229,255,0.5);}
.date-label{font-size:0.72rem;color:#9bb4be;margin-bottom:6px;font-weight:400;}
#events-layer{position:absolute;left:2px;right:6px;top:10px;bottom:10px;pointer-events:none; z-index:10;}
.multi-band,.single-evt{pointer-events:auto;position:absolute;display:flex;align-items:center;padding:0 10px;height:22px;border-radius:12px;font-size:0.78rem;color:#fff;white-space:nowrap;overflow:hidden; background:linear-gradient(135deg,rgba(255,255,255,0.02),rgba(255,255,255,0.03)); border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(6px) saturate(150%);}
#mobile-wrap{display:none;flex:1;overflow-y:auto;flex-direction:column;gap:6px;padding:8px 12px 40px;}
.mob-day{ background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08); border-radius:12px;overflow:hidden; flex-shrink:0; padding:6px;}
.mob-evt{padding:6px 10px;margin:3px 0;border-radius:10px;font-size:0.85rem;background:rgba(0,229,255,0.1);cursor:pointer;}
#event-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:9999;}
.modal-card{background:#1e293b;padding:16px;border-radius:12px;max-width:400px;width:90%;color:#fff;}
</style>
</head>
<body>

<div id="calendar-header">
  <div class="header-left">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span class="nav-btn" id="today-btn" style="font-size:13px;padding:4px 10px;">Aujourd'hui</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
  </div>
  <span id="calendar-title">Chargement…</span>
  <div id="current-time"></div>
</div>

<div id="calendar-wrap">
  <div id="calendar" role="grid" aria-label="Calendrier"></div>
  <div id="events-layer" aria-hidden="false"></div>
</div>

<div id="mobile-wrap"></div>

<div id="event-modal">
  <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function() {
  const PROXY_URL = '/proxy';
  const CALENDAR_IDS = { reception:'receptionroulier@gmail.com', navire:'smr.programme@gmail.com' };
  let weekView = 3, currentStartDate = new Date();
  let allEvents = [];

  // ===== UTILS =====
  function parseLocalDate(str){ const [y,m,d]=str.split('-').map(Number); return new Date(y,m-1,d);}
  function getMonday(d){ const date=new Date(d); const day=date.getDay(); const diff=(day===0?-6:1-day); date.setDate(date.getDate()+diff); date.setHours(0,0,0,0); return date;}
  function fmtTime(d){ return d ? new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''; }

  async function fetchCalendarsRange(timeMin,timeMax){
    const fetchCal = async (id,type)=>{
      try{
        const resp = await fetch(`${PROXY_URL}?id=${encodeURIComponent(id)}&timeMin=${timeMin.toISOString()}&timeMax=${timeMax.toISOString()}`);
        const data = await resp.json();
        return (data.items||[]).map(i=>({...i,__type:type}));
      }catch(e){ console.error('Fetch error',type,e); return []; }
    };
    const [reception,navire] = await Promise.all([
      fetchCal(CALENDAR_IDS.reception,'reception'),
      fetchCal(CALENDAR_IDS.navire,'navire')
    ]);
    return [...reception,...navire];
  }

  function normalizeItems(items){
    return items.map(ev=>{
      const copy = JSON.parse(JSON.stringify(ev));
      copy.__type = copy.__type||'';
      copy._isAllDay = !!(copy.start && copy.start.date && !copy.start.dateTime);
      if(copy.start){ copy._start=copy.start.dateTime ? new Date(copy.start.dateTime) : parseLocalDate(copy.start.date); if(copy._isAllDay) copy._start.setHours(0,0,0,0);}
      if(copy.end){ copy._end=copy.end.dateTime?new Date(copy.end.dateTime):parseLocalDate(copy.end.date);
        if(copy._isAllDay){ copy._endInclusive=new Date(copy._end); copy._endInclusive.setDate(copy._endInclusive.getDate()-1); copy._endInclusive.setHours(23,59,59,999);}
        else copy._endInclusive=new Date(copy._end.getTime());
      }
      if(!copy._endInclusive && copy._end) copy._endInclusive=new Date(copy._end.getTime());
      return copy;
    }).filter(e=>e._start && e._endInclusive);
  }

  // ===== CLOCK =====
  function updateClock(){ const now=new Date(); document.getElementById('current-time').textContent=
    `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`; }
  setInterval(updateClock,1000); updateClock();

  // ===== MODAL =====
  function hideModal(){ document.getElementById('event-modal').style.display='none'; }
  document.getElementById('event-modal').addEventListener('click',hideModal);
  function showEventModal(ev){
    const modal=document.getElementById('event-modal'), content=document.getElementById('modal-content');
    const start=ev._start,end=ev._end,isAll=ev._isAllDay;
    let html=`<h3>${ev.summary||'(sans titre)'}</h3>`;
    if(isAll) html+=`<div>Journée complète</div>`;
    else html+=`<div>${start.toLocaleString()} → ${end.toLocaleString()}</div>`;
    content.innerHTML=html; modal.style.display='flex';
  }

  // ===== RENDER MOBILE =====
  async function renderMobile(){
    const wrap=document.getElementById('mobile-wrap'); wrap.innerHTML='';
    const startDate=getMonday(currentStartDate);
    const endDate=new Date(startDate); endDate.setDate(endDate.getDate()+7*weekView);
    const items = normalizeItems(await fetchCalendarsRange(startDate,endDate));

    let dayMap={};
    for(let ev of items){
      let d=new Date(ev._start); d.setHours(0,0,0,0);
      let key=d.toISOString().split('T')[0];
      if(!dayMap[key]) dayMap[key]=[];
      dayMap[key].push(ev);
    }

    for(let d=startDate; d<endDate; d.setDate(d.getDate()+1)){
      let dayDiv=document.createElement('div'); dayDiv.className='mob-day';
      let dayLabel=document.createElement('strong'); dayLabel.textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}); dayDiv.appendChild(dayLabel);
      let key=d.toISOString().split('T')[0];
      let evs=dayMap[key]||[];
      evs.slice(0,3).forEach(ev=>{
        let eDiv=document.createElement('div'); eDiv.className='mob-evt'; eDiv.textContent=ev.summary||'(sans titre)'; eDiv.onclick=()=>showEventModal(ev); dayDiv.appendChild(eDiv);
      });
      if(evs.length>3){
        let more=document.createElement('div'); more.className='mob-evt'; more.textContent=`+${evs.length-3} événements`; dayDiv.appendChild(more);
      }
      wrap.appendChild(dayDiv);
    }
  }

  // ===== RENDER DESKTOP =====
  async function renderCalendar(){
    const cal=document.getElementById('calendar'); cal.innerHTML='';
    const startDate=getMonday(currentStartDate);
    const endDate=new Date(startDate); endDate.setDate(endDate.getDate()+7*weekView);
    const items=normalizeItems(await fetchCalendarsRange(startDate,endDate));
    let dayElems=[];
    for(let d=startDate; d<endDate; d.setDate(d.getDate()+1)){
      let cell=document.createElement('div'); cell.className='day-cell';
      if(d.toDateString()===new Date().toDateString()) cell.classList.add('today');
      let lbl=document.createElement('div'); lbl.className='date-label'; lbl.textContent=d.getDate(); cell.appendChild(lbl);
      cal.appendChild(cell); dayElems.push(cell);
    }

    // Position events
    items.forEach(ev=>{
      let startIdx=Math.floor((ev._start - startDate)/(1000*60*60*24));
      if(startIdx<0) startIdx=0;
      if(startIdx>=dayElems.length) startIdx=dayElems.length-1;
      let div=document.createElement('div'); div.className='single-evt'; div.textContent=ev.summary||'(sans titre)'; div.onclick=()=>showEventModal(ev);
      dayElems[startIdx].appendChild(div);
    });
  }

  // ===== RENDER LOGIC =====
  async function render(){
    if(window.innerWidth<720){
      document.getElementById('mobile-wrap').style.display='flex';
      document.getElementById('calendar-wrap').style.display='none';
      await renderMobile();
    } else {
      document.getElementById('mobile-wrap').style.display='none';
      document.getElementById('calendar-wrap').style.display='flex';
      await renderCalendar();
    }
    document.getElementById('calendar-title').textContent=`Semaine du ${getMonday(currentStartDate).toLocaleDateString('fr-FR')}`;
  }

  // ===== INIT =====
  render();
  window.addEventListener('resize',render);
  setInterval(render, 5*60*1000); // auto-refresh toutes les 5min
});
</script>
</body>
</html>
