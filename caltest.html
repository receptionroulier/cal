<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tableau de bord - Ponts & Calendrier</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f10;color:#fff;display:flex;flex-direction:column;height:100vh}
  /* header */
  #calendar-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 10px;color:#00e5ff;border-bottom:1px solid #333;position:relative}
  .nav-btn{cursor:pointer;color:#00e5ff;font-size:26px;padding:4px 10px;border-radius:6px}
  .nav-btn:hover{background:#222}
  .view-btn{cursor:pointer;font-size:14px;padding:4px 10px;background:#222;border-radius:6px;border:1px solid #333;color:#00e5ff}
  .view-btn:hover{background:#333}
  /* heure */
  #current-time{position:absolute;right:50px;top:50%;transform:translateY(-50%);font-size:3rem;font-weight:bold;color:#00e5ff;font-family:Trebuchet MS}
  /* calendar */
  #calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative}
  /* day cell */
  .day-cell{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:6px;position:relative;overflow:hidden;min-height:80px}
  .day-cell.future-day { border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 4px rgba(0, 229, 255, 0.2); }
  .day-cell.today { border: 2px solid rgba(0, 229, 255, 0.8); box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }
    50% { box-shadow: 0 0 12px rgba(0, 229, 255, 0.8); }
    100% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }
  }
  .date-label{font-size:0.72rem;color:#cbd6da;margin-bottom:6px;font-weight:400}
  /* Voile pour les jours passés */
  .past-day-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 8px;
    pointer-events: none;
    z-index: 50;
  }
  /* events layer (absolute) */
  #events-layer{position:absolute;left:2px;right:6px;top:10px;bottom:10px;pointer-events:none}
  .multi-band, .single-evt {
    pointer-events:auto;
    position:absolute;
    display:flex;
    align-items:center;
    padding:0 8px;
    height:22px;
    border-radius:6px;
    font-size:0.78rem;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,0.2) inset;
  }
  .reception{background:#109c53}
  .navire{background:#3644b3}
  .event-text-container {
    display: inline-flex;
    white-space: nowrap;
    overflow: hidden;
    width: 100%;
    position: relative;
  }
  .event-text {
    white-space: nowrap;
    display: inline-block;
    position: relative;
  }
  .event-text.scrolling {
    animation: scroll 10s linear infinite;
  }
  .event-text.scrolling::after {
    content: attr(data-text);
    position: absolute;
    left: 100%;
    white-space: nowrap;
  }
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
  .single-evt{border-radius:6px;padding:0 8px;display:flex;align-items:center}
  /* +X */
  .more-events{position:absolute;top:6px;right:8px;padding:2px 6px;background:rgba(0,0,0,0.45);border-radius:6px;font-size:0.72rem;cursor:pointer;z-index:60;pointer-events:auto}
  /* modal */
  #event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
  .modal-card{background:#222;padding:18px;border-radius:10px;max-width:720px;width:94%}
  .modal-card h3{margin-bottom:6px}
  .modal-item{margin-bottom:10px}
  .modal-item p{color:#dbe7ea;margin-top:6px}
  /* responsive */
  @media(max-width:720px){ .day-cell{min-height:68px} }
</style>
</head>
<body>
  <div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
    <span class="nav-btn" id="today-btn" style="font-size:16px">Aujourd’hui</span>
    <div id="current-time"></div>
  </div>
  <div id="calendar-wrap">
    <div id="calendar" role="grid" aria-label="Calendrier"></div>
    <div id="events-layer" aria-hidden="false"></div>
  </div>
  <div id="event-modal" onclick="hideModal()">
    <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
  window.addEventListener('unhandledrejection', (event) => { event.preventDefault(); });

  const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
  const CALENDAR_IDS = { reception: 'receptionroulier@gmail.com', navire: 'smr.programme@gmail.com' };
  const CACHE_TTL = 30000;
  let weekView = 3;
  let currentStartDate = new Date();
  let resizeTimeout;

  function calculateHash(events) {
    return JSON.stringify(events.map(ev => ({ id: ev.id, updated: ev.updated, start: ev.start.dateTime || ev.start.date, end: ev.end.dateTime || ev.end.date, summary: ev.summary })));
  }

  function saveCache(items, hash, startDate, endDate) {
    try {
      localStorage.setItem(`caltest_v2_${startDate.toISOString()}_${endDate.toISOString()}`, JSON.stringify({ items, hash, ts: Date.now() }));
    } catch (e) { console.error('Erreur sauvegarde cache :', e); }
  }

  function loadCache(startDate, endDate) {
    try {
      const raw = localStorage.getItem(`caltest_v2_${startDate.toISOString()}_${endDate.toISOString()}`);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() - obj.ts > CACHE_TTL) return null;
      return obj;
    } catch (e) { return null; }
  }

  function getMonday(d) { const date = new Date(d); const day = date.getDay(); date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day)); date.setHours(0, 0, 0, 0); return date; }
  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function fmtTime(d) { return d ? new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : ''; }
  function fmtDayLabel(d) { return d.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit' }); }
  function fmtFullDate(d) { return new Date(d).toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' }); }

  async function fetchCalendar(calendarId, timeMin, timeMax) {
    try {
      const base = 'https://www.googleapis.com/calendar/v3/calendars/';
      const url = `${base}${encodeURIComponent(calendarId)}/events?key=${encodeURIComponent(API_KEY)}&singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Erreur API: ${res.status}`);
      return res.json();
    } catch (error) { console.error(`Erreur fetchCalendar pour ${calendarId}:`, error); throw error; }
  }

  async function renderCalendar() {
    const calendarEl = document.getElementById('calendar');
    const eventsLayer = document.getElementById('events-layer');
    calendarEl.innerHTML = ''; eventsLayer.innerHTML = '';
    const today = new Date(); today.setHours(0,0,0,0);

    const thisMonday = getMonday(currentStartDate);
    const startDate = new Date(thisMonday); startDate.setDate(startDate.getDate() - 7);
    const totalDays = weekView * 7;

    const headerH = document.getElementById('calendar-header').getBoundingClientRect().height;
    const availH = Math.max(240, window.innerHeight - headerH - 32);
    const rowH = Math.floor((availH - 20) / weekView);
    calendarEl.style.gridAutoRows = `${rowH}px`;

    const cellMap = [];
    const months = new Set();

    for (let i = 0; i < totalDays; i++) {
      const d = new Date(startDate); d.setDate(d.getDate() + i); d.setHours(0,0,0,0);
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (d > today) cell.classList.add('future-day');
      if (d.getTime() === today.getTime()) { cell.classList.add('today'); cell.setAttribute('aria-current','date'); }
      const label = document.createElement('div'); label.className = 'date-label'; label.textContent = fmtDayLabel(d);
      cell.setAttribute('aria-label', `${fmtFullDate(d)}`);
      cell.appendChild(label);
      calendarEl.appendChild(cell);
      cellMap.push({ date: d, el: cell, eventsList: [], visibleCount: 0 });
      months.add(capitalize(d.toLocaleString('fr-FR', { month: 'long' })));
    }

    const timeMin = new Date(startDate); timeMin.setHours(0,0,0,0);
    const timeMax = new Date(timeMin); timeMax.setDate(timeMax.getDate() + totalDays);

    let items;
    const cache = loadCache(timeMin, timeMax);
    if (cache) items = cache.items;
    else {
      const [r1, r2] = await Promise.allSettled([fetchCalendar(CALENDAR_IDS.reception,timeMin,timeMax),fetchCalendar(CALENDAR_IDS.navire,timeMin,timeMax)]);
      const items1 = r1.status==='fulfilled'? r1.value.items||[]:[];
      const items2 = r2.status==='fulfilled'? r2.value.items||[]:[];
      items = [...items1.map(i=>({...i,__type:'reception'})), ...items2.map(i=>({...i,__type:'navire'}))];
      saveCache(items, calculateHash(items), timeMin, timeMax);
    }

    const norm = items.map(ev=>{
      const e=JSON.parse(JSON.stringify(ev));
      e.__type=e.__type||'';
      e._isAllDay=!!(e.start&&e.start.date&&!e.start.dateTime);
      e._start=e.start.dateTime?new Date(e.start.dateTime):new Date(e.start.date); e._start.setHours(0,0,0,0);
      e._end=e.end.dateTime?new Date(e.end.dateTime):new Date(e.end.date); e._end.setHours(0,0,0,0);
      e._endInclusive=e._isAllDay?(new Date(e._end).setDate(e._end.getDate()-1), e._end):e._end;
      return e;
    }).filter(e=>e._start&&e._endInclusive);

    // Segmentation simplifiée
    const segments = norm.map(ev=>({ ev, startIdx: Math.max(0, Math.floor((ev._start-startDate)/(24*3600*1000))), endIdx: Math.min(cellMap.length-1, Math.floor((ev._endInclusive-startDate)/(24*3600*1000))) }));

    // Lanes
    const weekLanes = Array.from({length:weekView},()=>[]);
    segments.forEach(seg=>{
      const weekIdx = Math.floor(seg.startIdx/7);
      let lane=0; while(weekLanes[weekIdx][lane]&&weekLanes[weekIdx][lane].some(r=>!(seg.endIdx<r.startIdx||seg.startIdx>r.endIdx))) lane++;
      if(!weekLanes[weekIdx][lane]) weekLanes[weekIdx][lane]=[];
      weekLanes[weekIdx][lane].push(seg);
      seg.lane=lane;
    });

    // Création des éléments
    const bandH=22, laneGap=6, bandSpacing=bandH+laneGap;
    const dateLabelH=18;
    const weekTopBase=[];
    for(let w=0;w<weekView;w++){ weekTopBase[w]=cellMap[w*7].el.getBoundingClientRect().top - calendarEl.getBoundingClientRect().top; }
    const visibleLanesPerWeek=weekLanes.map(lanes=>Math.max(0, Math.floor((rowH-dateLabelH-8+laneGap)/bandSpacing)));

    segments.forEach(seg=>{
      const firstCell=cellMap[seg.startIdx].el.getBoundingClientRect();
      const lastCell=cellMap[seg.endIdx].el.getBoundingClientRect();
      const left=firstCell.left - calendarEl.getBoundingClientRect().left;
      const width=(lastCell.left + lastCell.width)-firstCell.left-6;
      const top=(weekTopBase[Math.floor(seg.startIdx/7)]||0)+dateLabelH+2+(seg.lane*bandSpacing);
      const el=document.createElement('div');
      el.className=`multi-band ${seg.ev.__type}`;
      el.style.cssText=`position:absolute;left:${left}px;width:${Math.max(36,width)}px;top:${top}px;height:${bandH}px;display:flex;align-items:center;padding:0 8px;border-radius:6px;color:#fff;`; 
      const text=document.createElement('div');
      text.className='event-text'; text.textContent=seg.ev.summary||'(sans titre)'; text.setAttribute('data-text',text.textContent);
      el.appendChild(text);
      if(seg.lane>=visibleLanesPerWeek[Math.floor(seg.startIdx/7)]) el.style.display='none';
      eventsLayer.appendChild(el);
    });

    document.getElementById('calendar-title').textContent=Array.from(months).join(' / ');
  }

  setInterval(()=>{ document.getElementById('current-time').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); },1000);
  setInterval(()=>{ renderCalendar(); }, CACHE_TTL);
  renderCalendar().catch(err=>{ console.error('render error',err); document.getElementById('calendar-title').textContent='Erreur'; });
});

</script>
</body>
</html>
