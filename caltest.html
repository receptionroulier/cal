<script>
// ===============================
// Données de démonstration
// ===============================
const multiBandsData = [
  {
    start: new Date("2025-01-08"),
    end: new Date("2025-01-17"),
    label: "Navire A (Chargement)",
    colorClass: "reception"
  },
  {
    start: new Date("2025-01-10"),
    end: new Date("2025-01-14"),
    label: "Navire B (Déchargement)",
    colorClass: "navire"
  },
  {
    start: new Date("2025-01-16"),
    end: new Date("2025-01-21"),
    label: "Réception C",
    colorClass: "reception"
  }
];

// ===============================
// Paramètres du Graph
// ===============================
let zoomLevel = 1; // 1 = jour, 2 = semaine
let bandH = 26;    // <--- MIS À JOUR POUR LE GLASSMORPHISM
let graphMarginLeft = 80;
let dayWidth = 100;

const svg = document.getElementById("timeline");
const daysGroup = document.getElementById("days");
const multiBandsGroup = document.getElementById("multi-bands");
const overlay = document.getElementById("bands-overlay");

// ===============================
// Mise à jour de la timeline
// ===============================
function updateTimeline() {
  daysGroup.innerHTML = "";
  multiBandsGroup.innerHTML = "";
  overlay.innerHTML = "";

  dayWidth = zoomLevel === 1 ? 120 : 60;

  // Génère les jours
  let current = new Date("2025-01-08");
  let end = new Date("2025-01-25");

  let x = graphMarginLeft;
  let yAxis = 10;

  while (current <= end) {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("transform", `translate(${x}, 0)`);

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("y", 30);
    text.setAttribute("class", "date-text");
    text.textContent = current.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", 0);
    line.setAttribute("y1", yAxis);
    line.setAttribute("x2", 0);
    line.setAttribute("y2", 2000);
    line.setAttribute("class", "grid-line");

    g.appendChild(text);
    g.appendChild(line);
    daysGroup.appendChild(g);

    current.setDate(current.getDate() + 1);
    x += dayWidth;
  }

  renderMultiBands();
}

// ===============================
// Rendu des bandes
// ===============================
function renderMultiBands() {
  multiBandsData.forEach((evt, i) => {
    const xStart = graphMarginLeft + getDayOffset(evt.start) * dayWidth;
    const xEnd = graphMarginLeft + getDayOffset(evt.end) * dayWidth;
    const width = xEnd - xStart;

    const y = 80 + i * (bandH + 10);

    // SVG placeholder invisible
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", xStart);
    rect.setAttribute("y", y);
    rect.setAttribute("width", width);
    rect.setAttribute("height", bandH);
    rect.setAttribute("fill", "transparent");
    multiBandsGroup.appendChild(rect);

    // Bande overlay HTML (glassmorphism)
    const bandDiv = document.createElement("div");
    bandDiv.className = `multi-band ${evt.colorClass}`;
    bandDiv.style.left = `${xStart}px`;
    bandDiv.style.top = `${y}px`;
    bandDiv.style.width = `${width}px`;

    const text = document.createElement("span");
    text.className = "event-text";
    text.textContent = evt.label;

    bandDiv.appendChild(text);
    overlay.appendChild(bandDiv);
  });
}

function getDayOffset(date) {
  const start = new Date("2025-01-08");
  return Math.floor((date - start) / (1000 * 60 * 60 * 24));
}

// ===============================
// Zoom Buttons
// ===============================
document.querySelectorAll(".zoom-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    zoomLevel = Number(btn.dataset.level);
    updateTimeline();
  });
});

// ===============================
// Initial Render
// ===============================
updateTimeline();
</script>

</body>
</html>
