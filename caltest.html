<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>caltest - calendrier</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f10;color:#fff;display:flex;flex-direction:column;height:100vh}
  /* header */
  #calendar-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 10px;color:#00e5ff;border-bottom:1px solid #333}
  .nav-btn{cursor:pointer;color:#00e5ff;font-size:26px;padding:4px 10px;border-radius:6px}
  .nav-btn:hover{background:#222}
  .view-btn{cursor:pointer;font-size:14px;padding:4px 10px;background:#222;border-radius:6px;border:1px solid #333;color:#00e5ff}
  .view-btn:hover{background:#333}
  /* calendar */
  #calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative}
  /* day cell */
  .day-cell{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:6px;position:relative;overflow:hidden;min-height:80px}
  .date-label{font-size:0.72rem;color:#cbd6da;margin-bottom:6px;font-weight:400}
  /* events layer (absolute) */
  #events-layer{position:absolute;left:10px;right:10px;top:10px;bottom:10px;pointer-events:none}
  .multi-band, .single-evt {
    pointer-events:auto;
    position:absolute;
    display:flex;
    align-items:center;
    padding:0 8px;
    height:22px;
    border-radius:6px;
    font-size:0.78rem;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,0.2) inset;
  }
  .reception{background:#109c53}
  .navire{background:#3644b3}
  .multi-band .start{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
  .multi-band .end{margin-left:auto}
  /* single event block (same visuals, but used for single-day events positioned in layer) */
  .single-evt{border-radius:6px;padding:0 8px;display:flex;align-items:center}
  /* +X */
  .more-events{position:absolute;top:6px;right:8px;padding:2px 6px;background:rgba(0,0,0,0.45);border-radius:6px;font-size:0.72rem;cursor:pointer;z-index:60;pointer-events:auto}
  /* modal */
  #event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
  .modal-card{background:#222;padding:18px;border-radius:10px;max-width:720px;width:94%}
  .modal-card h3{margin-bottom:6px}
  .modal-item{margin-bottom:10px}
  .modal-item p{color:#dbe7ea;margin-top:6px}
  /* responsive */
  @media(max-width:720px){ .day-cell{min-height:68px} }
</style>
</head>
<body>
  <div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
    <span class="nav-btn" id="today-btn" style="font-size:16px">Aujourd’hui</span>
  </div>

  <div id="calendar-wrap">
    <div id="calendar" role="grid" aria-label="Calendrier"></div>
    <!-- layer containing ALL events (multi-day, all-day, single-day) -->
    <div id="events-layer" aria-hidden="false"></div>
  </div>

  <!-- modal/popover -->
  <div id="event-modal" onclick="hideModal()">
    <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

<script>
/* ---------------- Configuration & utils  ---------------- */
const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
const CALENDAR_IDS = { reception:'receptionroulier@gmail.com', navire:'smr.programme@gmail.com' };
const CACHE_KEY = 'caltest_v2_cache';
const CACHE_TTL = 30000; // 30s
let weekView = 3;
let currentStartDate = new Date();

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function fmtTime(d){ return d ? new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''; }
function fmtDayLabel(d){ return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'}); }
function fmtFullDate(d){ return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }

function saveCache(items, hash){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({items,hash,ts:Date.now()})); }catch(e){}
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(Date.now() - (obj.ts||0) > CACHE_TTL) return null;
    return obj;
  }catch(e){return null;}
}
function hashItems(items){
  return JSON.stringify(items).split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
}

async function fetchCalendar(calendarId, timeMin, timeMax){
  const base = 'https://www.googleapis.com/calendar/v3/calendars/';
  const url = base + encodeURIComponent(calendarId) + '/events'
    + '?key=' + encodeURIComponent(API_KEY)
    + '&singleEvents=true&orderBy=startTime'
    + '&timeMin=' + encodeURIComponent(timeMin.toISOString())
    + '&timeMax=' + encodeURIComponent(timeMax.toISOString());
  const res = await fetch(url);
  if(!res.ok) throw new Error('Erreur fetch calendar ' + res.status);
  return res.json();
}

/* ---------------- Core rendering ---------------- */
async function renderCalendar(){
  const calendarEl = document.getElementById('calendar');
  const eventsLayer = document.getElementById('events-layer');
  calendarEl.innerHTML = '';
  eventsLayer.innerHTML = '';

  // Compute startDate = monday of this week - 7 (previous week first)
  const today = new Date(currentStartDate);
  const thisMonday = getMonday(today);
  const pastMonday = new Date(thisMonday); pastMonday.setDate(thisMonday.getDate() - 7);
  const startDate = pastMonday;
  const totalDays = weekView * 7;

  // compute row height based on available height
  const headerH = document.getElementById('calendar-header').getBoundingClientRect().height;
  const availH = Math.max(240, window.innerHeight - headerH - 32);
  const rowH = Math.floor((availH - 20) / weekView);
  document.getElementById('calendar').style.gridAutoRows = rowH + 'px';

  // Build cells (grid)
  const cellMap = []; // {date, el}
  const months = new Set();
  for(let i=0;i<totalDays;i++){
    const d = new Date(startDate);
    d.setDate(d.getDate() + i);
    d.setHours(0,0,0,0);
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const label = document.createElement('div');
    label.className = 'date-label';
    label.textContent = fmtDayLabel(d);
    cell.appendChild(label);
    // placeholder for +X
    calendarEl.appendChild(cell);
    cellMap.push({date:d, el:cell, countEvents:0, eventsList:[]});
    months.add(capitalize(d.toLocaleString('fr-FR',{month:'long'})));
  }

  // Load events with caching
  const timeMin = new Date(startDate); timeMin.setHours(0,0,0,0);
  const timeMax = new Date(timeMin); timeMax.setDate(timeMax.getDate() + totalDays);
  const cache = loadCache();
  let items;
  if(cache) items = cache.items;
  else {
    const [r1, r2] = await Promise.allSettled([
      fetchCalendar(CALENDAR_IDS.reception, timeMin, timeMax),
      fetchCalendar(CALENDAR_IDS.navire, timeMin, timeMax)
    ]);
    const items1 = r1.status === 'fulfilled' ? (r1.value.items||[]) : [];
    const items2 = r2.status === 'fulfilled' ? (r2.value.items||[]) : [];
    items = [
      ...items1.map(i=>({...i, __type:'reception'})),
      ...items2.map(i=>({...i, __type:'navire'}))
    ];
    saveCache(items, hashItems(items));
  }

  // Normalize events: compute _start (Date), _end (Date), _isAllDay
  const norm = items.map(ev=>{
    const e = JSON.parse(JSON.stringify(ev));
    e._isAllDay = !!(e.start && e.start.date && !e.start.dateTime);
    if(e.start){
      if(e.start.dateTime) e._start = new Date(e.start.dateTime);
      else e._start = new Date(e.start.date); // midnight
    }
    if(e.end){
      if(e.end.dateTime) e._end = new Date(e.end.dateTime);
      else e._end = new Date(e.end.date); // for all-day, this is exclusive
    }
    // adjust inclusive end date for all-day events: make last included day = end - 1 day
    if(e._isAllDay && e._end){
      const adj = new Date(e._end);
      adj.setDate(adj.getDate() - 1);
      adj.setHours(23,59,59,999);
      e._endInclusive = adj;
    } else if(e._end) {
      // If end is exactly at 00:00 of a day, consider previous day as last visible day (common for whole-day end)
      const tmp = new Date(e._end);
      if(tmp.getHours()===0 && tmp.getMinutes()===0 && tmp.getSeconds()===0){
        const adj = new Date(tmp); adj.setDate(adj.getDate() - 1); adj.setHours(23,59,59,999);
        e._endInclusive = adj;
      } else {
        e._endInclusive = new Date(e._end);
      }
    }
    return e;
  });

  /* Build segments for all events (single, all-day, multi) but all are drawn from events-layer.
     We'll compute for each event the visible startIdx & endIdx (indices into cellMap)
  */
  function dateToIdx(date){
    const t = new Date(date); t.setHours(0,0,0,0);
    for(let i=0;i<cellMap.length;i++) if(cellMap[i].date.getTime() === t.getTime()) return i;
    // if not found, return -1 (out of visible range)
    return -1;
  }

  // create array of "segments" that map to visible ranges per event and per week
  const segments = []; // {ev, startIdx, endIdx, weekIdx, segStartDate, segEndDate}
  norm.forEach(ev=>{
    if(!ev._start || !ev._endInclusive) return;
    // segment start = max(ev._start at 00:00, visible startDate)
    let s = new Date(ev._start); s.setHours(0,0,0,0);
    let e = new Date(ev._endInclusive); e.setHours(23,59,59,999);
    // iterate through visible days and slice by week boundaries
    let cursor = new Date(s);
    while(cursor <= e){
      // week index relative to startDate
      const weekIndex = Math.floor(( (cursor - startDate) / (7*24*3600*1000) ));
      if(weekIndex < 0){
        // event starts before visible range: move cursor to startDate
        cursor = new Date(startDate);
        continue;
      }
      if(weekIndex >= weekView) break;
      const weekStartIdx = weekIndex * 7;
      const weekEndIdx = Math.min(weekStartIdx + 6, cellMap.length - 1);
      // segStartIdx = first cell >= cursor
      let segStartIdx = -1;
      for(let i=weekStartIdx;i<=weekEndIdx;i++){
        if(cellMap[i].date.getTime() >= cursor.getTime()){
          segStartIdx = i; break;
        }
      }
      if(segStartIdx === -1){
        cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate()+1);
        continue;
      }
      // segEndIdx = last cell <= e (but <= weekEnd)
      let segEndIdx = -1;
      for(let i=weekEndIdx;i>=weekStartIdx;i--){
        if(cellMap[i].date.getTime() <= e.getTime()){
          segEndIdx = i; break;
        }
      }
      if(segEndIdx === -1){
        cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate()+1);
        continue;
      }
      segments.push({
        ev,
        startIdx: segStartIdx,
        endIdx: segEndIdx,
        weekIdx: weekIndex,
        segStartDate: new Date(cellMap[segStartIdx].date),
        segEndDate: new Date(cellMap[segEndIdx].date)
      });
      // advance cursor to next day after segEndIdx
      cursor = new Date(cellMap[segEndIdx].date);
      cursor.setDate(cursor.getDate() + 1);
    }
  });

  // Now, per week, assign lanes so segments within same week do not overlap on same lane
  const weekLanes = Array.from({length:weekView}, ()=>[]);
  segments.forEach(seg=>{
    const lanes = weekLanes[seg.weekIdx];
    let lane = 0;
    function overlapWithLane(l){
      const arr = lanes[l] || [];
      return arr.some(r => !(seg.endIdx < r.startIdx || seg.startIdx > r.endIdx));
    }
    while(overlapWithLane(lane)) lane++;
    if(!lanes[lane]) lanes[lane] = [];
    lanes[lane].push({startIdx:seg.startIdx,endIdx:seg.endIdx,seg});
    seg.lane = lane;
  });

  // Count for each cell how many segments (events) overlap that cell (for +X)
  cellMap.forEach((c, idx)=>{
    c.countEvents = 0;
    c.eventsList = [];
  });
  // For single-day and all-day events (which are segments with startIdx===endIdx), and multi-day (segments can span),
  // count any segment that covers the cell
  segments.forEach(seg=>{
    for(let i=seg.startIdx;i<=seg.endIdx;i++){
      if(i>=0 && i<cellMap.length){
        cellMap[i].countEvents++;
        if(!cellMap[i].eventsList.includes(seg.ev)) cellMap[i].eventsList.push(seg.ev);
      }
    }
  });

  // Now render segments visually in eventsLayer using absolute positions (based on cell DOM rects)
  // Ensure layout is ready
  await new Promise(r => requestAnimationFrame(r));
  const calendarRect = calendarEl.getBoundingClientRect();
  const cellRects = cellMap.map(c => c.el.getBoundingClientRect());

  // derive measurement: date label height (we used the first cell)
  const dateLabel = document.querySelector('.date-label');
  const dateLabelH = dateLabel ? dateLabel.getBoundingClientRect().height : 18;
  const bandH = 22;
  const laneGap = 6;
  const bandSpacing = bandH + laneGap;

  // Per week top base: use top of first cell in week relative to calendarRect.top
  const weekTopBase = [];
  for(let w=0;w<weekView;w++){
    const idx = w*7;
    if(idx < cellRects.length) weekTopBase[w] = (cellRects[idx].top - calendarRect.top);
    else weekTopBase[w] = 0;
  }

  // Determine visible lanes per week that fit in rowH (to compute +X)
  const visibleLanesPerWeek = [];
  for(let w=0; w<weekView; w++){
    const avail = rowH - (dateLabelH + 8); // space under date label
    const lanes = Math.max(0, Math.floor((avail + laneGap) / bandSpacing));
    visibleLanesPerWeek[w] = lanes;
  }

  // Render visual segments
  segments.forEach(seg=>{
    const firstRect = cellRects[seg.startIdx];
    const lastRect = cellRects[seg.endIdx];
    if(!firstRect || !lastRect) return;
    const left = firstRect.left - calendarRect.left;
    const width = (lastRect.left + lastRect.width) - firstRect.left;
    const band = document.createElement('div');
    band.className = 'multi-band ' + (seg.ev.__type || '');
    band.style.left = left + 'px';
    band.style.width = Math.max(36, width) + 'px';
    // top = weekTopBase + dateLabelH + 6 + lane*bandSpacing
    const top = (weekTopBase[seg.weekIdx] || 0) + dateLabelH + 6 + (seg.lane * bandSpacing);
    band.style.top = top + 'px';
    band.style.height = bandH + 'px';
    // content: left start (if not all-day, show <hh:mm ), title, right end time (if not all-day)
    const startSpan = document.createElement('span');
    startSpan.className = 'start';
    const evStartTime = seg.ev._isAllDay ? '' : fmtTime(seg.ev._start);
    startSpan.textContent = (evStartTime ? ('<' + evStartTime + ' ') : '') + (seg.ev.summary || '');
    const endSpan = document.createElement('span');
    endSpan.className = 'end';
    // end time: if segment covers only until seg.segEndDate but event end beyond, show seg end time (end of that day)
    // compute end time for display: if event._isAllDay -> empty, else if seg.segEndDate < event._endInclusive -> show '23:59' or nothing; else show actual event end time
    let endTimeText = '';
    if(!seg.ev._isAllDay){
      // if seg.segEndDate < actual event last date, display '>23:59' else display actual end time
      const segEnd = new Date(seg.segEndDate);
      segEnd.setHours(23,59,59,999);
      if(segEnd.getTime() < seg.ev._endInclusive.getTime()){
        endTimeText = '>23:59';
      } else {
        endTimeText = '>' + fmtTime(seg.ev._end);
      }
    }
    endSpan.textContent = endTimeText;
    band.appendChild(startSpan);
    band.appendChild(endSpan);
    // click -> modal
    band.addEventListener('click', (ev)=>{ ev.stopPropagation(); showEventModal(seg.ev); });
    eventsLayer.appendChild(band);
  });

  // Render single-day events that may have startIdx===endIdx but we rendered them as segments above,
  // They are already drawn. No duplication.

  // Compute +X others for each cell and render badge
  cellMap.forEach((c, idx)=>{
    const weekIdx = Math.floor(idx/7);
    const visibleLanes = visibleLanesPerWeek[weekIdx] || 0;
    const totalHere = c.countEvents;
    if(totalHere > visibleLanes){
      const excess = totalHere - visibleLanes;
      const badge = document.createElement('div');
      badge.className = 'more-events';
      badge.textContent = '+' + excess + ' autres';
      badge.onclick = (ev)=>{ ev.stopPropagation(); showModalForCell(c); };
      c.el.appendChild(badge);
    }
  });

  // Title months
  document.getElementById('calendar-title').textContent = Array.from(months).join(' / ');
}

/* ---------------- Modal formatting ---------------- */
function showEventModal(ev){
  const modal = document.getElementById('event-modal');
  const content = document.getElementById('modal-content');
  const start = ev._start;
  const end = ev._end;
  const isAll = ev._isAllDay;
  const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
  let html = `<h3>${ev.summary || '(sans titre)'}</h3>`;
  if(isMulti){
    html += `<div class="modal-item"><p>Du ${fmtFullDate(start)} à ${fmtTime(start)}<br>Au ${fmtFullDate(end)} à ${fmtTime(end)}</p></div>`;
  } else if(isAll){
    html += `<div class="modal-item"><p>Le ${fmtFullDate(start)}</p></div>`;
  } else {
    html += `<div class="modal-item"><p>Le ${fmtFullDate(start)} à ${fmtTime(start)}</p></div>`;
  }
  if(ev.description) html += `<div class="modal-item"><p>${ev.description}</p></div>`;
  content.innerHTML = html;
  modal.style.display = 'flex';
}
function hideModal(){ document.getElementById('event-modal').style.display = 'none'; }

/* Show modal listing all events for a cell with the requested formatting */
function showModalForCell(cellObj){
  const modal = document.getElementById('event-modal');
  const content = document.getElementById('modal-content');
  const events = cellObj.eventsList || [];
  const html = events.map(ev=>{
    const start = ev._start;
    const end = ev._end;
    const isAll = ev._isAllDay;
    const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
    let block = `<h3>${ev.summary || '(sans titre)'}</h3>`;
    if(isMulti){
      block += `<p>&lt;${fmtTime(start)} ${ev.summary} ${'…'} &gt;${fmtTime(ev._end)}</p>`;
    } else if(isAll){
      block += `<p>${ev.summary}</p>`;
    } else {
      block += `<p>${fmtTime(start)} ${ev.summary}</p>`;
    }
    if(ev.description) block += `<p>${ev.description}</p>`;
    return `<div class="modal-item">${block}</div>`;
  }).join('<hr style="border:none;border-top:1px solid #333;margin:8px 0">');
  content.innerHTML = html || '<p>Aucun évènement</p>';
  modal.style.display = 'flex';
}

/* ---------------- Navigation bindings ---------------- */
document.getElementById('prev-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()-7); renderCalendar(); });
document.getElementById('next-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()+7); renderCalendar(); });
document.getElementById('today-btn').addEventListener('click', ()=>{ currentStartDate = new Date(); weekView = 3; renderCalendar(); });
document.getElementById('view-3w').addEventListener('click', ()=>{ weekView = 3; renderCalendar(); });
document.getElementById('view-4w').addEventListener('click', ()=>{ weekView = 4; renderCalendar(); });
window.addEventListener('resize', ()=>{ requestAnimationFrame(()=> renderCalendar()); });
document.getElementById('event-modal').addEventListener('click', hideModal);

/* Initial render & error handling */
renderCalendar().catch(err=>{
  console.error('render error', err);
  document.getElementById('calendar-title').textContent = 'Erreur chargement';
});
</script>
</body>
</html>
