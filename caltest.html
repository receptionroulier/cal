<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>caltest - calendrier (final)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f10;color:#fff;display:flex;flex-direction:column;height:100vh}

  /* header */
  #calendar-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 10px;color:#00e5ff;border-bottom:1px solid #333}
  .nav-btn{cursor:pointer;color:#00e5ff;font-size:26px;padding:4px 10px;border-radius:6px}
  .nav-btn:hover{background:#222}
  .view-btn{cursor:pointer;font-size:14px;padding:4px 10px;background:#222;border-radius:6px;border:1px solid #333;color:#00e5ff}
  .view-btn:hover{background:#333}

  /* calendar grid */
  #calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;align-content:start;position:relative}

  /* day cell */
  .day-cell{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:6px;position:relative;overflow:hidden;min-height:80px}
  .date-label{font-size:0.72rem;color:#cbd6da;margin-bottom:6px;font-weight:400}

  /* events layer (absolute overlay) */
  #events-layer{position:absolute;left:2px;right:2px;top:2px;bottom:2px;pointer-events:none;z-index:50}

  /* events */
  .multi-band, .single-evt {
    pointer-events:auto;
    position:absolute;
    display:flex;
    align-items:center;
    padding:0 8px;
    border-radius:6px;
    font-size:0.78rem;
    color:#fff;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,0.2) inset;
    white-space:nowrap;
  }
  .multi-band { white-space:nowrap; }
  .single-evt {
    white-space:normal;
    display:-webkit-box;
    -webkit-line-clamp:2;          /* max 2 lines */
    -webkit-box-orient:vertical;
    word-wrap:break-word;
  }

  /* calendar colors */
  .reception{background:#109c53}
  .navire{background:#3644b3}

  .multi-band .start{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
  .multi-band .end{margin-left:auto}

  /* +X */
  .more-events{position:absolute;top:6px;right:8px;padding:2px 6px;background:rgba(0,0,0,0.45);border-radius:6px;font-size:0.72rem;cursor:pointer;z-index:60;pointer-events:auto}

  /* modal */
  #event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:999}
  .modal-card{background:#222;padding:18px;border-radius:10px;max-width:720px;width:94%}
  .modal-card h3{margin-bottom:6px}
  .modal-item{margin-bottom:10px}
  .modal-item p{color:#dbe7ea;margin-top:6px}

  /* responsive */
  @media(max-width:720px){ .day-cell{min-height:68px} .single-evt{ -webkit-line-clamp:2 } }
</style>
</head>
<body>
  <div id="calendar-header">
    <span class="nav-btn" id="prev-btn">‹</span>
    <span id="calendar-title">Chargement…</span>
    <span class="nav-btn" id="next-btn">›</span>
    <span class="view-btn" id="view-3w">3 semaines</span>
    <span class="view-btn" id="view-4w">4 semaines</span>
    <span class="nav-btn" id="today-btn" style="font-size:16px">Aujourd’hui</span>
  </div>

  <div id="calendar-wrap">
    <div id="calendar" role="grid" aria-label="Calendrier"></div>
    <div id="events-layer" aria-hidden="false"></div>
  </div>

  <div id="event-modal" onclick="hideModal()">
    <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

<script>
/* ---------------- Configuration & utils ---------------- */
const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
const CALENDAR_IDS = { reception:'receptionroulier@gmail.com', navire:'smr.programme@gmail.com' };
const CACHE_KEY = 'caltest_final_cache_v2';
const CACHE_TTL = 30000; // 30s

let weekView = 3;                 // default 3 weeks (past, present, future)
let currentStartDate = new Date();

function getMonday(d){ const date=new Date(d); const day=date.getDay(); const diff=(day===0? -6:1-day); date.setDate(date.getDate()+diff); date.setHours(0,0,0,0); return date; }
function capitalize(s){ return s? s.charAt(0).toUpperCase()+s.slice(1):''; }
function fmtTime(d){ return d? new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''; }
function fmtDayLabel(d){ return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'}); }
function fmtFullDate(d){ return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }

function saveCache(items,hash){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({items,hash,ts:Date.now()})); }catch(e){} }
function loadCache(){ try{ const raw=localStorage.getItem(CACHE_KEY); if(!raw) return null; const obj=JSON.parse(raw); if(Date.now()-(obj.ts||0)>CACHE_TTL) return null; return obj; }catch(e){return null;} }
function hashItems(items){ return JSON.stringify(items).split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0); }

async function fetchCalendar(calendarId,timeMin,timeMax){
  const base='https://www.googleapis.com/calendar/v3/calendars/';
  const url = base + encodeURIComponent(calendarId) + '/events'
    + '?key='+encodeURIComponent(API_KEY)
    + '&singleEvents=true&orderBy=startTime'
    + '&timeMin='+encodeURIComponent(timeMin.toISOString())
    + '&timeMax='+encodeURIComponent(timeMax.toISOString());
  const res = await fetch(url);
  if(!res.ok) throw new Error('Erreur fetch calendar '+res.status);
  return res.json();
}

/* ---------------- Rendering core ---------------- */
async function renderCalendar(){
  const calendarEl = document.getElementById('calendar');
  const eventsLayer = document.getElementById('events-layer');
  calendarEl.innerHTML = '';
  eventsLayer.innerHTML = '';

  // compute visible window (monday of current week - past week first)
  const today = new Date(currentStartDate);
  const thisMonday = getMonday(today);
  const pastMonday = new Date(thisMonday); pastMonday.setDate(thisMonday.getDate() - 7);
  const startDate = pastMonday;
  const totalDays = weekView * 7;

  // row height based on viewport
  const headerH = document.getElementById('calendar-header').getBoundingClientRect().height;
  const availH = Math.max(240, window.innerHeight - headerH - 32);
  const rowH = Math.floor((availH - 20) / weekView);
  calendarEl.style.gridAutoRows = rowH + 'px';

  // build cell map
  const cellMap = [];
  const months = new Set();
  for(let i=0;i<totalDays;i++){
    const d = new Date(startDate); d.setDate(d.getDate()+i); d.setHours(0,0,0,0);
    const cell = document.createElement('div'); cell.className='day-cell';
    const label = document.createElement('div'); label.className='date-label'; label.textContent = fmtDayLabel(d);
    cell.appendChild(label); calendarEl.appendChild(cell);
    cellMap.push({date:d, el:cell, eventsList:[], totalSegments:0});
    months.add(capitalize(d.toLocaleString('fr-FR',{month:'long'})));
  }

  // load events (cache aware)
  const timeMin = new Date(startDate); timeMin.setHours(0,0,0,0);
  const timeMax = new Date(timeMin); timeMax.setDate(timeMax.getDate() + totalDays);
  const cache = loadCache();
  let items;
  if(cache) items = cache.items;
  else {
    const [r1,r2] = await Promise.allSettled([fetchCalendar(CALENDAR_IDS.reception, timeMin, timeMax), fetchCalendar(CALENDAR_IDS.navire, timeMin, timeMax)]);
    const items1 = r1.status === 'fulfilled' ? (r1.value.items||[]) : [];
    const items2 = r2.status === 'fulfilled' ? (r2.value.items||[]) : [];
    items = [...items1.map(i=>({...i, __type:'reception'})), ...items2.map(i=>({...i, __type:'navire'}))];
    saveCache(items, hashItems(items));
  }

  // normalize events
  const norm = items.map(ev=>{
    const e = JSON.parse(JSON.stringify(ev));
    e.__type = e.__type || '';
    e._isAllDay = !!(e.start && e.start.date && !e.start.dateTime);
    if(e.start){ e._start = e.start.dateTime ? new Date(e.start.dateTime) : new Date(e.start.date); if(!e.start.dateTime) e._start.setHours(0,0,0,0); }
    if(e.end){ e._end = e.end.dateTime ? new Date(e.end.dateTime) : new Date(e.end.date); if(!e.end.dateTime) e._end.setHours(0,0,0,0); }
    if(e._isAllDay && e._end){ const adj=new Date(e._end); adj.setDate(adj.getDate()-1); adj.setHours(23,59,59,999); e._endInclusive = adj; }
    else if(e._end){ const tmp=new Date(e._end); if(tmp.getHours()===0 && tmp.getMinutes()===0 && tmp.getSeconds()===0){ const adj=new Date(tmp); adj.setDate(adj.getDate()-1); adj.setHours(23,59,59,999); e._endInclusive=adj; } else e._endInclusive=new Date(e._end); }
    return e;
  }).filter(e=>e._start && e._endInclusive);

  // build segments split per week
  const segments = [];
  norm.forEach(ev=>{
    const sDay = new Date(ev._start); sDay.setHours(0,0,0,0);
    const eDay = new Date(ev._endInclusive); eDay.setHours(0,0,0,0);
    let cursor = new Date(sDay);
    while(cursor <= eDay){
      const weekIndex = Math.floor((cursor - startDate) / (7*24*3600*1000));
      if(weekIndex < 0){ cursor = new Date(startDate); continue; }
      if(weekIndex >= weekView) break;
      const weekStartIdx = weekIndex*7;
      const weekEndIdx = Math.min(weekStartIdx+6, cellMap.length-1);
      // find segment start and end inside week
      let segStartIdx=-1;
      for(let i=weekStartIdx;i<=weekEndIdx;i++){ if(cellMap[i].date.getTime() >= cursor.getTime()){ segStartIdx=i; break; } }
      if(segStartIdx===-1){ cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate()+1); continue; }
      let segEndIdx=-1;
      for(let i=weekEndIdx;i>=weekStartIdx;i--){ if(cellMap[i].date.getTime() <= eDay.getTime()){ segEndIdx=i; break; } }
      if(segEndIdx===-1){ cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate()+1); continue; }
      segments.push({ ev, startIdx:segStartIdx, endIdx:segEndIdx, weekIdx:weekIndex, segStartDate:new Date(cellMap[segStartIdx].date), segEndDate:new Date(cellMap[segEndIdx].date) });
      cursor = new Date(cellMap[segEndIdx].date); cursor.setDate(cursor.getDate()+1);
    }
  });

  // prepare geometry
  await new Promise(r=>requestAnimationFrame(r));
  const calendarRect = calendarEl.getBoundingClientRect();
  const cellRects = cellMap.map(c=>c.el.getBoundingClientRect());
  const dateLabel = document.querySelector('.date-label');
  const dateLabelH = dateLabel ? dateLabel.getBoundingClientRect().height : 18;

  const bandH = 20;       // base band height for one logical lane
  const laneGap = 6;
  const bandSpacing = bandH + laneGap;

  // For positioning top per week
  const weekTopBase = [];
  for(let w=0; w<weekView; w++){
    const idx = w*7;
    weekTopBase[w] = idx < cellRects.length ? (cellRects[idx].top - calendarRect.top) : 0;
  }

  // First: determine single-day spans (1 or 2) by measuring rendered text
  // We'll create hidden temporary elements to measure their scrollHeight
  segments.forEach(seg=>{ seg._isSingle = (seg.startIdx===seg.endIdx) && !seg.ev._isAllDay; seg._span = 1; });

  // helper to measure single-day height
  function measureSingleSpanText(seg){
    // create measuring node
    const temp = document.createElement('div');
    temp.className = 'single-evt ' + (seg.ev.__type || '');
    temp.style.position = 'absolute';
    temp.style.left = '-9999px';
    temp.style.top = '-9999px';
    temp.style.width = Math.max(36, cellRects[seg.startIdx].width - 4) + 'px';
    const evStartTime = seg.ev._isAllDay ? '' : ('<' + fmtTime(seg.ev._start) + ' ');
    temp.textContent = (evStartTime + (seg.ev.summary || ''));
    document.body.appendChild(temp);
    const h = temp.scrollHeight || temp.getBoundingClientRect().height;
    document.body.removeChild(temp);
    const span = (h > bandH + 6) ? 2 : 1; // if more than ~1 line -> 2
    return span;
  }

  // assign spans for single-days
  segments.forEach(seg=>{
    if(seg._isSingle){
      seg._span = measureSingleSpanText(seg);
      if(seg._span > 2) seg._span = 2;
    } else {
      seg._span = 1;
    }
  });

  // Lane assignment:
  // Option C: dedicate lanes for single-days first per week, then place other segments after them.
  const weekLanes = Array.from({length:weekView}, ()=>[]); // array of lanes; each lane is array of intervals {startIdx,endIdx}

  // helper: check if interval [s,e] overlaps any interval in lane l
  function laneOverlaps(laneArr, s, e){
    return laneArr.some(r => !(e < r.startIdx || s > r.endIdx));
  }

  // place single-day segments first (they may occupy seg._span lanes)
  segments.filter(s=>s._isSingle).forEach(seg=>{
    const w = seg.weekIdx;
    const lanes = weekLanes[w];
    let laneIdx = 0;
    // find first lane idx such that seg._span consecutive lanes are free (we treat lanes array as list of arrays)
    function canPlaceAt(idx){
      for(let k=0;k<seg._span;k++){
        const laneArr = lanes[idx+k] || [];
        if(laneOverlaps(laneArr, seg.startIdx, seg.endIdx)) return false;
      }
      return true;
    }
    while(!canPlaceAt(laneIdx)) laneIdx++;
    // ensure lanes exist
    for(let k=0;k<seg._span;k++) if(!lanes[laneIdx+k]) lanes[laneIdx+k]=[];
    // push interval into each lane of the span
    for(let k=0;k<seg._span;k++) lanes[laneIdx+k].push({startIdx:seg.startIdx,endIdx:seg.endIdx});
    seg.lane = laneIdx;
  });

  // then place non-single segments (multi-day / all-day) after single-day lanes used
  segments.filter(s=>!s._isSingle).forEach(seg=>{
    const w = seg.weekIdx;
    const lanes = weekLanes[w];
    let laneIdx = 0;
    function canPlaceAt(idx){
      // check only the single lane (span=1 for multi-days)
      const laneArr = lanes[idx] || [];
      return !laneOverlaps(laneArr, seg.startIdx, seg.endIdx);
    }
    // start search from 0, but to avoid collision with single-day we will place after max single lanes if needed:
    // find the first lane where it fits (can be 0 too if no single-days)
    while(!canPlaceAt(laneIdx)) laneIdx++;
    if(!lanes[laneIdx]) lanes[laneIdx]=[];
    lanes[laneIdx].push({startIdx:seg.startIdx,endIdx:seg.endIdx});
    seg.lane = laneIdx;
  });

  // compute visible lanes per week based on available row height under date label
  const visibleLanesPerWeek = [];
  for(let w=0; w<weekView; w++){
    const avail = rowH - (dateLabelH + 8);
    // each logical lane occupies bandH height; visible lanes is how many of those fit
    visibleLanesPerWeek[w] = Math.max(0, Math.floor((avail + laneGap) / bandSpacing));
  }

  // count per-cell how many segments (for +X)
  cellMap.forEach((c, idx)=>{ c.eventsList=[]; c.totalSegments=0; });
  segments.forEach(seg=>{
    for(let i=seg.startIdx;i<=seg.endIdx;i++){
      if(i>=0 && i<cellMap.length){
        cellMap[i].totalSegments++;
        if(!cellMap[i].eventsList.includes(seg.ev)) cellMap[i].eventsList.push(seg.ev);
      }
    }
  });

  // render segments
  segments.forEach(seg=>{
    const firstRect = cellRects[seg.startIdx];
    const lastRect = cellRects[seg.endIdx];
    if(!firstRect || !lastRect) return;
    const left = firstRect.left - calendarRect.left;
    const width = (lastRect.left + lastRect.width) - firstRect.left;
    const top = (weekTopBase[seg.weekIdx] || 0) + dateLabelH + 6 + (seg.lane * bandSpacing);
    if(seg._isSingle){
      // single-day: may occupy seg._span lanes -> height = bandH * seg._span + (seg._span-1)*0
      const el = document.createElement('div');
      el.className = 'single-evt ' + (seg.ev.__type || '');
      el.style.left = left + 'px';
      el.style.width = Math.max(36, firstRect.width - 6) + 'px';
      el.style.top = top + 'px';
      el.style.height = (bandH * seg._span + (seg._span>1?6:0)) + 'px';
      const evStartTime = seg.ev._isAllDay ? '' : ('<' + fmtTime(seg.ev._start) + ' ');
      el.textContent = (evStartTime + (seg.ev.summary || ''));
      el.addEventListener('click', e=>{ e.stopPropagation(); showEventModal(seg.ev); });
      seg._el = el;
      const visibleLanes = visibleLanesPerWeek[seg.weekIdx] || 0;
      // if any lane the segment uses is >= visibleLanes => hidden
      if(seg.lane >= visibleLanes) { el.style.display='none'; seg._isHidden=true; } else if((seg.lane + seg._span) > visibleLanes){ el.style.display='none'; seg._isHidden=true; } else seg._isHidden = false;
      eventsLayer.appendChild(el);
    } else {
      // multi or all-day -> single lane span
      const el = document.createElement('div');
      el.className = 'multi-band ' + (seg.ev.__type || '');
      el.style.left = left + 'px';
      el.style.width = Math.max(36, width - 4) + 'px';
      el.style.top = top + 'px';
      el.style.height = bandH + 'px';
      const startSpan = document.createElement('span'); startSpan.className='start';
      const evStartTime = seg.ev._isAllDay ? '' : fmtTime(seg.ev._start);
      startSpan.textContent = (evStartTime ? ('<' + evStartTime + ' ') : '') + (seg.ev.summary || '');
      const endSpan = document.createElement('span'); endSpan.className='end';
      let endTimeText = '';
      if(!seg.ev._isAllDay){
        const segEnd = new Date(seg.segEndDate); segEnd.setHours(23,59,59,999);
        if(segEnd.getTime() < seg.ev._endInclusive.getTime()) endTimeText = '>23:59';
        else endTimeText = '>' + fmtTime(seg.ev._end);
      }
      endSpan.textContent = endTimeText;
      el.appendChild(startSpan); el.appendChild(endSpan);
      el.addEventListener('click', e=>{ e.stopPropagation(); showEventModal(seg.ev); });
      seg._el = el;
      const visibleLanes = visibleLanesPerWeek[seg.weekIdx] || 0;
      if(seg.lane >= visibleLanes){ el.style.display='none'; seg._isHidden=true; } else seg._isHidden=false;
      eventsLayer.appendChild(el);
    }
  });

  // compute +X badges per cell
  cellMap.forEach((c, idx)=>{
    const weekIdx = Math.floor(idx / 7);
    const visibleLanes = visibleLanesPerWeek[weekIdx] || 0;
    let visibleCount = 0, hiddenCount = 0;
    segments.forEach(seg=>{
      if(seg.startIdx <= idx && seg.endIdx >= idx && seg.weekIdx === weekIdx){
        // segment occupies lanes [seg.lane .. seg.lane+seg._span-1]; consider visible if entirely within visibleLanes
        if((seg.lane + seg._span) <= visibleLanes) visibleCount++;
        else hiddenCount++;
      }
    });
    c.visibleCount = visibleCount; c.hiddenCount = hiddenCount;
    if(hiddenCount > 0){
      const badge = document.createElement('div');
      badge.className = 'more-events';
      badge.textContent = '+' + hiddenCount + ' autres';
      badge.addEventListener('click', e=>{ e.stopPropagation(); showModalForCell(c); });
      c.el.appendChild(badge);
    }
  });

  // title months
  document.getElementById('calendar-title').textContent = Array.from(months).join(' / ');
}

/* ---------------- Modals ---------------- */
function showEventModal(ev){
  const modal = document.getElementById('event-modal');
  const content = document.getElementById('modal-content');
  const start = ev._start, end = ev._end;
  const isAll = ev._isAllDay;
  const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
  let html = `<h3>${ev.summary || '(sans titre)'}</h3>`;
  if(isMulti){
    html += `<div class="modal-item"><p>Du ${fmtFullDate(start)} à ${fmtTime(start)}<br>Au ${fmtFullDate(end)} à ${fmtTime(end)}</p></div>`;
  } else if(isAll){
    html += `<div class="modal-item"><p>Le ${fmtFullDate(start)}</p></div>`;
  } else {
    html += `<div class="modal-item"><p>Le ${fmtFullDate(start)} à ${fmtTime(start)}</p></div>`;
  }
  if(ev.description) html += `<div class="modal-item"><p>${ev.description}</p></div>`;
  content.innerHTML = html;
  modal.style.display = 'flex';
}
function hideModal(){ document.getElementById('event-modal').style.display = 'none'; }

function showModalForCell(cellObj){
  const modal = document.getElementById('event-modal');
  const content = document.getElementById('modal-content');
  const events = cellObj.eventsList || [];
  const list = [];
  events.forEach(ev=>{
    const start = ev._start, end = ev._end;
    const isAll = ev._isAllDay;
    const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
    if(isMulti){
      list.push(`<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3><p>&lt;${fmtTime(start)} ${ev.summary} … &gt;${fmtTime(ev._end)}</p>${ev.description?'<p>'+ev.description+'</p>':''}</div>`);
    } else if(isAll){
      list.push(`<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3><p>${fmtFullDate(start)}</p>${ev.description?'<p>'+ev.description+'</p>':''}</div>`);
    } else {
      list.push(`<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3><p>${fmtTime(start)} ${ev.summary}</p>${ev.description?'<p>'+ev.description+'</p>':''}</div>`);
    }
  });
  content.innerHTML = list.join('<hr style="border:none;border-top:1px solid #333;margin:8px 0">') || '<p>Aucun évènement</p>';
  modal.style.display = 'flex';
}

/* ---------------- Navigation bindings ---------------- */
document.getElementById('prev-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()-7); renderCalendar(); });
document.getElementById('next-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate()+7); renderCalendar(); });
document.getElementById('today-btn').addEventListener('click', ()=>{ currentStartDate = new Date(); weekView = 3; renderCalendar(); });
document.getElementById('view-3w').addEventListener('click', ()=>{ weekView = 3; renderCalendar(); });
document.getElementById('view-4w').addEventListener('click', ()=>{ weekView = 4; renderCalendar(); });

window.addEventListener('resize', ()=>{ requestAnimationFrame(()=> renderCalendar()); });
document.getElementById('event-modal').addEventListener('click', hideModal);

/* initial */
renderCalendar().catch(err=>{ console.error('render error', err); document.getElementById('calendar-title').textContent='Erreur'; });
</script>
</body>
</html>
