<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Google</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial, sans-serif; background: #1a1a1a; color:#fff; display:flex; flex-direction:column; height:100vh; }

#calendar-header {
  flex:0 0 auto;
  padding:12px;
  text-align:center;
  font-size:22px;
  color:#00e5ff;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
}
.nav-btn { cursor:pointer; color:#00e5ff; font-size:26px; padding:4px 10px; border-radius:6px; transition:0.2s; }
.nav-btn:hover { background:#222; }
.view-btn { cursor:pointer; font-size:14px; padding:4px 10px; background:#222; border-radius:6px; border:1px solid #333; color:#00e5ff; }
.view-btn:hover { background:#333; }

#calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:10px; position:relative; flex:1; }

.day-cell { background:#222; border:1px solid #333; position:relative; overflow:hidden; transition: transform 0.2s, box-shadow 0.2s; border-radius:10px; padding:4px; }
.day-cell.past { transform: scale(0.95); opacity:0.6; }
.day-cell.today { transform: scale(1.05); box-shadow:0 0 15px #00e5ff; z-index:1; }
.day-cell.future { border:1px solid #00e5ff; }
.day-cell:hover.today { transform: scale(1.1); box-shadow:0 0 25px #00e5ff; }
.day-cell:hover.future { transform: scale(1.05); box-shadow:0 0 15px #00e5ff; }

.date-label { font-size:0.75rem; font-weight:normal; margin-bottom:2px; }

.event { padding:2px 4px; margin:2px 0; border-radius:4px; font-size:0.8rem; cursor:pointer; word-wrap:break-word; white-space:normal; z-index:2; }
.reception { background:#109c53; }
.navire { background:#3644b3; }

.multi-band { position:absolute; height:20px; border-radius:4px; display:flex; align-items:center; padding:0 4px; font-size:0.75rem; color:#fff; white-space:nowrap; overflow:hidden; z-index:2; }
.multi-band.reception { background:#109c53; }
.multi-band.navire { background:#3644b3; }

.multi-band .start-label { margin-right:auto; }
.multi-band .end-label { position:absolute; right:2px; }

.more-events { position:absolute; top:2px; right:4px; font-size:0.7rem; color:#fff; background:rgba(0,0,0,0.5); padding:1px 4px; border-radius:3px; cursor:pointer; z-index:3; }

#event-modal { position:fixed; top:0; left:0; width:100%; height:100%; display:none; justify-content:center; align-items:center; background:rgba(0,0,0,0.7); z-index:1000; }
#event-modal .modal-content { background:#333; color:#fff; padding:20px; border-radius:10px; max-width:90%; animation:pulse 0.3s; }
@keyframes pulse {0%{transform:scale(0.95);opacity:0;}50%{transform:scale(1.05);opacity:1;}100%{transform:scale(1);opacity:1;}}

.day-cell.fade-in, .multi-band.fade-in { animation: fadeInCell 0.3s forwards; }
@keyframes fadeInCell { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }

@media(max-width:768px){ .day-cell{font-size:0.8rem;} }
</style>
</head>
<body>
<div id="calendar-header">
  <span class="nav-btn" id="prev-btn">‹</span>
  <span id="calendar-title">Chargement…</span>
  <span class="nav-btn" id="next-btn">›</span>
  <span class="view-btn" id="view-3w">3 semaines</span>
  <span class="view-btn" id="view-4w">4 semaines</span>
  <span class="nav-btn" id="today-btn" style="font-size:18px;">Aujourd’hui</span>
</div>

<div id="calendar"></div>

<div id="event-modal" onclick="hideModal()">
  <div class="modal-content" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
const CALENDAR_IDS = { reception:'receptionroulier@gmail.com', navire:'smr.programme@gmail.com' };
let currentStartDate = new Date();
let weekView = 3;

function getCacheKey(){return'calendar-cache';}
function saveCache(data, hash){localStorage.setItem(getCacheKey(), JSON.stringify({data, hash, timestamp:Date.now()}));}
function loadCache(){const cached=localStorage.getItem(getCacheKey());if(!cached)return null;const obj=JSON.parse(cached);if(Date.now()-obj.timestamp>30000)return null;return obj;}
function hashEvents(events){return JSON.stringify(events).split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);}

async function fetchCalendarEvents(calendarId,timeMin,timeMax){
  const url=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events?key=${API_KEY}&timeMin=${timeMin.toISOString()}&timeMax=${timeMax.toISOString()}&singleEvents=true&orderBy=startTime`;
  const res = await fetch(url);
  return await res.json();
}

async function loadEvents(){
  const start = new Date(currentStartDate); start.setDate(start.getDate()-7);
  const end = new Date(start); end.setDate(end.getDate()+7*weekView);
  const cache = loadCache();
  if(cache) return cache.data;
  const receptionEvents = await fetchCalendarEvents(CALENDAR_IDS.reception,start,end);
  const navireEvents = await fetchCalendarEvents(CALENDAR_IDS.navire,start,end);
  const allEvents = [...receptionEvents.items.map(e=>({...e,type:'reception'})), ...navireEvents.items.map(e=>({...e,type:'navire'}))];
  const newHash = hashEvents(allEvents);
  if(cache && cache.hash===newHash) return cache.data;
  saveCache(allEvents,newHash);
  return allEvents;
}

function formatTime(d){return new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function formatDay(date){ return date.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'}); }
function formatFullDate(date){ return date.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'});}
function capitalize(str){ return str.charAt(0).toUpperCase()+str.slice(1); }

function createDayCell(date){
  const cell=document.createElement('div');
  cell.className='day-cell fade-in';
  const today=new Date(); today.setHours(0,0,0,0);
  if(date<today) cell.classList.add('past');
  else if(date.toDateString()===new Date().toDateString()) cell.classList.add('today');
  else cell.classList.add('future');
  const dayLabel=document.createElement('div'); 
  dayLabel.className='date-label';
  dayLabel.textContent = formatDay(date);
  cell.appendChild(dayLabel);
  return cell;
}

/* Modal */
function showModal(events){
  const modal=document.getElementById('event-modal');
  const content=document.getElementById('modal-content');
  if(!Array.isArray(events)) events=[events];
  content.innerHTML = events.map(ev=>{
    const start = ev.start.dateTime || ev.start.date;
    const end = ev.end.dateTime || ev.end.date;
    const isAllDay = ev.start.date && !ev.start.dateTime;
    const isMulti = !isAllDay && start !== end && new Date(start).toDateString()!==new Date(end).toDateString();
    let html = `<strong>${ev.summary}</strong><br>`;
    if(isMulti){
      html += `Du ${formatFullDate(new Date(start))} à ${formatTime(new Date(start))} Au ${formatFullDate(new Date(end))} à ${formatTime(new Date(end))}<br>`;
    } else if(isAllDay){
      html += `Le ${formatFullDate(new Date(start))}<br>`;
    } else {
      html += `Le ${formatFullDate(new Date(start))} à ${formatTime(new Date(start))}<br>`;
    }
    if(ev.description) html += `<em>${ev.description}</em>`;
    return `<p style="margin-bottom:6px;">${html}</p>`;
  }).join('<hr>');
  modal.style.display='flex';
}
function hideModal(){document.getElementById('event-modal').style.display='none';}

/* Obtenir le lundi d'une date */
function getMonday(d){ const date=new Date(d); const day=date.getDay(); const diff=(day===0?-6:1-day); date.setDate(date.getDate()+diff); date.setHours(0,0,0,0); return date; }

async function renderCalendar(){
  const calendarEl=document.getElementById('calendar'); calendarEl.innerHTML='';
  calendarEl.style.gridAutoRows = `calc(100% / ${weekView})`;
  const events = await loadEvents();

  // Lundi semaine passée
  const today = new Date();
  const thisMonday = getMonday(today);
  const pastMonday = new Date(thisMonday); pastMonday.setDate(thisMonday.getDate()-7);
  let startDate;
  if(weekView===3) startDate = pastMonday;
  else if(weekView===4) startDate = pastMonday; // 4 semaines aussi commence par semaine passée

  const totalDays = 7*weekView;
  const months = new Set();
  const cellMap = [];

  for(let i=0;i<totalDays;i++){
    const day = new Date(startDate);
    day.setDate(day.getDate()+i);
    const cell = createDayCell(day);
    calendarEl.appendChild(cell);
    cellMap.push({date:day, el:cell, occupied:[], events:[]});
    months.add(capitalize(day.toLocaleString('fr-FR',{month:'long'})));
  }

  /* Événements */
  events.forEach(ev=>{
    const start = new Date(ev.start.dateTime||ev.start.date);
    const end = new Date(ev.end.dateTime||ev.end.date);
    const isAllDay = ev.start.date && !ev.start.dateTime;

    if(start.toDateString()===end.toDateString() || isAllDay){
      const cellObj = cellMap.find(c=>c.date.toDateString()===start.toDateString());
      if(cellObj){
        const evDiv=document.createElement('div'); 
        evDiv.className='event '+ev.type; 
        const label = isAllDay ? ev.summary : `${formatTime(start)} ${ev.summary}`;
        evDiv.textContent=label; 
        evDiv.onclick=()=>showModal(ev);
        cellObj.el.appendChild(evDiv);
        cellObj.events.push(ev);
      }
    } else {
      // Multi-days, splité par semaine
      let currStart = new Date(start);
      while(currStart<end){
        const monday = getMonday(currStart);
        const weekIndex = Math.floor((monday-startDate)/(7*24*60*60*1000));
        const weekStartIdx = weekIndex*7;
        const weekEndIdx = weekStartIdx+6;
        const startIdx = Math.max(cellMap.findIndex(c=>c.date>=currStart), weekStartIdx);
        let endIdx = cellMap.findIndex(c=>c.date>=end);
        if(endIdx===-1) endIdx = totalDays-1;
        endIdx = Math.min(endIdx, weekEndIdx);

        let line=0;
        while(cellMap.slice(startIdx,endIdx+1).some(c=>c.occupied[line])) line++;
        for(let i=startIdx;i<=endIdx;i++){ cellMap[i].occupied[line]=true; cellMap[i].events.push(ev); }

        const firstCell = cellMap[startIdx].el;
        const lastCell = cellMap[endIdx].el;
        const band = document.createElement('div');
        band.className=`multi-band ${ev.type} fade-in`; 
        band.style.top=`${line*22 + weekIndex*(100/weekView)}%`;
        band.style.position='absolute';
        band.style.left=firstCell.offsetLeft+'px';
        band.style.width=(lastCell.offsetLeft+lastCell.offsetWidth-firstCell.offsetLeft)+'px';

        const startSpan = document.createElement('span');
        startSpan.className='start-label';
        startSpan.textContent = `<${formatTime(currStart)} ${ev.summary}`;
        const endSpan = document.createElement('span');
        endSpan.className='end-label';
        const thisSegmentEnd = new Date(Math.min(end, cellMap[endIdx].date.getTime()+24*60*60*1000));
        endSpan.textContent = `>${formatTime(thisSegmentEnd)}`;

        band.appendChild(startSpan);
        band.appendChild(endSpan);
        band.onclick=()=>showModal(ev);
        calendarEl.appendChild(band);

        currStart = new Date(cellMap[endIdx].date); currStart.setDate(currStart.getDate()+1);
      }
    }
  });

  // +X autres
  cellMap.forEach(c=>{
    if(c.events.length>3){
      const more=document.createElement('div'); 
      more.className='more-events'; 
      more.textContent=`+${c.events.length-3} autres`;
      more.onclick=()=>showModal(c.events);
      c.el.appendChild(more);
      for(let i=3;i<c.events.length;i++){
        const evEl=c.el.querySelectorAll('.event')[i];
        if(evEl) evEl.style.display='none';
      }
    }
  });

  document.getElementById('calendar-title').textContent=Array.from(months).join(' / ');
}

document.getElementById('prev-btn').onclick=()=>{currentStartDate.setDate(currentStartDate.getDate()-7); renderCalendar();}
document.getElementById('next-btn').onclick=()=>{currentStartDate.setDate(currentStartDate.getDate()+7); renderCalendar();}
document.getElementById('today-btn').onclick=()=>{
  currentStartDate=new Date();
  weekView=3;
  renderCalendar();
};
document.getElementById('view-3w').onclick=()=>{weekView=3; renderCalendar();}
document.getElementById('view-4w').onclick=()=>{weekView=4; renderCalendar();}

renderCalendar();
</script>
</body>
</html>
