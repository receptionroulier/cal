<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calendar Test</title>
<style>
/* --- Reset / Base styles --- */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f5f5;
}

#calendar-container {
  width: 100%;
  max-width: 1100px;
  margin: 30px auto;
  position: relative;
}

/* --- Calendar header --- */
#cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: #fff;
  border-radius: 8px;
  margin-bottom: 10px;
}
#cal-header button {
  padding: 6px 12px;
  cursor: pointer;
}
#cal-title {
  font-size: 22px;
  font-weight: bold;
}

/* --- Calendar table --- */
#calendar {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

#calendar th {
  background: #f0f0f0;
  padding: 8px;
  font-weight: bold;
  border: 1px solid #e0e0e0;
  text-align: center;
}

#calendar td {
  height: 80px;
  vertical-align: top;
  border: 1px solid #e0e0e0;
  position: relative;
  padding: 2px;
}

/* Date number (top-right of each cell) */
.cell-date {
  font-size: 13px;
  font-weight: bold;
  text-align: right;
  padding: 2px 4px;
}

/* --- Events Layer (all types) --- */
#events-layer {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

/* Bands for multi & all-day events */
.multi-band, .single-evt {
  position: absolute;
  background: #1976d2;
  color: #fff;
  border-radius: 4px;
  padding: 1px 4px;
  font-size: 11px;
  line-height: 1.2;
  white-space: normal;
  overflow: hidden;
  pointer-events: auto;
}

/* Allow 2 lines max for single-day */
.single-evt {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* Start and end label inside bands */
.multi-band .start { float: left; }
.multi-band .end { float: right; }

/* Hidden events (+X) badge */
.more-badge {
  position: absolute;
  right: 4px;
  bottom: 2px;
  background: #444;
  color: #fff;
  padding: 2px 4px;
  font-size: 11px;
  border-radius: 4px;
  cursor: pointer;
  pointer-events: auto;
}

/* --- Modal popup --- */
#event-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  justify-content: center;
  align-items: center;
}

#event-modal {
  background: #fff;
  padding: 18px;
  border-radius: 6px;
  width: 300px;
}

</style>
</head>
<body>

<div id="calendar-container">

  <div id="cal-header">
    <button id="prev-btn">←</button>
    <div id="cal-title"></div>
    <button id="today-btn">Aujourd'hui</button>
    <button id="next-btn">→</button>
  </div>

  <table id="calendar">
    <thead>
      <tr>
        <th>Lun</th><th>Mar</th><th>Mer</th>
        <th>Jeu</th><th>Ven</th><th>Sam</th><th>Dim</th>
      </tr>
    </thead>
    <tbody id="cal-body"></tbody>
  </table>

  <div id="events-layer"></div>

</div>

<!-- Modal -->
<div id="event-modal-bg">
  <div id="event-modal">
    <h3 id="m-title"></h3>
    <p id="m-date"></p>
    <p id="m-desc"></p>
  </div>
</div>

<script>
/* ------------------------------------------------------------------------------------------------
   UTILITAIRES
--------------------------------------------------------------------------------------------------- */
function fmtDate(d){ return d.toISOString().split("T")[0]; }
function fmtTime(d){ return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function cap(str){ return str.charAt(0).toUpperCase()+str.slice(1); }

function formatLongDate(d){
  return d.toLocaleDateString("fr-FR",{ weekday:"long", day:"2-digit", month:"long" });
}

/* ------------------------------------------------------------------------------------------------
   CALENDAR STATE
--------------------------------------------------------------------------------------------------- */
let anchorDate = new Date();  // center (middle) week

// Example events
const events = [
  {
    summary:"Journée complète Test",
    _start:new Date("2025-01-15"),
    _end:new Date("2025-01-15"),
    description:"Un test all-day",
    allDay:true
  },
  {
    summary:"Réunion",
    _start:new Date("2025-01-17T14:00"),
    _end:new Date("2025-01-17T15:00"),
    description:"Réunion standard",
    allDay:false
  },
  {
    summary:"Formation 3 jours",
    _start:new Date("2025-01-20T09:00"),
    _end:new Date("2025-01-22T17:00"),
    description:"Multi-day",
    allDay:false
  }
];

/* ------------------------------------------------------------------------------------------------
   BUILD CALENDAR (3 WEEKS, MONDAY START)
--------------------------------------------------------------------------------------------------- */
function startOfWeek(d){
  const r=new Date(d);
  const day=(r.getDay()+6)%7;
  r.setDate(r.getDate()-day);
  r.setHours(0,0,0,0);
  return r;
}

function buildCalendar(){
  const calBody=document.getElementById("cal-body");
  const eventsLayer=document.getElementById("events-layer");
  eventsLayer.innerHTML="";
  calBody.innerHTML="";

  const midMonday=startOfWeek(anchorDate);

  const prevMonday=new Date(midMonday); prevMonday.setDate(prevMonday.getDate()-7);
  const nextMonday=new Date(midMonday); nextMonday.setDate(nextMonday.getDate()+7);

  const weeks=[prevMonday, midMonday, nextMonday];

  // title = Mois du milieu
  const mname=midMonday.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  document.getElementById("cal-title").textContent = cap(mname);

  const cells=[];
  weeks.forEach(w=>{
    const tr=document.createElement("tr");
    for(let i=0;i<7;i++){
      const cdate=new Date(w); cdate.setDate(cdate.getDate()+i);
      const td=document.createElement("td");
      const dn=document.createElement("div");
      dn.className="cell-date";
      dn.textContent=cdate.getDate();
      td.appendChild(dn);
      tr.appendChild(td);
      cells.push({td, date:new Date(cdate)});
    }
    calBody.appendChild(tr);
  });

  /* --- Compute geometry --- */
  const rectCalendar=document.getElementById("calendar").getBoundingClientRect();
  const rectCells=cells.map(c=>c.td.getBoundingClientRect());
  const rectBody=calBody.getBoundingClientRect();

  const rowTops=[];
  for(let r=0;r<3;r++){
    const idx=r*7;
    rowTops.push(rectCells[idx].top - rectBody.top);
  }

  /* ----------------------------------------------------------------------------------------------
     TRANSFORM EVENTS → SEGMENTS
  ----------------------------------------------------------------------------------------------- */
  const segments=[];

  events.forEach(ev=>{
    const s=new Date(ev._start);
    const e=new Date(ev._end);
    const isAll=ev.allDay===true;

    const dbgStart=new Date(s);
    dbgStart.setHours(0,0,0,0);
    const dbgEnd=new Date(e);
    dbgEnd.setHours(23,59,59,999);

    for(let i=0;i<cells.length;i++){
      const cday=cells[i].date;
      if(cday >= dbgStart && cday <= dbgEnd){
        const weekIdx=Math.floor(i/7);
        const startIdx=i;
        let endIdx=i;
        for(let j=i+1;j<cells.length;j++){
          const nd=cells[j].date;
          if(nd>=dbgStart && nd<=dbgEnd) endIdx=j;
          else break;
        }
        segments.push({
          ev,
          startIdx,
          endIdx,
          weekIdx,
          _isSingleDay:(dbgStart.getTime()===dbgEnd.getTime()),
          _isAllDay:isAll
        });
        break;
      }
    }
  });

  /* ----------------------------------------------------------------------------------------------
     LANE ASSIGNMENT
  ----------------------------------------------------------------------------------------------- */
  const weekLanes=[[],[],[]];

  segments.forEach(seg=>{
    const lanes=weekLanes[seg.weekIdx];
    let lane=0;
    function overlaps(l){
      const arr=lanes[l] || [];
      return arr.some(r => !(seg.endIdx < r.startIdx || seg.startIdx > r.endIdx));
    }
    while(overlaps(lane)) lane++;
    if(!lanes[lane]) lanes[lane]=[];
    lanes[lane].push({startIdx:seg.startIdx,endIdx:seg.endIdx});
    seg.lane=lane;
  });

  // Visible lanes
  const cellH=80;
  const dateH=18;
  const bandH=16;
  const spacing=4;
  const maxBands=Math.floor((cellH-dateH)/ (bandH+spacing));

  const visibleLanesPerWeek=[];
  for(let w=0;w<3;w++){
    const count=weekLanes[w].length;
    visibleLanesPerWeek[w]=Math.min(count,maxBands);
  }

  /* ----------------------------------------------------------------------------------------------
     RENDER SEGMENTS
  ----------------------------------------------------------------------------------------------- */
  segments.forEach(seg=>{
    const r0=rectCells[seg.startIdx];
    const r1=rectCells[seg.endIdx];
    if(!r0 || !r1) return;

    const el=document.createElement("div");
    el.className = seg._isSingleDay ? "single-evt" : "multi-band";

    const left = r0.left - rectCalendar.left;
    const width = (r1.right - r0.left);

    el.style.left = (left + 0) + "px";
    el.style.width = (width - 4) + "px";

    const top = rowTops[seg.weekIdx] + dateH + 4 + seg.lane*(bandH+spacing);
    el.style.top = top + "px";
    el.style.height = bandH + "px";

    // TEXT
    if(seg._isSingleDay){
      const st = seg._isAllDay ? "" : fmtTime(seg.ev._start)+" ";
      el.textContent = st + seg.ev.summary;
    } else {
      const st = seg._isAllDay ? "" : "<"+fmtTime(seg.ev._start)+" ";
      const endT = seg._isAllDay ? "" : " >"+fmtTime(seg.ev._end);
      el.textContent = st + seg.ev.summary + endT;
    }

    // Hide if lane overflow
    const vis=visibleLanesPerWeek[seg.weekIdx];
    if(seg.lane >= vis){
      el.style.display="none";
      seg._hidden=true;
    } else {
      seg._hidden=false;
    }

    el.addEventListener("click", e=>{
      e.stopPropagation();
      showEventModal(seg.ev);
    });

    eventsLayer.appendChild(el);
  });

  /* ----------------------------------------------------------------------------------------------
     +X BADGES
  ----------------------------------------------------------------------------------------------- */
  const hiddenCount=new Array(cells.length).fill(0);

  segments.forEach(seg=>{
    if(seg._hidden){
      for(let i=seg.startIdx;i<=seg.endIdx;i++){
        hiddenCount[i]++;
      }
    }
  });

  cells.forEach((c,idx)=>{
    if(hiddenCount[idx]>0){
      const b=document.createElement("div");
      b.className="more-badge";
      b.textContent="+"+hiddenCount[idx];
      const r=rectCells[idx];
      b.style.top = (r.top - rectBody.top + cellH - 18) +"px";
      b.style.left = (r.left - rectBody.left + 4) +"px";
      b.addEventListener("click", e=>{
        e.stopPropagation();
        showMorePopup(idx);
      });
      eventsLayer.appendChild(b);
    }
  });

  /* ----------------------------------------------------------------------------------------------
     MORE POPUP
  ----------------------------------------------------------------------------------------------- */
  function showMorePopup(cellIdx){
    const arr=[];
    segments.forEach(seg=>{
      if(seg._hidden){
        if(cellIdx>=seg.startIdx && cellIdx<=seg.endIdx){
          arr.push(seg.ev);
        }
      }
    });

    let txt="";
    arr.forEach(ev=>{
      txt+= (ev.summary || "Événement") + "\n";
    });

    alert("Évènements cachés :\n\n" + txt);
  }
}

/* ------------------------------------------------------------------------------------------------
   MODAL
--------------------------------------------------------------------------------------------------- */
const modalBg=document.getElementById("event-modal-bg");
modalBg.addEventListener("click", ()=> modalBg.style.display="none");

function showEventModal(ev){
  document.getElementById("m-title").textContent=ev.summary;
  const s=new Date(ev._start);
  const e=new Date(ev._end);
  let text="";
  if(ev.allDay){
    if(fmtDate(s)===fmtDate(e)){
      text="Le "+cap(formatLongDate(s));
    } else {
      text="Du "+cap(formatLongDate(s))+" au "+cap(formatLongDate(e));
    }
  } else {
    if(fmtDate(s)===fmtDate(e)){
      text="Le "+cap(formatLongDate(s))+" à "+fmtTime(s);
    } else {
      text="Du "+cap(formatLongDate(s))+" à "+fmtTime(s)
       +" au "+cap(formatLongDate(e))+" à "+fmtTime(e);
    }
  }
  document.getElementById("m-date").textContent=text;
  document.getElementById("m-desc").textContent=ev.description||"";
  modalBg.style.display="flex";
}

/* ------------------------------------------------------------------------------------------------
   NAVIGATION
--------------------------------------------------------------------------------------------------- */
document.getElementById("prev-btn").onclick=()=>{
  anchorDate.setDate(anchorDate.getDate()-7);
  buildCalendar();
};

document.getElementById("next-btn").onclick=()=>{
  anchorDate.setDate(anchorDate.getDate()+7);
  buildCalendar();
};

document.getElementById("today-btn").onclick=()=>{
  anchorDate=new Date();
  buildCalendar();
};

/* ------------------------------------------------------------------------------------------------
   START
--------------------------------------------------------------------------------------------------- */
buildCalendar();
</script>

</body>
</html>
