<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
html, body { height:100%; font-family: system-ui, sans-serif; }

/* ===== DESKTOP ===== */
#desktop-view {
  display:flex;
  height:100vh;
}

.frame-wrapper {
  position:relative;
  height:100%;
}

#desktop-view iframe {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
}

/* ===== MOBILE ===== */
#mobile-view {
  display:none;
  flex-direction:column;
  height:100vh;
}

/* haut = p.html */
#mobile-top {
  height:40%;
}

/* bas = calr.html */
#mobile-bottom {
  flex:1;
  min-height:0;
}

#mobile-view iframe {
  width:100%;
  height:100%;
  border:none;
  position:relative;
}

/* SWITCH */
@media (max-width:719px){
  #desktop-view{display:none;}
  #mobile-view{display:flex;}
}
@media (min-width:720px){
  #desktop-view{display:flex;}
  #mobile-view{display:none;}
}
</style>
</head>

<body>

<!-- ===== DESKTOP ===== -->
<div id="desktop-view">
  <div class="frame-wrapper" style="width:25%;">
    <iframe src="https://receptionroulier.github.io/cal/p.html"></iframe>
  </div>
  <div class="frame-wrapper" style="width:75%;">
    <iframe src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>
</div>

<!-- ===== MOBILE ===== -->
<div id="mobile-view">

  <!-- 🔝 p.html (TON CODE, ton responsive, tes 5 colonnes) -->
  <div id="mobile-top">
    <iframe src="https://receptionroulier.github.io/cal/p.html"></iframe>
  </div>

  <!-- 🔽 calr.html -->
  <div id="mobile-bottom">
    <iframe src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>

</div>

</body>
</html>
