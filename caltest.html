<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tableau de bord - Ponts & Calendrier</title>
<style>
/* ---------- Reset & Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:#0f0f10;
  color:#fff;
  display:flex;
  flex-direction:column;
  height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ---------- HEADER (glass + neon glow strengthened) ---------- */
#calendar-header{
  display:flex;
  flex-wrap:wrap; /* adapt on small screens */
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  padding:12px 18px;
  color:#00e5ff;
  position:relative;

  /* glass base */
  position: sticky;
  top: 8px;
  z-index: 999;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(10,14,20,0.70), rgba(18,22,34,0.44));
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);

  /* STRONG NEON GLOW — increased */
  box-shadow:
    0 6px 30px rgba(0,170,255,0.22),
    0 0 80px rgba(0,170,255,0.18),
    0 0 140px rgba(0,160,255,0.12),
    inset 0 1px 0 rgba(255,255,255,0.02);
}

/* Nav buttons / controls */
.nav-btn, .view-btn, #today-btn {
  cursor:pointer;
  font-weight:600;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  border-radius:10px;
  padding:6px 12px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
  color: #bfeaff;
  text-shadow: 0 0 6px rgba(0,170,255,0.28);
  backdrop-filter: blur(6px);
}

/* arrows */
.nav-btn{ font-size:26px; padding:6px 12px; line-height:1; }

/* view buttons */
.view-btn{ font-size:13px; padding:6px 10px; }

/* today button */
#today-btn{ font-size:15px; font-weight:700; }

/* hover neon boost */
.nav-btn:hover, .view-btn:hover, #today-btn:hover{
  background: rgba(0,170,255,0.12);
  color:#fff;
  transform: translateY(-3px);
  box-shadow:
    0 0 20px rgba(0,170,255,0.60),
    0 0 48px rgba(0,170,255,0.26);
}

/* centered title (keeps same DOM) */
#calendar-title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:700;
  font-size:1.05rem;
  white-space:nowrap;
  color:#dff6ff;
  letter-spacing:0.4px;
  text-shadow:
    0 0 10px rgba(0,200,255,0.30),
    0 0 26px rgba(0,160,255,0.18);
  padding:2px 8px;
  border-radius:8px;
}

/* CURRENT TIME — MUCH LARGER + stronger glow */
#current-time{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:2.8rem;            /* << much larger */
  line-height:1;
  font-weight:800;
  color:#bfeeff;
  font-family: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
  letter-spacing:0.8px;
  text-shadow:
    0 0 10px rgba(0,200,255,0.65),
    0 0 28px rgba(0,160,255,0.45),
    0 8px 30px rgba(0,120,255,0.06);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  padding:8px 14px;
  border-radius:10px;
  border: 1px solid rgba(255,255,255,0.04);
  backdrop-filter: blur(8px) saturate(140%);
  box-shadow:
    0 6px 30px rgba(0,170,255,0.18),
    inset 0 1px 0 rgba(255,255,255,0.02);
  transform-origin: center;
  /* ensure it stands out on small screens too */
}

/* Slight responsive downscale for tiny screens */
@media (max-width:420px){
  #current-time{ font-size:2.0rem; right:10px; padding:6px 10px; }
  .nav-btn{ font-size:22px; padding:6px 8px; }
}

/* ---------- Calendar grid & events ---------- */
#calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;padding:10px 12px}
#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:6px;align-content:start;position:relative}
.day-cell{
  background:#141416;
  border:1px solid rgba(255,255,255,0.03);
  border-radius:10px;
  padding:8px;
  position:relative;
  overflow:hidden;
  min-height:88px;
}
.day-cell.future-day { border-color: rgba(0,220,255,0.14); box-shadow: 0 0 6px rgba(0,220,255,0.06); }
.day-cell.today { border-color: rgba(0,220,255,0.9); box-shadow: 0 6px 28px rgba(0,200,255,0.14); animation: pulse 2.4s infinite; }
@keyframes pulse {0% { box-shadow: 0 0 8px rgba(0, 200, 255, 0.28);}50% { box-shadow: 0 0 18px rgba(0, 200, 255, 0.38);}100% { box-shadow: 0 0 8px rgba(0, 200, 255, 0.28);} }
.date-label{font-size:0.72rem;color:#cbd6da;margin-bottom:6px;font-weight:500}
.past-day-overlay {position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.45));border-radius:8px;pointer-events:none;z-index:20}
#events-layer{position:absolute;left:4px;right:12px;top:10px;bottom:12px;pointer-events:none}

/* event bands */
.multi-band, .single-evt {
  pointer-events:auto;
  position:absolute;
  display:flex;
  align-items:center;
  padding:0 10px;
  height:22px;
  border-radius:12px;
  font-size:0.78rem;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.04);
  backdrop-filter: blur(6px) saturate(120%);
  -webkit-backdrop-filter: blur(6px) saturate(120%);
  box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.02);
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.multi-band:hover, .single-evt:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.06));
}

/* semantic color hints with neon feel */
.reception {
  background: linear-gradient(90deg, rgba(0,240,140,0.20), rgba(0,200,110,0.14));
  border-color: rgba(0,240,140,0.38);
  box-shadow: 0 6px 18px rgba(0,240,140,0.06), inset 0 1px 6px rgba(0,240,160,0.06);
}
.reception:hover {
  box-shadow: 0 10px 40px rgba(0,240,140,0.14), inset 0 2px 8px rgba(0,240,160,0.08);
}

.navire {
  background: linear-gradient(90deg, rgba(0,150,255,0.20), rgba(0,110,220,0.14));
  border-color: rgba(0,150,255,0.38);
  box-shadow: 0 6px 18px rgba(0,150,255,0.06), inset 0 1px 6px rgba(0,160,255,0.06);
}
.navire:hover {
  box-shadow: 0 10px 40px rgba(0,150,255,0.14), inset 0 2px 8px rgba(0,170,255,0.08);
}

/* scrolling text for long labels */
.event-text-container{display:inline-flex;white-space:nowrap;overflow:hidden;width:100%;position:relative}
.event-text{white-space:nowrap;display:inline-block;position:relative}
.event-text.scrolling{animation:scroll 10s linear infinite}
.event-text.scrolling::after{content:attr(data-text);position:absolute;left:100%;white-space:nowrap}
@keyframes scroll {0%{ transform:translateX(0);}100%{ transform:translateX(-100%);}}

/* more events badge */
.more-events{position:absolute;top:6px;right:8px;padding:3px 8px;background:rgba(0,0,0,0.45);border-radius:8px;font-size:0.75rem;cursor:pointer;z-index:60;pointer-events:auto}

/* modal */
#event-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:9999}
.modal-card{background:#191b1c;padding:18px;border-radius:12px;max-width:720px;width:94%;box-shadow:0 10px 40px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.03)}
.modal-card h3{margin-bottom:6px}
.modal-item{margin-bottom:10px}
.modal-item p{color:#dbe7ea;margin-top:6px}

/* responsiveness */
@media(max-width:720px){
  #calendar-header{ padding:10px 12px; gap:8px}
  .nav-btn{ font-size:22px; }
  .view-btn{ font-size:12px; }
  #current-time{ font-size:2.0rem; right:12px; padding:6px 10px; }
}
@media(max-width:500px){
  #calendar-header{ flex-direction:column; align-items:flex-start; padding:12px; border-radius:10px}
  #calendar-title{ position:relative; left:auto; transform:none; margin:6px 0; }
  #current-time{ position:relative; right:auto; transform:none; margin-left:0; font-size:1.6rem; }
  #calendar{ gap:6px; padding:6px}
}

/* small utility */
.hidden{display:none !important}
</style>
</head>
<body>
  <!-- HEADER -->
  <div id="calendar-header" role="banner" aria-label="En-tête du calendrier">
    <button class="nav-btn" id="prev-btn" aria-label="Semaine précédente">‹</button>
    <button class="nav-btn" id="today-btn" aria-label="Aujourd'hui">Aujourd’hui</button>

    <div id="calendar-title" aria-live="polite">Chargement…</div>

    <button class="nav-btn" id="next-btn" aria-label="Semaine suivante">›</button>

    <button class="view-btn" id="view-3w" aria-pressed="false">3 semaines</button>
    <button class="view-btn" id="view-4w" aria-pressed="false">4 semaines</button>

    <div id="current-time" aria-hidden="false">--:--:--</div>
  </div>

  <!-- CALENDAR -->
  <div id="calendar-wrap">
    <div id="calendar" role="grid" aria-label="Calendrier"></div>
    <div id="events-layer" aria-hidden="false"></div>
  </div>

  <!-- MODAL -->
  <div id="event-modal" onclick="hideModal()" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

<script>
/* ---------- Main JS (complete) ---------- */
document.addEventListener('DOMContentLoaded', function() {

  /***********************
   * Config & State
   ***********************/
  const API_KEY = 'AIzaSyDkQkqPoOGf8umYg2dbeTU0THfLlJnCjXo';
  const CALENDAR_IDS = {
    reception: 'receptionroulier@gmail.com',
    navire: 'smr.programme@gmail.com'
  };
  const CACHE_KEY = 'caltest_v2_cache';
  const CACHE_TTL = 30000; // 30s
  let weekView = 3;
  let currentStartDate = new Date();
  let resizeTimeout = null;
  let autoRefreshTimer = null;

  /***********************
   * Helpers
   ***********************/
  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function fmtTime(d) {
    if(!d) return '';
    return new Date(d).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDayLabel(d) {
    return d.toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit'});
  }
  function fmtFullDate(d){
    return new Date(d).toLocaleDateString('fr-FR', {weekday:'long', day:'2-digit', month:'long'});
  }
  function capitalize(s){ return s? s.charAt(0).toUpperCase()+s.slice(1): s; }
  function calculateHash(events){
    try {
      return JSON.stringify(events.map(ev=>({
        id: ev.id,
        updated: ev.updated,
        start: ev.start && (ev.start.dateTime || ev.start.date),
        end: ev.end && (ev.end.dateTime || ev.end.date),
        summary: ev.summary
      })));
    } catch(e){ return ''; }
  }
  function loadCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const obj = JSON.parse(raw);
      if(Date.now() - (obj.ts||0) > CACHE_TTL) return null;
      return obj;
    }catch(e){ return null; }
  }
  function saveCache(items, hash){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ items, hash, ts: Date.now() })); } catch(e){ console.error('Erreur sauvegarde cache:', e); }
  }

  /***********************
   * Clock
   ***********************/
  function updateClock(){
    const now = new Date();
    const hh = now.getHours().toString().padStart(2,'0');
    const mm = now.getMinutes().toString().padStart(2,'0');
    const ss = now.getSeconds().toString().padStart(2,'0');
    document.getElementById('current-time').textContent = `${hh}:${mm}:${ss}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  /***********************
   * Modal helpers
   ***********************/
  function hideModal(){ document.getElementById('event-modal').style.display = 'none'; }
  function showEventModal(ev){
    const modal = document.getElementById('event-modal');
    const content = document.getElementById('modal-content');
    const start = ev._start, end = ev._end, isAll = ev._isAllDay;
    const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
    let html = `<h3>${ev.summary || '(sans titre)'}</h3>`;
    if(isMulti) html += `<div class="modal-item"><p>Du ${fmtFullDate(start)} à ${fmtTime(start)}<br>Au ${fmtFullDate(end)} à ${fmtTime(end)}</p></div>`;
    else if(isAll) html += `<div class="modal-item"><p>Le ${fmtFullDate(start)}</p></div>`;
    else html += `<div class="modal-item"><p>Le ${fmtFullDate(start)} à ${fmtTime(start)}</p></div>`;
    if(ev.description) html += `<div class="modal-item"><p>${ev.description}</p></div>`;
    content.innerHTML = html;
    modal.style.display = 'flex';
  }
  function showModalForCell(cellObj){
    const modal = document.getElementById('event-modal');
    const content = document.getElementById('modal-content');
    const events = cellObj.eventsList || [];
    const list = [];
    events.forEach(ev=>{
      const start = ev._start, end = ev._end, isAll = ev._isAllDay;
      const isMulti = !isAll && (new Date(start).toDateString() !== new Date(end).toDateString());
      if(isMulti){
        list.push(`<div class="modal-item"><h3>${ev.summary || '(sans titre)'}</h3><p>Du ${fmtFullDate(start)} à ${fmtTime(start)}<br>Au ${fmtFullDate(end)} à ${fmtTime(end)}</p>${ev.description?('<p>'+ev.description+'</p>'):''}</div>`);
      } else if(isAll){
        list.push(`<div class="modal-item"><h3>${ev.summary || '(sans titre)'}</h3><p>Le ${fmtFullDate(start)}</p>${ev.description?('<p>'+ev.description+'</p>'):''}</div>`);
      } else {
        list.push(`<div class="modal-item"><h3>${ev.summary || '(sans titre)'}</h3><p>Le ${fmtFullDate(start)} à ${fmtTime(start)}</p>${ev.description?('<p>'+ev.description+'</p>'):''}</div>`);
      }
    });
    content.innerHTML = list.join('<hr style="border:none;border-top:1px solid #333;margin:8px 0">') || '<p>Aucun évènement</p>';
    modal.style.display = 'flex';
  }

  /***********************
   * Fetch calendars
   ***********************/
  async function fetchCalendarsRange(timeMin, timeMax){
    // fetch both calendars in parallel and tag events with __type
    const buildURL = (calId) => `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?key=${encodeURIComponent(API_KEY)}&singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}`;
    const a = fetch(buildURL(CALENDAR_IDS.reception)).then(r=>{ if(!r.ok) throw new Error('API reception '+r.status); return r.json(); }).catch(e=>{ console.error('fetch reception error',e); return { items: [] }; });
    const b = fetch(buildURL(CALENDAR_IDS.navire)).then(r=>{ if(!r.ok) throw new Error('API navire '+r.status); return r.json(); }).catch(e=>{ console.error('fetch navire error',e); return { items: [] }; });

    const [r1, r2] = await Promise.allSettled([a,b]);
    const items1 = r1.status === 'fulfilled' ? (r1.value.items || []) : [];
    const items2 = r2.status === 'fulfilled' ? (r2.value.items || []) : [];
    return [...items1.map(i=>({...i, __type:'reception'})), ...items2.map(i=>({...i, __type:'navire'}))];
  }

  /***********************
   * Rendering
   ***********************/
  function updateScrollingEvents(){
    document.querySelectorAll('.event-text').forEach(el=>{
      const container = el.parentElement;
      if(el.scrollWidth > container.clientWidth) el.classList.add('scrolling');
      else el.classList.remove('scrolling');
    });
  }

  async function renderCalendar(itemsOverride){
    const calendarEl = document.getElementById('calendar');
    const eventsLayer = document.getElementById('events-layer');
    calendarEl.innerHTML = '';
    eventsLayer.innerHTML = '';

    // compute date range: we show Monday of currentStartDate - 1 week (past) through weekView weeks
    const today = new Date(); today.setHours(0,0,0,0);
    const thisMonday = getMonday(currentStartDate);
    const pastMonday = new Date(thisMonday); pastMonday.setDate(thisMonday.getDate() - 7); // keep previous week visible
    const startDate = pastMonday;
    const totalDays = weekView * 7;

    // compute heights to allocate lanes visually
    const headerH = document.getElementById('calendar-header').getBoundingClientRect().height || 60;
    const availH = Math.max(260, window.innerHeight - headerH - 36);
    const rowH = Math.floor((availH - 20) / weekView);
    calendarEl.style.gridAutoRows = `${rowH}px`;

    // create day cells
    const cellMap = []; const months = new Set();
    for(let i=0;i<totalDays;i++){
      const d = new Date(startDate); d.setDate(d.getDate() + i); d.setHours(0,0,0,0);
      const cell = document.createElement('div'); cell.className = 'day-cell';
      if(d > today) cell.classList.add('future-day');
      if(d.getTime() === today.getTime()) cell.classList.add('today');
      const label = document.createElement('div'); label.className = 'date-label'; label.textContent = fmtDayLabel(d);
      cell.appendChild(label);
      calendarEl.appendChild(cell);
      cellMap.push({ date: d, el: cell, eventsList: [], visibleCount: 0, hiddenCount: 0 });
      months.add(capitalize(d.toLocaleString('fr-FR', { month:'long' })));
    }

    // ensure layout settled (width/height)
    await new Promise(resolve=>{
      const check = ()=>{
        const cells = calendarEl.querySelectorAll('.day-cell');
        if(cells.length > 0){
          let ok = true;
          cells.forEach(c=>{
            const r = c.getBoundingClientRect();
            if(r.width === 0 || r.height === 0) ok = false;
          });
          if(ok){ resolve(); return; }
        }
        requestAnimationFrame(check);
      };
      check();
    });

    const calendarRect = calendarEl.getBoundingClientRect();
    const cellRects = cellMap.map(c => c.el.getBoundingClientRect());

    const timeMin = new Date(startDate); timeMin.setHours(0,0,0,0);
    const timeMax = new Date(timeMin); timeMax.setDate(timeMax.getDate() + totalDays);

    // get items (cache-aware)
    let items = itemsOverride;
    if(!items){
      const cache = loadCache();
      if(cache){
        const fetched = await fetchCalendarsRange(timeMin, timeMax).catch(()=>[]);
        const newHash = calculateHash(fetched);
        if(newHash !== cache.hash){
          items = fetched;
          saveCache(items, newHash);
        } else {
          items = cache.items;
        }
      } else {
        items = await fetchCalendarsRange(timeMin, timeMax);
        saveCache(items, calculateHash(items));
      }
    }

    // normalize events (parse dates, handle all-day)
    const norm = items.map(e=>{
      const ev = JSON.parse(JSON.stringify(e));
      ev.__type = ev.__type || '';
      ev._isAllDay = !!(ev.start && ev.start.date && !ev.start.dateTime);
      if(ev.start){
        if(ev.start.dateTime) ev._start = new Date(ev.start.dateTime);
        else { ev._start = new Date(ev.start.date); ev._start.setHours(0,0,0,0); }
      }
      if(ev.end){
        if(ev.end.dateTime) ev._end = new Date(ev.end.dateTime);
        else { ev._end = new Date(ev.end.date); ev._end.setHours(0,0,0,0); }
      }
      if(ev._isAllDay && ev._end){
        const adj = new Date(ev._end);
        adj.setDate(adj.getDate() - 1);
        adj.setHours(23,59,59,999);
        ev._endInclusive = adj;
      } else if(ev._end){
        const tmp = new Date(ev._end);
        if(tmp.getHours() === 0 && tmp.getMinutes() === 0 && tmp.getSeconds() === 0){
          const adj = new Date(tmp);
          adj.setDate(adj.getDate() - 1);
          adj.setHours(23,59,59,999);
          ev._endInclusive = adj;
        } else ev._endInclusive = new Date(ev._end);
      }
      return ev;
    }).filter(e => e._start && e._endInclusive);

    // split into week-limited segments (so multi-week events render as bands per-week)
    const segments = [];
    norm.forEach(ev=>{
      const sDay = new Date(ev._start); sDay.setHours(0,0,0,0);
      const eDay = new Date(ev._endInclusive); eDay.setHours(0,0,0,0);
      let cursor = new Date(sDay);
      while(cursor <= eDay){
        const weekIndex = Math.floor((cursor - startDate) / (7*24*3600*1000));
        if(weekIndex < 0){ cursor = new Date(startDate); continue; }
        if(weekIndex >= weekView) break;
        const weekStartIdx = weekIndex * 7;
        const weekEndIdx = Math.min(weekStartIdx + 6, cellMap.length - 1);

        // find segment start & end index within that week
        let segStartIdx = -1;
        for(let i=weekStartIdx;i<=weekEndIdx;i++){
          if(cellMap[i].date.getTime() >= cursor.getTime()){ segStartIdx = i; break; }
        }
        if(segStartIdx === -1){
          cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate() + 1);
          continue;
        }
        let segEndIdx = -1;
        for(let i=weekEndIdx;i>=weekStartIdx;i--){
          if(cellMap[i].date.getTime() <= eDay.getTime()){ segEndIdx = i; break; }
        }
        if(segEndIdx === -1){
          cursor = new Date(cellMap[weekEndIdx].date); cursor.setDate(cursor.getDate() + 1);
          continue;
        }

        segments.push({
          ev,
          startIdx: segStartIdx,
          endIdx: segEndIdx,
          weekIdx: weekIndex,
          segStartDate: new Date(cellMap[segStartIdx].date),
          segEndDate: new Date(cellMap[segEndIdx].date)
        });

        cursor = new Date(cellMap[segEndIdx].date);
        cursor.setDate(cursor.getDate() + 1);
      }
    });

    // lane calculation (per-week)
    const weekLanes = Array.from({ length: weekView }, ()=>[]);
    segments.forEach(seg=>{
      const lanes = weekLanes[seg.weekIdx];
      let lane = 0;
      function overlaps(l){
        const arr = lanes[l] || [];
        return arr.some(r=>!(seg.endIdx < r.startIdx || seg.startIdx > r.endIdx));
      }
      while(overlaps(lane)) lane++;
      if(!lanes[lane]) lanes[lane] = [];
      lanes[lane].push({ startIdx: seg.startIdx, endIdx: seg.endIdx });
      seg.lane = lane;
    });

    // attach events to cellMap to show in modal the list
    cellMap.forEach(c=>{ c.eventsList = []; c.totalSegments = 0; });
    segments.forEach(seg=>{
      for(let i=seg.startIdx;i<=seg.endIdx;i++){
        if(i>=0 && i<cellMap.length){
          const c = cellMap[i];
          c.totalSegments++;
          if(!c.eventsList.includes(seg.ev)) c.eventsList.push(seg.ev);
        }
      }
    });

    // compute layout values for bands
    const dateLabelEl = document.querySelector('.date-label');
    const dateLabelH = dateLabelEl ? dateLabelEl.getBoundingClientRect().height : 18;
    const bandH = 22, laneGap = 6, bandSpacing = bandH + laneGap;
    const weekTopBase = [];
    for(let w=0; w<weekView; w++){
      const idx = w*7;
      weekTopBase[w] = idx < cellRects.length ? (cellRects[idx].top - calendarRect.top) : 0;
    }
    const visibleLanesPerWeek = [];
    for(let w=0; w<weekView; w++){
      const avail = rowH - (dateLabelH + 8);
      visibleLanesPerWeek[w] = Math.max(0, Math.floor((avail + laneGap) / bandSpacing));
    }

    function getFirstSegmentOfEvent(ev){
      return segments.filter(s=>s.ev === ev).reduce((a,b)=> a.startIdx < b.startIdx ? a : b);
    }
    function getLastSegmentOfEvent(ev){
      return segments.filter(s=>s.ev === ev).reduce((a,b)=> a.endIdx > b.endIdx ? a : b);
    }

    // grey-out past days
    cellMap.forEach(c=>{
      if(c.date < today){
        const overlay = document.createElement('div');
        overlay.className = 'past-day-overlay';
        c.el.appendChild(overlay);
        c.el.style.position = 'relative';
      }
    });

    // render segments as bands (eventsLayer uses absolute positioning)
    segments.forEach(seg=>{
      const firstRect = cellRects[seg.startIdx], lastRect = cellRects[seg.endIdx];
      if(!firstRect || !lastRect) return;
      const left = firstRect.left - calendarRect.left;
      const width = (lastRect.left + lastRect.width) - firstRect.left - 6;
      const el = document.createElement('div');
      el.className = 'multi-band ' + (seg.ev.__type || '');
      el.style.left = `${left}px`;
      el.style.width = `${Math.max(40, width)}px`;
      const top = (weekTopBase[seg.weekIdx] || 0) + dateLabelH + 6 + (seg.lane * bandSpacing);
      el.style.top = `${top}px`;
      el.style.height = `${bandH}px`;

      const textContainer = document.createElement('div'); textContainer.className = 'event-text-container';
      const eventText = document.createElement('div'); eventText.className = 'event-text';
      const ev = seg.ev;
      const evStartTime = ev._isAllDay ? '' : fmtTime(ev._start);
      const evEndTime = (!ev._isAllDay && seg.endIdx === getLastSegmentOfEvent(ev).endIdx) ? ('>' + fmtTime(ev._end)) : '';
      const isFirstSegment = seg.startIdx === getFirstSegmentOfEvent(ev).startIdx;
      let fullText = '';
      if(isFirstSegment && evStartTime) fullText += `<${evStartTime} `;
      fullText += ev.summary || '(sans titre)';
      if(evEndTime) fullText += ` ${evEndTime}`;
      eventText.textContent = fullText;
      eventText.setAttribute('data-text', fullText);
      textContainer.appendChild(eventText);
      el.appendChild(textContainer);

      // click to open modal
      el.addEventListener('click', e => { e.stopPropagation(); showEventModal(seg.ev); });

      // determine visibility based on lanes available
      const visibleLanes = visibleLanesPerWeek[seg.weekIdx] || 0;
      el.style.display = seg.lane >= visibleLanes ? 'none' : 'flex';
      seg._isHidden = seg.lane >= visibleLanes;

      eventsLayer.appendChild(el);
    });

    // add "+N autres" badges on day cells for hidden events
    cellMap.forEach((c, idx)=>{
      const weekIdx = Math.floor(idx / 7);
      const visibleLanes = visibleLanesPerWeek[weekIdx] || 0;
      let visibleCount = 0, hiddenCount = 0;
      segments.forEach(seg=>{
        if(seg.startIdx <= idx && seg.endIdx >= idx && seg.weekIdx === weekIdx){
          if(seg.lane < visibleLanes) visibleCount++;
          else hiddenCount++;
        }
      });
      c.visibleCount = visibleCount;
      c.hiddenCount = hiddenCount;
      if(hiddenCount > 0){
        const badge = document.createElement('div'); badge.className = 'more-events';
        badge.textContent = `+${hiddenCount} autres`;
        badge.addEventListener('click', e => { e.stopPropagation(); showModalForCell(c); });
        c.el.appendChild(badge);
      }
    });

    setTimeout(updateScrollingEvents, 140);
    document.getElementById('calendar-title').textContent = Array.from(months).join(' / ');
  }

  /***********************
   * Auto-refresh mechanism
   ***********************/
  function startAutoRefresh(){
    if(autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(async ()=>{
      try{
        const thisMonday = getMonday(currentStartDate);
        const pastMonday = new Date(thisMonday); pastMonday.setDate(thisMonday.getDate() - 7);
        const startDate = pastMonday;
        const totalDays = weekView * 7;
        const timeMin = new Date(startDate); timeMin.setHours(0,0,0,0);
        const timeMax = new Date(timeMin); timeMax.setDate(timeMax.getDate() + totalDays);
        const newItems = await fetchCalendarsRange(timeMin, timeMax);
        const newHash = calculateHash(newItems);
        const cache = loadCache();
        const oldHash = cache ? cache.hash : null;
        if(newHash !== oldHash){
          saveCache(newItems, newHash);
          await renderCalendar(newItems);
        }
      }catch(e){ console.error('Auto-refresh error', e); }
    }, 30000);
  }

  /***********************
   * Event listeners for controls
   ***********************/
  document.getElementById('prev-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate() - 7); localStorage.removeItem(CACHE_KEY); renderCalendar().catch(()=>{}); });
  document.getElementById('next-btn').addEventListener('click', ()=>{ currentStartDate.setDate(currentStartDate.getDate() + 7); localStorage.removeItem(CACHE_KEY); renderCalendar().catch(()=>{}); });
  document.getElementById('today-btn').addEventListener('click', ()=>{ currentStartDate = new Date(); weekView = 3; localStorage.removeItem(CACHE_KEY); renderCalendar().catch(()=>{}); });
  document.getElementById('view-3w').addEventListener('click', ()=>{ weekView = 3; currentStartDate = getMonday(currentStartDate); localStorage.removeItem(CACHE_KEY); renderCalendar().catch(()=>{}); });
  document.getElementById('view-4w').addEventListener('click', ()=>{ weekView = 4; currentStartDate = getMonday(currentStartDate); localStorage.removeItem(CACHE_KEY); renderCalendar().catch(()=>{}); });

  document.getElementById('event-modal').addEventListener('click', hideModal);
  window.addEventListener('resize', ()=>{ clearTimeout(resizeTimeout); resizeTimeout = setTimeout(()=>{ renderCalendar().catch(()=>{}); }, 220); });

  /***********************
   * Initial render
   ***********************/
  renderCalendar().then(()=>{ startAutoRefresh(); }).catch(err=>{ console.error('render error', err); document.getElementById('calendar-title').textContent = 'Erreur'; });
});
</script>
