<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
html, body { height:100%; font-family: system-ui, sans-serif; }

/* ===== DESKTOP ===== */
#desktop-view {
  display:flex;
  height:100vh;
}

.frame-wrapper {
  position:relative;
  height:100%;
}

iframe {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
}

/* ===== MOBILE ===== */
#mobile-view {
  display:none;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

/* PONTS */
#mob-ponts {
  background:#0f172a;
  color:#eaeaea;
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  flex-shrink:0; /* ✅ FIX IMPORTANT */
}

#mob-header {
  display:flex;
  justify-content:space-between;
  font-size:0.85rem;
  margin-bottom:6px;
}

#ponts-cols {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:6px;
}

.pont {
  padding:6px;
  border-radius:6px;
  font-size:0.8rem;
  text-align:center;
}

.pont.ouvert { background:#14532d; }
.pont.ferme { background:#7f1d1d; }

/* CALENDRIER */
#mobile-cal {
  flex:1;
  min-height:0; /* ✅ FIX IMPORTANT */
}

#mobile-cal iframe {
  width:100%;
  height:100%;
}

/* SWITCH */
@media (max-width:719px){
  #desktop-view{display:none;}
  #mobile-view{display:flex;}
}
@media (min-width:720px){
  #desktop-view{display:flex;}
  #mobile-view{display:none;}
}
</style>
</head>

<body>

<!-- ===== DESKTOP ===== -->
<div id="desktop-view">
  <div class="frame-wrapper" style="width:25%;">
    <iframe src="https://receptionroulier.github.io/cal/p.html"></iframe>
  </div>
  <div class="frame-wrapper" style="width:75%;">
    <iframe src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>
</div>

<!-- ===== MOBILE ===== -->
<div id="mobile-view">

  <!-- PONTS MOBILE -->
  <div id="mob-ponts">
    <div id="mob-header">
      <span>État des ponts</span>
      <span id="refresh" style="cursor:pointer;">⟳</span>
    </div>
    <div id="ponts-cols">
      <div style="opacity:0.5;text-align:center">Chargement…</div>
    </div>
  </div>

  <!-- CALENDRIER -->
  <div id="mobile-cal">
    <iframe src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>

</div>

<script>
const API = "https://www.havre-port.com/map/getPonts";
const PROXY = "https://crimson-recipe-63e0.receptionroulier.workers.dev/?url=";

async function fetchPonts(){
  try{
    const r = await fetch(PROXY + encodeURIComponent(API + "?_ts=" + Date.now()));
    const j = await r.json();
    return Object.values(j.data || j);
  }catch(e){
    console.warn(e);
    return [];
  }
}

function renderPonts(data){
  const container = document.getElementById("ponts-cols");
  container.innerHTML = "";

  if(!data.length){
    container.innerHTML = "<div style='opacity:0.5;text-align:center'>Aucune donnée</div>";
    return;
  }

  data.forEach(p => {
    const div = document.createElement("div");
    div.className = "pont " + (p.etat === "OUVERT" ? "ouvert" : "ferme");
    div.textContent = p.nom;
    container.appendChild(div);
  });
}

async function refresh(){
  const data = await fetchPonts();
  renderPonts(data);
}

// bouton refresh
document.getElementById("refresh").onclick = refresh;

// INIT PROPRE
function isMobile(){ return window.innerWidth < 720; }

function initMobile(){
  refresh();
}

// lancement fiable
window.addEventListener('DOMContentLoaded', () => {
  if (isMobile()) initMobile();
});

// gestion resize
let wasMobile = isMobile();

window.addEventListener('resize', () => {
  const nowMobile = isMobile();
  if (nowMobile && !wasMobile) {
    initMobile();
  }
  wasMobile = nowMobile;
});

// refresh auto
setInterval(()=>{
  if(isMobile()) refresh();
}, 30000);
</script>

</body>
</html>
