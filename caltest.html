<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts & Réception</title>
<style>
html, body {margin:0; padding:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#0f172a; color:#eaeaea;}
#desktop-view {display:flex; height:100vh; width:100%;}
.frame-wrapper {position:relative; height:100%; overflow:hidden;}
iframe {position:absolute; inset:0; width:100%; height:100%; border:none; opacity:0; pointer-events:none; transition: opacity 0.6s;}
.visible {opacity:1; pointer-events:auto;}
.hidden {opacity:0; pointer-events:none;}
#mobile-view {display:none; flex-direction:column; height:100vh; overflow:hidden;}
#mob-cal-iframe {flex:1; border:none; width:100%;}
@media(max-width:719px){#desktop-view{display:none;}#mobile-view{display:flex;}}
@media(min-width:720px){#desktop-view{display:flex;}#mobile-view{display:none;}}
</style>
</head>
<body>

<!-- DESKTOP -->
<div id="desktop-view">
  <div class="frame-wrapper" style="width:25%;">
    <iframe id="leftA"  class="visible" data-src="https://receptionroulier.github.io/cal/p.html"></iframe>
    <iframe id="leftB"  class="hidden"  data-src="https://receptionroulier.github.io/cal/p.html"></iframe>
  </div>
  <div class="frame-wrapper" style="width:75%;">
    <iframe id="rightA" class="visible" data-src="https://receptionroulier.github.io/cal/calr.html"></iframe>
    <iframe id="rightB" class="hidden"  data-src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>
</div>

<!-- MOBILE -->
<div id="mobile-view">

  <!-- P MOBILE (directement ton code) -->
  <div id="mob-ponts">
    <!-- Coller ici tout ton code de p mobile tel qu’il fonctionne actuellement -->
    <!-- Exemple : -->
    <!-- <div class="ponts-columns"> ... ton HTML et JS pour gérer les ponts ... </div> -->
    <!-- Assure-toi que toutes les fonctions pour dates et statut sont incluses -->
  </div>

  <!-- CALR MOBILE (iframe) -->
  <iframe id="mob-cal-iframe" src="https://receptionroulier.github.io/cal/calr.html"></iframe>

</div>

<script>
// DESKTOP IFRAME SWAP
function monitor(versionURL, iframeA, iframeB, delay) {
  const state = { active: iframeA, buffer: iframeB, lastVersion: null, isSwapping: false };
  if (!state.active.src) state.active.src = state.active.dataset.src;
  async function checkVersion() {
    try {
      const r = await fetch(versionURL+"?_="+Date.now());
      const v = await r.text();
      if(v!==state.lastVersion && !state.isSwapping){ state.lastVersion=v; await preloadAndSwap(); }
    } catch(e){console.error(e);}
  }
  function preloadAndSwap(){
    return new Promise(resolve=>{
      state.isSwapping=true;
      const {active, buffer} = state;
      buffer.src=buffer.dataset.src+"?v="+state.lastVersion;
      buffer.onload=()=>{
        active.classList.remove('visible'); active.classList.add('hidden');
        buffer.classList.remove('hidden'); buffer.classList.add('visible');
        state.active=buffer; state.buffer=active; state.isSwapping=false; resolve();
      };
    });
  }
  async function loop(){ await checkVersion(); await new Promise(r=>setTimeout(r,delay)); loop(); }
  loop();
}
function startDesktop() {
  monitor("https://receptionroulier.github.io/cal/p.version.txt", document.getElementById("leftA"), document.getElementById("leftB"), 1000);
  monitor("https://receptionroulier.github.io/cal/calr.version.txt", document.getElementById("rightA"), document.getElementById("rightB"), 5000);
}
if(window.innerWidth>=720){ startDesktop(); }
</script>

</body>
</html>
