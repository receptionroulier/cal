<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts & Calendrier</title>
<style>
html, body { margin:0; padding:0; height:100%; font-family: Arial, sans-serif; background:#101010; color:#eaeaea; }
#container { display:flex; height:100vh; width:100%; }
.frame-wrapper { position:relative; height:100%; overflow:hidden; }
iframe { position:absolute; inset:0; width:100%; height:100%; border:none; opacity:1; transition:opacity 0.6s ease-in-out; }

/* ================= DESKTOP ================= */
.desktop #container { flex-direction:row; }
.desktop .frame-wrapper.left { width:25%; }
.desktop .frame-wrapper.right { width:75%; }

/* ================= MOBILE ================= */
@media (max-width: 900px) {
  #container { flex-direction:column; }
  .frame-wrapper { width:100%; height:auto; min-height:50vh; }
  #mobile-wrapper { display:block; padding:10px; }
  .mobile-section { margin-bottom:20px; }
  .mobile-section h3 { margin:5px 0; }
  .pont-card { background:#1f1f1f; padding:8px 12px; border-radius:6px; margin:3px 0; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .pastille { width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:6px; }
  .ferme { border-left:4px solid #ff4040; }
  .fermeture { border-left:4px solid orange; }
  .manoeuvre { border-left:4px solid #1c3cff; }
  .travaux-icon { margin-left:6px; color:orange; font-weight:bold; }
  #spinner { width:35px; height:35px; border:4px solid #333; border-top:4px solid #00e5ff; border-radius:50%; animation:spin 1s linear infinite; margin:20px auto; display:block; }
  @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
}
</style>
</head>
<body class="desktop">

<div id="container">
  <!-- Desktop left -->
  <div class="frame-wrapper left">
    <iframe id="leftA" src="https://receptionroulier.github.io/cal/p.html"></iframe>
  </div>
  <!-- Desktop right -->
  <div class="frame-wrapper right">
    <iframe id="rightA" src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>
</div>

<!-- Mobile wrapper -->
<div id="mobile-wrapper" style="display:none;">
  <div id="spinner"></div>
  <div class="mobile-section" id="fermes-section">
    <h3><span class="pastille" style="background:#ff4040;"></span> Ponts Fermés</h3>
    <div id="fermes-list"></div>
  </div>
  <div class="mobile-section" id="fermeture-section">
    <h3><span class="pastille" style="background:orange;"></span> Fermeture imminente</h3>
    <div id="fermeture-list"></div>
  </div>
  <div class="mobile-section" id="manoeuvre-section">
    <h3><span class="pastille" style="background:#1c3cff;"></span> Manoeuvre en cours</h3>
    <div id="manoeuvre-list"></div>
  </div>
  <div class="mobile-section" id="calendar-section" style="cursor:pointer;">
    <h3>📅 Calendrier</h3>
    <iframe id="calendar-frame" src="https://receptionroulier.github.io/cal/calr.html" style="width:100%; min-height:300px; border:none;"></iframe>
  </div>
</div>

<script>
// Detect mobile
function isMobile() { return window.innerWidth <= 900; }

function switchToMobile() {
  document.body.classList.remove('desktop');
  document.getElementById('container').style.display='none';
  document.getElementById('mobile-wrapper').style.display='block';
}

// Mobile click redirection
document.getElementById('fermes-list').addEventListener('click', ()=>{ window.open('https://receptionroulier.github.io/cal/p.html','_blank'); });
document.getElementById('fermeture-list').addEventListener('click', ()=>{ window.open('https://receptionroulier.github.io/cal/p.html','_blank'); });
document.getElementById('manoeuvre-list').addEventListener('click', ()=>{ window.open('https://receptionroulier.github.io/cal/p.html','_blank'); });
document.getElementById('calendar-section').addEventListener('click', ()=>{ window.open('https://receptionroulier.github.io/cal/calr.html','_blank'); });

// Load ponts data via fetch + proxy
async function loadPonts() {
  const spinner = document.getElementById('spinner');
  try {
    const res = await fetch('https://crimson-recipe-63e0.receptionroulier.workers.dev/?url=' + encodeURIComponent('https://www.havre-port.com/map/getPonts?_ts=' + Date.now()));
    const json = await res.json();
    const ponts = Object.values(json);

    const fermes = [];
    const fermeture = [];
    const manoeuvre = [];

    ponts.forEach(p=>{
      const s = (p.statutText||"").toLowerCase();
      const dateFinTravaux = p.finTravaux || ""; // si disponible
      const item = `<div class="pont-card ${s.includes('fermé')?'ferme':s.includes('fermeture')?'fermeture':s.includes('manoeuvre')?'manoeuvre':''}">
        <span>${p.nom} ${p.date? '('+p.date+')':''}</span>
        ${dateFinTravaux?'<span class="travaux-icon">⚠️ Jusqu\'au '+dateFinTravaux+'</span>':''}
      </div>`;
      if(s.includes('fermé') || s.includes('ferme')) fermes.push(item);
      else if(s.includes('fermeture')) fermeture.push(item);
      else if(s.includes('manoeuvre')||s.includes('manœuvre')) manoeuvre.push(item);
    });

    document.getElementById('fermes-list').innerHTML = fermes.join('') || '<i>Aucun pont fermé</i>';
    document.getElementById('fermeture-list').innerHTML = fermeture.join('') || '<i>Aucun pont en fermeture imminente</i>';
    document.getElementById('manoeuvre-list').innerHTML = manoeuvre.join('') || '<i>Aucune manoeuvre en cours</i>';
  } catch(e) {
    document.getElementById('fermes-list').innerHTML = '<i>Impossible de charger les ponts</i>';
    document.getElementById('fermeture-list').innerHTML = '';
    document.getElementById('manoeuvre-list').innerHTML = '';
    console.error(e);
  } finally { spinner.style.display='none'; }
}

// Initial check
if(isMobile()) { switchToMobile(); loadPonts(); }

// Handle resize
window.addEventListener('resize', ()=>{
  if(isMobile()) { switchToMobile(); loadPonts(); }
  else { location.reload(); }
});
</script>

</body>
</html>
