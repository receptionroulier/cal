<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tableau de bord - Ponts - Navires & Calendrier Réception</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
    flex-direction: row; /* desktop */
}

/* wrapper iframes */
.frame-wrapper {
    position: relative;
    height: 100%;
    overflow: hidden;
}

iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in-out;
}

.visible {
    opacity: 1;
    pointer-events: auto;
}

.hidden {
    opacity: 0;
    pointer-events: none;
}

/* 🔹 Styles responsive pour mobile */
@media (max-width: 768px) {
    #container {
        flex-direction: column; /* vertical */
    }

    .frame-wrapper {
        width: 100% !important;
        height: 50vh; /* chaque iframe prend moitié de l'écran */
    }
}
</style>
</head>
<body>

<div id="container">
  <!-- Ponts (gauche) -->
  <div class="frame-wrapper" style="width:25%;">
    <iframe id="leftA" class="visible" data-src="https://receptionroulier.github.io/cal/p.html?filter=closed"></iframe>
    <iframe id="leftB" class="hidden" data-src="https://receptionroulier.github.io/cal/p.html?filter=closed"></iframe>
  </div>

  <!-- Calendrier (droite) -->
  <div class="frame-wrapper" style="width:75%;">
    <iframe id="rightA" class="visible" data-src="https://receptionroulier.github.io/cal/calr.html"></iframe>
    <iframe id="rightB" class="hidden" data-src="https://receptionroulier.github.io/cal/calr.html"></iframe>
  </div>
</div>

<script>
// Fonction Smart Polling + swap iframe
function monitor(versionURL, iframeA, iframeB, pageURL, delay, preloadImmediate=false) {
    const state = {
        active: iframeA,
        buffer: iframeB,
        lastVersion: null,
        isSwapping: false
    };

    if (!state.active.src) state.active.src = state.active.dataset.src;

    async function checkVersion() {
        try {
            const response = await fetch(versionURL + "?_=" + Date.now());
            const version = await response.text();

            if (version !== state.lastVersion && !state.isSwapping) {
                state.lastVersion = version;
                await preloadAndSwap(version);
            }

        } catch (err) {
            console.error("Erreur version :", err);
        }
    }

    function preloadAndSwap(version) {
        return new Promise(resolve => {
            state.isSwapping = true;
            const { active, buffer } = state;

            buffer.src = buffer.dataset.src + "?v=" + version;

            buffer.onload = () => {
                active.classList.add("hidden");
                active.classList.remove("visible");
                buffer.classList.add("visible");
                buffer.classList.remove("hidden");

                state.active = buffer;
                state.buffer = active;

                state.isSwapping = false;
                resolve();
            };
        });
    }

    async function loop() {
        await checkVersion();
        await new Promise(r => setTimeout(r, delay));
        loop();
    }

    loop();
}

// Partie gauche → 1 seconde
monitor(
    "https://receptionroulier.github.io/cal/p.version.txt",
    document.getElementById("leftA"),
    document.getElementById("leftB"),
    "https://receptionroulier.github.io/cal/p.html",
    1000,
    false
);

// Partie droite → 5 secondes
monitor(
    "https://receptionroulier.github.io/cal/calr.version.txt",
    document.getElementById("rightA"),
    document.getElementById("rightB"),
    "https://receptionroulier.github.io/cal/calr.html",
    5000,
    true
);

// 🔹 Mise à jour interne instantanée du calendrier et de l’heure
setInterval(() => {
    const iframe = document.getElementById("rightA"); // iframe visible
    if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: "refreshTimeAndEvents" }, "*");
    }
}, 1000);
</script>

</body>
</html>
