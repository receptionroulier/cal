<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts & Réception</title>
<style>
/* ===================== RESET ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ===================== DESKTOP (iframes) ===================== */
#desktop-view {
  display: flex;
  height: 100vh;
  width: 100%;
}
.frame-wrapper {
  position: relative;
  height: 100%;
  overflow: hidden;
}
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease-in-out;
}
.visible { opacity: 1; pointer-events: auto; }
.hidden  { opacity: 0; pointer-events: none; }

/* ===================== MOBILE VIEW ===================== */
#mobile-view {
  display: none;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #eaeaea;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

/* --- PONTS SECTION --- */
#mob-ponts {
  flex-shrink: 0;
  padding: 10px 12px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
}
#mob-ponts-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
#mob-ponts-title {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 6px;
}
#mob-ponts-indicator { font-size: 0.62rem; color: #64748b; }
.ponts-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pont-col { display: flex; flex-direction: column; gap: 2px; }
.col-header {
  display: flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; margin-bottom: 4px; flex-wrap: wrap; color: #cbd5e1;
}
.col-count { opacity: 0.5; font-weight: 400; }
.pastille { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.p-rouge  { background: #ff4040; }
.p-orange { background: orange; }
.p-bleu   { background: #4c6fff; }
.p-vert   { background: #58ff58; }
.pont-entry  { font-size: 10px; line-height: 1.3; margin-bottom: 3px; }
.pont-name   { font-weight: 600; color: #e0e0e0; word-break: break-word; }
.pont-since  { color: #64748b; font-size: 9px; }
.mob-spinner {
  width: 20px; height: 20px;
  border: 3px solid #333; border-top-color: #00e5ff;
  border-radius: 50%; animation: spin 1s linear infinite;
  margin: 6px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --- CAL HEADER --- */
#mob-cal-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  min-height: 40px;
}
#mob-cal-title {
  flex: 1;
  font-size: 0.85rem;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #e2e8f0;
}
#mob-cal-today {
  font-size: 11px; padding: 3px 8px;
  background: rgba(255,255,255,0.08); border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.15); color: #fff;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
#mob-cal-today:hover { background: rgba(255,255,255,0.15); }

/* --- CALENDAR LIST --- */
#mob-cal-wrap {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 12px 40px;
}
.mob-month-sep {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: #475569; padding: 12px 2px 4px; flex-shrink: 0;
}
.mob-sentinel { height: 1px; flex-shrink: 0; }
.mob-day {
  background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  overflow: hidden; flex-shrink: 0;
}
.mob-day.mob-today { border: 2px solid rgba(0,229,255,0.7); box-shadow: 0 0 8px rgba(0,229,255,0.4); animation: pulse 2s infinite; }
.mob-day.mob-past  { background: rgba(255,255,255,0.03); opacity: 0.6; }
.mob-day.mob-future{ background: rgba(255,255,255,0.07); border-color: rgba(0,229,255,0.2); }
.mob-day.mob-holiday { background: rgba(255,60,60,0.08) !important; border-color: rgba(255,80,80,0.5) !important; opacity: 1 !important; box-shadow: 0 0 6px rgba(255,60,60,0.15) !important; }
@keyframes pulse { 0%,100%{box-shadow:0 0 8px rgba(0,229,255,0.4)} 50%{box-shadow:0 0 14px rgba(0,229,255,0.6)} }
.mob-day-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; font-size: 0.85rem; font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.mob-day-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.2); }
.mob-today  .mob-day-dot { background: #00e5ff; }
.mob-future .mob-day-dot { background: rgba(0,229,255,0.4); }
.mob-past   .mob-day-dot { background: rgba(255,255,255,0.15); }
.mob-day-date { color: #cbd5e1; font-size: 0.82rem; }
.mob-holiday-label { font-size: 0.6rem; color: rgba(255,120,120,0.85); font-weight: 600; margin-left: auto; letter-spacing: 0.03em; }
.mob-events { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; }
.mob-empty  { font-size: 0.75rem; color: #475569; font-style: italic; padding: 6px 12px 10px; }
.mob-evt {
  display: flex; flex-direction: column; gap: 2px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
  transition: transform .12s; flex-shrink: 0;
}
.mob-evt:active { transform: translateX(3px); }
.mob-evt.reception    { background: linear-gradient(90deg,rgba(0,255,120,0.18),rgba(0,200,100,0.14)); border: 1px solid rgba(0,255,120,0.5); box-shadow: 0 0 8px rgba(0,255,140,0.25); }
.mob-evt.navire-smr   { background: linear-gradient(90deg,rgba(0,130,255,0.18),rgba(0,110,220,0.14)); border: 1px solid rgba(0,160,255,0.5); box-shadow: 0 0 8px rgba(0,150,255,0.25); }
.mob-evt.navire-manucar { background: linear-gradient(90deg,rgba(255,140,0,0.18),rgba(220,100,0,0.14)); border: 1px solid rgba(255,160,0,0.5); box-shadow: 0 0 6px rgba(255,140,0,0.2); }
.mob-evt.autre        { background: linear-gradient(90deg,rgba(255,220,0,0.18),rgba(200,180,0,0.14)); border: 1px solid rgba(255,210,0,0.5); box-shadow: 0 0 6px rgba(255,220,0,0.2); }
/* Layout carte : gauche=titre+horaire, droite=Imp/Exp */
.mob-evt-inner { display: flex; align-items: stretch; gap: 4px; min-width: 0; }

.mob-evt-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.82rem; color: #f0f8ff; }

#cal-event-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.65); z-index: 999; }
.modal-card { background: rgba(15,23,42,0.97); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; max-width: 720px; width: 94%; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-height: 85vh; overflow-y: auto; }

#mob-cal-back:hover { background:rgba(255,255,255,0.1); color:#fff; }

/* ===================== RESPONSIVE SWITCH ===================== */

  #mobile-view  { display: none !important; }

<script>
/* ================================================================
   DESKTOP – Smart Polling + iframe swap
   ================================================================ */
function monitor(versionURL, iframeA, iframeB, delay) {
  const state = { active: iframeA, buffer: iframeB, lastVersion: null, isSwapping: false };
  if (!state.active.src) state.active.src = state.active.dataset.src;
  async function checkVersion() {
    try {
      const r = await fetch(versionURL + "?_=" + Date.now());
      const v = await r.text();
      if (v !== state.lastVersion && !state.isSwapping) { state.lastVersion = v; await preloadAndSwap(v); }
    } catch(e) {}
  }
  function preloadAndSwap(v) {
    return new Promise(resolve => {
      state.isSwapping = true;
      const { active, buffer } = state;
      buffer.src = buffer.dataset.src + "?v=" + v;
      buffer.onload = () => {
        active.classList.add("hidden"); active.classList.remove("visible");
        buffer.classList.add("visible"); buffer.classList.remove("hidden");
        state.active = buffer; state.buffer = active;
        state.isSwapping = false; resolve();
      };
    });
  }
  async function loop() { await checkVersion(); await new Promise(r => setTimeout(r, delay)); loop(); }
  loop();
}

function startDesktop() {
  const lA=document.getElementById("leftA"), lB=document.getElementById("leftB");
  const rA=document.getElementById("rightA"), rB=document.getElementById("rightB");
  monitor("https://receptionroulier.github.io/cal/p.version.txt", lA, lB, 1000);
  monitor("https://receptionroulier.github.io/cal/calr.version.txt", rA, rB, 5000);
}

/* ================================================================
   MOBILE – PONTS
   ================================================================ */
const PONTS_API       = "https://www.havre-port.com/map/getPonts";
const PROXY           = "https://crimson-recipe-63e0.receptionroulier.workers.dev/?url=";
const PONTS_CACHE_KEY = "mob_pontsData_v1";
const PONTS_TIME_KEY  = "mob_pontsTime_v1";
const PONTS_EXPIRY    = 60000;
const PONTS_INTERVAL  = 30000;

function parseFRDate(str) {
  if (!str) return NaN;
  str = str.replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim();
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (!m) return NaN;
  return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)).getTime();
}
function fmtShort(str) {
  const t=parseFRDate(str); if(!isFinite(t)) return str||"—";
  const d=new Date(t), p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function extractFinTravaux(pont) {
  const raw=[pont.statutText,pont.forceText,pont.info,pont.description,pont.message,pont.text,pont.comment].filter(v=>v&&typeof v==="string").join(" ");
  const m1=raw.match(/\bdu\s+\d{1,2}\/\d{1,2}\/\d{4}\s+au\s+(\d{1,2}\/\d{1,2}\/\d{4})/i); if(m1) return m1[1];
  const m2=raw.match(/jusqu[''`]?\s*au\s+(\d{1,2}\/\d{1,2}\/\d{4})/i); if(m2) return m2[1];
  const m3=raw.match(/\bau\s+(\d{1,2}\/\d{1,2}\/\d{4})/i); if(m3) return m3[1];
  const all=[...raw.matchAll(/\b(\d{1,2}\/\d{1,2}\/\d{4})\b/g)].map(x=>x[1]);
  if(all.length) return all[all.length-1]; return null;
}
function fmtFinTravaux(pont) {
  const fin=extractFinTravaux(pont); if(!fin) return "Date inconnue";
  const t=parseFRDate(fin); if(!isFinite(t)) return `Jusqu'au ${fin}`;
  const d=new Date(t), p=n=>String(n).padStart(2,'0');
  return `Jusqu'au ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
}
function classifyPont(p) {
  const s=(p.statutText||"").toLowerCase();
  if((s.includes("fermé")||s.includes("ferme"))&&s.includes("travaux")) return "travaux";
  if(s.includes("fermeture")) return "fermeture";
  if(s.includes("fermé")||s.includes("ferme")) return "ferme";
  if(s.includes("manoeuvre")||s.includes("manœuvre")) return "manoeuvre";
  if(s.includes("ouvert")) return "ouvert";
  return "ferme";
}
async function fetchPonts() {
  const url=PROXY+encodeURIComponent(PONTS_API+"?_ts="+Date.now());
  try {
    const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
    const raw=await r.text(), json=JSON.parse(raw);
    const arr=json?.data?Object.values(json.data):Object.values(json);
    return Array.from(new Map(arr.map(p=>[p.nom,p])).values());
  } catch(e) { console.warn("fetchPonts:",e); return null; }
}
function mkEntry(p,sinceStr){ return `<div class="pont-entry"><div class="pont-name">${p.nom}</div><div class="pont-since">${sinceStr}</div></div>`; }
function renderPontsCols(ponts) {
  const cols=document.getElementById("ponts-cols");
  const byDate=list=>list.sort((a,b)=>(parseFRDate(b.date)||0)-(parseFRDate(a.date)||0));
  const fermes=byDate(ponts.filter(p=>classifyPont(p)==="ferme"));
  const travaux=byDate(ponts.filter(p=>classifyPont(p)==="travaux"));
  const fermeture=byDate(ponts.filter(p=>classifyPont(p)==="fermeture"));
  const manoeuvre=byDate(ponts.filter(p=>classifyPont(p)==="manoeuvre"));
  const ouverts=byDate(ponts.filter(p=>classifyPont(p)==="ouvert"));
  const since=p=>p.date?`Depuis le ${fmtShort(p.date)}`:"—";
  const build=(list,fn)=>list.length?list.map(p=>mkEntry(p,fn(p))).join(""):`<div class="pont-entry"><div class="pont-since">—</div></div>`;
  cols.innerHTML=`
    <div class="pont-col">
      <div class="col-header"><span class="pastille p-rouge"></span>Fermé(s)<span class="col-count">(${fermes.length})</span></div>
      ${build(fermes,since)}
    </div>
    <div class="pont-col">
      <div class="col-header">🚧&nbsp;En Travaux<span class="col-count">(${travaux.length})</span></div>
      ${build(travaux,p=>fmtFinTravaux(p))}
      <div class="col-header" style="margin-top:6px"><span class="pastille p-orange"></span>En Fermeture<span class="col-count">(${fermeture.length})</span></div>
      ${build(fermeture,since)}
    </div>
    <div class="pont-col">
      <div class="col-header"><span class="pastille p-vert"></span>Ouvert(s)<span class="col-count">(${ouverts.length})</span></div>
      ${ouverts.length?mkEntry(ouverts[0],since(ouverts[0])):`<div class="pont-entry"><div class="pont-since">—</div></div>`}
      <div class="col-header" style="margin-top:6px"><span class="pastille p-bleu"></span>Bientôt Ouvert<span class="col-count">(${manoeuvre.length})</span></div>
      ${build(manoeuvre,since)}
    </div>`;
}
async function refreshPonts(force=false) {
  const now=Date.now(), indicator=document.getElementById("mob-ponts-indicator");
  const lastTime=parseInt(localStorage.getItem(PONTS_TIME_KEY)||0);
  const nowStr=new Date(now).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(!force&&lastTime&&now-lastTime<PONTS_EXPIRY){
    const cached=localStorage.getItem(PONTS_CACHE_KEY);
    if(cached){ renderPontsCols(JSON.parse(cached)); indicator.textContent=`🟢 ${nowStr}`; return; }
  }
  const fresh=await fetchPonts();
  if(!fresh){
    const cached=localStorage.getItem(PONTS_CACHE_KEY);
    if(cached){ renderPontsCols(JSON.parse(cached)); indicator.textContent=`🔴 ${nowStr}`; }
    else { document.getElementById("ponts-cols").innerHTML='<div style="color:#ff4040;font-size:10px;grid-column:1/-1;text-align:center">Erreur réseau</div>'; }
    return;
  }
  localStorage.setItem(PONTS_CACHE_KEY,JSON.stringify(fresh));
  localStorage.setItem(PONTS_TIME_KEY,String(now));
  renderPontsCols(fresh);
  indicator.textContent=`🟢 ${nowStr}`;
}

        fetch(`https://calendrier.api.gouv.fr/jours-feries/metropole/${year+1}.json`),
      ]);
      const [d1, d2] = await Promise.all([r1.json(), r2.json()]);
      Object.keys(d1).forEach(k => holidaySet.add(k));
      Object.keys(d2).forEach(k => holidaySet.add(k));
    } catch(e) { console.warn('Jours fériés non chargés:', e.message); }
  }
  loadFrenchHolidays();

  /* ── FETCH NAVIRES — Worker proxy + fallback ancienne API ── */
  async function fetchNaviresAPI(timeMin, timeMax) {
    try {
      const items = await fetchNaviresNew(timeMin, timeMax);
      if (items !== null) return items;
    } catch(e) { console.warn('Worker SHGT indisponible, fallback:', e.message); }
    return fetchNaviresOld(timeMin, timeMax);
  }

  async function fetchNaviresNew(timeMin, timeMax) {
    const raw = [];
    const r = await fetch(NAVIRES_API_NEW, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        dateFrom: fmtDateISO(timeMin), dateTo: fmtDateISO(timeMax),
        sectorId: 0, SectorProjectNumberType: 0, searchValue: '', onlyUserData: false, withRefused: false
      }),
    });
    if (!r.ok) throw new Error('Worker HTTP ' + r.status);
    const allDays = await r.json();
    const seen = new Set();
    const days = allDays.filter(d=>{ if(seen.has(d.date)) return false; seen.add(d.date); return true; });
    days.sort((a,b)=>a.date.localeCompare(b.date));
    for (const day of days) {
      if (!day.postes?.length) continue;
      for (const pg of day.postes) {
        const [hDebut] = pg.poste.startTime.split(':').map(Number);
        const [hFin]   = pg.poste.endTime.split(':').map(Number);
        for (const pa of pg.projectAssignments) {
          const projectName = pa.project?.name || '';
          if (pa.sectorId === 25) continue;
          const [y,m,d] = pa.date.split('-').map(Number);
          const _start = new Date(y,m-1,d,hDebut,0,0,0);
          const _end   = new Date(y,m-1,d,hFin,0,0,0);
          if (_end <= _start) _end.setHours(23,59,0,0);
          const _name  = pa.project?.extraInfo || pa.project?.name || '';
          const _place = pa.project?.place?.name || '';
          let _type = 'autre';
          if (projectName === 'Navire SMR')     _type = 'navire-smr';
          if (projectName === 'Navire Manucar') _type = 'navire-manucar';
          raw.push({ _start, _end, _name, _place, _hDebut: hDebut, _hFin: hFin, _volumes: pa.volumes||[], _comments: pa.comments||pa.customerComments||'', _type, id: String(pa.id) });
        }
      }
    }
    return buildFusedEvents(raw);
  }

  async function fetchNaviresOld(timeMin, timeMax) {
    const startDate = fmtDateISO(timeMin), endDate = fmtDateISO(timeMax);
    try {
      const r = await fetch(`${NAVIRES_API}?startDate=${startDate}&endDate=${endDate}`);
      if (!r.ok) return [];
      const data = await r.json();
      for (const day of data) { if (day.isHoliday) holidaySet.add(day.date); }
      const raw = [];
      for (const day of data) {
        if (!day.projectAssignments?.length) continue;
        for (const pa of day.projectAssignments) {
          const { hDebut, hFin } = parsePoste(pa.poste);
          const [y,m,d] = pa.date.split('-').map(Number);
          const _start = new Date(y,m-1,d,hDebut,0,0,0);
          const _end   = new Date(y,m-1,d,hFin,0,0,0);
          if (_end <= _start) _end.setHours(23,59,0,0);
          raw.push({ _start, _end, _name: pa.name, _place: pa.place||'', _hDebut: hDebut, _hFin: hFin, _volumes: [], _comments: '', _type: 'navire-smr', id: String(pa.id) });
        }
      }
      return buildFusedEvents(raw);
    } catch(e) { console.error('fetchNaviresOld:', e); return []; }
  }

  function buildFusedEvents(raw) {
    raw.sort((a, b) => a._start - b._start);
    const fused = [], lastSegments = new Map();
    for (const ev of raw) {
      const key = `${ev._name}||${ev._place}`;
      const lastSeg = lastSegments.get(key);
      if (lastSeg && lastSeg._end.getTime() === ev._start.getTime()) {
        lastSeg._end = new Date(ev._end);
        lastSeg._hFin = ev._hFin;
      } else {
        const newSeg = { ...ev };
        fused.push(newSeg);
        lastSegments.set(key, newSeg);
      }
    }
    return fused.map(ev => {
      const lieu = fmtPlace(ev._place);
      const summary = `${ev._name}${lieu ? ' — ' + lieu : ''}`;
      const _endInclusive = new Date(ev._end);
      if (ev._end.getHours() === 0 && ev._end.getMinutes() === 0) _endInclusive.setSeconds(-1);
      return {
        id: ev.id, summary,
        __type: ev._type || 'navire-smr',
        _isAllDay: false, _start: ev._start, _end: ev._end, _endInclusive,
        _place: ev._place, _hDebut: ev._hDebut, _hFin: ev._hFin, _hFinDisplay: ev._hFin,
        _volumes: ev._volumes || [], _comments: ev._comments || ''
      };
    });
  }

  async function fetchReception(timeMin, timeMax) {
    const p=`?key=${encodeURIComponent(API_KEY)}&singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}`;
    try {
      const r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CAL_RECEPTION)}/events${p}`);
      const d=r.ok?await r.json():{items:[]};
      return (d.items||[]).map(i=>({...i,__type:'reception'}));
    } catch(e) { return []; }
  }

  function normalizeGCal(items) {
    return items.map(ev => {
      const allDay=!!(ev.start?.date&&!ev.start?.dateTime);
      let _start,_end,_endInclusive;
      if (allDay) {
        _start=parseDateLocal(ev.start.date); _end=parseDateLocal(ev.end.date);
        _endInclusive=new Date(_end); _endInclusive.setDate(_endInclusive.getDate()-1); _endInclusive.setHours(23,59,59,999);
      } else { _start=new Date(ev.start.dateTime); _end=new Date(ev.end.dateTime); _endInclusive=new Date(_end); }
      return {...ev,__type:ev.__type||'',_isAllDay:allDay,_start,_end,_endInclusive};
    }).filter(e=>e._start&&e._endInclusive);
  }

  async function fetchAll(timeMin, timeMax) {
    const [gcalItems,naviresItems] = await Promise.all([fetchReception(timeMin,timeMax), fetchNaviresAPI(timeMin,timeMax)]);
    return [...normalizeGCal(gcalItems), ...naviresItems];
  }

  async function fetchRange(from, to) {
    const tMin=new Date(from); tMin.setHours(0,0,0,0);
    const tMax=new Date(to); tMax.setHours(23,59,59,999);
    const items=await fetchAll(tMin,tMax);
    return items.filter(ev=>SHOW_TYPES.includes(ev.__type));
  }

  // Modal événement
  document.getElementById('cal-event-modal').addEventListener('click', ()=>document.getElementById('cal-event-modal').style.display='none');

  function evtDateHtml(ev) {
    if (isNavire(ev.__type)) {
      const hD=String(ev._hDebut??new Date(ev._start).getHours()).padStart(2,'0');
      const hF=String(ev._hFinDisplay??ev._hFin??new Date(ev._end).getHours()).padStart(2,'0');
      const multiDay=new Date(ev._start).toDateString()!==new Date(ev._end).toDateString();
      if (multiDay) return `<p>Du ${fmtFullDate(ev._start)} ${hD}:00<br>Au ${fmtFullDate(ev._end)} ${hF}:00</p>`;
      return `<p>Le ${fmtFullDate(ev._start)}<br>${hD}:00 → ${hF}:00</p>`;
    }
    const {_start:s,_end:e,_isAllDay:all}=ev;
    const multi=!all&&new Date(s).toDateString()!==new Date(e).toDateString();
    if(multi) return `<p>Du ${fmtFullDate(s)} à ${fmtTime(s)}<br>Au ${fmtFullDate(e)} à ${fmtTime(e)}</p>`;
    return all?`<p>Le ${fmtFullDate(s)}</p>`:`<p>Le ${fmtFullDate(s)} à ${fmtTime(s)}</p>`;
  }

  function fmtVolumes(volumes) {
    if (!volumes?.length) return '';
    const imp = volumes.filter(v => v.type === 1);
    const exp = volumes.filter(v => v.type === 2);
    function hasAny(v) { return (v.vlCount||0)+(v.vanCount||0)+(v.hhCount||0)+(v.staticCount||0) > 0; }
    function detailLine(v) {
      const parts = [];
      if (v.vlCount)     parts.push(`${v.vlCount}vl`);
      if (v.vanCount)    parts.push(`${v.vanCount}van`);
      if (v.hhCount)     parts.push(`${v.hhCount}hh`);
      if (v.staticCount) parts.push(`${v.staticCount}stat`);
      const detail = parts.join('+');
      const comment = v.comment ? ` - ${v.comment}` : '';
      return detail ? `${detail}${comment}` : null;
    }
    function renderGroup(label, group) {
      const active = group.filter(hasAny);
      if (!active.length) return '';
      const total = active.reduce((s,v) => s+(v.vlCount||0)+(v.vanCount||0)+(v.hhCount||0)+(v.staticCount||0), 0);
      let html = `<div style="font-size:0.82rem;color:#e2e8f0;margin-top:4px;font-weight:600">${label}: ${total}</div>`;
      for (const v of active) {
        const line = detailLine(v);
        if (line) html += `<div style="font-size:0.78rem;color:#94a3b8;margin-left:10px;margin-top:1px">${line}</div>`;
      }
      return html;
    }
    return renderGroup('Imp', imp) + renderGroup('Exp', exp);
  }

  function evtHtml(ev) {
    const lieu = ev._place ? `<p>📍 ${ev._place}</p>` : '';
    const volumes = ev._volumes?.length ? `<div style="margin-top:6px"><span style="font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:0.05em">Volumes</span>${fmtVolumes(ev._volumes)}</div>` : '';
    const commentsRaw = (!ev._volumes?.length && ev.__type === 'autre' && ev._comments) ? ev._comments.replace(/<[^>]*>/g,'').trim() : '';
    const comments = commentsRaw ? `<p style="font-size:0.82rem;color:#cbd5e1;margin-top:4px">${commentsRaw}</p>` : '';
    return `<div class="modal-item"><h3>${ev.summary||'(sans titre)'}</h3>${evtDateHtml(ev)}${lieu}${volumes}${comments}${ev.description?'<p>'+ev.description+'</p>':''}</div>`;
  }

  function showEventModal(ev) {
    document.getElementById('cal-modal-content').innerHTML=evtHtml(ev);
    document.getElementById('cal-event-modal').style.display='flex';
  }

  // Format 2 lignes
  function evtTwoLines(ev, day) {
    if (ev._isAllDay) return { name: ev.summary||('(sans titre)'), time: null };

    if (isNavire(ev.__type)) {
      const nom = ev.summary?.split('—')[0].trim() || '';
      const quai = fmtPlace(ev._place) ? ` — ${fmtPlace(ev._place)}` : '';
      const evStartDay = new Date(ev._start); evStartDay.setHours(0,0,0,0);
      const evEndDay   = new Date(ev._endInclusive); evEndDay.setHours(0,0,0,0);
      const isMultiDay = evStartDay.getTime() !== evEndDay.getTime();

      if (!isMultiDay) {
        const hD = String(ev._hDebut ?? ev._start.getHours()).padStart(2,'0');
        const hF = String(ev._hFinDisplay ?? ev._hFin ?? ev._end.getHours()).padStart(2,'0');
        return { name: nom, time: `${hD}:00 → ${hF}:00${quai}` };
      }
      const dayTime = day.getTime();
      if (dayTime === evStartDay.getTime()) {
        const hD = String(ev._hDebut ?? ev._start.getHours()).padStart(2,'0');
        return { name: nom, time: `${hD}:00 →${quai}` };
      } else if (dayTime === evEndDay.getTime()) {
        const hF = String(ev._hFinDisplay ?? ev._hFin ?? ev._end.getHours()).padStart(2,'0');
        return { name: nom, time: `→ ${hF}:00${quai}` };
      } else {
        return { name: nom, time: `···${quai}` };
      }
    }

    const nom = ev.summary || '(sans titre)';
    const evSD=new Date(ev._start); evSD.setHours(0,0,0,0);
    const evED=new Date(ev._endInclusive); evED.setHours(0,0,0,0);
    if (evSD.getTime()===evED.getTime()) return { name: nom, time: `${fmtTime(ev._start)} → ${fmtTime(ev._end)}` };
    const dt=day.getTime();
    if (dt===evSD.getTime()) return { name: nom, time: `${fmtTime(ev._start)} →` };
    if (dt===evED.getTime()) return { name: nom, time: `→ ${fmtTime(ev._end)}` };
    return { name: nom, time: '···' };
  }

  // Calcule totaux Imp/Exp pour affichage carte
  function getVolTotals(volumes) {
    if (!volumes?.length) return null;
    function hasAny(v) { return (v.vlCount||0)+(v.vanCount||0)+(v.hhCount||0)+(v.staticCount||0) > 0; }
    const imp = volumes.filter(v => v.type === 1 && hasAny(v));
    const exp = volumes.filter(v => v.type === 2 && hasAny(v));
    const total = arr => arr.reduce((s,v)=>s+(v.vlCount||0)+(v.vanCount||0)+(v.hhCount||0)+(v.staticCount||0),0);
    const impTotal = total(imp), expTotal = total(exp);
    if (!impTotal && !expTotal) return null;
    return { imp: impTotal, exp: expTotal };
  }

  function eventsOnDay(day, norm) {
    return norm.filter(ev => {
      const s=new Date(ev._start); s.setHours(0,0,0,0);
      const e=new Date(ev._endInclusive); e.setHours(0,0,0,0);
      return day>=s && day<=e;
    }).sort((a,b)=>new Date(a._start)-new Date(b._start));
  }

  function buildDayCard(day, today, norm) {
    const isPast=day<today, isToday=day.getTime()===today.getTime();
    const isHoliday=holidaySet.has(fmtDateISO(day));
    const evts=eventsOnDay(day,norm);
    const card=mk('div','mob-day');
    card.dataset.ts=day.getTime();
    if(isToday){ card.classList.add('mob-today'); card.id='mob-today-anchor'; }
    else card.classList.add(isPast?'mob-past':'mob-future');
    if(isHoliday) card.classList.add('mob-holiday');

    const hdr=mk('div','mob-day-header');
    const dot=mk('div','mob-day-dot');
    const dateDiv=mk('div','mob-day-date');
    dateDiv.textContent=capitalize(day.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}));
    hdr.append(dot,dateDiv);
    if(isHoliday){ const hl=mk('span','mob-holiday-label'); hl.textContent='Férié'; hdr.appendChild(hl); }
    card.appendChild(hdr);

    if(!evts.length){
      const e=mk('div','mob-empty'); e.textContent='Aucun événement'; card.appendChild(e);
    } else {
      const evWrap=mk('div','mob-events');
      evts.forEach(ev=>{
        const row=mk('div','mob-evt '+(ev.__type||''));
        const {name,time}=evtTwoLines(ev,day);

        const inner=mk('div','mob-evt-inner');
        const left=mk('div','mob-evt-left');
        const nameEl=mk('div','mob-evt-name'); nameEl.textContent=name; left.appendChild(nameEl);
        if(time!==null){ const timeEl=mk('div','mob-evt-time'); timeEl.textContent=time; left.appendChild(timeEl); }
        inner.appendChild(left);

        // Zone droite : Imp/Exp ou commentaire pour "autre"
        const vols = getVolTotals(ev._volumes);
        const commentsRaw = (!ev._volumes?.length && ev.__type === 'autre' && ev._comments) ? ev._comments.replace(/<[^>]*>/g,'').trim() : '';
        if (vols && (vols.imp || vols.exp)) {
          const right=mk('div','mob-evt-right');
          if(vols.imp){ const v=mk('div','mob-evt-vol'); v.textContent=`Imp: ${vols.imp}`; right.appendChild(v); }
          if(vols.exp){ const v=mk('div','mob-evt-vol'); v.textContent=`Exp: ${vols.exp}`; right.appendChild(v); }
          inner.appendChild(right);
        } else if (commentsRaw) {
          const right=mk('div','mob-evt-right');
          const c=mk('div','mob-evt-comment'); c.textContent=commentsRaw; right.appendChild(c);
          inner.appendChild(right);
        }

        row.appendChild(inner);
        row.addEventListener('click',e=>{ e.stopPropagation(); showEventModal(ev); });
        evWrap.appendChild(row);
      });
      card.appendChild(evWrap);
    }
    return card;
  }

  function maybySepBefore(w, day, ref) {
    const key=day.getFullYear()*100+day.getMonth();
    if(w.querySelector(`.mob-month-sep[data-mkey="${key}"]`)) return;
    const sep=mk('div','mob-month-sep'); sep.dataset.mkey=key;
    sep.textContent=capitalize(day.toLocaleString('fr-FR',{month:'long',year:'numeric'}));
    ref ? w.insertBefore(sep,ref) : w.appendChild(sep);
  }

  function updateTitle(w) {
    const wRect=w.getBoundingClientRect();
    const days=[...w.querySelectorAll('.mob-day')];
    const months=[],seen=new Set();
    for(const card of days){
      const r=card.getBoundingClientRect();
      if(r.bottom>wRect.top&&r.top<wRect.bottom){
        const ts=parseInt(card.dataset.ts);
        if(!isNaN(ts)){ const d=new Date(ts), k=d.getFullYear()*100+d.getMonth(); if(!seen.has(k)){ seen.add(k); months.push(capitalize(d.toLocaleString('fr-FR',{month:'long',year:'numeric'}))); } }
      }
    }
    if(months.length) document.getElementById('mob-cal-title').textContent=months.join(' / ');
  }

  function scrollToToday(smooth) {
    const w=wrap(), anchor=document.getElementById('mob-today-anchor');
    if(!w||!anchor) return;
    w.scrollTo({top:Math.max(0,w.scrollTop+anchor.getBoundingClientRect().top-w.getBoundingClientRect().top-10),behavior:smooth?'smooth':'instant'});
  }

  let mobNorm=[], mobFrom=null, mobTo=null, mobLoading=false, mobObserver=null;

  async function prependDays(n, today) {
    const w=wrap(), sentTop=document.getElementById('mob-sent-top');
    const newTo=new Date(mobFrom); newTo.setDate(newTo.getDate()-1);
    const newFrom=new Date(newTo); newFrom.setDate(newTo.getDate()-n+1);
    const extra=await fetchRange(newFrom,newTo);
    mobNorm=[...extra,...mobNorm]; mobFrom=new Date(newFrom);
    const prevH=w.scrollHeight;
    const days=[]; for(let d=new Date(newFrom);d<=newTo;d.setDate(d.getDate()+1)) days.push(new Date(d));
    let ins=sentTop.nextSibling, lastM=-1;
    days.forEach(day=>{
      day.setHours(0,0,0,0);
      const k=day.getFullYear()*100+day.getMonth();
      if(k!==lastM){ lastM=k; maybySepBefore(w,day,ins); ins=sentTop.nextSibling; }
      const card=buildDayCard(day,today,mobNorm); w.insertBefore(card,ins); ins=card.nextSibling;
    });
    w.scrollTop+=w.scrollHeight-prevH;
  }

  async function appendDays(n, today) {
    const w=wrap(), sentBot=document.getElementById('mob-sent-bot');
    const newFrom=new Date(mobTo); newFrom.setDate(newFrom.getDate()+1);
    const newTo=new Date(newFrom); newTo.setDate(newFrom.getDate()+n-1);
    const extra=await fetchRange(newFrom,newTo);
    mobNorm=[...mobNorm,...extra]; mobTo=new Date(newTo);
    let lastM=-1;
    for(let d=new Date(newFrom);d<=newTo;d.setDate(d.getDate()+1)){
      const day=new Date(d); day.setHours(0,0,0,0);
      const k=day.getFullYear()*100+day.getMonth();
      if(k!==lastM){ lastM=k; maybySepBefore(w,day,sentBot); }
      w.insertBefore(buildDayCard(day,today,mobNorm),sentBot);
    }
  }

  async function initCal() {
    const w=wrap();
    w.innerHTML='<div style="text-align:center;padding:40px;opacity:0.5;font-size:0.9rem">Chargement…</div>';
    const today=new Date(); today.setHours(0,0,0,0);
    const from=new Date(today); from.setDate(today.getDate()-14);
    const to=new Date(today); to.setDate(today.getDate()+30);
    mobNorm=await fetchRange(from,to); mobFrom=new Date(from); mobTo=new Date(to); mobLoading=false;
    w.innerHTML='';
    const sentTop=mk('div','mob-sentinel'); sentTop.id='mob-sent-top'; w.appendChild(sentTop);
    let lastM=-1;
    for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
      const day=new Date(d); day.setHours(0,0,0,0);
      const k=day.getFullYear()*100+day.getMonth();
      if(k!==lastM){ lastM=k; maybySepBefore(w,day,null); }
      w.appendChild(buildDayCard(day,today,mobNorm));
    }
    const sentBot=mk('div','mob-sentinel'); sentBot.id='mob-sent-bot'; w.appendChild(sentBot);
    w.addEventListener('scroll',()=>updateTitle(w),{passive:true});
    requestAnimationFrame(()=>{ scrollToToday(false); setTimeout(()=>updateTitle(w),150); });
    if(mobObserver) mobObserver.disconnect();
    mobObserver=new IntersectionObserver(async entries=>{
      for(const entry of entries){
        if(!entry.isIntersecting||mobLoading) continue;
        mobLoading=true;
        if(entry.target.id==='mob-sent-top') await prependDays(14,today);
        if(entry.target.id==='mob-sent-bot') await appendDays(30,today);
        mobLoading=false;
      }
    },{root:w,rootMargin:'100px',threshold:0});
    mobObserver.observe(sentTop); mobObserver.observe(sentBot);
  }

  document.getElementById('mob-cal-today').addEventListener('click',()=>scrollToToday(true));

  // Démarrer si mobile
  if(window.innerWidth < 720) initCal();
  window.addEventListener('resize',()=>{ if(window.innerWidth<720&&!mobFrom) initCal(); });
})();

/* ================================================================
   INIT
   ================================================================ */
function isMobile(){ return window.innerWidth < 720; }
if (!isMobile()) { startDesktop(); }
else {
  refreshPonts(true);
  setInterval(()=>refreshPonts(false), PONTS_INTERVAL);
}
let wasOrIsMobile = isMobile();
window.addEventListener('resize', () => {
  const nowMobile = isMobile();
  if (nowMobile !== wasOrIsMobile) {
    wasOrIsMobile = nowMobile;
    if (!nowMobile) startDesktop();
    else refreshPonts(true);
  }
});
</script>
