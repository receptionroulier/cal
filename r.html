<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord - Ponts & Calendrier</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: #eaeaea;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    scroll-behavior: smooth;
}
.container {
    width: 95%;
    max-width: 1200px;
    padding: 12px;
    box-sizing: border-box;
}
h2 {
    text-align: center;
    color: #ffffff;
    margin: 0 0 10px;
}
#update-indicator {
    text-align: center;
    font-size: 0.8em;
    opacity: 0.85;
    font-weight: bold;
    margin-bottom: 15px;
}
/* Spinner */
.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #333;
    border-top: 4px solid #00e5ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 40px auto;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Sections Ponts */
.pont-section {
    margin-bottom: 20px;
}
.section-title {
    font-weight: bold;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    font-size: 1.1em;
}
.pastille {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block; margin-right: 8px;
}
.pastille.red { background: #ff4040; }
.pastille.orange { background: orange; }
.pastille.blue { background: #1c3cff; }

/* Ponts list */
.pont-item {
    padding: 6px 10px;
    margin-bottom: 4px;
    background: #1f1f1f;
    border-radius: 6px;
    cursor: pointer;
}
.pont-item:hover { background: #2a2a2a; }
.pont-item span { font-weight: bold; }
.pont-item div { font-size: 0.8em; color: #aaa; margin-left: 16px; }

/* Calendrier */
#calendar-wrapper {
    width: 100%;
    height: 400px;
    margin-top: 20px;
    position: relative;
}
#calendar-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
}
#calendar-wrapper iframe.loading { opacity: 0.3; }
#calendar-wrapper iframe.loaded { opacity: 1; transition: opacity 0.5s; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
    <h2>État des Ponts</h2>
    <div id="update-indicator">Chargement...</div>
    <div id="ponts-mobile">
        <div class="spinner"></div>
    </div>

    <div id="calendar-wrapper">
        <iframe id="calendar-iframe" src="https://receptionroulier.github.io/cal/calr.html" class="loading"></iframe>
    </div>
</div>

<script>
const FETCH_TIMEOUT = 10000;
const CACHE_KEY_DATA = "pontsData";
const CACHE_KEY_HASH = "pontsHash";
const CACHE_KEY_TIME = "pontsCacheTime";
const CACHE_EXPIRATION = 60000;
const REFRESH_INTERVAL = 30000;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function withTimeout(factory, ms){
    const controller = new AbortController();
    const id = setTimeout(()=>controller.abort(), ms);
    try { return await factory(controller.signal); } finally { clearTimeout(id); }
}
async function fetchWithTimeout(url, opts={}, timeout=FETCH_TIMEOUT){
    return withTimeout(signal => fetch(url, {...opts, signal}), timeout);
}
async function fetchWithPool(url){
    const proxies = ["https://crimson-recipe-63e0.receptionroulier.workers.dev/?url="];
    for (let proxy of proxies) {
        try {
            const res = await fetchWithTimeout(proxy + encodeURIComponent(url));
            if(res.ok){ const t = await res.text(); try { return JSON.parse(t); } catch{return t;} }
        } catch(e){ console.warn(`Proxy failed: ${proxy}`, e); }
    }
    try { const res = await fetchWithTimeout(url); if(res.ok){ const t = await res.text(); try { return JSON.parse(t); } catch{return t;} } }
    catch(e){ console.error("Direct fetch failed:", e); }
    return null;
}
function parseRawContentToData(raw){
    if(!raw) return null;
    if(typeof raw==="string"){ try{ const j=JSON.parse(raw); return j?.data||j; } catch{return null;} }
    if(typeof raw==="object"){ if(raw.data) return raw.data; if(raw.contents){ try{ const inner=JSON.parse(raw.contents); return inner?.data||inner; } catch{return null;} } return raw; }
    return null;
}
function parseFRDate(str){ if(!str) return null; const parts=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return parts?str:null; }

function renderMobilePonts(ponts){
    const container=document.getElementById("ponts-mobile");
    container.innerHTML="";
    const sections=[
        {title:"Ponts Fermés", color:"red", filter:p=>p.statutText.toLowerCase().includes("fermé")},
        {title:"Fermeture imminente", color:"orange", filter:p=>p.statutText.toLowerCase().includes("fermeture")},
        {title:"Manœuvre en cours", color:"blue", filter:p=>p.statutText.toLowerCase().includes("manoeuvre")||p.statutText.toLowerCase().includes("manœuvre")}
    ];
    sections.forEach(sec=>{
        const list=ponts.filter(sec.filter);
        if(list.length){
            const htmlList=list.map(p=>{
                const travauxIcon = p.statutText.toLowerCase().includes("travaux") ? ' ⚠️' : '';
                const finTravaux = p.dateFinTravaux ? `<div>Jusqu'au : ${p.dateFinTravaux}</div>` : '';
                return `<div class="pont-item" onclick="window.location.href='https://receptionroulier.github.io/cal/p.html'">
                            <span>${p.nom} (${p.date||"inconnue"})${travauxIcon}</span>
                            ${finTravaux}
                        </div>`;
            }).join("");
            container.innerHTML+=`<div class="pont-section">
                <div class="section-title"><span class="pastille ${sec.color}"></span>${sec.title}</div>
                ${htmlList}
            </div>`;
        }
    });
}

async function checkAndUpdate(force=false){
    const now=new Date();
    const indicator=document.getElementById("update-indicator");
    indicator.textContent="Chargement...";
    const cachedRaw=localStorage.getItem(CACHE_KEY_DATA);
    if(!force && cachedRaw){ renderMobilePonts(JSON.parse(cachedRaw)); indicator.textContent="🟢 États mis à jour depuis cache"; return; }

    try{
        const raw=await fetchWithPool("https://www.havre-port.com/map/getPonts?_ts="+Date.now());
        const data=parseRawContentToData(raw);
        if(!data) throw new Error("Impossible de récupérer les ponts");
        const ponts=Object.values(data);
        localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(ponts));
        renderMobilePonts(ponts);
        indicator.textContent=`🟢 États mis à jour le ${now.toLocaleString()}`;
    }catch(e){
        indicator.textContent="🔴 Échec récupération des ponts";
        if(cachedRaw) renderMobilePonts(JSON.parse(cachedRaw));
    }
}

(async function init(){
    checkAndUpdate(true);
    setInterval(()=>checkAndUpdate(false), REFRESH_INTERVAL);

    const calIframe=document.getElementById("calendar-iframe");
    calIframe.onload=()=>{ calIframe.classList.remove("loading"); calIframe.classList.add("loaded"); };
    calIframe.onclick=()=>window.location.href="https://receptionroulier.github.io/cal/calr.html";
})();
</script>

</body>
</html>
